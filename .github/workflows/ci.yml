name: validate

# CR-CATALOG-STRUCT-02 brings this catalog into conformance with the
# catalog repository standard (CR-CATALOG-STRUCT-01). The workflow
# fetches the standard's tooling from dea-metaframework and runs:
#   1. CATALOG.yaml regeneration + freshness check
#   2. CATALOG.yaml validation (gate)
#   3. Per-entity schema validation (legacy; uses local schemas/)
#   4. The seven existing catalog-specific validators
#   5. Cross-repo conformance suite (CST-001..CST-016)
#
# The schema-validation phase-2 early-exit is preserved for catalogs
# in deferred-population mode (empty entities/); once Phase 2 entries
# land, drop the early-exit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-process-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so that CR-META's cutoff
          # probe (git log -1 --format=%ct on each CR file) can
          # resolve to a real last-commit timestamp. Default
          # fetch-depth: 1 is a shallow clone, which makes every
          # CR appear 'new' (mtime == now) and blocks merges.
          fetch-depth: 0

      - name: Check for catalog entries
        id: check
        run: |
          shopt -s nullglob globstar
          count=0
          for f in entities/v1-alpha/**/*.yaml; do
            [ -f "$f" ] && count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No catalog entries to validate (Phase 2 not started). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install pyyaml jsonschema pytest

      - name: Fetch catalog index machinery from dea-metaframework (if not vendored)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: technehub-labs/dea-metaframework
          path: .metaframework

      - name: Install regenerator + gate + schema (prefer vendored copies)
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p scripts catalog-index-schema
          # Prefer vendored copies (per CST-013/CST-014). Fall back to
          # dea-metaframework checkout only if the vendored copy is
          # missing; this avoids CI drift when dea-metaframework main
          # advances past the vendored version.
          if [ ! -f scripts/regenerate_catalog.py ]; then
            cp .metaframework/tools/regenerate_catalog.py scripts/
          fi
          if [ ! -f scripts/check_catalog_index.py ]; then
            cp .metaframework/tools/check_catalog_index.py scripts/
          fi
          if [ ! -f catalog-index-schema/catalog-index-schema.json ]; then
            cp .metaframework/tools/catalog-index-schema.json catalog-index-schema/
          fi

      - name: Set canonical git origin URL (regenerator reads it)
        if: steps.check.outputs.skip != 'true'
        run: |
          # actions/checkout@v4 sets the origin without a .git suffix.
          # The committed CATALOG.yaml carries the .git suffix (matching
          # what `git clone` produces locally). Normalize here so the
          # regenerator's --check produces byte-identical output.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: CATALOG.yaml must match regenerator output
        if: steps.check.outputs.skip != 'true'
        run: python scripts/regenerate_catalog.py --check --schema catalog-index-schema/catalog-index-schema.json

      - name: Validate CATALOG.yaml (CR-CATALOG-STRUCT-01 §8 gate)
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_catalog_index.py --strict --schema catalog-index-schema/catalog-index-schema.json

      - name: Validate catalog entries against the right schema
        if: steps.check.outputs.skip != 'true'
        run: |
          python - <<'PY'
          """Per-file schema dispatch (CR-BP-12).

          Validates every entity under entities/v1-alpha/ against the
          schema that matches its `type` discriminator:

            type: Process       -> schemas/entity.schema.json (L2 Business Process)
            type: ProcessGroup  -> schemas/entities/process-group.schema.json (L1)
            type: Activity      -> schemas/entities/activity.schema.json (L3, CR-BP-42)
          """
          import glob, json, sys
          from pathlib import Path
          import yaml
          from jsonschema import Draft7Validator

          SCHEMAS = {
              "Process": "schemas/entity.schema.json",
              "ProcessGroup": "schemas/entities/process-group.schema.json",
              "Activity": "schemas/entities/activity.schema.json",
          }
          FALLBACK = "schemas/entity.schema.json"

          all_errors = []
          files = sorted(glob.glob("entities/v1-alpha/**/*.yaml", recursive=True))
          # Filter out state-directory files (research/, candidates/,
          # retired/) per CR-CATALOG-STRUCT-01 §5: only the canonical
          # file at the subtree root is a catalog entry. State-directory
          # files are research/candidate/retired artifacts; they are not
          # validated against the entity schema here.
          files = [
              f for f in files
              if not any(p in ("research", "candidates", "retired") for p in Path(f).parts)
          ]
          for path in files:
              with open(path) as f:
                  data = yaml.safe_load(f) or {}
              if not isinstance(data, dict):
                  continue
              t = data.get("type", "Process")
              schema_path = SCHEMAS.get(t, FALLBACK)
              with open(schema_path) as f:
                  schema = json.load(f)
              v = Draft7Validator(schema)
              errors = list(v.iter_errors(data))
              if errors:
                  for e in errors:
                      all_errors.append(f"{path}: {e.message} ({'/'.join(str(x) for x in e.absolute_path)})")
          if all_errors:
              print("Validation FAILED:")
              for e in all_errors:
                  print("  X", e)
              sys.exit(1)
          print(f"Validation PASS ({len(files)} entries; per-file schema dispatch)")
          PY

      - name: Run ECF conformance gate (CR-ECF-CG-004)
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_ecf_conformance.py

      - name: Run Business Process specialization gate (CR-BP-SPEC-BP-01)
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_process_specialization.py

      - name: Run Process Context gate (CR-BP-02)
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_process_context.py

      - name: Run Process Identity gate (CR-BP-03)
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_process_identity.py

      - name: Run Legacy Migration gate (CR-BP-03A)
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_legacy_migration.py

      - name: STRUCT conformance (CR-BP-15-IMP Phase 1; decision D6)
        if: steps.check.outputs.skip != 'true'
        # STRUCT guards the reconciliation scaffolding against typos
        # (e.g. `reconcilliation/` shadowing `reconciliation/`). It is
        # intentionally permissive: the catalogue's contracts own
        # schema integrity; STRUCT only flags unknown top-level
        # entries.
        run: python scripts/check_struct.py --strict || true

      - name: Disposition register (CR-BP-15-IMP Phase 3-4)
        if: steps.check.outputs.skip != 'true'
        # Validates reconciliation/dispositions/register.yaml +
        # reconciliation/tranches/plan.yaml against the inventory.
        # Advisory until the register is LOCKED in Phase 5.
        run: python scripts/check_dispositions.py --strict || true

      - name: Run Process Semantics gate (CR-BP-14 S21; BP-SEM-001..012)
        if: steps.check.outputs.skip != 'true'
        # Blocking as of PR-9 (CR-BP-15-IMP Phase 5 closure). All 18
        # canonical Business Process records now conform to the
        # CR-BP-14 canonical contract; the disposition register is
        # LOCKED. The validator is promoted from advisory to
        # blocking so any future regression is caught at PR time.
        run: python scripts/check_process_semantics.py --strict

      - name: Run architectural regression gate (CR-BP-16 S21; BP-AR-001..007)
        if: steps.check.outputs.skip != 'true'
        # Blocking as of PR-11 (CR-BP-15-IMP Phase 7 readiness).
        # Seven architectural regression patterns guard against
        # conflation of Business Process vs Process Kernel,
        # ECF Coordinate vs Business Process, etc. (CR-BP-16 S21).
        run: python scripts/check_architectural_regression.py --strict

      - name: Refresh conformance report (CR-BP-16 S23)
        if: steps.check.outputs.skip != 'true'
        # Generates reconciliation/conformance_report.yaml with
        # per-record conformance Levels 1-4. Advisory; the report
        # is the pre-admission readiness artefact (CR-BP-16 S24).
        run: python scripts/build_conformance_report.py

      - name: Run CR metadata gate (CR-BP-16 S16; CR-META-001..006)
        if: steps.check.outputs.skip != 'true'
        # Blocking as of PR-13 (CR-BP-16 §16 enforcement promotion).
        # Legacy CRs (mtime < 2026-09-06) are reported as advisory;
        # NEW CRs (mtime >= 2026-09-06) MUST comply with the S21
        # metadata schema (Status, Layer, Owner, Depends on,
        # Companion to, filename pattern). The cutoff is set via
        # --cutoff-date and the policy is documented in
        # docs/conformance-pipeline.md S16.
        run: python scripts/check_cr_metadata.py --strict

      - name: Aggregate Conformance Result (CR-BP-16 S17/S18)
        if: steps.check.outputs.skip != 'true'
        # The single CONFORMANCE RESULT verdict (CR-BP-16 S18) that
        # aggregates the 10-step pipeline (S17). This is the
        # pre-merge verdict source. Blocking + advisory gates are
        # both reported; the verdict is one of CONFORMANT,
        # CONFORMANT-WITH-WARNINGS, or NON-CONFORMANT.
        run: python scripts/conformance_result.py

      - name: Run documentation conformance gate (CR-BP-16 S22; DOC-001..003)
        if: steps.check.outputs.skip != 'true'
        # Advisory as of PR-12. Normative terminology consistency
        # across documentation; reports legacy synonym usage,
        # unresolvable id references, and standalone 'Process'.
        run: python scripts/check_documentation_conformance.py

      - name: Run admission gate (CR-BP-16 S15 + S17 Step 8; ADM-001..008)
        if: steps.check.outputs.skip != 'true'
        # CR-BP-16 S15 advisory mode for the full ADM-001..008 set;
        # CR-BP-16 S17 Step 8 (Provenance) is BLOCKING for ADM-001 +
        # ADM-008 via --strict-provenance. Boundary (ADM-005),
        # identity (ADM-002), context (ADM-003), group fit (ADM-004),
        # intent (ADM-006), specialization (ADM-007) stay advisory
        # until the corresponding §15 subsections are promoted.
        # New-process admission mandatory conformance path:
        # Evidence -> Identity -> Context -> Group Fit -> Boundary ->
        # Intent -> Classification -> Specialization -> Sibling
        # Analysis -> MECE -> Schema -> Provenance -> Governance ->
        # CANONICAL.
        run: python scripts/check_admission_gate.py --strict-provenance

      - name: Run Process Group gate (CR-BP-12)
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_process_group.py

      - name: Run lifecycle discovery gate (CR-BP-62; DISC-001..008)
        if: steps.check.outputs.skip != 'true'
        # Advisory. Structural completeness of lifecycle-discovery
        # records (discovery/v1-alpha/); never admits or rejects
        # canonicality (CR-BP-62 S20). Regression guard until
        # CR-BP-63 lands the Activate/Retire discovery records.
        run: python scripts/check_lifecycle_discovery.py

      - name: Run cross-repo conformance suite (CR-CATALOG-STRUCT-01 §11)
        if: steps.check.outputs.skip != 'true'
        run: |
          python .metaframework/tools/conformance_test_catalog_structure.py \
              --catalog-root . \
              --template-root .metaframework/tools/catalog-repo-template \
              --strict
