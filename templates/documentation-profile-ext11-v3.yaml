# =============================================================================
# Placeholder convention re-issuance (EXT-11)
# =============================================================================
# Per CR-BP-94-EXT-08 §5.4: the '(pending; backfill at EXT-04)' phrase is
# retired. Per EXT-09 §10, the 11 completeness states are normative. The
# v3 generator emits the applicable state per the profile's classification
# of the section.
placeholder_states:
  reissued_phrases:
    not_started: "(operational content not yet researched; status: not_started per EXT-09 §10)"
    in_progress: "(operational content in progress; status: in_progress per EXT-09 §10)"
    pending_evidence: "(operational content pending evidence; status: pending_evidence per EXT-09 §10)"
    pending_review: "(operational content pending accountable review; status: pending_review per EXT-09 §10)"
    approved: "(operational content approved per EXT-09 §10)"
    not_applicable: "(not applicable to this entity level per EXT-09 §11)"
    unknown: "(operational content unknown; status: unknown per EXT-09 §10)"
    inherited: "(inherited from authoritative source; marker: > Inherited from: <source>)"
    rejected: "(proposed assertion reviewed and rejected per EXT-09 §10)"
    superseded: "(superseded by newer approved assertion per EXT-09 §10)"
    deferred: "(deferred with approved reason; status: deferred per EXT-09 §10)"
  retired_phrase: "(pending; backfill at EXT-04)"
  retired_phrase_disposition: |
    The retired phrase MUST NOT be used to direct operational-content
    authoring. Per EXT-08 §5.4, the EXT-11 v3 profile replaces it with
    the EXT-09 §10 completeness states. The retired phrase is preserved
    as a recognition-only string (the validator recognises it on legacy
    READMEs and reports the re-issuance in EXT-19 backfill tranches).
