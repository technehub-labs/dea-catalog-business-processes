# =============================================================================
# templates/documentation-profile-ext11-v3.yaml
# CR-BP-94-EXT-11 (Decomposition-Level Operational Documentation Profiles).
# Profile version: v3. Supersedes the v1 profile family (L0/L1 v1, L2/L3/L4 v1)
# that landed under CR-BP-94-EXT-01a. The v1 profiles remain in
# templates/documentation-profile-*.yaml for backward compatibility with
# records validated under v1. The v3 profile is the EXT-11 reference
# implementation.
#
# Design: one file for the v3 profile family (L0 + L1 + L2 + L3 + L4),
# with the 5-classification model (required / conditional / optional /
# not_applicable / inherited) per EXT-11 §5.
# =============================================================================

profile_family_id: dea:profile-readme-ext11-v3
profile_family_version: 3.0.0
profile_family_status: candidate       # candidate | active | deprecated
provenance:
  established_by: CR-BP-94-EXT-11
  established_at: 2026-10-19
  supersedes:
    - dea:profile-readme-l0-process-context-v1
    - dea:profile-readme-l1-process-group-v1
    - dea:profile-readme-l2-process-v1
    - dea:profile-readme-l3-activity-v1
    - dea:profile-readme-l4-task-v1
  transition_policy: |
    The v1 profiles remain in templates/ and are referenced by the
    EXT-04/05/06/07 gates (the 7-section EXT-07 v2 profile). The
    v3 profile is the EXT-11 reference. The conformance gate
    [36] EXT-11 Profile Conformance (wire in scripts/conformance_result.py
    under CR-BP-94-EXT-23 closure) validates the v3 profile; the
    v1 profiles are grandfathered per EGV-012 until each is migrated
    to v3 in a follow-up slice.

# EXT-11 §5: requirement classification. All 5 are required structural
# metadata for each profile record.
classification_model:
  required:
    meaning: "Must be present for a conformant entity"
  conditional:
    meaning: "Required when a documented applicability condition holds"
  optional:
    meaning: "May be supplied when useful and supported"
  not_applicable:
    meaning: "Not applicable to this entity level or context"
  inherited:
    meaning: |
      May be supplied from an authoritative parent or referenced source,
      subject to applicability validation

# Cross-cutting structural rules (apply to ALL profiles in this family).
cross_cutting_rules:
  no_executable_at_l0_l1: |
    L0/L1 profiles MUST NOT include executable operational sections
    (inputs, outputs, transformation, trigger, precondition, performer,
    accountability, business rule, control, exception). This is a
    structural constraint enforced by the profile validator.
  no_workflow_orchestration_at_l4: |
    L4 profile MUST NOT include workflow orchestration sections
    (sequence, branching, retry, state-machine, orchestration,
    workflow-engine implementation). This is a structural constraint
    enforced by the profile validator (per CR-BP-98).
  no_copy_of_parent_content: |
    A child profile MUST NOT automatically inherit all parent inputs,
    outputs, rules, controls, roles, or dependencies. Inheritance
    requires: identifiable authoritative source; semantic reason;
    applicability to the child; explicit inheritance disposition;
    traceable reference. (EXT-11 §11.3.)
  placeholder_convention: |
    The '(pending; backfill at EXT-04)' placeholder (retired under
    CR-BP-94-EXT-08) is re-issued under EXT-11 with explicit EXT-09
    §10 completeness states: not_started / in_progress / approved /
    not_applicable / unknown / inherited / deferred / pending_evidence
    / pending_review / rejected / superseded. The placeholder text in
    generated READMEs is updated to surface the applicable state.

# =============================================================================
# L0 PROCESS CONTEXT PROFILE (EXT-11 §6)
# =============================================================================
l0_process_context:
  profile_id: dea:profile-readme-l0-process-context-v3
  applies_to:
    entity_type: ProcessContext
    level: L0
  non_executable: true
  required_sections:
    - id: header-identity-table
      heading: "## Header and Identity Table"
    - id: executive-summary
      heading: "## 1. Executive Summary / Intent"
    - id: governance-provenance
      heading: "## 2. Governance and Provenance"
    - id: behavioral-boundaries
      heading: "## 3. Behavioral Boundaries (Cell Charter)"
    - id: hierarchical-decomposition
      heading: "## 4. Hierarchical Decomposition"
    - id: properties-relationships
      heading: "## 5. Properties and Relationships"
    - id: technical-metadata
      heading: "## 7. Technical Metadata"
  conditional_sections:
    - id: operational-metrics
      heading: "## 6. Operational, Control and Metrics Details"
      applies_when: "L0 metrics are governed (separate CR; not in EXT-11 scope)"
  not_applicable_sections:
    - {id: trigger, rationale: "L0 is non-executable (EXT-09 §11.1)"}
    - {id: precondition, rationale: "L0 is non-executable"}
    - {id: input, rationale: "L0 is non-executable"}
    - {id: transformation, rationale: "L0 is non-executable"}
    - {id: output, rationale: "L0 is non-executable"}
    - {id: outcome, rationale: "L0 is non-executable"}
    - {id: performer, rationale: "L0 is non-executable"}
    - {id: accountability, rationale: "L0 is non-executable"}
    - {id: business_rule, rationale: "L0 is non-executable"}
    - {id: control, rationale: "L0 is non-executable"}
    - {id: exception, rationale: "L0 is non-executable"}
    - {id: workflow-orchestration, rationale: "L0 is non-executable + L4 prohibition"}
  inherited_sections:
    - {id: regulatory-evidence, inherits_from: external-authority}

# =============================================================================
# L1 PROCESS GROUP PROFILE (EXT-11 §7)
# =============================================================================
l1_process_group:
  profile_id: dea:profile-readme-l1-process-group-v3
  applies_to:
    entity_type: ProcessGroup
    level: L1
  non_executable: true
  required_sections:
    - id: header-identity-table
      heading: "## Header and Identity Table"
    - id: intent-definition
      heading: "## Intent and Definition"
    - id: governance-provenance
      heading: "## 2. Governance and Provenance"
    - id: properties-relationships
      heading: "## 5. Properties and Relationships"
    - id: hierarchical-decomposition
      heading: "## 4. Hierarchical Decomposition"
    - id: technical-metadata
      heading: "## 7. Technical Metadata"
  conditional_sections:
    - id: shared-rules-controls
      heading: "## Shared Business Rules and Controls"
      applies_when: "L1 group declares shared governance across its member L2 BPs"
  not_applicable_sections:
    - {id: trigger, rationale: "L1 is non-executable (EXT-09 §11.2)"}
    - {id: precondition, rationale: "L1 is non-executable"}
    - {id: input, rationale: "L1 is non-executable"}
    - {id: transformation, rationale: "L1 is non-executable"}
    - {id: output, rationale: "L1 is non-executable"}
    - {id: outcome, rationale: "L1 is non-executable (L1 may declare group-level outcomes; this is the inherited outcome pattern)"}
    - {id: performer, rationale: "L1 is non-executable"}
    - {id: accountability, rationale: "L1 is non-executable (Process Owner is rendered at L2; L1 may declare group-level ownership)"}
    - {id: business_rule, rationale: "L1 is non-executable; rule ownership is at L2/L3/L4 unless inherited from L0"}
    - {id: control, rationale: "L1 is non-executable; control ownership is at L2/L3/L4 unless inherited"}
    - {id: exception, rationale: "L1 is non-executable"}
    - {id: workflow-orchestration, rationale: "L1 is non-executable + L4 prohibition"}
  inherited_sections:
    - {id: group-outcomes, inherits_from: l0-process-context}
    - {id: scope-boundary, inherits_from: l0-process-context}

