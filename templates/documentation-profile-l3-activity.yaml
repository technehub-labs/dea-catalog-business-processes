# =============================================================================
# templates/documentation-profile-l3-activity.yaml
# CR-BP-94-EXT-01 (Documentation Architecture slice).
# Profile ID: dea:profile-readme-l3-activity-v1
# Applies to: entity.type=Activity, level=L3
# =============================================================================

profile_id: dea:profile-readme-l3-activity-v1
profile_version: 1.0.0
profile_status: draft
classification:
  entity_type: Activity           # must match entity.type
  level: L3                       # must match resolved level from CR-BP-93 mapping
  description: |
    L3 Activity documentation profile. Applies to canonical Activity
    records in the DEA Process Catalog. The profile differentiates
    Activity from Process: Activity is cohesive work contributing
    to a parent Business Process; Activity MUST NOT carry
    Business-Process-level obligations (e.g., full outcomes framework)
    that belong to its parent.

required_sections:
  - id: entity-identity
    heading: "## 1. Entity Identity and Classification"
    source: generated
    description: |
      Canonical ID, name, type, level, lifecycle, parent BP
      (`belongs_to_business_process`), cohesion rationale (CR-BP-32
      ACT-003), governing CR. Auto-populated from the YAML record.

  - id: formal-definition
    heading: "## 2. Formal Definition and Scope"
    source: curated
    description: |
      Definition, purpose, scope. Human-authored. Substantive prose
      required; ACT-011 (CR-BP-97) sets a 120-char minimum for the
      `definition` field. Inherited from L2 BP scope where applicable.

  - id: semantic-dimensions
    heading: "## 3. Canonical Semantic Dimensions"
    source: curated
    description: |
      Five-dimension framework: ontological, behavioral, structural,
      teleological, governance. Behavioral emphasis at L3 is on
      handoffs + transformations, not on full process flows.

  - id: decomposition
    heading: "## 4. Decomposition and Composition"
    source: mixed
    description: |
      Parent BP (belongs_to_business_process) is generated.
      Composed Tasks (`composes[]`) are generated. Decomposition
      coverage statement is human-authored.

  - id: behavior
    heading: "## 5. Behavior and Workflow"
    source: curated
    description: |
      Preconditions + triggers, main handoff flow, exception paths,
      completion criteria. Human-authored. Less exhaustive than L2
      profile (L3 contributes to, not owns, the process flow).

  - id: interfaces
    heading: "## 6. Inputs, Outputs, and Interfaces"
    source: curated
    description: |
      Inputs (id/name/description/source), outputs
      (id/name/description/consumer). Back-compat: OPTIONAL
      Activity `inputs[]` / `outputs[]` fields per CR-BP-97 ACT-012.

  - id: roles
    heading: "## 7. Roles, Responsibilities, and Accountability"
    source: curated
    description: |
      Roles responsible for the work, handoff actors. Human-authored.

  - id: rules-controls
    heading: "## 8. Business Rules and Controls"
    source: curated
    description: |
      Business rules the Activity enforces. Conditional on
      lifecycle. Conditional on whether the Activity is in a
      regulated domain.

  - id: outcomes
    heading: "## 9. Outcomes and Performance"
    source: conditional
    description: |
      Contribution to parent process outcome (per CR-BP-97 ACT-013
      `outcome_contribution:` OPTIONAL field). Outcome metrics at
      L3 are typically inherited from the parent BP; this section
      is `not_applicable` when no Activity-specific metric exists.

  - id: evidence
    heading: "## 10. Evidence and Traceability"
    source: mixed
    description: |
      Assertion table. YAML evidence_links are generated; curation
      rows are human-authored.

  - id: completeness
    heading: "## 11. Documentation Completeness"
    source: generated
    description: |
      Six-dimension coverage status. Generated by EXT-03 manifest.

  - id: revision-history
    heading: "## 12. Revision History"
    source: generated
    description: |
      Versioned table generated from the YAML change_history.

conditional_sections:
  - id: exception-flows
    heading: "## 5a. Alternative and Exception Flows"
    trigger: entity declares exception handling or `boundary` field (CR-BP-97 ACT-014)
    source: curated

  - id: systems
    heading: "## 6a. Systems and Information"
    trigger: entity declares system interaction
    source: curated

  - id: regulatory
    heading: "## 8a. Regulatory Controls"
    trigger: entity is in a regulated domain
    source: curated

  - id: approvals
    heading: "## 7a. Human Approvals"
    trigger: entity triggers human approvals
    source: curated

inherited_markers:
  - "<!-- generated: do-not-edit -->"
  - "<!-- curated: edit-here -->"
  - "> Inherited from:"
  - "> Assumption:"
  - "> Expert:"

evidence_requirements:
  canonical_model: derived from YAML
  business_assumption: requires `> Assumption:` marker + evidence ref
  external_standard: requires stable URI reference
  expert_interpretation: requires `> Expert:` marker
  inherited_metric: must identify authoritative parent BP

lifecycle_obligations:
  research:
    mandatory_sections: [entity-identity, formal-definition]
    allowed_gaps: [behavioral, structural, governance]
  candidate:
    mandatory_sections: [entity-identity, formal-definition, decomposition, behavior, evidence]
    allowed_gaps: [outcomes-conditional, governance-conditional]
  active:
    mandatory_sections: all
    allowed_gaps: none
  deprecated:
    mandatory_sections: [entity-identity, formal-definition, decomposition, retirement-rationale]
    allowed_gaps: [behavioral-not-applicable, governance-not-applicable]
  retired:
    mandatory_sections: [entity-identity, formal-definition, retirement-rationale, historical-preservation]
    allowed_gaps: [all-operational-not-applicable]

registration:
  registered_at: '2026-09-18'
  registered_by: CR-BP-94-EXT-01
  governed_by: docs/process-documentation-architecture.md
  parent_template: CR-BP-94
  supersedes: none
  superseded_by: null
