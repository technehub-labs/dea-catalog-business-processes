# =============================================================================
# templates/task.yaml
# CR-BP-94 (Decomposition Record Templates); recon-programme slice CR-BP-92 §9.
# CR-BP-93 (Decomposition Semantic Contract) §7 normative basis.
# CR-BP-98 (Task Boundary and Workflow Realization): future slice; this
# template is the first normative description of the L4 record shape and
# will be reconciled against CR-BP-98 when that slice lands.
# =============================================================================
#
# What this template IS:
#   A canonical authoring skeleton for an L4 Task record. Tasks are the
#   lowest semantic level of process decomposition (CR-BP-32 §12; CR-BP-93 §7).
#
# What this template is NOT:
#   Not an Activity template (see templates/activity.yaml). Task is BELOW
#   Activity. Not a workflow step, not a software operation, not a work
#   instruction. Sequence / branching / conditions / orchestration live
#   in Workflow Definition, NOT in Task.
#
# Authoring flow:
#   1. Copy to entities/v1-alpha/dea:task-<kebab-name>/dea:task-<kebab-name>.yaml.
#   2. Replace every `<...>` placeholder.
#   3. CR-BP-98 (Task Boundary and Workflow Realization) will establish the
#      L4 schema + gate. Until then, this template is normative-by-template;
#      no gate enforces its structure today.
#
# CR-BP-94 design intent: this template carries the normative L4 shape so
# that future L4 population tranches (CR-BP-99 reconciliation or a dedicated
# L4 tranche) have an authoritative authoring skeleton. The fields marked
# `# TODO(CR-BP-98):` are placeholders that will be reconciled when the
# L4/WF slice lands.

id: dea:task-<kebab-name>           # TODO(CR-BP-98): id family `dea:task-*` per CR-BP-04 §4.
type: Task                           # TODO(CR-BP-98): discriminator; always `Task` for L4 entries.

# -----------------------------------------------------------------------------
# TODO(CR-BP-98): L4 required fields. Below is the normative L4 shape per
# CR-BP-93 §7. CR-BP-98 will codify the schema + gate enforcement.
# -----------------------------------------------------------------------------

name: <Verb Object>                  # TODO(CR-BP-98): 1-200 chars. Verb-object form.
                                     # Example: 'Submit Filing to Regulator', 'Verify Party Identity'.
version: 1.0.0                       # TODO(CR-BP-98): SemVer; bump on semantic change (SIV-001..004).

lifecycle_status: candidate          # TODO(CR-BP-98): `candidate | active | deprecated | retired`.
status: candidate                    # TODO(CR-BP-98): Discovery status (CR-BP-11 dispositions).

definition: |                        # TODO(CR-BP-98): 1-2000 chars; bounded, actionable, single-responsibility.
  <The bounded unit of work performed at the L4 layer.
  A good definition answers: 'What is the single bounded unit of work?
  A Task is independently verifiable for completion.>

belongs_to_activity: dea:activity-<parent-activity-id>  # TODO(CR-BP-98): must resolve to a canonical L3 Activity.

trigger: |                           # TODO(CR-BP-98): required at L4 (per CR-BP-92 §5 matrix).
  <What initiates this Task. Single-responsibility, bounded.>

outcome: |                           # TODO(CR-BP-98): required at L4 (Completion state per CR-BP-92 §5).
  <The completion state. Verifiable for completion.>

# -----------------------------------------------------------------------------
# TODO(CR-BP-98): responsibility, evidence, boundary.
# -----------------------------------------------------------------------------

responsibility: |                    # TODO(CR-BP-98): bounded responsibility (one role or capability).
  <The role or capability responsible for executing this Task.>

boundary:                            # TODO(CR-BP-98): inclusions / exclusions.
  inclusions:
    - <what this Task does include>
  exclusions:
    - <what this Task does NOT include (deferred to other Tasks or downstream)>

evidence:                            # TODO(CR-BP-98): structured evidence.
  - source: <evidence source>
    claim: <the claim>
    strength: E2
    # url: <https://...>

# -----------------------------------------------------------------------------
# ECF conformance (gate [8] expectation): inherits the parent Activity's
# coordinate (which inherits the parent BP's coordinate).
# -----------------------------------------------------------------------------

ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: 1.0.0
  profile: dea:ecf@1.0.0
  status: conformant
  affiliation: inherits-catalog
  canonicalReferences:
    - kind: coordinate
      domain: <Domain>                # MUST match the parent Activity's domain.
      stage: <Stage>                  # MUST match the parent Activity's stage.
      identifier: ecf:<domainCamel>.<stage>

# -----------------------------------------------------------------------------
# Metadata + change_history (CR-BP-98 will codify gate enforcement).
# -----------------------------------------------------------------------------

metadata:
  established_by: <CR-id>
  established_at: <YYYY-MM-DD>
  change_history:
    - cr: <CR-id>
      date: <YYYY-MM-DD>
      change: |
        <Concise description.>

# -----------------------------------------------------------------------------
# CR-BP-93 §7 (Disallowed): the following semantics do NOT belong at L4.
# They live in Workflow Definition (CR-BP-98 §13):
#
#   - sequencing            (Task A -> Task B -> Task C)
#   - branching             (if/else)
#   - conditions            (gate predicates)
#   - dependencies          (Task A depends-on Task B)
#   - participants          (multi-party collaboration)
#   - events                (event-driven triggers)
#   - orchestration         (choreography)
#   - state transitions     (state machines)
#   - automation            (RPA, scheduled, etc.)
#
# Composition (Activity --composes--> Task) is structural only and does NOT
# imply any of the above. (CR-BP-32 §7, §11; CR-BP-92 §11 RF-09.)
# -----------------------------------------------------------------------------
