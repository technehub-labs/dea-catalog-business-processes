# =============================================================================
# templates/task.yaml
# CR-BP-94 (Decomposition Record Templates); recon-programme slice CR-BP-92 §9.
# CR-BP-93 (Decomposition Semantic Contract) §7 normative basis.
# CR-BP-98 (Task Boundary and Workflow Realization): SLICE LANDED.
#   The `# TODO(CR-BP-98):` placeholders from CR-BP-94 are now resolved
#   by `schemas/entities/task.schema.json` (the canonical L4 schema)
#   and `scripts/check_task_model.py` (TASK-001..005 structural
#   validator). The schema is normative; this template is the
#   authoring skeleton.
# =============================================================================
#
# What this template IS:
#   A canonical authoring skeleton for an L4 Task record. Tasks are the
#   lowest semantic level of process decomposition (CR-BP-32 §12; CR-BP-93 §7).
#
# What this template is NOT:
#   Not an Activity template (see templates/activity.yaml). Task is BELOW
#   Activity. Not a workflow step, not a software operation, not a work
#   instruction. Sequence / branching / conditions / orchestration live
#   in Workflow Definition, NOT in Task.
#
# Authoring flow:
#   1. Copy to entities/v1-alpha/dea:task-<kebab-name>/dea:task-<kebab-name>.yaml.
#   2. Replace every `<...>` placeholder.
#   3. The structural validator `scripts/check_task_model.py` (TASK-001..005)
#      enforces the schema-derived invariants on every PR.
#   4. The Execution Boundary validator (EXE-001..010) ensures no
#      workflow / orchestration semantics leak into the Task record.
#
# CR-BP-94 design intent: this template carries the normative L4 shape so
# that future L4 population tranches (CR-BP-99 reconciliation or a dedicated
# L4 tranche) have an authoritative authoring skeleton. CR-BP-98 lands the
# formal schema and the TASK-001..005 gate that enforces it.

id: dea:task-<kebab-name>           # CR-BP-04 §4 id family: dea:task-*.
type: Task                           # Discriminator; always `Task` for L4 entries.

# -----------------------------------------------------------------------------
# Required fields (CR-BP-93 §9: Definition / Boundary / Trigger / Outcome /
# Responsibility / Evidence are Required at L4).
# -----------------------------------------------------------------------------

name: <Verb Object>                  # 1-200 chars. Verb-object form.
                                     # Example: 'Submit Filing to Regulator'.
version: 1.0.0                       # SemVer; bump on semantic change (SIV-001..004).

lifecycle_status: candidate          # candidate | active | deprecated | retired.
status: candidate                    # Discovery status (CR-BP-11 dispositions).

definition: |                        # 1-2000 chars; bounded, actionable, single-responsibility.
  <The bounded unit of work performed at the L4 layer.
  A good definition answers: 'What is the single bounded unit of work?'
  A Task is independently verifiable for completion.>

belongs_to_activity: dea:activity-<parent-activity-id>  # Must resolve to a canonical L3 Activity.

trigger: |                           # Required at L4 (per CR-BP-92 §5 matrix).
  <What initiates this Task. Single-responsibility, bounded.>

outcome: |                           # Required at L4 (Completion state per CR-BP-92 §5).
  <The completion state. Verifiable for completion.>

# -----------------------------------------------------------------------------
# Responsibility + boundary + evidence (TASK-002/003/004).
# -----------------------------------------------------------------------------

responsibility: |                    # Bounded responsibility (one role or capability).
  <The role or capability responsible for executing this Task.>

boundary:                            # Inclusions / exclusions (Required at L4).
  inclusions:
    - <what this Task does include>
  exclusions:
    - <what this Task does NOT include (deferred to other Tasks or downstream)>

evidence:                            # Structured evidence per CR-BP-92 §13.
  - source: <evidence source>
    claim: <the claim>
    strength: E2
    # url: <https://...>

# -----------------------------------------------------------------------------
# ECF conformance (CR-ECF-CG-004): inherits the parent Activity's
# coordinate (which inherits the parent BP's coordinate).
# -----------------------------------------------------------------------------

ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: 1.0.0
  profile: dea:ecf@1.0.0
  status: conformant
  affiliation: inherits-catalog
  canonicalReferences:
    - kind: coordinate
      domain: <Domain>                # MUST match the parent Activity's domain.
      stage: <Stage>                  # MUST match the parent Activity's stage.
      identifier: ecf:<domainCamel>.<stage>

# -----------------------------------------------------------------------------
# Metadata + change_history.
# -----------------------------------------------------------------------------

metadata:
  established_by: <CR-id>
  established_at: <YYYY-MM-DD>
  change_history:
    - cr: <CR-id>
      date: <YYYY-MM-DD>
      change: |
        <Concise description.>

# -----------------------------------------------------------------------------
# CR-BP-93 §7 (Disallowed): the following semantics do NOT belong at L4.
# They live in Workflow Definition (CR-BP-98 §13):
#
#   - sequencing            (Task A -> Task B -> Task C)
#   - branching             (if/else)
#   - conditions            (gate predicates)
#   - dependencies          (Task A depends-on Task B)
#   - participants          (multi-party collaboration)
#   - events                (event-driven triggers)
#   - orchestration         (choreography)
#   - state transitions     (state machines)
#   - automation            (RPA, scheduled, etc.)
#
# TASK-005 (check_task_model.py) enforces this constraint: any field
# from DISALLOWED_L4_FIELDS triggers a finding. CR-BP-33 EXE-001..010
# enforce the same discipline on BP records.
#
# Composition (Activity --composes--> Task) is structural only and does NOT
# imply any of the above. (CR-BP-32 §7, §11; CR-BP-92 §11 RF-09.)
# -----------------------------------------------------------------------------