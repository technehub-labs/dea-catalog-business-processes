discovery:
  id: dea:discovery-party-and-relationship-activate-escape
  ecf_context:
    domain: PartyAndRelationship
    lifecycle_stage: Activate
  candidates:
  - name: Onboard Regulated Party Relationship
    proposed_identity:
      verb: Onboard
      object: Regulated Party Relationship
      scope: enterprise
    trigger: >-
      A new party applies to establish a relationship with the enterprise in a
      jurisdiction or sector where identity verification and due diligence are
      mandated before the relationship may commence (e.g. KYC/AML obligations
      in financial services).
    inputs: >-
      Onboarding application; identity documents; beneficial-ownership
      declarations; sanctions and watchlist positions; regulatory onboarding
      requirements.
    transformation: >-
      Move the applicant from unverified applicant to verified, risk-rated,
      approved (or declined) party with the relationship record established and
      commencement authorized.
    outcome: >-
      The party relationship is activated with verified identity, resolved
      beneficial ownership, an assigned risk classification, and a documented
      approval; declined applicants receive a recorded refusal.
    boundary: >-
      Begins at receipt of the onboarding application; ends at approval with
      commencement authorized (or at recorded refusal). Ongoing monitoring,
      periodic due-diligence refresh and transaction surveillance belong to
      the Operate coordinate and are excluded.
    actors: Onboarding function; compliance; relationship owner; the applicant.
    controls: >-
      Customer identification program (CIP); customer due diligence (CDD/EDD);
      sanctions and PEP screening; beneficial-ownership resolution; onboarding
      approval authority.
    evidence:
      sources:
      - >-
        FATF Recommendation 10 (customer due diligence when establishing
        business relationships; identification, verification, beneficial
        ownership, purpose-and-nature of the relationship)
      - >-
        FinCEN Customer Due Diligence Rule (31 CFR 1010.230, 2016) and
        Customer Identification Program rules: onboarding-time identification
        and verification with beneficial-ownership resolution at account
        opening
      - >-
        EU Anti-Money-Laundering Directives (AMLD4/AMLD5/AMLD6) customer due
        diligence obligation triggered on establishing a business relationship
      - >-
        Basel Committee BCBS guidelines on the sound management of ML/FT risks
        (customer acceptance policy as a distinct onboarding control)
      - Wolfsberg Group guidance on customer onboarding and due diligence
      - >-
        Banking practice universally operates customer onboarding and
        verification as a distinct, controlled, repeatable process separate
        from steady-state relationship operation
      evidence_strength: authoritative
    evaluation:
      process_reality: >-
        Established and legally mandated across regulated sectors; performed by
        dedicated onboarding functions worldwide.
      transformation: >-
        Unverified applicant to verified, risk-rated, approved party; a real
        state transformation with material control work.
      trigger: >-
        Onboarding application in a regulated context; observable and
        mandated.
      outcome: >-
        Verified, risk-classified, approved (or declined) relationship;
        distinguishable and evidenced.
      boundary: >-
        Strong; application receipt to approval/refusal; ongoing monitoring
        explicitly excluded to the Operate coordinate.
      semantic_identity: >-
        Verb + object identity independent of the ECF coordinate;
        recognizable across sectors as regulated onboarding.
      cross_context_stability: >-
        The same transformation recurs in supplier onboarding
        (sanctions/export-control screening) and partner vetting; identity
        stable, implementation varies.
      cross_domain_applicability: >-
        Concentrated in regulated sectors (financial services, telecoms
        subscriber registration, gambling, crypto asset services); not
        universal across all enterprises.
      ecf_independence: >-
        "Onboard Regulated Party Relationship" names recognizable work without
        reference to the Activate label.
      duplication: >-
        No existing canonical BP covers regulated onboarding; nearest neighbors
        (relationship establishment under Build/Operate) exclude mandated
        due-diligence work.
      composition: >-
        Business Process level; constituent verification, screening and
        approval work decomposes to Activities at L3.
      capability_distinction: >-
        A transformation with trigger and outcome, not a capability
        restatement.
      governance_distinction: >-
        Not a policy or decision; a governed workflow whose controls are
        regulatory obligations.
      lifecycle_span: >-
        Begins and ends within Activate; downstream monitoring relationships
        recorded, not duplicated.
    scoring:
      process_reality: 2
      semantic_stability: 2
      cross_domain_applicability: 1
      boundary_clarity: 2
      evidence_strength: 2
      total: 9
      rationale: >-
        Authoritative multi-source regulatory evidence and universal sector
        practice; strong boundary against Operate; cross-domain breadth limited
        to regulated sectors, holding the total at 9.
    disposition:
      type: ADMIT-CANONICAL
      canonical_process_ref: processes:process-pr-activate-6qzuve
      related_contexts: []
    admission:
      status: admitted
      admitted_as: processes:process-pr-activate-6qzuve
      admitted_by: CR-BP-71
      admitted_at: '2026-09-15'
  - name: Commence Relationship
    proposed_identity:
      verb: Commence
      object: Party Relationship
      scope: enterprise
    trigger: A contract or agreement reaches its effectiveness date.
    inputs: Executed contract; effectiveness provisions; onboarding record.
    transformation: >-
      Move the party relationship from executed-but-dormant to active; rights
      and obligations begin to run.
    outcome: The relationship is active and obligations are live.
    boundary: >-
      Begins at contract effectiveness; ends at active-relationship
      confirmation. Entangled with relationship-establishment work already
      catalogued under Build/Operate coordinates.
    actors: Contract owner; counterparty; relationship manager.
    controls: Effectiveness provisions; commencement notices.
    evidence:
      sources:
      - >-
        Contract practice universally distinguishes execution from
        effectiveness (conditions precedent, effectiveness dates,
        commencement notices)
      evidence_strength: moderate
    evaluation:
      process_reality: Established in contract administration.
      transformation: Real but narrow; effectiveness of an executed instrument.
      trigger: Effectiveness date reached; observable.
      outcome: Active relationship; distinguishable.
      boundary: >-
        Unresolved against existing relationship-establishment processes in
        the catalog; the entanglement persists for non-regulated
        commencements.
      semantic_identity: >-
        Recognizable; close kin to Bring into Force with a contractual object
        (processes:process-ge-activate-wegs44 admitted at
        GovernanceAndExistence/Activate by CR-BP-65).
      cross_context_stability: >-
        Stable as a contract-effectiveness concept across domains.
      cross_domain_applicability: >-
        Broad, but the boundary question follows it everywhere.
      ecf_independence: Identity holds without the Activate label.
      duplication: >-
        Overlaps the admitted Bring Policy Instrument into Force semantics
        when the instrument is a contract.
      composition: >-
        Business Process level if the boundary resolves; otherwise a
        commencement Activity within relationship establishment.
      capability_distinction: Transformation, not capability.
      governance_distinction: Not a bare decision; a governed workflow.
      lifecycle_span: Confined to Activate if admitted.
    scoring:
      process_reality: 2
      semantic_stability: 1
      cross_domain_applicability: 1
      boundary_clarity: 0
      evidence_strength: 1
      total: 5
      rationale: >-
        Real contract-effectiveness work, but the boundary against catalogued
        relationship-establishment processes remains unresolved for the
        non-regulated case; the CR-BP-63 deferral stands.
    disposition:
      type: DEFER
      related_contexts:
      - GovernanceAndExistence/Activate
  - name: Activate Customer Journeys
    proposed_identity:
      verb: Activate
      object: Customer Journeys
      scope: enterprise
    trigger: A journey design is approved for release to customers.
    inputs: Approved journey design; channel configurations.
    transformation: >-
      Journey configurations move from approved design to live availability.
    outcome: The journeys are live to customers.
    boundary: >-
      Entangled with journey build work and with service transition; no
      independent trigger class.
    actors: Journey owner; channel operations.
    controls: Release approvals.
    evidence:
      sources:
      - Journey-management practice literature
      evidence_strength: weak
    evaluation:
      process_reality: >-
        Limited standalone evidence; usually a step inside journey release
        management.
      transformation: Configuration-state change, execution-level.
      trigger: >-
        Release approval; not independent of build/transition work.
      outcome: Live journeys; a deployment outcome.
      boundary: Not defensible as a standalone process.
      semantic_identity: Restates deployment semantics at journey level.
      cross_context_stability: Variable.
      cross_domain_applicability: Single-domain flavor.
      ecf_independence: Depends on the Activate label for its identity.
      duplication: >-
        Overlaps transition-to-service work admitted at ProductAndValue/Activate
        (CR-BP-64).
      composition: Activity level within release or transition processes.
      capability_distinction: Not a capability.
      governance_distinction: Not a governance construct.
      lifecycle_span: Terminal-phase variant of build/transition work.
    scoring:
      process_reality: 1
      semantic_stability: 1
      cross_domain_applicability: 0
      boundary_clarity: 0
      evidence_strength: 0
      total: 2
      rationale: >-
        Execution-level release step; reclassify as Activity under the owning
        transition or release process.
    disposition:
      type: RECLASSIFY
      related_contexts:
      - ProductAndValue/Activate
  context_evaluation:
    concerns_identified: true
    candidates_considered: true
    adjacent_contexts_reviewed: true
    existing_processes_searched: true
    lifecycle_spanning_considered: true
    capability_distinctions_tested: true
    pattern_candidates_considered: true
    evidence_assessed: true
    process_empty: false
  rationale:
    included: >-
      Targeted escape-clause evaluation of the PartyAndRelationship x Activate
      register cell (register v8, backlog-deferred). The cell's escape
      condition reads "defer until a regulated onboarding (e.g. KYC for
      financial services) requires a distinct group". The discovery finds that
      condition met: regulated party onboarding (KYC/AML/CDD) is a legally
      mandated, boundary-clear, evidence-authoritative transformation distinct
      from steady-state relationship operation, scoring 9/10 and recommended
      ADMIT-CANONICAL as processes:process-pr-activate-6qzuve.
      This record re-evaluates the cell; the CR-BP-63 record
      (dea:discovery-party-and-relationship-activate) remains the baseline
      evidence for the cell's other candidates.
    excluded: >-
      Non-regulated first-time activation (Commence Relationship) remains
      deferred on the unresolved boundary against relationship-establishment
      processes; Activate Customer Journeys remains reclassified to Activity
      level. Neither is revived by the escape-clause evidence, which is
      specific to the regulated-onboarding case.
    unresolved: >-
      Admission of the recommended candidate is a separate governed step
      (admission tranche with PC + PG + BP stack and register flip); this
      discovery record recommends and does not admit.
