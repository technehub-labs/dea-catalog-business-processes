  rationale:
    included: 'Regulated entity run-off: insurer, mutual, or portfolio under PRA PS20/24, FSB 2025, NAIC Model 901, IFRS 17,
      ASC 205-30

      Statutory accounting basis transition: going-concern to liquidation-basis (US) or fulfillment-measurement (IFRS 17 run-off)

      Policyholder claim adjudication and payment during run-off

      Run-off plan submission within 28 days of supervised run-off (PRA PS20/24)

      Solvent exit certification (PRA) or completion certification (FSB) at run-off completion'
    excluded: 'Pre-run-off financial stewardship (Operate; F&A x Operate)

      Physical asset decommissioning (EnablementAndOperations x Retire; CR-BP-66)

      Counterparty and agent relationship closure (PartyAndRelationship x Retire; CR-BP-67)

