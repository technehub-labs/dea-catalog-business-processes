# Lifecycle process-discovery record (CR-BP-62 section 17).
# Exercise: CR-BP-63 (Activate/Retire boundary-stage discovery).
# Context: GovernanceAndExistence / Retire. Dispositions are discovery outcomes;
# canonical admission remains governed (CR-BP-62 section 20).
discovery:
  id: dea:discovery-governance-and-existence-retire
  ecf_context:
    domain: GovernanceAndExistence
    lifecycle_stage: Retire
  candidates:
  - name: Transition Out of Service
    proposed_identity:
      verb: Transition
      object: Policy Instrument Out of Service
      scope: enterprise
    trigger: An approved retirement decision exists for the policy instrument.
    inputs: Active policy instrument; retirement decision; dependency and impact analysis.
    transformation: 'Move the policy instrument from operational reliance toward controlled exit: withdrawal
      planning, stakeholder transition, and removal from operational dependence.'
    outcome: The policy instrument is no longer operationally relied upon; residual obligations are identified
      and routed.
    boundary: Begins at the approved retirement decision; ends at confirmed removal from operational reliance.
      Excludes post-exit obligation closure (Improve/Operate) and asset disposal execution.
    actors: Retirement owner; service owner; affected stakeholders.
    controls: Retirement approval; communication policy; data retention rules.
    evidence:
      sources:
      - ITIL service portfolio management practice includes service retirement as governed lifecycle work
      - eTOM (TM Forum GB921) lifecycle management covers service/resource withdrawal from operation
      - 'Industry end-of-life practice: product and service EOL policies standardize withdrawal-from-service
        work (notice, migration windows, final support)'
      evidence_strength: authoritative
    evaluation:
      process_reality: 'Established: service/product retirement is governed, repeatable enterprise work.'
      transformation: Clear state change from operationally relied-upon to exited.
      trigger: Approved retirement decision; meaningful and observable.
      outcome: Removal from operational reliance; distinguishable and auditable.
      boundary: 'Strong: retirement decision before, post-exit closure after.'
      semantic_identity: Verb (transition) + object (service object) + outcome (out of service) stand
        without the ECF label (BP-LIFE-009).
      cross_context_stability: Stable whether the object is a product, service, technology service or
        relationship.
      cross_domain_applicability: Broadest in service-bearing domains; recognizable elsewhere.
      ecf_independence: Identity survives removal of the Retire label.
      duplication: No existing canonical BP carries withdrawal-from-service semantics; checked against
        all 126 BP records.
      composition: 'L2: spans withdrawal planning, stakeholder transition and reliance removal.'
      capability_distinction: Transformation work, not an ability.
      governance_distinction: Governed work; not itself a policy or decision.
      lifecycle_span: Primarily Retire; migration steps legitimately touch Improve/Build under lifecycle-spanning
        rules.
    scoring:
      process_reality: 2
      semantic_stability: 2
      cross_domain_applicability: 1
      boundary_clarity: 2
      evidence_strength: 2
      total: 8
      rationale: 'Established and stable with authoritative evidence; thinner outside service-bearing
        domains: record the pattern with the canonical home at ProductAndValue/Retire.'
    disposition:
      type: RECORD-PATTERN
      related_contexts:
      - ProductAndValue/Retire
  - name: Decommission
    proposed_identity:
      verb: Decommission
      object: Policy Instrument
      scope: enterprise
    trigger: A retired policy instrument is released for decommissioning.
    inputs: Retired policy instrument; decommissioning plan.
    transformation: Take the policy instrument out of commission and prepare it for disposal or recovery.
    outcome: The policy instrument is decommissioned.
    boundary: Begins at release for decommissioning; ends at disposal or recovery readiness.
    actors: Asset owner; engineering; safety and compliance functions.
    controls: Safety and environmental regulation; disposal policy.
    evidence:
      sources:
      - 'ISO 55000 asset management: decommissioning as a lifecycle activity (asset-context evidence)'
      - eTOM resource lifecycle management
      evidence_strength: moderate
    evaluation:
      process_reality: Established in asset contexts; thinner for non-asset objects.
      transformation: Material where the object is asset-like; metaphorical otherwise.
      trigger: Release for decommissioning; observable.
      outcome: Decommissioned state; distinguishable and inspectable.
      boundary: Workable only where the object is asset-like.
      semantic_identity: Identity is an asset-context narrowing of Transition Out of Service.
      cross_context_stability: Stable only in asset-like contexts.
      cross_domain_applicability: Limited beyond asset-bearing domains.
      ecf_independence: Recognizable but derivative here.
      duplication: No existing BP duplicates decommissioning semantics.
      composition: Composition favors the Transition Out of Service parent for non-asset objects.
      capability_distinction: Transformation work, not an ability.
      governance_distinction: Heavily regulated work; not itself a policy.
      lifecycle_span: Primarily Retire; disposal execution may span into Operate under spanning rules.
    scoring:
      process_reality: 2
      semantic_stability: 2
      cross_domain_applicability: 1
      boundary_clarity: 2
      evidence_strength: 1
      total: 7
      rationale: 'Strong in asset contexts; as a general cross-domain candidate it is the asset-object
        narrowing of the recorded pattern: record pattern with canonical home at EnablementAndOperations/Retire.'
    disposition:
      type: RECORD-PATTERN
      related_contexts:
      - EnablementAndOperations/Retire
  - name: Migrate / Transfer
    proposed_identity:
      verb: Migrate
      object: Policy Instrument
      scope: enterprise
    trigger: Users, data or dependencies of a retiring policy instrument must move to a successor.
    inputs: Retiring policy instrument; successor target; migration plan.
    transformation: Move users, data and dependencies from the retiring policy instrument to the successor.
    outcome: Dependencies run on the successor; the retiring policy instrument carries no live load.
    boundary: Begins at migration start; ends at dependency cutover to the successor.
    actors: Migration owner; successor owner; affected users.
    controls: Migration windows; data-handling policy.
    evidence:
      sources:
      - TOGAF migration planning (ADM Phases E/F) treats migration as governed transition work
      - Industry migration practice (platform, data and customer migrations) is standardized and repeatable
      evidence_strength: moderate
    evaluation:
      process_reality: Established and repeatable.
      transformation: Dependency-location change; real.
      trigger: Migration requirement from a retiring object; meaningful.
      outcome: Successor carries the load; distinguishable.
      boundary: Workable.
      semantic_identity: Recognizable across contexts.
      cross_context_stability: Stable transformation with highly variable implementation.
      cross_domain_applicability: Broad, but the same candidate legitimately participates at Build and
        Improve (platform migrations, restructurings), not only Retire.
      ecf_independence: Independent of the Retire label.
      duplication: No duplication; the question is stage span, not overlap.
      composition: L2-scale work in large migrations; often an Activity set within retirement or improvement
        processes.
      capability_distinction: Transformation work.
      governance_distinction: Not governance.
      lifecycle_span: 'Lifecycle-spanning by nature (BP-LIFE-014): record as a pattern spanning Build/Improve/Retire
        rather than duplicating per stage.'
    scoring:
      process_reality: 2
      semantic_stability: 1
      cross_domain_applicability: 2
      boundary_clarity: 1
      evidence_strength: 1
      total: 7
      rationale: 'Stable, cross-domain, lifecycle-spanning transformation with variable implementation:
        record as a pattern; do not duplicate per stage.'
    disposition:
      type: RECORD-PATTERN
      related_contexts: []
  - name: Close Enterprise Relationship
    proposed_identity:
      verb: Close
      object: Enterprise Relationship
      scope: enterprise
    trigger: A contract or relationship reaches termination, expiry or an approved exit decision.
    inputs: Active relationship; termination terms; outstanding obligations register.
    transformation: 'Wind down the relationship: terminate or let expire, settle outstanding obligations,
      and close the accounts of the relationship.'
    outcome: The relationship is formally closed; residual obligations are settled or routed.
    boundary: Begins at termination/expiry trigger; ends at formal closure with obligations settled or
      routed.
    actors: Relationship owner; counterparty; legal and finance functions.
    controls: Termination provisions; notice periods; settlement policy.
    evidence:
      sources:
      - Contract close-out practice (relationship-context evidence)
      evidence_strength: moderate
    evaluation:
      process_reality: Established wherever contracts and relationships end.
      transformation: Relationship-state change from active to closed; material and auditable.
      trigger: Termination, expiry or approved exit; observable.
      outcome: Formal closure with obligations settled or routed; distinguishable.
      boundary: Weaker where the 'relationship' framing is secondary to an asset or service object.
      semantic_identity: 'Stands without the ECF label: relationship closure is named directly.'
      cross_context_stability: Stable but secondary outside relationship-bearing domains.
      cross_domain_applicability: Home ground is PartyAndRelationship; recognizable kin in FinanceAndAccounting
        (account closure).
      ecf_independence: Independent.
      duplication: No existing BP duplicates relationship-closure semantics.
      composition: 'L2: spans notice, settlement and closure confirmation.'
      capability_distinction: Transformation work.
      governance_distinction: Contains legal acts but is closure work.
      lifecycle_span: Primarily Retire.
    scoring:
      process_reality: 2
      semantic_stability: 2
      cross_domain_applicability: 1
      boundary_clarity: 2
      evidence_strength: 1
      total: 7
      rationale: 'Real but relationship-framed: record the pattern with the canonical home at PartyAndRelationship/Retire.'
    disposition:
      type: RECORD-PATTERN
      related_contexts:
      - PartyAndRelationship/Retire
  - name: Recover / Reclaim
    proposed_identity:
      verb: Recover
      object: Residual Value
      scope: enterprise
    trigger: A decommissioned or exited policy instrument holds recoverable value.
    inputs: Exited policy instrument; recovery options.
    transformation: Reclaim residual value (materials, licenses, deposits, capacity) from the exited object.
    outcome: Recoverable value is reclaimed and accounted for.
    boundary: Begins at recovery decision; ends at reclaimed value booked.
    actors: Asset owner; finance; recovery vendors.
    controls: Recovery policy; accounting rules.
    evidence:
      sources:
      - Asset recovery and salvage practice (asset-context evidence)
      evidence_strength: weak
    evaluation:
      process_reality: Real but situational work.
      transformation: Value-location change; real but downstream of exit.
      trigger: Recovery decision; situational.
      outcome: Reclaimed value; distinguishable.
      boundary: Nested inside exit work.
      semantic_identity: Subordinate to Transition Out of Service / Decommission outcomes.
      cross_context_stability: Variable by object class.
      cross_domain_applicability: Concentrated in asset-bearing domains.
      ecf_independence: Recognizable but derivative.
      duplication: Overlaps the exit candidates' outcomes.
      composition: Activity-scale within exit processes.
      capability_distinction: Transformation work, wrong level.
      governance_distinction: Not governance.
      lifecycle_span: None independent.
    scoring:
      process_reality: 1
      semantic_stability: 1
      cross_domain_applicability: 0
      boundary_clarity: 1
      evidence_strength: 0
      total: 3
      rationale: 'Derivative recovery step: merge into the exit candidates as an outcome activity.'
    disposition:
      type: MERGE
      related_contexts:
      - ProductAndValue/Retire
      - EnablementAndOperations/Retire
      canonical_process_ref: processes:process-pv-retire-6us5am (proposed)
  - name: Resolve Residual Obligations
    proposed_identity:
      verb: Resolve
      object: Residual Obligations
      scope: enterprise
    trigger: An exited policy instrument leaves obligations that outlive the exit (retention, warranty,
      support tail, regulatory duties).
    inputs: Residual obligations register; applicable policies and statutes.
    transformation: Track, discharge or transfer obligations that survive the object's exit until each
      is closed.
    outcome: No unmanaged residual obligations remain.
    boundary: Begins at exit completion; ends at final obligation closure.
    actors: Obligation owner; legal; compliance.
    controls: Retention policy; statutory duties; warranty terms.
    evidence:
      sources:
      - Data retention and disposal obligations under privacy and records-management regimes (e.g. GDPR
        storage-limitation principle) are universal post-exit work
      - Warranty and support-tail administration in product practice
      evidence_strength: moderate
    evaluation:
      process_reality: Established wherever exits occur.
      transformation: Obligation-state change to closed; real but asynchronous and long-tailed.
      trigger: Exit completion with residual register non-empty; meaningful.
      outcome: All residuals closed; distinguishable.
      boundary: Workable but temporally unbounded; governed by obligation terms.
      semantic_identity: Recognizable across domains.
      cross_context_stability: Stable transformation; highly variable obligation mix.
      cross_domain_applicability: 'Broad: every domain''s exits leave residuals.'
      ecf_independence: Independent of the Retire label.
      duplication: No duplication of existing BPs.
      composition: Long-tailed obligation tracking reads as a pattern feeding multiple domains rather
        than one concrete L2 process.
      capability_distinction: Transformation work.
      governance_distinction: Adjacent to compliance governance but is discharge work.
      lifecycle_span: Post-exit span legitimately reaches into Operate/Improve; handle via spanning rules.
    scoring:
      process_reality: 2
      semantic_stability: 1
      cross_domain_applicability: 2
      boundary_clarity: 1
      evidence_strength: 1
      total: 7
      rationale: 'Stable cross-domain closure work with variable implementation and unbounded tail: record
        as a pattern.'
    disposition:
      type: RECORD-PATTERN
      related_contexts: []
  - name: Sunset / Rescind Policy Instrument
    proposed_identity:
      verb: Rescind
      object: Policy Instrument
      scope: enterprise
    trigger: A policy instrument reaches its sunset date or a repeal decision is approved.
    inputs: In-force instrument; sunset or repeal authority; dependency analysis.
    transformation: 'Move the instrument from in-force to no-longer-in-force: obligations cease, with
      transitional provisions for accrued rights.'
    outcome: The instrument is rescinded; accrued rights and transitional duties are preserved or discharged.
    boundary: Begins at sunset/repeal trigger; ends at loss of force. Entangled with policy review and
      replacement work at Improve.
    actors: Governance authority; promulgating body; affected parties.
    controls: Sunset clauses; repeal procedures; transitional provisions.
    evidence:
      sources:
      - 'Legal-regulatory practice: repeal, sunset clauses and transitional provisions are universal mechanisms
        in statute and regulation systems'
      evidence_strength: moderate
    evaluation:
      process_reality: Established in legal-regulatory systems; rarer in enterprise-internal governance.
      transformation: Real loss-of-force change.
      trigger: Sunset date or repeal decision; observable.
      outcome: Instrument no longer in force; distinguishable.
      boundary: 'Entangled: rescission typically arrives as the outcome of policy review (Improve) rather
        than as standalone retirement work.'
      semantic_identity: Recognizable; mirror-image of Bring into Force.
      cross_context_stability: Stable in legal-regulatory contexts.
      cross_domain_applicability: Primarily governance instruments.
      ecf_independence: Independent of the ECF label.
      duplication: No duplication; the question is composition vs policy-review processes.
      composition: Boundary evidence insufficient to separate from policy review at Improve; register
        note (rare; attribute of operating-model retirement) is consistent with this evaluation.
      capability_distinction: Transformation work.
      governance_distinction: Governance-heavy but is workflow-shaped.
      lifecycle_span: Retire with Improve adjacency.
    scoring:
      process_reality: 1
      semantic_stability: 1
      cross_domain_applicability: 0
      boundary_clarity: 0
      evidence_strength: 1
      total: 3
      rationale: 'Real mechanism, but in enterprise governance it rides on policy review at Improve and
        lacks a defensible standalone boundary: defer per the register''s sector-example condition.'
    disposition:
      type: DEFER
      related_contexts:
      - GovernanceAndExistence/Improve
  context_evaluation:
    concerns_identified: true
    candidates_considered: true
    adjacent_contexts_reviewed: true
    existing_processes_searched: true
    lifecycle_spanning_considered: true
    capability_distinctions_tested: true
    pattern_candidates_considered: true
    evidence_assessed: true
    process_empty: true
  rationale:
    included: 'Evaluated 7 candidates for the GovernanceAndExistence/Retire context against the BP-LIFE-001..015
      battery. Recorded as reusable patterns: Transition Out of Service, Decommission, Migrate / Transfer,
      Close Enterprise Relationship, Resolve Residual Obligations.'
    excluded: 'Excluded from canonical admission: merged as duplicate/terminal-phase semantics: Recover
      / Reclaim.'
    unresolved: 'Unresolved: deferred pending further evidence or boundary resolution: Sunset / Rescind
      Policy Instrument; no canonical Business Process identified after evaluation; the context remains
      process-empty for canonical purposes with this record as the documented rationale (CR-BP-62 section
      15).'
