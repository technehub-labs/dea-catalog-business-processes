status: candidate
definition: The cohesive grouping of work within Onboard Regulated Party Relationship
  that applies the four-eye or higher-approver regime, records the activation or refusal
  decision with the supporting rationale and approver identity, and issues the onboarding
  record to the systems that open or close the relationship.
belongs_to_business_process: dea:process-onboard-regulated-party-relationship
cohesion_rationale: Constituent work shares a single decision-recording concern, one
  input class (the completed identity, ownership, and risk artefacts plus the approver's
  adjudication), and one output (an evidenced decision record that triggers relationship
  activation or refusal). Cohesion score 9/9 assessed at deposition (CR-BP-32 section
  6).
