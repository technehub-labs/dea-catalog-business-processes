id: processes:group-pv-design-msz6da
type: ProcessGroup
version: 1.0.0
name: Proposition Design
definition: 'The bounded Process Group that organises the Business Process responsibilities of designing product and service propositions, their packaging and configuration, and innovation experiments in the ProductAndValue x Design context. v2.4.0 grounding (domain-grounding.md §3.5).

  '
process_context: processes:pc-pv-design-8dhwpn
scope:
  includes:
  - Product and service proposition design
  - Packaging and configuration design
  - Innovation experiment design
  excludes:
  - Technology platform architecture (enablement-operations)
  - Value proposition thesis conception (Conceive stage; adjacent context)
  - Product variant development (Build stage; adjacent context)
outcomes:
- Propositions are designed with bounded specifications.
- Packaging and configuration are designed for target segments.
- Innovation experiments are designed with hypotheses and timeboxes.
