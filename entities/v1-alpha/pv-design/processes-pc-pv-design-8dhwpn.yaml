name: Proposition and Packaging Design
definition: 'The bounded enterprise context for **designing** the propositions, packaging, configuration, and innovation experiments of the enterprise in the **Product & Value** domain. This context addresses the analytical work of producing designs for product and service propositions, packaging and configuration, and innovation experiments. v2.4.0: the domain owns the value-bearing proposition, not every form of value in the enterprise (domain-grounding.md §3.5).

  '
scope:
  includes:
  - Proposition design
  - Packaging and configuration design
  - Innovation experiment design
  - Proposition architecture design
  excludes:
  - Proposition conception (Conceive stage; adjacent context)
  - Product development (Build stage; adjacent context)
  - Technology platform architecture (enablement-operations x design; adjacent domain)
  - Strategic direction design (strategy-direction x design; adjacent domain)
outcomes:
- Product and service propositions are designed with bounded scope.
- Packaging and configuration designs are committed.
- Innovation experiments are designed and ready for Build.
- Proposition architecture is designed for the portfolio.
