plain_language_name: 'Commit Experiment Design'
plain_language_description: 'This activity draws the hypothesis, the success criteria, and the timebox together into one committed experiment design. The three strands arrive as its inputs, the whole is consolidated and ratified, and the committed design is confirmed as the basis for the prototype build. The test is fully specified before the first thing is built for it.'
business_purpose: 'It exists so the prototype build proceeds from one committed experiment design.'
practical_context: 'It closes the experiment design once hypothesis, criteria, and timebox are defined, and it completes when the committed experiment design is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian assembles the hypothesis, success criteria, and timebox into the experiment design, obtains ratification, and records the committed design for the build.'
