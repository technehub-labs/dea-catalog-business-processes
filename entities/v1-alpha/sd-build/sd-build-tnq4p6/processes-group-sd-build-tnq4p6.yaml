type: ProcessGroup
version: 1.0.0
name: Strategic Plan Build
definition: 'The bounded Process Group that organises the Business Process responsibilities of building the strategic plan in the StrategyAndDirection x Build context. This group covers the constructive work of building the strategic plan, building the strategic roadmap, translating strategic choices into initiatives, and setting resource allocation priorities. v2.4.0 grounding (domain-grounding.md §3.2).

  '
process_context: processes:pc-sd-build-gmzrrm
scope:
  includes:
  - Strategic plan build
  - Strategic roadmap build
  - Strategic choices translation into initiatives
  - Resource allocation priorities
  excludes:
  - Budget construction (finance-accounting x build)
  - Capability build (owning domains)
  - Strategic choices design (Design stage; adjacent context)
outcomes:
- Strategic plan is built and committed.
- Strategic roadmap is built with sequenced initiatives.
- Resource allocation priorities are set per initiative.
