plain_language_name: 'File the Assembled Plan Evidence for the Build'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so how the plan came together, and from which version, stays retrievable through every later revision.'
business_purpose: 'It exists so the assembled plan''s provenance is answerable when a future revision asks why the plan reads as it does.'
practical_context: 'It opens when the confirmation is in place, and it closes with the assembly evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the assembly evidence at its required retention tier and sets the retrieval handles, so the next planning cycle can trace the plan back to its bounded version.'
