plain_language_name: 'Bring the Plan Together with Its Direction, Objectives and Allocation'
plain_language_description: 'With the inputs verified, the assembly proper begins. The processing custodian draws the bounded version, chosen direction, objectives, initiatives and allocation into one document, producing the assembled plan in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because direction, objectives and allocation only steer the organisation once they are bound into a single assembled plan.'
practical_context: 'It opens when the verified material is ready to be worked, and it closes with the assembled plan produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function binds the bounded version, the chosen direction, its objectives and initiatives and the allocation into the plan document, keeping the assembly workings for the audit trail.'
