plain_language_name: 'Take In the Bounded Version and Its Choice and Roadmap Material'
plain_language_description: 'The assembly opens as its material arrives: the bounded plan version together with the chosen direction, objectives, initiatives and allocation that hang off it. The intake custodian logs them against the assembly file so the assembling starts accounted for.'
business_purpose: 'It exists so the plan is assembled from a logged bounded version and its parts, never from scattered unversioned pieces.'
practical_context: 'It opens when the bounded version and its supporting material are presented for assembly, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the bounded plan version with its committed choice and built roadmap into the assembly file, so the plan assembly starts accounted for.'
