plain_language_name: 'Build Strategic Plan'
plain_language_description: 'After the strategic choices have been evaluated and a path chosen, this work writes that choice down as a formal, versioned plan. The strategy function assembles the plan with its roadmap and the portfolio of initiatives that will carry it, and sets the resource allocation priorities within the authorised frame. The committed plan then becomes the reference the organisation executes against.'
business_purpose: 'It turns an agreed direction into a durable, versioned document: without a committed plan, roadmap, and initiative portfolio, the chosen strategy stays an intention rather than something the enterprise can steer by.'
practical_context: 'Runs at the point in the strategy cycle where evaluated choices are ready to be written up; the strategy function drafts and commits the plan, roadmap, and initiative portfolio ahead of execution.'
worked_example:
  agent_type: human
  narrative: 'The strategy function drafts the plan document, pins the roadmap milestones into sequence, and lists the initiatives that will deliver each step. Resource envelopes are set within the authorised frame, and the versioned plan is committed for the organisation to work to.'
