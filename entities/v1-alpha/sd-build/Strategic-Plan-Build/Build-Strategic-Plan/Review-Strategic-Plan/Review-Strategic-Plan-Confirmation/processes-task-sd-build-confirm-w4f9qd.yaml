plain_language_name: 'Hand the Reviewed Plan to the Committing Step'
plain_language_description: 'The confirming opens once the plan is reviewed. The confirmation custodian tells the downstream teams the reviewed plan is available, and closes the reconciliation against what the activity promised for the review.'
business_purpose: 'It exists so the commitment work proceeds from a confirmed review rather than from an opinion formed in a corridor.'
practical_context: 'It opens when the reviewed plan is ready to hand on, and it closes with the confirmation issued and the review''s promises checked off against what was delivered.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian in the strategy function hands the reviewed plan to the commitment team, reconciles the delivered review against what it promised, and issues the confirmation.'
