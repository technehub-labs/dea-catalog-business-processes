plain_language_name: 'Review Strategic Plan'
plain_language_description: 'Someone now reads the assembled plan with a sceptical eye. Intake brings the document in, verification tests it line by line against the direction the enterprise chose and the version it was scoped to, and any gaps go back for rework. Once the scrutiny is satisfied, confirmation records the outcome and the reviewed plan is kept with its audit trail.'
business_purpose: 'It protects the process from committing a plan that quietly drifts from the direction and scope leadership actually approved.'
practical_context: 'It happens straight after assembly, opening at intake of the drafted document and closing when the review verdict is confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'Two strategy function reviewers sit down with the assembled plan, tick each section against the approved direction and version scope, and raise one chapter for rework; after the fix, the confirmation custodian records the verdict and the records custodian archives the reviewed document.'
