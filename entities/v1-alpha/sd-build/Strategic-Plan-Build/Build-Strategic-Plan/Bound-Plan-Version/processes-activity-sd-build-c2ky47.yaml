plain_language_name: 'Set the Plan Version Boundary'
plain_language_description: 'Before anyone writes a page of the plan, somebody has to decide exactly which evaluated choice and which roadmap this document covers. The team registers the incoming materials, confirms they match what the build needs, and marks out the version''s reach so later drafting stays inside agreed lines. Once the boundary is agreed it is confirmed to downstream colleagues and stored with its audit trail.'
business_purpose: 'It fixes the identity of the plan document early, so every later assembly, review and commitment refers to one clearly scoped version.'
practical_context: 'It opens at intake when the committed choice and the built roadmap are presented, and closes when the version boundary is confirmed and filed.'
worked_example:
  agent_type: human
  narrative: 'A strategy function planner takes in the committed choice and the finished roadmap, agrees with the activity owner where the plan version starts and stops, and hands the marked-out version to the drafting team with its audit identifiers recorded.'
