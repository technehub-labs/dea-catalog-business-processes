plain_language_name: 'Prioritize Allocation Decisions'
plain_language_description: 'Not every funded initiative can start at once, so ranks are needed. Intake registers the allocations, verification tests them against the envelope limits and what the plan says matters most, and processing orders the decisions into a defensible priority list. Confirmation communicates the ranking and the records custodian preserves it ahead of commitment.'
business_purpose: 'It ranks the resourcing choices so the strongest strategic cases are served first when envelopes are tight.'
practical_context: 'It follows allocation, opening when the allocation decisions are presented at intake and closing when the agreed ranking is confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'Strategy function leads compare the allocated initiatives against the plan''s stated priorities and the envelope headroom, agree the ranking in a short review, and the confirmation custodian communicates the order to downstream colleagues before commitment.'
