plain_language_name: 'Rank the Allocation Decisions Against Envelopes and Plan'
plain_language_description: 'With the inputs verified, the prioritizing proper begins. The processing custodian weighs each allocation decision against the bounded envelopes and the strategic plan, producing the prioritized decisions in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because scarce resources need a defensible order of precedence, argued from the plan rather than asserted.'
practical_context: 'It opens when the verified material is ready to be worked, and it closes with the prioritized decisions produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function ranks the verified decisions against their envelopes and the plan''s priorities, keeping the weighing workings for the audit trail.'
