plain_language_name: 'Test the Sequence and Milestones Before Assembling the Roadmap'
plain_language_description: 'Before the roadmap is put together, the arriving sequence and milestones are put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because a roadmap built over mismatched sequence and anchors misleads every team that plans against it.'
practical_context: 'It opens once the intake is registered and the assembly material is ready to be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the logged sequence and milestones against what the activity requires, and writes up a milestone that no sequence step delivers as a shortfall to be put right.'
