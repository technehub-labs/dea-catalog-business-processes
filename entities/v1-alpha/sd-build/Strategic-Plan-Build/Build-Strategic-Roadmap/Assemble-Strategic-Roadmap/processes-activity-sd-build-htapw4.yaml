plain_language_name: 'Assemble Strategic Roadmap'
plain_language_description: 'Now the pieces become one navigable document. Intake registers the ordered initiatives and their fixed dates, verification makes sure nothing is missing or contradictory, and processing merges them into a single roadmap that reads from first step to last. When assembly is confirmed, downstream colleagues are notified and the assembled roadmap is preserved with its audit trail.'
business_purpose: 'It combines order and dates into one roadmap artifact that the wider planning effort can read, challenge and ultimately commit.'
practical_context: 'It runs once sequencing and milestone anchoring are complete, closing when the assembled roadmap is confirmed as ready for commitment.'
worked_example:
  agent_type: human
  narrative: 'A strategy function roadmap writer combines the agreed initiative order and the anchored dates into one document, a verification custodian confirms the threads tie together, and the confirmation custodian tells plan-build colleagues the draft roadmap is ready.'
