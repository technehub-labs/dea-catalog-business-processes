plain_language_name: 'Review Strategic Fit'
plain_language_description: 'Drafted work is only worth committing if it genuinely serves the direction. Intake brings the initiative set in, scrutiny tests each draft against what the plan and the chosen direction actually call for, and anything off-course is flagged for rework. When the fit is confirmed, downstream colleagues are notified and the fit-checked set is preserved.'
business_purpose: 'It filters out initiatives that would quietly pull the enterprise off its chosen path, so only aligned work reaches commitment.'
practical_context: 'It happens after drafting, opening when the drafted initiatives are presented at intake and closing when the fit verdict is confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'Two strategy function reviewers read each drafted initiative against the approved direction, return one misaligned proposal for reshaping, and the confirmation custodian records the fit outcome once every draft passes.'
