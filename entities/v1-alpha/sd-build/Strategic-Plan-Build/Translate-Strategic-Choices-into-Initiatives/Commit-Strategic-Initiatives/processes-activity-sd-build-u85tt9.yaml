plain_language_name: 'Commit Strategic Initiatives'
plain_language_description: 'The initiative set has survived scoping, drafting and the fit review, so it is ready to become official. Intake registers the confirmed set, a last verification checks every initiative is complete, and the commitment is made so the roadmap and resourcing work can pick them up. Confirmation tells downstream consumers the committed set is available and the records custodian preserves it with its audit identifiers.'
business_purpose: 'It finalises the translated choices as a committed initiative set, the handover this process owes to the sequencing and resourcing work that follows.'
practical_context: 'It opens after the fit review clears the set and closes when commitment is confirmed, consumers notified and evidence archived.'
worked_example:
  agent_type: human
  narrative: 'The strategy function lead commits the fit-checked initiative set, the confirmation custodian notifies the roadmap and allocation teams that their inputs are ready, and the records custodian files the set with retention and retrieval handles set up.'
