plain_language_name: 'Set the Initiative Scope'
plain_language_description: 'Every chosen direction needs turning into work with edges. This step registers the committed choice and the parent plan, verifies the inputs, and marks out how far each initiative may reach — what is in and what is out. The agreed scope lines are confirmed downstream and preserved so drafting stays inside them.'
business_purpose: 'It stops initiative drafting from sprawling by fixing agreed edges around each piece of work the choices demand.'
practical_context: 'It opens at intake when the committed choice and the plan are presented, closing once the scope boundaries are confirmed and filed.'
worked_example:
  agent_type: human
  narrative: 'A strategy function facilitator walks the committed choice through a scoping session, agrees with the activity owner what each initiative will and will not cover, and the records custodian preserves the agreed boundaries for the drafting team.'
