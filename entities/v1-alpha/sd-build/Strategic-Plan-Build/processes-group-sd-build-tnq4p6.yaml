plain_language_name: 'Building the Strategic Plan and Roadmap'
plain_language_description: 'This family assembles the plan itself. Its processes build the strategic plan, construct the roadmap with sequenced initiatives, translate the designed strategic choices into concrete initiatives, and set the resource allocation priorities each initiative will live within.'
business_purpose: 'So direction becomes a committed, versioned plan and roadmap — initiatives named, sequenced and resourced within the authorised envelope.'
practical_context: 'Encountered in the Build stage, once strategic choices are designed, ahead of plan activation and the steering of execution.'
worked_example:
  agent_type: human
  narrative: 'After the choices are designed, the Strategy & Direction Process Owner builds the strategic plan, sequences the roadmap initiatives, translates each choice into owned initiatives, and sets the resource allocation priorities the programme teams will work within.'
