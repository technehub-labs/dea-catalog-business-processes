plain_language_name: 'Strategic Plan Build'
plain_language_description: 'This context covers the Strategy & Direction area at the Build stage: assembling the actual plan. It builds the strategic plan and roadmap, translates committed choices into an initiative portfolio, and sets resource allocation priorities within the authorized frame. Designing the options beforehand and steering execution afterwards belong to neighboring contexts.'
business_purpose: 'To turn strategic choices into a versioned plan, roadmap, and initiative set with clear priorities and resourcing.'
practical_context: 'Encountered in planning seasons after choices are committed — the weeks where strategy becomes documents, roadmaps, and funded initiatives.'
worked_example:
  agent_type: human
  narrative: 'In the planning season, the Strategy & Direction Process Owner assembles the plan document, sequences the roadmap, translates each committed choice into named initiatives, and sets resource priorities within the authorized envelope.'
