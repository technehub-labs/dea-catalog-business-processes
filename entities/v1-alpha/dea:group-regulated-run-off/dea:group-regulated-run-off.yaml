id: dea:group-regulated-run-off
type: ProcessGroup
version: 1.0.0

name: Regulated Run-Off

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of retiring a regulated financial entity
  (insurer, mutual, or run-off portfolio) under statutory run-off
  obligations in the FinanceAndAccounting x Retire context where
  regulator-acknowledged run-off authorisation triggers distinct
  group-level work (run-off plan submission, statutory accounting
  basis transition, reserving, capital adequacy, asset-liability
  matching, policyholder priority, communications, retained-records,
  exit accounting, and solvent-exit or run-off completion
  certification).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-fa-retire

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - "Regulator-acknowledged run-off authorisation (PRA, FCA, NAIC, IAIS, EIOPA member authorities)"
    - "Run-off plan submission within the controlling regulator's window (28-day window under PRA PS20/24)"
    - "Statutory accounting basis transition: going-concern to liquidation-basis (ASC 205-30) or fulfillment-measurement (IFRS 17 run-off treatment)"
    - "Reserving, capital adequacy, and asset-liability matching throughout the run-off period"
    - "Policyholder priority creditor treatment and policyholder claim adjudication and payment"
    - "Communications to policyholders and stakeholders"
    - "Retained-records and service-of-process obligations"
    - "Tax-clearance and statutory liability settlement"
    - "Solvent exit certification or run-off completion certification"
  excludes:
    - "Pre-run-off financial stewardship (Operate coordinate)"
    - "Physical asset decommissioning (EnablementAndOperations x Retire; CR-BP-66)"
    - "Counterparty and agent relationship closure (PartyAndRelationship x Retire; CR-BP-67)"
    - "Product line retirement (ProductAndValue x Retire; CR-BP-67 adjacent)"
    - "Non-insurance regulated wind-downs (banks under PRA BRRD / FDIC OLA, pension funds under PBGC termination) -- deferred to a future CR"

# Intended enterprise outcomes.
outcomes:
  - "The regulated run-off is executed under the controlling regulator's supervision with statutory accounting basis (liquidation basis under ASC 205-30, IFRS 17 fulfillment measurement for insurance liabilities, IFRS 5 for held-for-sale groups), all policyholder claims adjudicated and paid under policyholder-priority creditor treatment, statutory liabilities settled, retained-records and service-of-process obligations satisfied, and the entity's authorisation surrendered or the run-off portfolio fully transferred with solvent-exit certification (PRA) or run-off completion certification (FSB) obtained."

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-regulated-run-off
    target_id: dea:process-conclude-regulated-run-off
    relationship_type: composes
