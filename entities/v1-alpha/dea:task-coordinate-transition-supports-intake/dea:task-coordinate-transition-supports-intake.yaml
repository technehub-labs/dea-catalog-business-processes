id: dea:task-coordinate-transition-supports-intake
type: Task
name: Coordinate Transition Supports Intake
definition: 'The bounded unit of work within `dea:activity-coordinate-transition-supports`
  (Coordinate Transition Supports) that carries out the intake phase of the parent''s
  verb-object decomposition. Phase responsibility: designated intake custodian. Phase
  trigger: Parent Activity''s input class is presented for processing and the activity
  owner is notified of intake. Phase outcome: Intake registered; input artifact preserved
  with audit identifiers; downstream phases may proceed.'
belongs_to_activity: dea:activity-coordinate-transition-supports
trigger: Parent Activity's input class is presented for processing and the activity
  owner is notified of intake.
outcome: Intake registered; input artifact preserved with audit identifiers; downstream
  phases may proceed.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Acceptance of the input artifact per parent Activity scope.
  - Issuance of intake acknowledgment with audit identifiers.
  exclusions:
  - Validation of the input against specifications (phase 2).
  - Transformation of the input to the specified form (phase 3).
evidence:
- source: dea:activity-coordinate-transition-supports
  claim: "Parent Activity cohesion rationale (CR-BP-32 \xA76): Constituent work shares\
    \ a single transition-support coordination concern, one input class (the affected-employee\
    \ roster and the available public and private support programmes), and one output\
    \ (the package of supports offered to each affected employee with delivery and\
    \ uptake evidence). Cohesion score 8/9 assessed at deposition (CR-BP-32 section\
    \ 6): coordination spans multiple delivery partners and uptake is contingent on\
    \ employee choice."
  strength: E3
- source: CR-BP-102
  claim: Task decomposition pattern (5-phase verb-object completion) authored by `scripts/decompose_l4.py`.
  strength: E2
