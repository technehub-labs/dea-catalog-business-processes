plain_language_name: 'Work Out and Fund What Each Employee Is Owed'
plain_language_description: 'With the particulars verified, the processing custodian makes the computation itself: the statutory notice pay, severance, and benefits continuation owed to each employee are calculated, the total liability is reserved or funded for the severance date, and the entitlement schedule is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because people owed severance must be able to trust the number - and the money must actually be there on the day.'
practical_context: 'It starts once checking is complete and the verified particulars are ready to be computed from, and it ends with the entitlement schedule and funded liability produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in workforce management computes each employee''s statutory entitlements, reserves the total, and records the funded liability, keeping the working papers.'
