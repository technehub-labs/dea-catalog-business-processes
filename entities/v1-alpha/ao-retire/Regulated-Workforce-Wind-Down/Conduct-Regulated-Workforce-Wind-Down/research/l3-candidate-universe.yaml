- id: processes:activity-ao-retire-uqgpmh
  name: "Notify Statutory Workforce Reduction"
  l2_criteria_test:
    input_output_transformation: pass
    objective_contribution: pass
    standalone_executability: fail
    resource_dedication: fail
  verdict: activity
  cohesion_score: 9
  in_scope: "Service of the statutory advance-notice period (WARN Act 60 days, EU Directive 98/59/EC, UK Trade Union and Labour Relations (Consolidation) Act 1992 section 188, jurisdictional equivalents); preparation and submission of the regulator-filed notice; documentation of the notice service method, recipients, and dates for consultation evidence."
  out_of_scope:
  - "Consultation with representative bodies (decomposition into Consult Representative Bodies)"
  - "Computation of statutory notice pay, severance, and benefits continuation (decomposition into Compute Statutory Liabilities)"
  - "Dislocated-worker transition supports (decomposition into Coordinate Transition Supports)"
  - "Voluntary separation programs not triggering statutory thresholds (handled by the conventional workforce reduce path)"
  evidence:
  - "Parent BP trigger: 'A regulated wind-down event is authorized (mass layoff, agent unit decommission, or organizational unit wind-down) where statutory advance-notice and consultation obligations are triggered by the size and nature of the employment reduction.'"
  - "US Worker Adjustment and Retraining Notification Act (WARN Act) 29 USC 2101-2109: 60-day advance notice of mass layoff or plant closing affecting 50+ employees at a single site."
  - "EU Council Directive 98/59/EC: collective redundancy consultation and notification obligations where thresholds are crossed within a 30-day window."
  - "UK Trade Union and Labour Relations (Consolidation) Act 1992 section 188: consultation obligations where 20 or more employees are dismissed at an establishment within 90 days."
  disposition: landed
  landed_at: '2026-09-16'
  landed_by: CR-BP-77
