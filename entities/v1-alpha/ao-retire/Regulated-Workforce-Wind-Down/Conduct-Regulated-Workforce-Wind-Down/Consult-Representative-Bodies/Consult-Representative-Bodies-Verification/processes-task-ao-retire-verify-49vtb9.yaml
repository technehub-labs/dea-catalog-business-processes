plain_language_name: 'Check the Proposal Before Consultation Opens'
plain_language_description: 'Before consultation opens, the verification custodian checks the scope, business case, and alternatives against what consultation requires - that the proposal is complete enough for representatives to respond to meaningfully. Defects are logged for rejection or repair before the consultation begins.'
business_purpose: 'It exists so representatives are never consulted on a proposal too thin to respond to.'
practical_context: 'It runs once the intake is registered and the proposal can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the consultable alternatives section empty and logs the defect before consultation opens.'
