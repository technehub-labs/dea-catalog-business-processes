plain_language_name: 'Coordinate Transition Supports'
plain_language_description: 'This activity lines up the practical help that supplements the statutory entitlements for everyone affected: the state referral service for displaced workers, retraining, continued health cover, and help finding new work. The affected roster and the support programmes on offer arrive together, a support package is put together per person, and the offered supports, with delivery and uptake noted, are confirmed and retained.'
business_purpose: 'It exists so everyone affected by the wind-down is offered real help landing on their feet, beyond the money owed.'
practical_context: 'It runs once the affected roster is settled during the wind-down, and it closes when each person''s offered supports, with delivery and uptake evidence, are confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function coordinator matches each person on the affected roster to the referral, retraining, and health-cover programmes available, records what was offered and taken up, and files the evidence.'
