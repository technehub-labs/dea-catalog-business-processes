plain_language_name: 'Receive the Affected Roster and the Support Programmes'
plain_language_description: 'Support coordination opens when the affected-employee roster and the available public and private support programmes are handed over together. The intake custodian accepts both, registers them with audit identifiers, and starts the coordination from a recorded base.'
business_purpose: 'It exists so supports are arranged over a registered roster against registered programmes rather than piecemeal.'
practical_context: 'It opens when the roster and programmes are presented for coordination, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the operations function registers the affected roster and the support programmes as the coordination baseline, with audit references.'
