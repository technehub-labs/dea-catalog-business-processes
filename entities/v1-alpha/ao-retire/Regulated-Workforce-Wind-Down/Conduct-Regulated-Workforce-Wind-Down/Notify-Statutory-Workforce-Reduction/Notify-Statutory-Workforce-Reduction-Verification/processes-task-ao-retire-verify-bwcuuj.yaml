plain_language_name: 'Check the Event and Roster Before the Notices Issue'
plain_language_description: 'Before any notice issues, the verification custodian checks the event and roster against what notification requires - that the reduction crosses the thresholds the controlling statute sets and the roster matches the authorized scope. Defects are logged for rejection or repair before any notice is served.'
business_purpose: 'It exists so statutory notices never issue on an unauthorized event or a roster that overshoots it.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the roster running wider than the authorized scope and logs the defect before any notice issues.'
