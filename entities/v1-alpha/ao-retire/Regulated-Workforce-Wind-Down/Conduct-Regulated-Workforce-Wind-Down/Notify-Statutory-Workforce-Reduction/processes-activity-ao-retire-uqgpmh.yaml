plain_language_name: 'Serve the Statutory Advance Notice'
plain_language_description: 'This activity serves the legally required advance notice when an employment reduction is large enough to trigger it. The authorised wind-down and the scoped workforce roster arrive first, the filings to the authorities and the individual notices are prepared and served, and the notice record is confirmed and retained. The clock on the wind-down''s other legal obligations effectively starts here.'
business_purpose: 'It exists so a large-scale reduction meets its advance-notice law, with the filings and individual notices on record.'
practical_context: 'It opens the wind-down once the event is authorised and the reduction crosses the thresholds the labour law sets, and it closes when the served notices are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A workforce management custodian serves the advance notice for an authorised unit wind-down, covering the filings to the authorities and an individual notice to each affected person, and files the notice record for the consultation step.'
