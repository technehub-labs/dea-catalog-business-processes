name: Workforce Retirement
process_context:
  id: processes:pc-ao-retire-3kqe9c
  domain: AgencyAndOrganization
  lifecycle_stage: Retire
  scope_summary: Governed retirement of workforce populations under regulated wind-down obligations, distinct from steady-state agent operations and from asset decommissioning.
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: 'Agency & Organization: the regulated retirement of workforce populations under statutory mass-layoff, consultation, notice, severance, and transition-support obligations.'
  lifecycle_concern: 'Retire: regulated wind-down of an agent population triggered by a statutory mass-layoff threshold or regulated wind-down authorization.'
  combined_semantic_meaning: 'The regulated-workforce-retirement work that moves an enterprise

    workforce from active employment to documented, statutory-compliant

    wind-down under WARN, EU Directive 98/59/EC, ILO C158/C135, or

    jurisdictional mass-layoff statutes, with notice served,

    worker-representative consultation satisfied, severance and

    benefits continuation recorded, and transition supports routed.

    '
  expected_outcomes:
  - Statutory advance notice served to affected employees and statutory recipients (state dislocated-worker unit, local chief elected official) on the controlling notice period
  - Information and consultation with workers' representatives documented per the controlling statute or regulation
  - Fair-selection criteria applied and recorded for the affected population
  - Severance, benefits continuation, and statutory liability recorded and funded
  - Transition supports (state dislocated-worker referral, training, health-care continuation, outplacement) routed to the affected population
  inclusions:
  - Statutory advance notice to affected employees (WARN 60-day rule; jurisdictional equivalents)
  - Information and consultation with workers' representatives (EU Directive 98/59/EC; jurisdictional works-council obligations)
  - Fair-selection criteria (anti-discrimination, statutory exclusions)
  - Severance, benefits continuation, and recorded statutory liability
  - 'Transition supports: state dislocated-worker referral, training, health-care continuation, outplacement'
  exclusions:
  - Steady-state offboarding of individual agents (AgencyAndOrganization x Operate)
  - Non-regulated cohort decommission (Operate coordinate or Activity under agent operations)
  - Asset retirement, decommissioning, and shutdown (EnablementAndOperations x Retire; CR-BP-66)
  - Relationship close-out and regulated offboarding (PartyAndRelationship x Retire; CR-BP-67)
  - Knowledge archival absent regulated wind-down triggers (Operate coordinate or Activity under knowledge management)
  adjacent_boundaries:
  - 'processes:pc-ao-operate-zfevmp (adjacent context): the Operate cell continues ongoing agent management, steady-state offboarding, and non-regulated cohort decommission; the Retire cell only governs regulated mass-layoff or regulated wind-down workflows.'
  - 'processes:pc-eo-retire-nw3ynf (sibling cell, CR-BP-66): the Retire cell at EnablementAndOperations handles asset retirement, decommissioning, and shutdown of physical / IT / data assets; the A&O Retire cell handles workforce retirement under regulated mass-layoff or wind-down obligations.'
  - 'processes:pc-pr-retire-2cusde (sibling cell, CR-BP-67): the Retire cell at PartyAndRelationship handles party-relationship close-out and regulated offboarding (e.g. GDPR-driven erasure); the A&O Retire cell handles workforce retirement at the agent-population level.'
