plain_language_name: 'Analyze Asset Utilization'
plain_language_description: 'This activity reads the maintenance records and production performance to bound which assets sit underused and which are choking flow. The records arrive as the raw material, the utilization picture is analyzed and its problems bounded, and the analysis is confirmed onward for the option design. Idle capacity and bottlenecks both get names and numbers.'
business_purpose: 'It exists so asset utilization problems — idle and overloaded alike — are evidenced and bounded before any asset is moved.'
practical_context: 'It opens the utilization optimization, when the maintenance records and production performance are presented, and it completes once the utilization analysis is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function analyst reads the maintenance records and production performance, bounds which assets are underused and which are bottlenecks, and confirms the analysis for the option design.'
