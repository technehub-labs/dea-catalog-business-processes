plain_language_name: 'Hold the Gains the Projects Delivered'
plain_language_description: 'With the outcomes verified, the processing custodian does the sustainment itself: each delivered gain is put under the control mechanisms that keep it from decaying, and the sustained gains are set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because improvements decay silently once attention moves on - sustainment is what keeps the win won.'
practical_context: 'It starts once checking is complete and the verified outcomes are ready to be held, and it ends with the sustained gains produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the operations function puts each delivered gain under its control mechanism and records what is being held, keeping the working papers.'
