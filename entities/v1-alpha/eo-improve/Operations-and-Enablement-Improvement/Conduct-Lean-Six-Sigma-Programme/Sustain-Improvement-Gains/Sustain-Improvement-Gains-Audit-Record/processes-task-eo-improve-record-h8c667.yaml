plain_language_name: 'File the Gain Sustainment Audit Record'
plain_language_description: 'At the close the records custodian preserves the sustainment trail at its required retention tier and sets the retrieval handles for it. Which gains were held, under which controls, stays readable whenever a claimed improvement is examined.'
business_purpose: 'It exists so the holding of each gain can be evidenced whenever an improvement''s durability is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the sustainment trail at its retention tier and sets the retrieval handles a benefits review would consult.'
