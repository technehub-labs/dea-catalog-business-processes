plain_language_name: 'Measure What the Upgrades Actually Improved'
plain_language_description: 'With the inputs verified, the processing custodian does the measurement itself: what each committed and implemented upgrade actually moved is measured against the gap baseline, and the improvement measurement is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because an upgrade installed is not an upgrade proven - measurement is where the promise is settled.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be measured from, and it ends with the improvement measurement produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the operations function measures each implemented upgrade against the gap baseline and records the result, keeping the working papers.'
