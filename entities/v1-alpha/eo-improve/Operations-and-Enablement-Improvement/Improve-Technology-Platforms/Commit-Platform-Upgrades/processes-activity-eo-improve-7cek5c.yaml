plain_language_name: 'Commit Platform Upgrades'
plain_language_description: 'This activity gives the worked-up platform fixes formal standing so they are scheduled for implementation. The upgrade designs arrive as the case for each fix, the set is reviewed and ratified, and the committed upgrades are confirmed into the improvement backlog. From here the fixes are dated work, not wishes.'
business_purpose: 'It exists so the designed platform upgrades are committed to a backlog and scheduled, rather than drifting unprioritised.'
practical_context: 'It follows the upgrade design, once the designs are in hand, and it completes when the committed upgrades are confirmed into the backlog and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reviews each upgrade design, ratifies the set for implementation, and records the committed upgrades into the platform improvement backlog.'
