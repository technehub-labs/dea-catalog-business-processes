plain_language_name: 'Design Platform Upgrades'
plain_language_description: 'This activity works each bounded platform gap into a concrete upgrade design. The gap analysis arrives with the platform architecture as the frame, upgrades are designed against both and checked for fit, and the upgrade designs are confirmed onward for commitment. Each named pain point gains a specific technical answer.'
business_purpose: 'It exists so every bounded platform gap gets a designed upgrade that fits the architecture, before any is bought or built.'
practical_context: 'It follows the gap analysis, when the bounded gaps and the platform architecture are to hand, and it completes once the upgrade designs are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer turns each bounded gap into a concrete upgrade design, checks the designs fit the platform architecture, and confirms them for commitment.'
