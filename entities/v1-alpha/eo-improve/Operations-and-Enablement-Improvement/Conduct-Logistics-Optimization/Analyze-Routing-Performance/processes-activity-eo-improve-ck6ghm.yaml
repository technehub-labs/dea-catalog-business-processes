plain_language_name: 'Analyze Routing Performance'
plain_language_description: 'This activity reads the performance records for routing and the wider network to surface where cost runs high or service slips. The execution records and attainment figures arrive as the raw material, the analysis bounds the opportunities and quantifies each, and the opportunity analysis is confirmed onward for the change design. The network''s weak spots become named, sized targets.'
business_purpose: 'It exists so logistics improvement aims at opportunities the evidence actually supports, sized before any change is designed.'
practical_context: 'It opens the logistics optimization, when the routing execution records and service attainment figures are presented, and it completes once the opportunity analysis is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function analyst reads the routing execution records and service attainment figures, bounds and sizes the cost and service opportunities, and confirms the analysis for the design step.'
