plain_language_name: 'Design Route and Network Changes'
plain_language_description: 'This activity works the analyzed opportunities into concrete changes to routes and the network. The opportunity analysis arrives with the routing specification as the frame, changes are designed against both and their impact assessed, and the change designs are confirmed onward for commitment. Each opportunity gains a specific, costed answer.'
business_purpose: 'It exists so every evidenced opportunity gets a concrete, impact-assessed change rather than a vague intention.'
practical_context: 'It follows the performance analysis, when the bounded opportunities are presented for design, and it completes once the change designs with impact assessments are confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer turns each bounded opportunity into a concrete route or network change, assesses its impact against the routing specification, and confirms the designs for commitment.'
