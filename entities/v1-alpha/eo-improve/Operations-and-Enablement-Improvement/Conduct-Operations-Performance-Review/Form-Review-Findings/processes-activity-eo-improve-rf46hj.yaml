plain_language_name: 'Form Review Findings'
plain_language_description: 'This activity turns the assembled evidence into bounded conclusions about what the performance actually shows. The evidence pack arrives as the material, findings are formed and each is kept within what the evidence supports, and the finding set is confirmed onward for routing. The review speaks only as loudly as its evidence allows.'
business_purpose: 'It exists so the review''s conclusions are bounded by evidence, strong enough to act on and disciplined enough to defend.'
practical_context: 'It follows the evidence assembly, when the pack is presented for reading, and it completes once the finding set is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian reads the evidence pack and forms bounded findings on logistics, asset usage, and platform performance, each held to what the evidence shows, and confirms the set for routing.'
