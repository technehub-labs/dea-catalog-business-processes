plain_language_name: 'Conduct Operations Performance Review'
plain_language_description: 'This is the structured look backwards that sets up the next round of improvement. Performance signals are gathered and read, from logistics gaps to asset utilization against target, and the findings are written up in a review. The review closes with findings committed for logistics optimization, asset utilization work and technology platform evolution, which feed the next planning cycle.'
business_purpose: 'It exists to turn performance signals into committed findings, so the execution engine and its enabling assets evolve deliberately instead of drifting.'
practical_context: 'Runs whenever performance signals, logistics gaps or asset utilization targets show the execution engine or its enabling assets need to evolve. The operations function conducts the review and hands its findings to the next planning cycle.'
worked_example:
  agent_type: human
  narrative: 'Ahead of the planning round, an operations manager assembles the quarter''s performance signals, walks the team through the logistics gaps and asset utilization misses, and commits the findings so the right improvement work is planned next.'
