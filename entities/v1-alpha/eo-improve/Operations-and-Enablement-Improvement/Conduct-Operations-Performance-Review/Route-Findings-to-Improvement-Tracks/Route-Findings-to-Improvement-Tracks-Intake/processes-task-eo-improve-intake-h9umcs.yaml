plain_language_name: 'Receive the Formed Findings for Routing'
plain_language_description: 'Routing opens when the formed findings are handed over as the conclusions awaiting their destinations. The intake custodian accepts them, registers them with audit identifiers, and starts the routing from a recorded baseline.'
business_purpose: 'It exists so findings are sent onward from a registered set rather than picked over informally.'
practical_context: 'It opens when the formed findings are presented for routing, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the formed findings as the routing baseline, with audit references, and opens the sending work.'
