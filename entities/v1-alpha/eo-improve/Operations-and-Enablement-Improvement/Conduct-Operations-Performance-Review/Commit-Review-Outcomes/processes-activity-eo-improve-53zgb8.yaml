plain_language_name: 'Commit Review Outcomes'
plain_language_description: 'This activity draws the findings and their routings together into the review''s record and gives the outcomes formal standing. The routed findings arrive as its final inputs, the whole is consolidated and ratified, and the committed outcomes are confirmed as the review''s standing result. The review thereby closes with decisions on the record, not observations in the air.'
business_purpose: 'It exists so the review ends as committed outcomes that the improvement tracks must act on, not as a filed report.'
practical_context: 'It closes the performance review, once findings are formed and routed, and it completes when the committed outcomes are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian consolidates the findings and their routings into the review record, obtains ratification of the outcomes, and preserves the record for the next planning cycle.'
