definition: 'The bounded enterprise context for **improving** the operations and enablement assets of the enterprise in the **Enablement & Operations** domain. This context addresses the learning and adaptation work of conducting operations performance reviews, logistics optimization, lean programmes, asset utilization optimization, and technology platform evolution. v2.4.0: absorbs asset utilization improvement from the dissolved Supply & Resources domain; supplier consolidation lives in party-relationship x improve (domain-grounding.md §3.6).

  '
