id: dea:task-assign-retained-records-custodianship-confirm
type: Task
name: Assign Retained-Records Custodianship Confirmation
definition: The bounded unit of work within `dea:activity-assign-retained-records-custodianship` (Assign Retained-Records Custodianship) that reconcile the wind-down-ready record pack against the dissolution statute and the retained-records custodianship contract, issue the wind-down completion confirmation to the governance custodian and the registrar of companies, and log the confirmation.
belongs_to_activity: dea:activity-assign-retained-records-custodianship
trigger: Bounded-work artefact produced for Assign Retained-Records Custodianship; confirm gate may reconcile against the governing contract and issue the completion confirmation to the governance custodian.
outcome: Completion confirmation issued for Assign Retained-Records Custodianship and acknowledged by the governance custodian and any governing-party notify-list; confirmation custodian passes custody to the records custodian.
responsibility: confirmation custodian
boundary:
  inclusions:
  - Reconciliation of the Assign Retained-Records Custodianship artefact against the governing contract and any notify-list requirements.
  - Issuance of the Assign Retained-Records Custodianship completion confirmation and acknowledgement logging.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Re-execution of prior phases on confirmation rejection.
evidence:
- source: Delaware DGCL §§275-283 (Dissolution)
  claim: statutory dissolution and winding-up provisions binding the retire-phase verification and the statutory dissolution filings. Bounded-work evidence for the confirm-phase custodian of `dea:activity-assign-retained-records-custodianship` (CR-BP-L4-03 enrichment).
  strength: E1
- source: UK Insolvency Act 1986 Part IV
  claim: UK winding-up statute grounding the retire-phase wind-down quorum requirements and registrar filings. Bounded-work evidence for the confirm-phase custodian of `dea:activity-assign-retained-records-custodianship` (CR-BP-L4-03 enrichment).
  strength: E1
- source: dea:activity-assign-retained-records-custodianship
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-03 cell-specific bounded-work prose for this GovernanceAndExistence L4 Task.
