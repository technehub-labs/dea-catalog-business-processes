plain_language_name: 'Hold the Design Against the Standards Before Codification'
plain_language_description: 'With the manifest registered, the verification custodian reads the whole pack against the architecture''s standards and the delegation contract, and issues the report naming whatever deviates and how it will be mended.'
business_purpose: 'It exists because a design committed short of the standards would codify loosely from day one - the reading is what keeps it honest.'
practical_context: 'It opens once the manifest is registered and the contract and quality checks may run against the pack, and it closes with the verification certificate issued, custody passed onward to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function reads the pack against the architecture''s standards, naming whatever deviates and how it will be mended.'
