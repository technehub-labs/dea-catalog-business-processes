plain_language_name: 'Commit Policy and Control Design'
plain_language_description: 'This activity draws the policy artefacts, the control objectives, and the regime enforcing them together into one design and gives it formal standing. The three strands arrive as its inputs, the whole is consolidated and ratified, and the committed design is confirmed as the basis for codification and build. Governance''s rulebook design becomes one owned decision.'
business_purpose: 'It exists so codification and build start from one committed policy and control design.'
practical_context: 'It closes the policy and control design, once artefacts, objectives, and regime are designed, and it completes when the committed design is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian assembles the policy artefacts, control objectives, and compliance regime into the design document, obtains ratification, and records the commitment for codification.'
