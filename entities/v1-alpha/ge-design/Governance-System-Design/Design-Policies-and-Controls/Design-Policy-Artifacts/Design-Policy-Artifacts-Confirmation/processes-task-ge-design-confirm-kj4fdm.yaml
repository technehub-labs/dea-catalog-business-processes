  strength: E1
- source: COSO Internal Control 2013
  claim: internal-control framework grounding the design-phase control-objective definition and compliance-regime design. Bounded-work evidence for the confirm-phase custodian of `processes:activity-ge-design-ka3nqz` (CR-BP-L4-03 enrichment).
  strength: E2
