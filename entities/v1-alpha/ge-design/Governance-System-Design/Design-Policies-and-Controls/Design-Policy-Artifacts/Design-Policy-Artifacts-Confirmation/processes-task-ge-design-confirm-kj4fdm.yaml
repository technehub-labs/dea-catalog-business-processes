id: processes:task-ge-design-confirm-kj4fdm
type: Task
name: Design Policy Artifacts Confirmation
definition: The bounded unit of work within `processes:activity-ge-design-ka3nqz` (Design Policy Artifacts) that reconcile the design-ready governance artefact against the governance-architecture standards and the delegation-of-authority contract, issue the design-completion confirmation to the governance custodian, and log the confirmation.
belongs_to_activity: processes:activity-ge-design-ka3nqz
trigger: Bounded-work artefact produced for Design Policy Artifacts; confirm gate may reconcile against the governing contract and issue the completion confirmation to the governance custodian.
outcome: Completion confirmation issued for Design Policy Artifacts and acknowledged by the governance custodian and any governing-party notify-list; confirmation custodian passes custody to the records custodian.
responsibility: confirmation custodian
boundary:
  inclusions:
  - Reconciliation of the Design Policy Artifacts artefact against the governing contract and any notify-list requirements.
  - Issuance of the Design Policy Artifacts completion confirmation and acknowledgement logging.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Re-execution of prior phases on confirmation rejection.
