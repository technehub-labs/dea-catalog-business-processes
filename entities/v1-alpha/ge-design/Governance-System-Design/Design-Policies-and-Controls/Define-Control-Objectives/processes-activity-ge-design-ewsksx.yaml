plain_language_name: 'Define Control Objectives'
plain_language_description: 'This activity states what each control must achieve for the designed policies to hold. The policy artefact designs arrive with the tolerance bands as the frame, objectives are defined against both and checked for coverage, and the objective set is confirmed onward for the compliance regime. Every policy gains the controls it deserves, stated as outcomes first.'
business_purpose: 'It exists so controls are designed against stated outcomes rather than invented mechanisms.'
practical_context: 'It follows the artefact designs, when the designs and tolerance bands are to hand, and it completes once the control objective set is confirmed for the compliance regime.'
worked_example:
  agent_type: human
  narrative: 'A governance design authority designer states the outcome each control must achieve for the designed policies to hold within the tolerance bands, and confirms the objective set.'
