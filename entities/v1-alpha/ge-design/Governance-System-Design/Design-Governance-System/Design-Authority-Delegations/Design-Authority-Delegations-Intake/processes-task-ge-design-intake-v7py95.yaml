outcome: Intake manifest registered and bound to the Design Authority Delegations case file; registered intake custodian passes custody to the verification custodian.
responsibility: intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Design Authority Delegations input pack against the Design-stage intake contract.
  - Binding of the input pack to the Design Authority Delegations case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
