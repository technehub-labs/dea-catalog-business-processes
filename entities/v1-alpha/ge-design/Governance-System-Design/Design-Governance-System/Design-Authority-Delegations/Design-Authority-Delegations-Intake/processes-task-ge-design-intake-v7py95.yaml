plain_language_name: 'Take Custody of the Delegation Input Pack'
plain_language_description: 'The intake custodian takes charge of the design pack — the conception framework reference, the body-architecture proposals, the delegation models, and the regime requirements — and writes the manifest that ties the pack into the case file for the design.'
business_purpose: 'It exists so the delegations begin from a registered pack rather than from loose papers.'
practical_context: 'It opens when custody of the pack arrives and the intake contract applies, and it closes with the manifest registered and bound to the case file, custody passed onward to the verification custodian.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function takes charge of the design pack and writes the binding manifest.'
