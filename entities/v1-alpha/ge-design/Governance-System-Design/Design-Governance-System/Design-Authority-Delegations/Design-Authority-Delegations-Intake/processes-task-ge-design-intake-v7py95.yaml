definition: The bounded unit of work within `processes:activity-ge-design-ry86fn` (Design Authority Delegations) that accept custody of the governance-design input pack (conception framework reference, body-architecture proposals, delegation models, compliance-regime requirements) and persist a registered intake manifest binding the inputs to the design case file.
