plain_language_name: 'Lay the Delegations Case Down for Keeps'
plain_language_description: 'At the close the records custodian lays the case down under the schedule that keeps it, integrity sealed: the manifest, the verification report, the design-ready artefact, the completion confirmation, and whatever remediations were raised. The delegations'' design stays provable for as long as the system endures.'
business_purpose: 'It exists so the delegations'' design can be evidenced for as long as the system endures.'
practical_context: 'It opens once the completion confirmation is issued and the case file may be retained, and it closes with the case file held under the retention schedule, its integrity protected.'
worked_example:
  agent_type: human
  narrative: 'A records custodian lays the case down under the schedule that keeps it and sets the retrieval handles a governance review would consult.'
