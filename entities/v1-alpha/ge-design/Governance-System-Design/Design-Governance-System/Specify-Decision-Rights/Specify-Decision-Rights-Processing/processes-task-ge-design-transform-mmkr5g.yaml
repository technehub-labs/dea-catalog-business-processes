plain_language_name: 'Say Who Decides What, and With Whose Consultation'
plain_language_description: 'With the certificate in hand, the processing custodian executes the design for the rights: what each body and role may decide, and with whose consultation, is specified against the delegation design, and the design-ready artefact is produced for confirmation.'
business_purpose: 'It exists because a delegation that cannot say who decides is a delegation that decides nothing.'
practical_context: 'It opens once the verification certificate is in hand and the bounded design may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function specifies what each body and role may decide and with whose consultation.'
