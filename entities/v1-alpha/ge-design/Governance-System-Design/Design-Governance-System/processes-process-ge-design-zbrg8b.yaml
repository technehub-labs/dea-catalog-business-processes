plain_language_name: 'Design Governance System'
plain_language_description: 'With the strategy agreed, the next question is what governing machinery will carry it. Here the teams work out which boards and committees are needed, what authority each one is delegated, and who holds which decision rights. The finished design is a blueprint that tells the establishment work exactly what bodies to stand up.'
business_purpose: 'It translates strategic intent into a concrete structure of bodies, authority delegations, and decision rights, so accountability for governing is clear before anything is created.'
practical_context: 'Runs once a governance strategy has been committed: the strategy function drafts the structure of bodies, delegations, and decision rights, and the governing board signs the design off for establishment.'
worked_example:
  agent_type: human
  narrative: 'A strategy function architect maps out which committees the new strategy needs, what each may decide, and what stays with the governing board, then walks the board through the delegations for approval.'
