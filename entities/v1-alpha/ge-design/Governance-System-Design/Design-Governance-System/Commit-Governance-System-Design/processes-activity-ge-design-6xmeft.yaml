plain_language_name: 'Commit Governance System Design'
plain_language_description: 'This activity draws the articulated bodies, the delegations, and the decision rights together into one design and gives it formal standing. The three strands arrive as its inputs, the whole is consolidated and ratified, and the committed design is confirmed as the basis for the establishment build. The enterprise''s governance shape becomes one owned decision.'
business_purpose: 'It exists so governance establishment starts from one committed system design rather than three sketches.'
practical_context: 'It closes the governance system design, once bodies, delegations, and rights are designed, and it completes when the committed design is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian assembles the body inventory, delegation design, and decision rights specification into the system design document, obtains ratification, and records the commitment.'
