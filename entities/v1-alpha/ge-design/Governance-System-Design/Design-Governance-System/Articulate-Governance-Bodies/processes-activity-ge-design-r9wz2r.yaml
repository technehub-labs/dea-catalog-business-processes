plain_language_name: 'Articulate Governance Bodies'
plain_language_description: 'This activity names and sketches each board, committee, and other body the governance system will consist of. The committed governance strategy arrives as the source, the body inventory is articulated from it and reviewed for coverage, and the articulated bodies are confirmed onward for the delegation work. The system''s cast of characters is settled first.'
business_purpose: 'It exists so governance design starts by settling exactly which bodies the system comprises.'
practical_context: 'It opens the governance system design once a governance strategy has been committed, and it completes when the articulated body inventory is confirmed for the delegation design.'
worked_example:
  agent_type: human
  narrative: 'A governance design authority designer names and sketches each board, committee, and other body the strategy calls for, and confirms the articulated inventory for the delegation design.'
