id: processes:task-ge-design-intake-fcb7bj
type: Task
name: Commit Policy and Control Design Intake
definition: The bounded unit of work within `processes:activity-ge-design-t3muvd` (Commit Policy and Control Design) that accept custody of the governance-design input pack (conception framework reference, body-architecture proposals, delegation models, compliance-regime requirements) and persist a registered intake manifest binding the inputs to the design case file.
belongs_to_activity: processes:activity-ge-design-t3muvd
trigger: Custody of the Design-stage input pack for Commit Policy and Control Design ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Commit Policy and Control Design case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Commit Policy and Control Design input pack against the Design-stage intake contract.
  - Binding of the input pack to the Commit Policy and Control Design case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
evidence:
- source: OECD Principles G20/OECD 2023 Chapter VI
  claim: board-responsibilities chapter binding the design-phase body articulation and delegation-of-authority design. Bounded-work evidence for the intake-phase custodian of `processes:activity-ge-design-t3muvd` (CR-BP-L4-03 enrichment).
  strength: E1
- source: COSO Internal Control 2013
  claim: internal-control framework grounding the design-phase control-objective definition and compliance-regime design. Bounded-work evidence for the intake-phase custodian of `processes:activity-ge-design-t3muvd` (CR-BP-L4-03 enrichment).
  strength: E2
- source: processes:activity-ge-design-t3muvd
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-03 cell-specific bounded-work prose for this GovernanceAndExistence L4 Task.
