name: Governance System Design
definition: 'The bounded enterprise context for **designing** the governance system, control objectives, and policy architecture in the **governance and existence** domain. This context addresses the work of translating strategy and mandate into a designed governance architecture, a set of control objectives, and an articulated policy architecture that the enterprise can build.

  '
