plain_language_name: 'Customer Insight and Retention'
plain_language_description: 'This context covers the customer and demand area at the Improve stage: learning from customers and keeping more of them. It monitors satisfaction, analyses churn and its warning signs, operates win-back activity for lapsed customers, and feeds insight back into strategy, design, and operations. Day-to-day account handling belongs to the operating context.'
business_purpose: 'To lengthen customer relationships and raise their value by acting on satisfaction, churn, and win-back evidence.'
practical_context: 'Encountered on a continuous insight rhythm — survey waves, churn reviews, and triggered win-back pushes when departure risk shows.'
worked_example:
  agent_type: human
  narrative: 'When churn analysis flags a cluster of at-risk accounts, the Party & Relationship Process Owner commissions a satisfaction deep-dive, launches a targeted win-back push, and routes the findings into the next experience design cycle.'
