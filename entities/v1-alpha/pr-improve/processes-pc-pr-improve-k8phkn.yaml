id: processes:pc-pr-improve-k8phkn
domain: PartyAndRelationship
lifecycle_stage: Improve
name: Customer Insight and Retention
definition: 'The bounded enterprise context for **improving** customer experience, retention, and lifetime value in the **customer and demand** domain. This context addresses the work of monitoring customer insight (satisfaction, churn risk, win-back opportunities) and operating retention programs that close the loop between insight and design/build/operate.

  '
scope:
  includes:
  - Customer satisfaction monitoring
  - Churn analysis and prediction
  - Win-back program operation
  - Customer feedback loops
  excludes:
  - Active customer relationship operation (Operate stage)
  - Customer strategy framing (Conceive stage)
  - Customer experience design (Design stage)
outcomes:
- Customer insight informs Conceive/Design/Build cycles.
- Retention programs reduce churn.
- Win-back programs re-engage lapsed customers.
