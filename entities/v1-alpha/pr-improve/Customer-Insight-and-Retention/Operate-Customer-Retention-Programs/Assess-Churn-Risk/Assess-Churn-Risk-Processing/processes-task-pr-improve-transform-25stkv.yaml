plain_language_name: 'Score the Churn Risk Across the Base'
plain_language_description: 'With the certificate in hand, the processing custodian works the improvement: each at-risk customer is scored, the feedback is gathered and aggregated, and the retention actions are carried out. The results are produced as an outcomes pack ready for confirmation.'
business_purpose: 'It exists because retention effort is wasted unless it is aimed at the customers actually about to leave.'
practical_context: 'It opens when the verification certificate clears the pack, and it closes with the outcomes pack produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function scores the churn risk for each affected party using the feedback and behaviour signals.'
