plain_language_name: 'Open the Churn-Risk Case File'
plain_language_description: 'The churn work opens with its case pack: the register of customers at risk of leaving, the stream of voice-of-customer feedback, and the candidate retention actions. The intake custodian logs each item against the improvement file so the assessment starts accounted for.'
business_purpose: 'It exists because retention effort is wasted unless it is aimed at the customers actually about to leave.'
practical_context: 'It opens when the Improve-stage pack is handed over for the activity, and it closes with the manifest registered and custody passed to the verification custodian.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in customer relationship management logs the risk register and feedback stream into the improvement case file.'
