  - Receipt and registration of the Assess Churn Risk input pack against the Improve-stage intake contract.
  - Binding of the input pack to the Assess Churn Risk case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the closure case file (phase 5).
