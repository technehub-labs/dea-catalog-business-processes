plain_language_name: 'Carry Out the Retention Interventions'
plain_language_description: 'With the certificate in hand, the processing custodian works the improvement: each at-risk customer is scored, the feedback is gathered and aggregated, and the retention actions are carried out. The executed interventions and their effects are produced as an outcomes pack ready for confirmation.'
business_purpose: 'It exists because a churn score nobody acts on saves nobody.'
practical_context: 'It opens when the verification certificate clears the pack, and it closes with the outcomes pack produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in customer relationship management executes the retention interventions chosen for each flagged account.'
