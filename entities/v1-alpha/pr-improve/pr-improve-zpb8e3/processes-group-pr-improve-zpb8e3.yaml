id: processes:group-pr-improve-zpb8e3
type: ProcessGroup
version: 1.0.0
name: Customer Insight and Retention
definition: 'The bounded Process Group that organizes the Business Process responsibilities of monitoring customer insight and operating retention programs in the PartyAndRelationship x Improve context. This group captures the work of closing the loop between customer insight (satisfaction, churn risk, win-back opportunities) and the Conceive/Design/Build/Operate cycles that follow from it. The group is the canonical Process Group for the customer-improvement value stream.

  '
process_context: processes:pc-pr-improve-k8phkn
scope:
  includes:
  - Customer satisfaction monitoring
  - Churn analysis and prediction
  - Win-back program operation
  - Customer feedback loops
  excludes:
  - Active customer relationship operation (Operate stage)
  - Customer strategy framing (Conceive stage)
  - Customer experience design (Design stage)
outcomes:
- Customer insight informs Conceive/Design/Build cycles.
- Retention programs reduce churn.
- Win-back programs re-engage lapsed customers.
