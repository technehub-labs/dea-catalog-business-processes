definition: 'The bounded enterprise context for **operating** the strategic steering, environmental sensing, and strategic review cycle of the enterprise in the **Strategy & Direction** domain. This context addresses the steady-state work of monitoring strategic performance, sensing environmental signals, steering the initiative portfolio, and operating the strategic review cycle. v2.4.0: monitoring and steering the strategy as a stable subject; operational performance management lives in Enablement & Operations.

  '
