type: ProcessGroup
version: 1.0.0
name: Strategic Steering Operation
definition: 'The bounded Process Group that organises the Business Process responsibilities of operating strategic steering in the StrategyAndDirection x Operate context. This group covers the steady-state work of monitoring strategic performance, sensing environmental signals, steering the initiative portfolio, and operating the strategic review cycle. v2.4.0 grounding (domain-grounding.md §3.2).

  '
process_context: processes:pc-sd-operate-5cs5ee
scope:
  includes:
  - Strategic performance monitoring
  - Environmental sensing
  - Initiative portfolio steering
  - Strategic review cycle operation
  excludes:
  - Operational performance management (enablement-operations x operate)
  - Initiative execution (enablement-operations x operate)
  - Strategic plan build (Build stage; adjacent context)
outcomes:
- Strategic performance is monitored against objectives.
- Environmental signals are sensed and routed.
- Initiative portfolio is steered with rebalancing decisions.
- Strategic review cycle is operated on cadence.
