plain_language_name: 'Track Performance against Plan'
plain_language_description: 'Readings on their own say little; they need the plan beside them. Intake registers the collected measures, verification confirms the comparison basis is consistent, and processing lays each reading against the plan''s objectives and targets to build the current position. Confirmation shares the tracked position downstream and the records custodian preserves it for the deviation check.'
business_purpose: 'It maintains the running picture of where execution stands relative to the plan, the position that makes deviations visible at all.'
practical_context: 'It follows collection, opening at intake of each collected measure set and closing when the updated position is confirmed and preserved.'
worked_example:
  agent_type: human
  narrative: 'A strategy function tracker lays the fresh readings beside the plan''s objectives and targets, a verification custodian confirms the basis of comparison has not shifted, and the confirmation custodian publishes the updated position to the monitoring team.'
