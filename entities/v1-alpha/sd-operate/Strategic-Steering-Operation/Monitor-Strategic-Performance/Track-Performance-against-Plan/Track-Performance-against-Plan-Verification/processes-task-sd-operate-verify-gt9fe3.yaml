plain_language_name: 'Test the Measures Before They Are Set Against the Plan'
plain_language_description: 'Before the collected measures are set against the plan, the arriving material is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because a tracked position built on an unverified measure would report the strategy as off or on course for the wrong reason.'
practical_context: 'It opens once the intake is registered and the measures can be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the arriving measures against what the tracking needs, and writes up one measure that no longer maps to its plan line as a shortfall to be put right.'
