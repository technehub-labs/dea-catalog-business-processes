plain_language_name: 'Test the Typed Signals Before They Leave for Their Routes'
plain_language_description: 'Before the typed signals leave for their routes, the arriving material is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because a signal delivered with a wrong type lands on the wrong desk, and the desk that needed it never hears.'
practical_context: 'It opens once the intake is registered and the typed signals can be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the typed signals against what the routing needs, and writes up one opportunity signal still marked for monitoring as a shortfall to be put right.'
