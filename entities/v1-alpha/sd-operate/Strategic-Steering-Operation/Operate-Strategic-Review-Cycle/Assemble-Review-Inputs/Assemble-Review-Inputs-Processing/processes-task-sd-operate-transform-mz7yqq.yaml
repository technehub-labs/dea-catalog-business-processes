plain_language_name: 'Build the Review Pack with Reports, Briefs and Agenda'
plain_language_description: 'With the inputs verified, the assembly proper begins. The processing custodian binds the tested reports and briefs to the session agenda, producing the assembled review inputs in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because a review without its papers on the table is a conversation, not a decision; the pack makes the session real.'
practical_context: 'It opens when the verified feeds are ready to be worked, and it closes with the assembled review inputs produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function binds the tested performance reports and signal briefs to the agenda for the scheduled review, keeping the pack workings for the audit trail.'
