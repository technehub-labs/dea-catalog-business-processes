plain_language_name: 'Test the Pack Before the Session Is Opened'
plain_language_description: 'Before the review session is opened, the arriving pack is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because a review convened over a pack with holes spends its hour on housekeeping instead of decisions.'
practical_context: 'It opens once the intake is registered and the pack can be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the arriving pack against what the session needs, and writes up an agenda without its supporting report as a shortfall to be put right before the room gathers.'
