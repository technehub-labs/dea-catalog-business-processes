plain_language_name: 'Record Review Decisions'
plain_language_description: 'A decision that is not written down did not really happen. The conducted sessions arrive at intake, verification checks every minute against what was agreed, and processing logs each decision with its owner and route to whichever process will carry it out. Confirmation notifies the receiving teams and the records custodian preserves the decision log at its retention tier.'
business_purpose: 'It gives review sessions lasting effect, turning tabled discussion into logged, owned and routed decisions other processes can execute.'
practical_context: 'It closes each session on the cadence, opening at intake of the minuted outcomes and closing when the routed log is confirmed and preserved.'
worked_example:
  agent_type: human
  narrative: 'The strategy function scribe logs each agreed decision with owner and due route, a verification custodian reads the log back against the minutes, and the confirmation custodian notifies the receiving teams their actions are on the record.'
