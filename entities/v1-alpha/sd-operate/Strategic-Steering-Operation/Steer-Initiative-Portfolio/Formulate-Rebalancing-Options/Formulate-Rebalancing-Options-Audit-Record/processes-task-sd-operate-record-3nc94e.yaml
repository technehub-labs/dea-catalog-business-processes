plain_language_name: 'File the Options Record with Its Drift Lineage'
plain_language_description: 'After the handover, the trail must be kept. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles.'
business_purpose: 'It exists so the options that were on the table, and the drift they answered, stay producible when one is chosen.'
practical_context: 'It opens once the confirmation has been issued and the audit trail can be laid down, and it closes with the options record preserved at its required tier and its retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the rebalancing options with their drift lineage at the agreed retention tier, and sets the retrieval handles for when the chosen option is reviewed.'
