plain_language_name: 'Formulate Rebalancing Options'
plain_language_description: 'Named drift needs candidate fixes, and this work drafts them. Intake registers the drift findings, verification checks each finding carries enough detail to act on, and processing writes the corrective options — pausing, accelerating, rescoping or re-resourcing the offending initiatives. Confirmation circulates the option set downstream and the records custodian preserves it for selection.'
business_purpose: 'It gives the drift real answers, a menu of concrete corrective moves leadership can choose between rather than a problem statement alone.'
practical_context: 'It follows the drift check, opening at intake of the findings and closing when the corrective options are confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'Strategy function planners draft corrective moves for each named departure — one initiative paused, one rescoped — and the confirmation custodian passes the option set to the colleagues preparing the decision.'
