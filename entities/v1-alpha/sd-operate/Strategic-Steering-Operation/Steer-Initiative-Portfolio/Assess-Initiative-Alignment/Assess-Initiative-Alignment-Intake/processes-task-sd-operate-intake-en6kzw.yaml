plain_language_name: 'Take In the Monitored Performance for the Alignment Assessment'
plain_language_description: 'The assessment opens as its material arrives: the monitored strategic performance against which the in-flight initiatives will be weighed. The intake custodian logs them against the assessment file so the assessment starts accounted for.'
business_purpose: 'It exists so the alignment verdict covers every in-flight initiative on the register, none judged unseen.'
practical_context: 'It opens when the monitored performance is presented for assessment, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
