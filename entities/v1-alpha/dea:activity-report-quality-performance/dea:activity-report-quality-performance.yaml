id: dea:activity-report-quality-performance
type: Activity
name: Report Quality Performance
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Operate Quality Control that
  aggregates per-batch inspection records into quality performance reporting
  (first-pass yield, defect rates) for the owning Process Group.
belongs_to_business_process: dea:process-operate-quality-control
cohesion_rationale: Constituent work shares a single aggregation-and-reporting
  concern, consumes one input class (per-batch quality records), and serves
  one audience (the Execution and Fulfillment Process Group). Cohesion score
  7/9 assessed at deposition (CR-BP-32 §6; research/l3-candidate-universe.yaml);
  lowest of the pilot set because reporting cadence varies by stakeholder,
  retained as a distinct Activity because absorption into Record Inspection
  Results would mix capture and aggregation concerns.
decomposition_boundary: l4-reached
ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: 1.0.0
  profile: dea:ecf@1.0.0
  status: conformant
  affiliation: inherits-catalog
  canonicalReferences:
  - kind: coordinate
    domain: EnablementAndOperations
    stage: Operate
    identifier: ecf:enablementAndOperations.operate
metadata:
  established_by: CR-BP-42
