plain_language_name: 'Keep the Owings from Customers True'
plain_language_description: 'With the movements verified, the processing custodian does the keeping itself: every invoice, collection, and application is written into the receivables record as it happens, and the current record is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because an owing that drifts from its facts is a chase built on sand - the keeping is what makes the receivables record worth trusting.'
practical_context: 'It starts once checking is complete and the verified movements are ready to be written from, and it ends with the current record produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the compliance function writes every invoice, collection, and application into the record as it happens, keeping the working papers.'
