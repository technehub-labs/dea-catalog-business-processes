plain_language_name: 'Manage Tax Compliance and Filings'
plain_language_description: 'This process is what keeps the organisation''s tax returns and filings on time and in order. As each filing due date approaches, returns are prepared, payments are scheduled, and tax exposures are monitored. The compliance function owns the routine so that nothing slips through.'
business_purpose: 'It exists so tax obligations are met reliably: returns prepared, payments scheduled, and exposures watched, with no missed due dates and no surprises.'
practical_context: 'It is triggered whenever a tax return or filing due date is reached, and the compliance function manages the preparation, the scheduling, and the exposure monitoring.'
worked_example:
  agent_type: human
  narrative: 'With a filing due date approaching, the compliance function prepares the return, schedules the payment, and updates the exposure monitoring before the deadline passes.'
