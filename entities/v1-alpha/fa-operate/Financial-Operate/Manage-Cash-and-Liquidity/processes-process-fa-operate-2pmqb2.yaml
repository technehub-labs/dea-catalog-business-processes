plain_language_name: 'Manage Cash and Liquidity'
plain_language_description: 'This process keeps track of the enterprise''s cash and makes sure there is enough of it when it is needed. Whenever a cash position or liquidity event comes up, positions are checked, forecasts are updated, and investment decisions are weighed against the treasury policy. The result is cash that is visible today and covered for tomorrow.'
business_purpose: 'It exists so the enterprise always knows how much cash it holds, can see what is coming, and keeps its investment decisions inside the treasury policy.'
practical_context: 'It is triggered whenever a cash position or liquidity event occurs, and the compliance function monitors positions, forecasts, and investment decisions against the treasury policy.'
worked_example:
  agent_type: human
  narrative: 'When an unexpected liquidity event lands, the compliance function checks the current cash position, refreshes the forecast, and confirms that any investment decision stays within the treasury policy.'
