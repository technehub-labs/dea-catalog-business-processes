plain_language_name: 'Execute Investment Decisions'
plain_language_description: 'This activity puts idle cash to work through the investments treasury policy allows. Surplus liquidity identified against the forecast arrives as the opportunity, investments are executed within the policy''s bounds, and the executed decisions are confirmed for the record. Money that would sit still earns instead, inside the rules.'
business_purpose: 'It exists so surplus cash is deployed productively without ever stepping outside the treasury policy.'
practical_context: 'It runs when the forecast shows surplus liquidity worth deploying, and it completes once the executed investments are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A treasury officer deploys the forecast surplus into investments the policy permits, checks each against its bounds, and confirms the executed decisions for the record.'
