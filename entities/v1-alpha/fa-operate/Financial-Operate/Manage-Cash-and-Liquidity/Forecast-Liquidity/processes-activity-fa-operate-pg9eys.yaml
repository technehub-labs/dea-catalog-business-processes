plain_language_name: 'Forecast Liquidity'
plain_language_description: 'This activity projects the cash ahead, from where positions stand today and what is known to be owed. The monitored positions and the known obligations arrive as the inputs, the liquidity forecast is drawn and checked against both, and the forecast is confirmed onward for the investment decisions. Tomorrow''s cash needs are met because today''s treasury saw them coming.'
business_purpose: 'It exists so liquidity needs are foreseen from positions and obligations, not discovered in the moment.'
practical_context: 'It runs against the monitored positions and the known obligations, and it completes once the liquidity forecast is confirmed onward for the investment decisions.'
worked_example:
  agent_type: human
  narrative: 'A treasury analyst projects the coming liquidity from today''s monitored positions and the obligations on the books, and confirms the forecast for the investment decisions.'
