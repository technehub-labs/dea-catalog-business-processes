plain_language_name: 'Receive the Account Balances and Cash Events'
plain_language_description: 'Watching opens when the account balances and the cash events are handed over together as the material the position picture will be kept from. The intake custodian accepts them, registers them with audit identifiers, and starts the monitoring from a recorded baseline.'
business_purpose: 'It exists so cash is watched from registered balances rather than from the bank''s own timing.'
practical_context: 'It opens when the balances and events are presented for the watching, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the compliance function registers the balances and cash events as the watching baseline, with audit references.'
