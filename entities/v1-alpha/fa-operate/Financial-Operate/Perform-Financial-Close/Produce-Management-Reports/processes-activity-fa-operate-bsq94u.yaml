plain_language_name: 'Produce Management Reports'
plain_language_description: 'This activity draws the closed period''s numbers into the reports management will actually read. The certified period arrives as the source of truth, the management reports are produced from it and checked against it, and the produced reports are confirmed onward. The close''s final act is making its work legible to decision-makers.'
business_purpose: 'It exists so management sees the closed period through reports drawn from certified numbers.'
practical_context: 'It follows the close certification, working from the certified period, and it completes when the produced management reports are confirmed onward for their readers.'
worked_example:
  agent_type: human
  narrative: 'A close custodian produces the management reports from the certified period''s numbers, checks them against the certified books, and confirms the reports for their readers.'
