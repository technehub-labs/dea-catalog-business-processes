plain_language_name: 'Check the Balances Before Turning Them into Pages'
plain_language_description: 'Before anything is produced, the verification custodian checks the reconciled balances against what production requires - that they are the proven set and cover the period the pages will speak for. Defects are logged for rejection or repair before the producing begins.'
business_purpose: 'It exists so no manager''s page is printed from balances that were never proven.'
practical_context: 'It runs once the intake is registered and the balances can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a balance whose reconciliation is still open and logs the defect before the producing begins.'
