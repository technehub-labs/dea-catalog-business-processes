plain_language_name: 'Check the Schedule Before Making the Entries'
plain_language_description: 'Before anything is made, the verification custodian checks the schedule and policies against what entry work requires - that every due entry type is on the schedule and the policies are the current ones. Defects are logged for rejection or repair before the entries are made.'
business_purpose: 'It exists so no loose end is left because the schedule forgot it.'
practical_context: 'It runs once the intake is registered and the schedule can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a due accrual missing from the schedule and logs the defect before the entries are made.'
