plain_language_name: 'Execute Period-End Entries'
plain_language_description: 'This activity puts through the entries that fence the period off — accruals, deferrals, and the adjustments between. The close boundary arrives as the trigger, the period-end entries are executed and checked against the period''s activity, and the executed entries are confirmed onward for reconciliation. The period''s books are made final by design, not by decree.'
business_purpose: 'It exists so the period ends with its proper entries booked, not with activity left hanging over the boundary.'
practical_context: 'It runs at each period close boundary, and it completes once the executed period-end entries are confirmed onward for the reconciliations.'
worked_example:
  agent_type: human
  narrative: 'A close custodian books the accruals, deferrals, and adjustments that properly end the period, checks them against the period''s activity, and confirms the entries for reconciliation.'
