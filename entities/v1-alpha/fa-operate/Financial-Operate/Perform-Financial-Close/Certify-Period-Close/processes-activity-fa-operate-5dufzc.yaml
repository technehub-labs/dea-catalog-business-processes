plain_language_name: 'Certify Period Close'
plain_language_description: 'This activity gives the closed period its formal certification, releasing the numbers for reporting to begin. The reconciled period arrives as the candidate, the close is certified complete and correct under the close controls, and the certified period is confirmed onward for the reports. The books are officially shut until someone certifies this.'
business_purpose: 'It exists so reporting builds only on a period whose close has been formally certified.'
practical_context: 'It follows the reconciliations, once the balances agree with the world, and it completes when the certified close is confirmed and its record retained for the reporting step.'
worked_example:
  agent_type: human
  narrative: 'A close custodian certifies the reconciled period as complete and correct under the close controls, and confirms the certified close for the management reporting.'
