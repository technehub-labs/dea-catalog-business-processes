plain_language_name: 'File the Payroll Disbursement Audit Record'
plain_language_description: 'At the close the records custodian preserves the disbursement trail at its required retention tier and sets the retrieval handles for it. What was paid, to whom, through which channel, stays readable whenever a payment is queried.'
business_purpose: 'It exists so every payment can be evidenced whenever a payment is disputed.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the disbursement trail at its retention tier and sets the retrieval handles a payment query would consult.'
