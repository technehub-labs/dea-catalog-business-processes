plain_language_name: 'Receive the Time, Attendance, and Compensation Terms'
plain_language_description: 'Calculation opens when the time records, the attendance data, and the agreed compensation terms are handed over together as the inputs the pay will be worked out from. The intake custodian accepts them, registers them with audit identifiers, and starts the calculation from a recorded baseline.'
business_purpose: 'It exists so pay is computed from registered inputs rather than from a manager''s note.'
practical_context: 'It opens when the time, attendance, and terms are presented for the calculation, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the compliance function registers the time, attendance, and terms as the calculation baseline, with audit references.'
