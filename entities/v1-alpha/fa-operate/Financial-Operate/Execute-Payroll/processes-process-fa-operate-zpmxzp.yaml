plain_language_name: 'Execute Payroll'
plain_language_description: 'Every payroll cycle, this process pays people. It issues the compensation owed, applies the withholdings that must be taken, and produces the statutory filings that go with each cycle. Run well it is invisible; run late or wrong, everyone notices.'
business_purpose: 'It exists so people are paid the right amount on time every cycle, with the required withholdings taken and the statutory filings produced as expected.'
practical_context: 'The work runs at each payroll cycle boundary, with the compliance function seeing that compensation, withholdings, and statutory filings are produced every time.'
worked_example:
  agent_type: human
  narrative: 'When the payroll cycle boundary is reached, the compliance function checks the compensation figures, confirms the withholdings, and completes the statutory filings so everyone is paid correctly for the period.'
