plain_language_name: 'Compute Withholdings'
plain_language_description: 'This activity works out the deductions — tax and otherwise — that come off the calculated pay. The calculated compensation arrives as the base, withholdings are computed against it per the applicable rules, and the computed deductions are confirmed onward for disbursement. What is earned and what is kept are both established before anyone is paid.'
business_purpose: 'It exists so the deductions owed from each person''s pay are computed correctly, before payment goes out.'
practical_context: 'It follows the compensation calculation within the cycle, and it completes once the computed withholdings are confirmed onward for disbursement.'
worked_example:
  agent_type: human
  narrative: 'A compliance function payroll analyst computes the tax and other deductions against the calculated pay for every person, and confirms the withholdings for disbursement.'
