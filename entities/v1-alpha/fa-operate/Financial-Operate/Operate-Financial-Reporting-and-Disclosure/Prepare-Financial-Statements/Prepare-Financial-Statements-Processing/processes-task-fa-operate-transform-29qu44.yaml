plain_language_name: 'Turn the Closed Books into Statements'
plain_language_description: 'With the data verified, the processing custodian does the preparation itself: each milestone''s statements are drawn from the closed ledger in the shape the milestone demands, and the prepared statements are set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because the books only speak when they are asked in the right form - the statements are that form.'
practical_context: 'It starts once checking is complete and the verified data is ready to be drawn from, and it ends with the prepared statements produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the compliance function draws the closed books into each milestone''s statements, keeping the working papers.'
