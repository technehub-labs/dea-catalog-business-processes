plain_language_name: 'Hand the Package to Everyone Waiting for It'
plain_language_description: 'With the package verified, the processing custodian does the delivery itself: each report and disclosure is handed to its audience along its channel and against its milestone, and the deliveries are set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because a report that reaches nobody informs nobody - the delivery is where the whole reporting effort finally pays.'
practical_context: 'It starts once checking is complete and the verified package is ready to be handed out, and it ends with the delivered package produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the compliance function hands each report to its audience along its channel, keeping the working papers.'
