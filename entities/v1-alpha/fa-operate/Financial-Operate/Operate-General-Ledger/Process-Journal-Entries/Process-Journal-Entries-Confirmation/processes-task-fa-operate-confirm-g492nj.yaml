plain_language_name: 'Confirm the Posted Entries'
plain_language_description: 'When the posting stands done, the confirmation custodian reconciles it against the outcome the activity set out to reach and issues the confirmation. The ledger operation learns its daily diet is digested and the books stand current.'
business_purpose: 'It exists so the books are treated as current only once the posting is confirmed.'
practical_context: 'It begins once preparation is complete and the posted entries await their consumers, and it closes with the confirmation issued, consumers informed, and the result reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the posted entries against the activity''s intended outcome and issues the confirmation the ledger operation needs.'
