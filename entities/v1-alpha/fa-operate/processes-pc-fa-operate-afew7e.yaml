id: processes:pc-fa-operate-afew7e
domain: FinanceAndAccounting
lifecycle_stage: Operate
name: Accounting, Reporting, and Treasury Operation
definition: 'The bounded enterprise context for **operating** the general ledger, accounts payable and receivable, treasury, tax compliance, financial close, financial planning and analysis, and financial reporting and disclosure of the enterprise in the **Finance & Accounting** domain. This context addresses the steady-state work of monetary recording and reporting. v2.4.0: procure-to-pay and order-to-cash operational execution moved to enablement-operations x operate; the monetary recording of those cycles remains here (domain-grounding.md §3.7).

  '
scope:
  includes:
  - General ledger operation
  - Accounts payable and receivable operation
  - Treasury operation
  - Tax compliance operation
  - Financial close operation
  - Financial planning and analysis operation
  - Financial reporting and disclosure operation
  excludes:
  - Finance capability build (Build stage; adjacent context)
  - Procurement transaction execution (enablement-operations x operate; adjacent domain)
  - Agent compensation operation (agency-organization x operate; adjacent domain)
outcomes:
- General ledger is operated to period close.
- Accounts payable and receivable are operated.
- Treasury is operated within policy.
- Tax compliance is operated.
- Financial close is operated on schedule.
- Financial reporting and disclosure are produced.
