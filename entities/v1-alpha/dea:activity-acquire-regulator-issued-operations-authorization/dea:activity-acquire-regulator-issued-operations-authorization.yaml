id: dea:activity-acquire-regulator-issued-operations-authorization
type: Activity
name: Acquire Regulator-Issued Operations Authorization
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: "The cohesive grouping of work within Activate Operations Capability that acquires and records the regulator-issued authorization or certification required for live operations (EASA / FAA AOC; FAA Part 119; PSD2 / ECB / PRA authorization under PSD2 Articles 11 and 28; EMA / FDA / MHRA GMP certification; MiCA Article 59 authorization; ORR / ERA safety case; nuclear operations authorization)."
belongs_to_business_process: dea:process-activate-operations-capability
cohesion_rationale: "Constituent work shares a single regulator-authorization-acquisition concern, one input class (the operations-capability description and the regulator-mandated filing format), and one output (the regulator-issued authorization preserved on the regulated operations record). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6)."
