id: dea:task-commit-risk-framework-design-verify
type: Task
name: Commit Risk Framework Design Verification
definition: The bounded unit of work within `dea:activity-commit-risk-framework-design` (Commit Risk Framework Design) that verify the input pack against the governance-architecture standards (OECD Principles, King IV outcomes) and the delegation-of-authority contract, and emit a verification report naming any architecture deviations and their remediation.
belongs_to_activity: dea:activity-commit-risk-framework-design
trigger: Intake manifest registered for Commit Risk Framework Design; verification gate may execute the contract and quality-criteria checks against the input pack.
outcome: Verification certificate issued for Commit Risk Framework Design naming verification methods applied and any deviations remediated; verification custodian passes custody to the processing custodian.
responsibility: verification custodian
boundary:
  inclusions:
  - Execution of the Commit Risk Framework Design contract checks and quality-criteria verification.
  - Reconciliation of the input pack against the Commit Risk Framework Design verification certificate requirements.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Re-execution of prior phases on rejected or withdrawn cases.
