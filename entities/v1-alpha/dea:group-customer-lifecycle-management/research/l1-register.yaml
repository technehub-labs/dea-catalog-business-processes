      - TOGAF ADM Phase G Implementation Governance
      disposition: ratified-accepted
      ratified_at: '2026-09-14'
      ratified_by: CR-BP-65
      admission: >-
        Reversed from backlog-deferred on CR-BP-63 discovery evidence
        (discovery/v1-alpha/governance-and-existence-activate.yaml): Bring into
        Force scored 9/10 with an ADMIT-CANONICAL recommendation on universal
        entry-into-force semantics (legal-regulatory commencement provisions,
        board-resolution effectiveness, standard-setter effective dates).
        CR-BP-65 lands the PC (dea:pc-ge-activate), PG
        (dea:group-governance-instrument-commencement) and BP
        (dea:process-bring-into-force). Prior deferral (v2, per-cell note):
        governance activation treated as an attribute of governance operate;
        the discovery evaluation established that adoption and commencement
        are distinct, universally governed events (BP-LIFE-002/005/009).
      audit_status: landed
