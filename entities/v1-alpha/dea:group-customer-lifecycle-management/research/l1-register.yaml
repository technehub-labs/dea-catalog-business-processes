ratification:
  version: 7
  cr: CR-BP-66
  ratified_at: '2026-09-14'
  supersedes: version 6 (CR-BP-65, ratified 2026-09-14)
  ratified_accepted: 39
  backlog_deferred: 10
  v4_to_v5_note: 'Two ProductAndValue cells (Activate, Retire) reverse from
    backlog-deferred to ratified-accepted/landed on CR-BP-63 discovery evidence
    under the CR-BP-62 lifecycle process-discovery method. The remaining 12
    Activate/Retire cells keep their v4 dispositions unchanged; their CR-BP-63
    discovery outcomes (RECORD-PATTERN / DEFER / process-empty with documented
    rationale) do not warrant register changes. This is a targeted disposition
    reversal, not a re-derivation; the v4 rederivation_basis still stands.'
  v5_to_v6_note: 'One GovernanceAndExistence cell (Activate) reverses from
    backlog-deferred to ratified-accepted/landed on CR-BP-63 discovery evidence
    (Bring into Force, 9/10, universal entry-into-force semantics). The remaining
    11 Activate/Retire cells keep their dispositions unchanged. Targeted
    disposition reversal, not a re-derivation; the v4 rederivation_basis still
    stands.'
  v6_to_v7_note: 'One EnablementAndOperations cell (Retire) reverses from
    backlog-deferred to ratified-accepted/landed on CR-BP-63 discovery evidence
    (Decommission, 9/10, ISO 55000 asset end-of-life discipline; the v2
    per-cell escape condition "until a regulated decommission requires a
    standalone group" is met). The remaining 10 Activate/Retire cells keep
    their dispositions unchanged. Targeted disposition reversal, not a
    re-derivation; the v4 rederivation_basis still stands.'
  rederivation_basis: 'Re-derived against dea-metaframework framework/domain-grounding.md
    at ECF

    v2.5.0 (CR-ECF-006, CR-ECF-007, CR-ECF-008; ADR-ECF-001, ADR-ECF-002, ADR-ECF-003). The v2.3.0 and

    v2.4.0 domain renames were semantic re-scopings, not pure renames: the

    former Supply & Resources domain was dissolved (physical/virtual resources

    moved to Enablement & Operations as enablers; supplier relationships moved

    to Party & Relationship; financial resources moved to Finance & Accounting)

    and Strategy & Direction occupies the vacated axiom slot. Party &

    Relationship broadened from customer-only to all external parties.

    Finance & Accounting is scoped to monetary reality (abstract ''value''

    removed). Agency & Organization is substrate-independent (human and

    artificial agents).

    '
  v2_to_v250_note: >-
    The v2.4.0 -> v2.5.0 transition was a label-only rename of Domain 6
    (OperationsAndEnablement -> EnablementAndOperations, CR-ECF-008 +
    ADR-ECF-003). No coordinate was added, removed, or re-scoped. The
    v3 disposition register (35 ratified-accepted / 14 backlog-deferred
    / 49 total) is unchanged at v4; this is a no-op re-derivation. The
    ECF v2.5.0 cascade landed on the catalog in PR #61 (CR-BP-23); the
    register re-derivation is recorded here as the formal v4 ratification.
  deferred_rationale: 'Activate and Retire are lifecycle transition stages, not stable
    Process Group operating scopes. L1 Process Groups (CR-BP-12) catalogue the bounded
    operating scope of a process domain; the Activate stage is the handover from Build
    to Operate (a sub-step of the receiving Process Group), and the Retire stage is
    the wind-down of the prior Process Group (a sub-step of the ending Process Group).
    Neither forms a stable L1 group on its own. Reconsider if a discrete Activate/Retire
    process identity is later identified (separate CR). Applied uniformly across all
    7 domains in register v2 (v1 had 3 Activate cells ratified; normalized to deferred
    for consistency).

    '
register:
