# Canonical Process Group entry: dea:group-customer-lifecycle-management.
#
# This is the FIRST Process Group record in the catalog,
# landing as part of CR-BP-12. It exercises the new schema,
# validator, and CI gate, and promotes the metadata.group label
# that lived on dea:process-manage-customer-relationship (CR-BP-03C)
# into a governed first-class record.
#
# Design (CR-BP-12 §4):
#   - Catalog-owned record, NOT a metamodel entity.
#   - ID family: dea:group-* (CR-BP-04 §4).
#   - Canonical containment: L1 group --composes--> L2 process.
#   - The L2 entity carries the inverse `part_of` for navigation.
#   - MECE within Process Context (PG-006) is enforced.

id: dea:group-customer-lifecycle-management
type: ProcessGroup
version: 1.0.0

# Display + classification.
name: Customer Lifecycle Management

# Normative definition (PG-006 / MECE depends on this being
# non-overlapping with peer Process Groups in the same context).
definition: |
  The bounded Process Group that organizes the Business Process
  responsibilities of operating the customer lifecycle within the
  PartyAndRelationship x Operate context. This group captures the
  end-to-end work of sustaining an active customer relationship:
  ongoing management, escalation handling, renewal coordination,
  win-back, and portfolio allocation. The group is the canonical
  Process Group for the customer-lifecycle value stream; functional
  refinements (e.g. enterprise-customer management, SMB-customer
  management) specialize the L2 processes beneath it, not the
  group itself.

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-pr-op

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Account management for active customers
    - Customer escalation handling
    - Customer renewal coordination
    - Customer win-back coordination
    - Customer portfolio allocation
  excludes:
    - New customer acquisition (Conceive stage; adjacent context)
    - Customer onboarding implementation (Build stage; adjacent context)
    - Customer support ticket resolution (Support Staff BP, not L2)
    - Customer churn prediction modelling (Analytics BP, not L2)

# Intended enterprise outcomes.
outcomes:
  - Active customer relationships are sustained across their lifecycle.
  - Customer escalations are resolved within agreed service-level targets.
  - Customer renewals are coordinated with minimal revenue leakage.
  - Customer portfolio allocation is data-informed.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
# The single composed L2 process is the Manage Customer Relationship
# specialization that landed in CR-BP-03C. Future L2 admissions
# (e.g. dea:process-manage-enterprise-customer-relationship) will
# land here as additional `composes` entries.
composes:
  - source_id: dea:group-customer-lifecycle-management
    target_id: dea:process-manage-customer-relationship
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The Manage Customer Relationship L2 process is the principal
      responsibility of the customer-lifecycle value stream within
      PartyAndRelationship x Operate; this composition is the canonical
      starting point.
    evidence: docs/examples/manage-customer-relationship.md
    provenance:
      type: migration
      reference: CR-BP-12 (promotion of metadata.group label)
      asserted_by: dea-team
      asserted_at: '2026-09-04'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: end-to-end

# Discovery / governance status (mirrors CR-BP-11 register values).
status: accepted

# Catalog entry lifecycle (PG-008 enforces).
# `candidate` because CR-BP-13 (GovernanceAndExistence admission
# tranche) has not yet promoted this group to `active`; the
# promotion is gated on the end-to-end validation in CR-BP-13.
lifecycle_status: candidate

# ECF Conformance Gate (CR-ECF-CG-001..004; enforced by
# scripts/check_ecf_conformance.py on every catalog entry).
# The Process Group entry inherits the catalog's conformance
# posture (dea:ecf@1.0.0); the canonical references resolve to
# the ECF Domain (PartyAndRelationship) and Stage (Operate) of the
# Process Context the Process Group belongs to. The Process Group
# does not introduce new ECF extensions; it is a catalog-owned
# grouping construct that exists to organize Business Process
# specializations within an existing Process Context.
ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: '1.0.0'
  profile: dea:ecf@1.0.0
  status: conformant
  affiliation: inherits-catalog
  canonicalReferences:
    - kind: coordinate
      domain: PartyAndRelationship
      stage: Operate
      identifier: ecf:partyRelationship.operate

# Evidence (CR-BP-11 register strength scale E0..E5).
evidence:
  - source: APQC PCF 7.0
    claim: |
      The customer lifecycle (Acquire, Onboard, Retain, Win-back)
      is a recognized cross-industry process frame; the L1 grouping
      follows that frame.
    strength: E3
    url: https://www.apqc.org/resource-library/resource-listing/apqc-process-classification-framework-pcf-cross-industry-pdf-13
  - source: CR-BP-11 (49-coordinate discovery register)
    claim: |
      The party-relationship x operate coordinate carries 5 accepted L1
      candidates; this record is the first to be promoted from the
      register.
    strength: E4
    reference: entities/v1-alpha/dea:group-customer-lifecycle-management/research/L1-REGISTER-v0.1.md

# Metadata (PG-006 cross-context overlap exception path lives here).
metadata:
  established_by: CR-BP-12
  established_at: '2026-09-04'
  cross_context_overlap: []  # No cross-context membership at admission time.
  change_history:
    - cr: CR-BP-12
      date: '2026-09-04'
      change: |
        Initial Process Group record; promoted from
        metadata.group label on dea:process-manage-customer-relationship
        (CR-BP-03C) into a governed first-class record.
    - cr: CR-BP-13
      date: '2026-09-05'
      change: |
        Research ratification. The CR-BP-11 49-coordinate register
        that produced this Process Group was ratified on 2026-09-05:
        38 coordinates ratified-accepted; 11 backlog-deferred
        (Activate/Retire transition stages). The ratified register
        lives at this entity's research/l1-register.yaml and
        research/l1-candidate-universe.yaml.

links:
