id: dea:task-effect-instrument-commencement-confirm
type: Task
name: Effect Instrument Commencement Confirmation
definition: The bounded unit of work within `dea:activity-effect-instrument-commencement` (Effect Instrument Commencement) that reconcile the activated-instrument record against the constitutive instrument and the governing statute, issue the commencement confirmation to the governance custodian and the obligated parties, and log the confirmation against the case file.
belongs_to_activity: dea:activity-effect-instrument-commencement
trigger: Bounded-work artefact produced for Effect Instrument Commencement; confirm gate may reconcile against the governing contract and issue the completion confirmation to the governance custodian.
outcome: Completion confirmation issued for Effect Instrument Commencement and acknowledged by the governance custodian and any governing-party notify-list; confirmation custodian passes custody to the records custodian.
responsibility: confirmation custodian
boundary:
  inclusions:
  - Reconciliation of the Effect Instrument Commencement artefact against the governing contract and any notify-list requirements.
  - Issuance of the Effect Instrument Commencement completion confirmation and acknowledgement logging.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Re-execution of prior phases on confirmation rejection.
evidence:
- source: Delaware DGCL §§101-108 (Formation and Commencement)
  claim: statutory formation and commencement provisions binding the activate-phase verification step to incorporation formalities. Bounded-work evidence for the confirm-phase custodian of `dea:activity-effect-instrument-commencement` (CR-BP-L4-03 enrichment).
  strength: E1
- source: UK Companies Act 2006 Part 2
  claim: UK formation statute grounding the activate-phase commencement-condition checks and the constitutive-instrument registration. Bounded-work evidence for the confirm-phase custodian of `dea:activity-effect-instrument-commencement` (CR-BP-L4-03 enrichment).
  strength: E1
- source: dea:activity-effect-instrument-commencement
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-03 cell-specific bounded-work prose for this GovernanceAndExistence L4 Task.
  strength: E3
