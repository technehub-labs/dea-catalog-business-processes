id: dea:task-resolve-beneficial-ownership-confirm
type: Task
name: Resolve Beneficial Ownership Confirmation
definition: The bounded unit of work within `dea:activity-resolve-beneficial-ownership` (Resolve Beneficial Ownership) that reconcile the activated-party record against the onboarding-decision criteria and the verification certificate, issue the onboarding confirmation to the relationship custodian and the activated party, and log the confirmation against the case file.
belongs_to_activity: dea:activity-resolve-beneficial-ownership
trigger: Bounded-work artefact produced for Resolve Beneficial Ownership; confirm gate may reconcile against the governing contract and issue the completion confirmation to the relationship custodian.
outcome: Completion confirmation issued for Resolve Beneficial Ownership and acknowledged by the relationship custodian and any governing-party notify-list; confirmation custodian passes custody to the records custodian.
responsibility: confirmation custodian
boundary:
  inclusions:
  - Reconciliation of the Resolve Beneficial Ownership artefact against the governing contract and any notify-list requirements.
  - Issuance of the Resolve Beneficial Ownership completion confirmation and acknowledgement logging.
  exclusions:
  - Long-term retention of the closure case file (phase 5).
  - Re-execution of prior phases on confirmation rejection.
evidence:
- source: FATF Recommendation 10 (Customer Due Diligence)
  claim: governing AML/CDD standard for party-activation verification; binds the identity, sanctions, and adverse-media verification step to a regulator-recognised control. Bounded-work evidence for the confirm-phase custodian of `dea:activity-resolve-beneficial-ownership` (CR-BP-L4-02 enrichment).
  strength: E1
- source: FinCEN CDD Rule (31 CFR 1010.230)
  claim: US-specific CDD rule establishing minimum identity-verification procedures that the activate-phase verification step operationalises. Bounded-work evidence for the confirm-phase custodian of `dea:activity-resolve-beneficial-ownership` (CR-BP-L4-02 enrichment).
  strength: E1
- source: dea:activity-resolve-beneficial-ownership
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-02 cell-specific bounded-work prose for this PartyAndRelationship L4 Task.
  strength: E3
