id: dea:task-resolve-records-and-rights-intake
type: Task
name: Resolve Records and Rights Intake
definition: The bounded unit of work within `dea:activity-resolve-records-and-rights` (Resolve Records and Rights) that accept custody of the relationship-closure input pack (close-out plan, outstanding-obligations inventory, records-and-rights register) and persist a registered intake manifest binding the inputs to the closure case file.
belongs_to_activity: dea:activity-resolve-records-and-rights
trigger: Custody of the Retire-stage input pack for Resolve Records and Rights ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Resolve Records and Rights case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Resolve Records and Rights input pack against the Retire-stage intake contract.
  - Binding of the input pack to the Resolve Records and Rights case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the closure case file (phase 5).
evidence:
- source: Sarbanes-Oxley §802 records retention
  claim: US records-retention statute binding the retire-phase records custodian retention schedule to a regulator-recognised minimum. Bounded-work evidence for the intake-phase custodian of `dea:activity-resolve-records-and-rights` (CR-BP-L4-02 enrichment).
  strength: E1
- source: GDPR Art 5(1)(e) storage limitation
  claim: data-protection storage-limitation principle binding the retire-phase storage-limitation rules and the record-phase cryptographic destruction attestation. Bounded-work evidence for the intake-phase custodian of `dea:activity-resolve-records-and-rights` (CR-BP-L4-02 enrichment).
  strength: E1
- source: dea:activity-resolve-records-and-rights
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-02 cell-specific bounded-work prose for this PartyAndRelationship L4 Task.
  strength: E3
