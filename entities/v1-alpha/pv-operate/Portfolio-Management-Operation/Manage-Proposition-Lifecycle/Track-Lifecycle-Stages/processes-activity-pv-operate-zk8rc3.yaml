plain_language_name: 'Track Lifecycle Stages'
plain_language_description: 'Product management keeps a live tally of where every proposition sits in its life - the stages run from introduction through growth and maturity toward decline - using the performance signals coming in. Signals arrive at intake, are verified, worked into the stage tracking record, confirmed, and archived.'
business_purpose: 'It keeps the stage position of every offering current, so transition management and gate decisions start from an accurate map rather than stale assumptions.'
practical_context: 'It is the continuous sensing half of lifecycle management: each watching cycle opens as performance signals arrive at intake and closes when the confirmed tracking record is filed.'
worked_example:
  agent_type: human
  narrative: 'A product management watcher registers each proposition''s latest signals at intake, confirms a once-fast grower has plateaued, updates its stage position to maturity in the tracking record, and confirms the refreshed positions to the lifecycle team.'
