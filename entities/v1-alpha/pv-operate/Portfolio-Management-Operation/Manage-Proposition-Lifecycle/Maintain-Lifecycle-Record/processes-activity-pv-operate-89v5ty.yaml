plain_language_name: 'Maintain Lifecycle Record'
plain_language_description: 'Every transition and gate decision is written into the lifecycle record, so at any moment product management can see where each offering stands and how it got there. New events arrive at intake, are checked, applied to the record, confirmed, and the update trail is preserved.'
business_purpose: 'It keeps a faithful running history of each proposition''s journey through its stages, the reference everyone relies on for position and precedent.'
practical_context: 'It operates continuously through lifecycle management: intake opens as transitions and gate decisions land, and closure comes when the refreshed record and audit trail are confirmed and filed.'
worked_example:
  agent_type: human
  narrative: 'After a gate advance is executed, the product management record keeper registers the event at intake, applies it to the proposition''s history at processing, confirms the updated stage account to the team, and hands the trail to the records custodian.'
