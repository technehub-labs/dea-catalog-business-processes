plain_language_name: 'Product Portfolio Operation'
plain_language_description: 'This family runs the live portfolio day to day. Its processes operate the product catalogue with accurate listings, manage portfolio performance with rebalancing decisions, and manage each proposition''s lifecycle from launch through gate decisions to retirement.'
business_purpose: 'So the catalogue stays accurate, portfolio performance is managed against intent, and every proposition moves through its lifecycle with deliberate gate decisions.'
practical_context: 'Encountered continuously in the Operate stage: catalogue updates, performance tracking, rebalancing and lifecycle gates across the live portfolio.'
worked_example:
  agent_type: mixed
  narrative: 'Each week the Product & Value Process Owner''s team updates catalogue listings on the commerce platform, reviews portfolio performance against targets, rebalances attention toward the rising proposition, and takes the lifecycle gate decision that moves one offering from growth to maturity management.'
