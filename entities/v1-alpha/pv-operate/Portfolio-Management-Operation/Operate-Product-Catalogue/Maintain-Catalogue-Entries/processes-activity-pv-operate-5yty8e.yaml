plain_language_name: 'Maintain Catalogue Entries'
plain_language_description: 'The entries describing each live offering are kept up to date here, refreshed from the variant baselines and lifecycle states as things change. Updates arrive at intake, are verified, applied to the entries, confirmed, and archived, so the catalogue always mirrors what is actually on offer.'
business_purpose: 'It keeps the catalogue''s descriptions true to the offerings actually in operation, so downstream publishing and customer-facing channels describe reality.'
practical_context: 'It runs alongside steady-state catalogue work: intake opens as baselines or lifecycle states change, and closure comes when the updated entries and their audit trail are confirmed and filed.'
worked_example:
  agent_type: human
  narrative: 'When a variant reaches a new lifecycle state, a product management catalogue administrator registers the change at intake, verifies it against the baseline, rewrites the entry at processing, confirms the corrected listing, and the trail is filed for audit.'
