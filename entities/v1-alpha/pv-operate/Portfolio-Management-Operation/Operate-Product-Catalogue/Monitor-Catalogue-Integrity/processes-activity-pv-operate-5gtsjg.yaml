plain_language_name: 'Monitor Catalogue Integrity'
plain_language_description: 'Someone has to watch the watchable: this work checks the operated catalogue for accuracy, availability, and consistency, catching corruption before customers do. Catalogue and channel states arrive at intake, are verified, assessed into an integrity posture, confirmed, and archived.'
business_purpose: 'It protects the catalogue''s standing as the trusted list of what can be bought, so channels and customers are never misled by a stale or broken entry.'
practical_context: 'It runs as a standing vigil over steady-state operation: intake opens as catalogue and channel states arrive, and closure comes when the confirmed integrity posture and its trail are filed.'
worked_example:
  agent_type: human
  narrative: 'A product management catalogue steward registers the day''s catalogue and channel states at intake, spots at verification that one channel shows an outdated price band, raises it through the posture at processing, and confirmation triggers the fix while the trail is archived.'
