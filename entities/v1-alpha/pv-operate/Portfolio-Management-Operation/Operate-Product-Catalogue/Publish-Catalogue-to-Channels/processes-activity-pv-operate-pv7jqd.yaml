plain_language_name: 'Publish Catalogue to Channels'
plain_language_description: 'Whatever the catalogue says, customers only see it once it reaches the channels they buy through; this work performs that hand-off, channel by channel. Channel configurations arrive at intake, are checked, the maintained catalogue is pushed out per channel, confirmation notifies dependents, and the publication trail is archived.'
business_purpose: 'It closes the gap between a correct catalogue and a sellable one, putting the maintained content in front of customers wherever they shop.'
practical_context: 'It runs each time the maintained catalogue is ready for release: intake opens on the channel configurations'' arrival and closure comes when the published state per channel is confirmed and archived.'
worked_example:
  agent_type: human
  narrative: 'Ahead of a range refresh, a product management channel administrator takes the maintained catalogue at intake, verifies each channel configuration, pushes the updated listings to every sales channel at processing, confirms publication to the dependents, and files the trail.'
