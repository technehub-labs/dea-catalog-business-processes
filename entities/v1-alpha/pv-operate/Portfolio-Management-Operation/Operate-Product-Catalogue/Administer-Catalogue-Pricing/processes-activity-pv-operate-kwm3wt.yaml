plain_language_name: 'Administer Catalogue Pricing'
plain_language_description: 'Prices shown in the catalogue are looked after here: launch pricing and any later adjustments are applied within the rules that govern them, so customers always see deliberate, correct prices. Pricing material arrives at intake, is checked against the rules, applied to the catalogue, confirmed, and the change trail is archived.'
business_purpose: 'It keeps catalogue prices correct and rule-abiding, protecting both the customer''s trust and the value case each proposition was built on.'
practical_context: 'It runs through steady-state catalogue operation: intake opens whenever launch pricing or rule-bound adjustments arrive, and closure comes when the administered prices and their audit trail are confirmed and filed.'
worked_example:
  agent_type: human
  narrative: 'When a seasonal adjustment is due, a product management pricing administrator registers the request at intake, checks it against the pricing rules, applies the new prices to the catalogue, confirms the update, and the records custodian files the trail.'
