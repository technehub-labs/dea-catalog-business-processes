plain_language_name: 'Log the Arriving Performance Signals'
plain_language_description: 'The watching opens as proposition performance signals arrive for monitoring. The intake custodian logs them against the performance picture file so the monitoring starts accounted for.'
business_purpose: 'It exists because keeping continuous sight of proposition performance starts with knowing exactly which signals arrived and when.'
practical_context: 'It opens when a round of signals is presented for monitoring with the activity''s owner told that it has landed, and it closes with the intake registered.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in product management logs the week''s proposition signals into the performance picture file, so the continuous watch on how each proposition sits against its investment envelope starts accounted for.'
