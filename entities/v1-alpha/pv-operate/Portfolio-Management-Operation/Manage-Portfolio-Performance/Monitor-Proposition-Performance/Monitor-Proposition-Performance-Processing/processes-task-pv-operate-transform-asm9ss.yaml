plain_language_name: 'Assemble the Proposition Performance Picture'
plain_language_description: 'With the signals verified, the watching becomes a picture. The processing custodian reads the telemetry against each proposition''s investment envelope, producing the performance picture in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because raw telemetry steers nothing until it is assembled into a picture showing how each proposition performs against its envelope.'
practical_context: 'It opens when the verified signals are ready to be read, and it closes with the performance picture produced in the agreed form and the workings retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management assembles the week''s verified telemetry into the performance picture, showing which propositions track inside their envelopes and which are drifting, and keeps the workings for the audit trail.'
