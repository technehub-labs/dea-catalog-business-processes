plain_language_name: 'Monitor Proposition Performance'
plain_language_description: 'Day to day, product management keeps watch on how each proposition is performing, measuring what comes back against the envelope it was given. Incoming telemetry arrives at intake, is checked for quality, is worked into a current performance picture, confirmed to those managing the portfolio, and archived.'
business_purpose: 'It provides the steady stream of performance visibility the portfolio needs, so drift away from an investment thesis is spotted early rather than at review time.'
practical_context: 'It is the standing watch of portfolio management, opening each cycle as telemetry arrives at intake and closing when the refreshed performance picture is confirmed and filed.'
worked_example:
  agent_type: human
  narrative: 'Each reporting day, a product management analyst registers the latest proposition telemetry at intake, verifies odd readings at verification, refreshes the performance picture at processing, and confirms it to the portfolio lead, who uses it to spot propositions drifting past their envelopes.'
