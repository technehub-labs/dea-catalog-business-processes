plain_language_name: 'Log the Reporting Cycle Materials'
plain_language_description: 'Each reporting cycle opens as the material for the portfolio performance report arrives. The intake custodian logs them against the reporting file so the reporting starts accounted for.'
business_purpose: 'It exists because a report bound for governance and strategy consumers must start from an accounted set of cycle inputs.'
practical_context: 'It opens when the cycle''s inputs are presented for the report with the activity''s owner told that they have landed, and it closes with the intake registered.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in product management logs the quarter''s reporting inputs into the reporting file at the top of the cycle, so the preparation of the portfolio performance report starts accounted for.'
