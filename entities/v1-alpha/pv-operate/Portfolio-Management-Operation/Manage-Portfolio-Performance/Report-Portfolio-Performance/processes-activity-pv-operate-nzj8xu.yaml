plain_language_name: 'Report Portfolio Performance'
plain_language_description: 'On the reporting cadence, product management packages the performance picture into a report for the forums that steer the portfolio. Intake gathers the cycle''s material, verification checks the figures, processing assembles the portfolio performance report, confirmation releases it to its consumers, and the issue is archived.'
business_purpose: 'It keeps the people who steer the portfolio supplied with a regular, dependable account of performance, so oversight rests on fact rather than impression.'
practical_context: 'It runs to a reporting cadence within steady-state operation: each cycle opens at intake when the period''s material is presented and closes when the confirmed report and its audit trail are filed.'
worked_example:
  agent_type: human
  narrative: 'At the close of the reporting month, a product management analyst collects the period''s figures at intake, verifies them at verification, assembles the report for the governance and strategy consumers, confirms its release, and archives the issue trail.'
