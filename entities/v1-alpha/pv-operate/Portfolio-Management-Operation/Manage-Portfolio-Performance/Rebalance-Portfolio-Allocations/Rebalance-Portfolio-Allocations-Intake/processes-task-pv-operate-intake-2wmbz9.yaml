plain_language_name: 'Take In the Rebalancing Request Papers'
plain_language_description: 'The rebalancing opens as the material calling for new allocations arrives, starting from the monitored performance picture. The intake custodian logs them against the rebalancing file so the rebalancing starts accounted for.'
business_purpose: 'It exists because shifting portfolio money must begin from logged triggering evidence and direction, or the round has no accounted start.'
practical_context: 'It opens when the picture and direction material is presented for rebalancing with the activity''s owner told that it has landed, and it closes with the intake registered.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in product management logs the latest performance picture and the portfolio direction papers into the rebalancing file, so the work of shifting allocations starts accounted for.'
