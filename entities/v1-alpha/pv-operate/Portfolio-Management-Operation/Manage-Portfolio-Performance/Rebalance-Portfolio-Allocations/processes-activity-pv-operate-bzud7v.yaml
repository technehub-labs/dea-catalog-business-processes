plain_language_name: 'Rebalance Portfolio Allocations'
plain_language_description: 'When the performance picture shows money sitting in the wrong places, product management shifts the allocations to match - moving envelope room from laggards toward the propositions doing better. The picture arrives at intake, is verified against the portfolio direction, the shifts are worked out and applied, confirmed, and the rebalancing trail is archived.'
business_purpose: 'It acts on what monitoring reveals, adjusting where investment sits so the portfolio backs its best-performing propositions instead of its historically favoured ones.'
practical_context: 'It follows monitoring in the performance cycle: intake opens on the refreshed performance picture and closure comes when the confirmed allocations and their audit trail are on record.'
worked_example:
  agent_type: human
  narrative: 'Seeing one proposition consistently outperform while another drifts, a product management lead registers the picture at intake, works out a reallocation that trims the laggard''s envelope, confirms the change with the portfolio owner, and the records custodian files the trail.'
