name: Portfolio Management Operation
definition: 'The bounded Process Group that organises the Business Process responsibilities of operating the product catalogue, managing portfolio performance, and managing the proposition lifecycle in the ProductAndValue x Operate context. v2.4.0 grounding (domain-grounding.md §3.5).

  '
process_context: processes:pc-pv-operate-ewpwjc
scope:
