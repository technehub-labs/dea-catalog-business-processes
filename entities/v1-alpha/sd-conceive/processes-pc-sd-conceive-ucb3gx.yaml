plain_language_name: 'Purpose and Ambition Conception'
plain_language_description: 'This context covers the Strategy & Direction area at the Conceive stage: the deepest front-end thinking about the enterprise''s trajectory. It frames purpose and ambition, commits strategic intent, sets the horizons the enterprise aims at, and develops corporate strategy within its authorized mandate. Option design and plan building come later.'
business_purpose: 'To decide, deliberately and early, what the enterprise is aiming at and how far it intends to go over each horizon.'
practical_context: 'Encountered at founding, at generational inflection points, and in long-horizon reviews when the question of direction itself is open.'
worked_example:
  agent_type: human
  narrative: 'Facing a generational shift in its market, the Strategy & Direction Process Owner leads the framing of purpose and ambition, commits a strategic intent for the decade, and bounds the horizons the enterprise will plan against.'
