plain_language_name: 'Choose the Trajectory the Synthesized Direction Commits To'
plain_language_description: 'With the inputs verified, the choosing proper begins. The processing custodian weighs the articulated trajectories against the synthesized direction and fixes the one course the enterprise will follow, producing the chosen trajectory in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because a direction stays a wish until one course of travel is actually chosen over the alternatives.'
practical_context: 'It opens when the verified material is ready to be worked, and it closes with the chosen trajectory produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function weighs the verified trajectories against the direction, settles on the one the enterprise will follow, and keeps the choosing workings for the audit trail.'
