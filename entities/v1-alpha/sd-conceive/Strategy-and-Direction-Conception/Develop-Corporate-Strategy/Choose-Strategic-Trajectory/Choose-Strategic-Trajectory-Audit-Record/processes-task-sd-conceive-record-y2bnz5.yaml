plain_language_name: 'File the Trajectory Choice Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so why this course was chosen, and the others set aside, stays answerable at every strategy review.'
business_purpose: 'It exists because the road not taken is exactly what future rounds will want examined with evidence.'
practical_context: 'It opens when the confirmation is in place, and it closes with the choice evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the choice evidence at its required retention tier and sets the retrieval handles, so a later challenge to the course taken is met from the record.'
