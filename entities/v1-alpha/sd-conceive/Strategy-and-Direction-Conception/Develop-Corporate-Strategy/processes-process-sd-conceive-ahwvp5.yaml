plain_language_name: 'Develop Corporate Strategy'
plain_language_description: 'This is the work that produces the organisation''s corporate strategy itself. The strategy function brings together a bounded ambition, the strategic intent, and a chosen trajectory, and commits them as a strategy ready for detailed design work. It runs whenever the enterprise is setting a new strategic course, reframing an existing one, or realigning at board level in response to signals from outside.'
business_purpose: 'It gives the whole enterprise one committed strategic course: ambition, intent, and trajectory decided together, so every downstream plan and initiative pulls in the same direction.'
practical_context: 'Encountered when a new strategic trajectory is needed, at major planning points or when environmental signals force board-level realignment; the strategy function develops and commits the strategy.'
worked_example:
  agent_type: human
  narrative: 'The strategy function drafts the corporate strategy, setting the bounded ambition, the intent, and the chosen trajectory, and takes it through review with the leadership. Once committed, it is handed to the design work that turns it into objectives and options.'
