plain_language_name: 'Take In the Synthesized Direction for the Trajectory Work'
plain_language_description: 'The articulation opens as its material arrives: the synthesized direction that says where the enterprise must head. The intake custodian logs it against the articulation file so the articulating starts accounted for.'
business_purpose: 'It exists so the trajectory is articulated over the logged direction rather than over a headline anyone half recalls.'
practical_context: 'It opens when the synthesized direction is presented for articulation, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
