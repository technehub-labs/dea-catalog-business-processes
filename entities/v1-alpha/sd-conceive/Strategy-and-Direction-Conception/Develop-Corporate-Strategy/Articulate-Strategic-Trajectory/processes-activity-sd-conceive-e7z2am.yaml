plain_language_name: 'Articulate Strategic Trajectory'
plain_language_description: 'A direction is a bearing; a trajectory spells out the route. Intake registers the synthesized direction, verification tests the emerging wording against it, and processing writes out the trajectory in full — where the enterprise is heading and along what path. Confirmation passes the articulated trajectory downstream and the records custodian preserves it for the choice step.'
business_purpose: 'It converts the fused direction into an explicit trajectory that leaders can weigh and choose between.'
practical_context: 'It follows synthesis, opening at intake of the synthesized direction and closing when the articulated trajectory is confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'Strategy function writers turn the synthesized direction into a fully spelled-out trajectory, read it back against the direction with the activity owner, and the confirmation custodian releases it to the colleagues who will choose the way forward.'
