plain_language_name: 'Commit Corporate Strategy'
plain_language_description: 'This is the closing act of strategy conception. The chosen trajectory comes in at intake alongside the settled ambition and intent, a final verification confirms the set is complete, and the corporate strategy is committed as one artifact. Confirmation notifies downstream consumers that the strategy is ready to drive design work, and the records custodian preserves the committed strategy for the long term.'
business_purpose: 'It seals the process with one committed corporate strategy, the mandate that lets downstream design work begin from a settled base.'
practical_context: 'It opens once the trajectory is chosen and closes with the commitment confirmed, downstream consumers notified and evidence archived.'
worked_example:
  agent_type: human
  narrative: 'The strategy function lead commits the corporate strategy, the confirmation custodian notifies design colleagues that the committed ambition, intent and trajectory are available, and the records custodian archives the strategy evidence at its retention tier.'
