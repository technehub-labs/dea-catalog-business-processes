plain_language_name: 'File the Strategic Intent Commitment Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so what the organisation committed to, and which trade-offs it accepted, stays provable through every later strategy round.'
business_purpose: 'It exists because the trade-offs behind the intent are exactly what later rounds will want to re-litigate without evidence.'
practical_context: 'It opens when the confirmation is in place, and it closes with the commitment evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the commitment evidence at its required retention tier and sets the retrieval handles, so the accepted trade-offs are always traceable from the record.'
