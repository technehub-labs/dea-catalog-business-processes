plain_language_name: 'Take In the Framed Intent and the Scoped Trade-offs'
plain_language_description: 'The committing opens as its material arrives: the framed intent narrative together with the trade-offs it has been scoped to navigate. The intake custodian logs them against the commitment file so the committing starts accounted for.'
business_purpose: 'It exists so the intent is committed over logged framing and trade-offs rather than over a speech someone half remembers.'
practical_context: 'It opens when the framed intent and scoped trade-offs are presented for commitment, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the framed intent narrative and the scoped trade-offs into the commitment file, so the commitment work starts accounted for.'
