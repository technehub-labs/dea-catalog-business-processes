plain_language_name: 'Conceive Strategic Intent'
plain_language_description: 'With the enterprise''s purpose and ambition settled, this work decides what direction the organisation will actually steer. The strategy function frames a bounded strategic intent that sits inside that purpose and ambition, giving the planning work that follows a clear heading. The intent then serves as the reference point for horizons, options, and objectives.'
business_purpose: 'It gives the enterprise a steerable sense of direction: strategic intent translates broad purpose and ambition into a framing that later planning can design against.'
practical_context: 'Encountered early in the strategy cycle, once purpose and ambition are defined; the strategy function conceives and frames the intent before any horizons or options are drawn.'
worked_example:
  agent_type: human
  narrative: 'The strategy function holds a framing session once the purpose and ambition are signed off, drafting the strategic intent in a few bounded statements. The intent is agreed and becomes the heading under which horizons and options are developed.'
