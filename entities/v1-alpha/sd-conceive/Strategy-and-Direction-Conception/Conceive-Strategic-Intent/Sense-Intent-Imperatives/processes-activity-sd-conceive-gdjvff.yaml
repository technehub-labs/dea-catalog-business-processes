plain_language_name: 'Identify Intent Imperatives'
plain_language_description: 'Direction-setting starts with listening. Purpose signals, mandate changes and cues from the environment are brought in at intake, checked for relevance, and shaped into a clear set of imperatives that explains why bounded intent is needed now. Confirmation shares that set with downstream colleagues and the records custodian preserves it for the framing work that follows.'
business_purpose: 'It grounds the intent work in evidence, so the direction the enterprise frames responds to real signals rather than assumptions.'
practical_context: 'It opens the process at intake when purpose signals and mandate changes arrive, closing once the sensed imperatives are confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'A strategy function analyst gathers mandate notes and environment cues at intake, a verification custodian filters out the noise, and the team publishes the shortlist of imperatives that the intent framing will answer to.'
