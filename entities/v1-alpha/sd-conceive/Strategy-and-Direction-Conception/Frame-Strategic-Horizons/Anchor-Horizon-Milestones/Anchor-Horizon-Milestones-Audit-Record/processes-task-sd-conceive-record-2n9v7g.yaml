plain_language_name: 'File the Horizon Milestone Anchoring Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so why each milestone sits in its timeframe stays answerable when horizon dates are later challenged.'
business_purpose: 'It exists because the anchoring logic is what dated the strategy''s promises, and it must be answerable from evidence.'
practical_context: 'It opens when the confirmation is in place, and it closes with the anchoring evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the anchoring evidence at its required retention tier and sets the retrieval handles, so a challenged milestone date is explained from the record.'
