plain_language_name: 'Hand the Framed Purpose Statement to the Ambition Framing'
plain_language_description: 'The confirming opens once the statement is framed. The confirmation custodian tells the downstream teams the purpose statement is available, and closes the reconciliation against what the activity promised for the framing.'
business_purpose: 'It exists so the ambition is framed over a confirmed statement of purpose rather than over a phrase still being polished.'
practical_context: 'It opens when the purpose statement is ready to hand on, and it closes with the confirmation issued and the framing''s promises checked off against what was delivered.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian in the strategy function hands the framed purpose statement to the ambition framing team, reconciles it against what the framing promised, and issues the confirmation.'
