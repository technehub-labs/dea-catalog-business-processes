plain_language_name: 'Take In the Purpose Statement and the Environment Cues'
plain_language_description: 'The framing opens as its material arrives: the purpose statement together with the environment cues bearing on what the enterprise can credibly attempt. The intake custodian logs them against the framing file so the framing starts accounted for.'
business_purpose: 'It exists so the ambition is framed over the logged purpose and real-world cues rather than over unchecked optimism.'
practical_context: 'It opens when the purpose statement and the cues are presented for framing, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the purpose statement and the environment cues into the framing file, so the ambition framing starts accounted for.'
