plain_language_name: 'Settle What the Relationship Still Owes'
plain_language_description: 'With the certificate in hand, the processing custodian works the closure: what is owed is settled, the records and rights are resolved under the rules for how long data may be kept, and the close itself is executed. Each financial and contractual obligation is fulfilled or settled, and the evidence is produced as a record pack ready for confirmation.'
business_purpose: 'It exists because a relationship cannot close cleanly while either party still owes the other.'
practical_context: 'It opens when the verification certificate clears the pack, and it closes with the record pack produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in supplier and partner management settles each outstanding obligation and records the settlement evidence.'
