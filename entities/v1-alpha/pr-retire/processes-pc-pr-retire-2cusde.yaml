  lifecycle_concern: 'Retire: contract close-out, party offboarding, residual obligation and record resolution.'
  combined_semantic_meaning: 'The termination-stage work of closing enterprise relationships

    and resolving what they leave behind, across customer, supplier

    and partner roles.

    '
  expected_outcomes:
  - Relationships are closed out under approved termination plans.
  - Residual obligations are settled and records and rights resolved.
  - Regulated offboarding obligations (including erasure) are evidenced.
  inclusions:
  - Contract close-out and termination settlement
  - Party offboarding across roles (customer, supplier, partner)
  - Residual obligation and record resolution
  exclusions:
  - Relationship establishment and activation (Activate stage; sibling coordinate)
  - Steady-state relationship operation (Operate stage; adjacent context)
  - Relationship improvement and development (Improve stage; adjacent context)
  - Asset retirement and decommissioning (EnablementAndOperations x Retire; sibling cell)
  adjacent_boundaries:
