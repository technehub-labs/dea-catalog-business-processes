id: dea:process-sunset-regulated-strategic-plan
name: Sunset Regulated Strategic Plan
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management

# Trigger and outcome (BP-ARC-ID-002: trigger / outcome blocks nested
# inside identity; pre-existing baseline -- does not block CI under
# check_admission_gate.py --strict-provenance).
trigger: 'A regulated entity''s supervisor-acknowledged-and-live strategic plan must be sunset because a competent regulator has required its retirement (failed stress test triggers plan replacement; bank recovery-plan rejection by the SRB; FDIC directive to retire an inadequate resolution plan; state PUC retraction of an approved strategic plan; NHS England directive to retire a non-viable 5-year strategy).'

outcome: 'The regulated strategic plan is formally sunset with the regulator directive on record, the replacement plan''s status preserved, the retired plan''s records retained per the regulated-entity retention policy, and the supervisor''s acknowledgement of the sunset recorded.'

description: 'Sunset a regulated entity''s supervisor-acknowledged-and-live strategic plan under the enterprise''s regulated-entity retention policy within the dea:pc-sd-retire Cell Charter. The trigger is a competent regulator''s directive or rejection that requires the plan''s retirement; the outcome is the plan formally sunset with the regulator directive on record, the replacement plan''s status preserved, the retired plan''s records retained per the regulated-entity retention policy, and the supervisor''s acknowledgement of the sunset recorded. Distinct from strategy improvement (Improve coordinate) and from strategy activation (Activate coordinate, which handles replacement-plan activation).'

# Process specialisation (BP-ARC-ID-005: empty until specialisation
# program is approved).
process_specialization: []

# Process identity / definitions / processes_and_projects distinction
# (BP-001..008 enforce; CR-BP-12 register faces).
process_identity:
  boundary_face: regulated-entity retention policy
  identity_kind: canonical
  is_process: true
  is_project: false

# Process scope (BP-006: bounded on inputs and outcomes).
process_scope:
  includes:
    - "Regulator directive or rejection notice (failed stress test triggers plan replacement; bank recovery-plan rejection by the SRB; FDIC directive to retire an inadequate resolution plan; state PUC retraction of an approved strategic plan; NHS England directive to retire a non-viable 5-year strategy)"
    - "Superseded or replaced plan identification on the regulated strategic-plan record"
    - "Filings register update for the regulated strategic plan"
    - "Communications plan execution for the regulated strategic-plan sunset under the regulator's continuing supervision"
    - "Regulator-acknowledged sunset record preservation on the regulated strategic-plan record"
    - "Retained-records plan execution per the regulated-entity retention policy"
    - "Affected business-unit notification under the regulator's continuing supervision"
  excludes:
    - "Strategic-plan conception, design, build, activation, steady-state execution, and improvement (StrategyAndDirection x Conceive / Design / Build / Activate / Operate / Improve)"
    - "Non-regulated strategic-plan sunset (single-business-unit rollout without regulator's review)"
    - "Strategic plans absent a regulator-directed sunset regime"
    - "Strategic-plan disposition where no competent regulator has required retirement"
    - "Replacement-plan activation (handled at StrategyAndDirection x Activate)"

# Canonical context block (BP-SEM-007 enforces; replaces legacy scalar
# process_context for downstream gate compliance).
context:
- ref: dea:pc-sd-retire

# Process identity sub-block (BP-C1..C4 enforces).
identity:
  verb: Sunset
  object: Regulated Strategic Plan
  scope: enterprise
  outcome_statement: 'The regulated strategic plan is formally sunset with the regulator directive on record, the replacement plan''s status preserved, the retired plan''s records retained per the regulated-entity retention policy, and the supervisor''s acknowledgement of the sunset recorded.'
  evidence_links:
    - type: documentation
      ref: discovery/v1-alpha/strategy-and-direction-retire-escape.yaml
    - type: governance
      ref: CR-BP-80 (escape-clause discovery; score 8)
    - type: governance
      ref: CR-BP-101 (admission tranche; this slice)
  cross_context_stability: |
    Stable across regulated sectors: banking (FDICIA Section 131;
    SRB rejection; Bank of England PRA SS9/17), utilities (state
    PUC retraction), healthcare (NHS England directive). The
    regulated-strategic-plan sunset identity survives the
    removal of the SD.Retire ECF label per BP-LIFE-009.

# Part-of reference (inverse of L1 containment; CR-BP-12 §4 rule).
part_of:
- dea:group-regulated-strategic-plan-sunset

# Activity composition (CR-BP-32; BP-AR-007 enforces).
# This process admits 0 Activity specialisation(s) at land-time.
# Activity decomposition is the work of a future L3 tranche; the
# admission follows the CR-BP-86 pattern (BP-only admission; Activity
# decomposition as a follow-on slice per CR-BP-87 precedent at
# SD.Activate). Activity decomposition will be authored when the
# CR-BP-62 lifecycle-discovery method is exercised on the SD.Retire
# Activity universe; that is downstream of this admission.

# Discovery lineage (CR-BP-62 §17; CR-BP-80 escape record).
discovery:
  record: dea:discovery-strategy-and-direction-retire-escape
  candidate: Sunset Regulated Strategic Plan
  score: 8
  axes:
    process_reality: 2
    semantic_stability: 2
    cross_domain_applicability: 1
    boundary_clarity: 2
    evidence_strength: 1
  disposition:
    type: ADMIT-CANONICAL
    rationale: |
      The CR-BP-80 escape-clause exercise re-evaluated the
      SD.Retire coordinate under the regulator-directed sunset
      landscape and found the verbatim escape condition
      superseded for this cell. The 2024-2026 supervisor-
      acknowledged evidence base is sufficient for canonical
      admission at score 8; the cell flips
      ratified-accepted/landed at v17 of the l1-register.

# Governance / regulatory notes (BP-AR-006 enforcement;
# informative; does not gate CI).
governance:
  regulators:
    - "Federal Deposit Insurance Corporation (FDIC): FDICIA Section 131 prompt-corrective-action recovery-plan replacement"
    - "Single Resolution Board (SRB): bank recovery-plan rejection directive"
    - "Bank of England Prudential Regulation Authority (PRA): SS9/17 recovery and resolution planning; withdrawal under PRA direction"
    - "US state Public Utility Commissions (PUC): integrated resource plan and strategic-plan retraction"
    - "NHS England / Department of Health: trust 5-year strategy directive"
  statutory_retention:
    - "Regulated-entity retention policy per supervisor's continuing oversight"
    - "Filings register preserved for the statutory retention period"

