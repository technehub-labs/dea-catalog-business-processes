plain_language_name: 'Say How Much Risk the Enterprise Will Carry'
plain_language_description: 'With the certificate in hand, the processing custodian executes the conception for the appetite: how much risk the enterprise accepts is articulated from the governance mandate, joined by the rest of the conception the framework package carries, and the conception-ready package is produced for confirmation.'
business_purpose: 'It exists because an enterprise that never says how much risk it will take says yes to all of it by default.'
practical_context: 'It opens once the verification certificate is in hand and the bounded conception may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function articulates how much risk the enterprise will carry, drawing on the governance mandate.'
