plain_language_name: 'Read the Pack Against the Method Before It Counts'
plain_language_description: 'With the manifest registered, the verification custodian reads the whole pack against the methodology that governs the framework and the rules that bound the scope, and issues the report naming whatever deviates from the method and how it will be mended.'
business_purpose: 'It exists because an appetite articulated short of its method would steer the enterprise by feel - the reading is what keeps it honest.'
practical_context: 'It opens once the manifest is registered and the contract and quality checks may run against the pack, and it closes with the verification certificate issued, custody passed onward to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function reads the pack against the method and names whatever deviates and how it will be mended.'
