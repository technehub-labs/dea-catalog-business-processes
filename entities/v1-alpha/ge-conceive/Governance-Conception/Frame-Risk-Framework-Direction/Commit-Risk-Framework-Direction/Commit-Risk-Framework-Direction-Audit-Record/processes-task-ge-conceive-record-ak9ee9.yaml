plain_language_name: 'Lay the Direction Case Down for Keeps'
plain_language_description: 'At the close the records custodian lays the case down under the schedule that keeps it, integrity sealed: the manifest, the verification report, the conception-ready package, the completion confirmation, and whatever remediations were raised. The direction''s making stays provable for as long as the framework endures.'
business_purpose: 'It exists so the direction''s making can be evidenced for as long as the framework endures.'
practical_context: 'It opens once the completion confirmation is issued and the case file may be retained, and it closes with the case file held under the retention schedule, its integrity protected.'
worked_example:
  agent_type: human
  narrative: 'A records custodian lays the case down under the schedule that keeps it and sets the retrieval handles a risk review would consult.'
