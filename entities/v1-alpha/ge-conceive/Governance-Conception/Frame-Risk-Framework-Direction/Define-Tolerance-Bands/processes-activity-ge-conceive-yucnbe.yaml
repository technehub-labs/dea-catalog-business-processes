plain_language_name: 'Define Tolerance Bands'
plain_language_description: 'This activity marks how far actual risk may swing either side of the appetite before anyone must act. The articulated appetite arrives as the centre line, tolerance bands are drawn around it and checked for realism, and the band set is confirmed onward for the posture work. The appetite gains its margins of tolerance here.'
business_purpose: 'It exists so acceptable variation around the appetite is defined in advance, not debated after the fact.'
practical_context: 'It follows the appetite articulation, working around the stated appetite, and it completes once the tolerance band set is confirmed for the posture framing.'
worked_example:
  agent_type: human
  narrative: 'A governing board lead marks the bands of acceptable variation either side of the stated appetite, checks they are realistic, and confirms the band set onward.'
