    change: 'CR-BP-20 Option A GE/SD split (user-approved 2026-09-07, grounded in domain-grounding.md §3.1 and §3.2): Develop corporate strategy is excluded from GovernanceAndExistence per v2.4.0 (GE authorises but does not direct). This process is scheduled for migration to StrategyAndDirection × Conceive (dea:pc-sd-conceive) in CR-BP-21a (planned landing tranche). Until that cell lands, this process remains affiliated with GE × Conceive and composed by dea:group-governance-conception (formerly dea:group-strategy-and-governance-conception).'
