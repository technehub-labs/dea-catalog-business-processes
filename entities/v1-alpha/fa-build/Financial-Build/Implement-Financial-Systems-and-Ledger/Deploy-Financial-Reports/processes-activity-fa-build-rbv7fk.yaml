plain_language_name: 'Deploy Financial Reports'
plain_language_description: 'This activity builds the reports the books will be expected to turn out into the live systems. The reporting requirements and disclosure needs arrive as the specification, reports are deployed against the configured ledger and checked for output, and the deployed reports are confirmed onward for readiness. The ledger can now answer the questions it was built to answer.'
business_purpose: 'It exists so the ledger produces the reports its readers need, as designed, from live data.'
practical_context: 'It follows the posting configuration, when the reporting requirements and disclosure needs are to hand, and it completes once the deployed reports are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A finance function builder deploys the required reports against the configured ledger, checks each renders correctly from live data, and confirms the deployed set.'
