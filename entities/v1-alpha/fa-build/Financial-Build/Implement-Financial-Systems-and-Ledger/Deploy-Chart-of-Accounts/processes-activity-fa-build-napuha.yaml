plain_language_name: 'Deploy Chart of Accounts'
plain_language_description: 'This activity installs the designed account structure into the live financial systems. The committed plan structure arrives as the design of record, the chart of accounts is deployed and checked against it, and the deployed structure is confirmed onward for the posting rules. The skeleton of the books goes live here.'
business_purpose: 'It exists so the enterprise''s books stand on the account structure it designed, live in its systems.'
practical_context: 'It opens the financial systems implementation, when the committed plan structure is presented for deployment, and it completes once the deployed chart of accounts is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A finance function builder installs the designed account structure into the financial systems, checks the deployment against the committed plan structure, and confirms it for the posting rules.'
