plain_language_name: 'Formalize the Funding Agreements'
plain_language_description: 'This activity puts the agreed funding terms into signed, binding paperwork. The negotiated terms arrive as the substance, the facility documentation is executed and checked against what was agreed, and the executed documents are confirmed onward. Handshake deals become commitments the enterprise can draw on.'
business_purpose: 'It exists so the negotiated funding lines become signed commitments the enterprise can actually draw against.'
practical_context: 'It follows the negotiations, when the agreed terms are to hand, and it completes once the executed facility documentation is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A finance function officer turns the negotiated terms into executed facility paperwork, checks every clause against what was agreed, and confirms the signed documents.'
