plain_language_name: 'Build Budgeting and Forecasting Systems'
plain_language_description: 'When a new planning cycle is coming up or the budget tooling needs a rebuild, the finance function puts the budgeting and forecasting systems in place. The work covers building the planning models, wiring up the integrations that feed them, and putting the necessary controls around them. Once the work is finished, the systems are ready to carry the organisation''s budgeting.'
business_purpose: 'It gives the organisation working budgeting and forecasting systems, so plans and forecasts can be produced reliably every cycle instead of being assembled by hand.'
practical_context: 'The work starts when a planning cycle is scoped or a budget tool rebuild is agreed, and the finance function carries it through ahead of the next budgeting round.'
worked_example:
  agent_type: human
  narrative: 'Ahead of next year''s planning round, the finance function scopes the rebuild, assembles the forecasting models, connects them to the feeds they depend on, and signs off the controls so planning can run on the new setup.'
