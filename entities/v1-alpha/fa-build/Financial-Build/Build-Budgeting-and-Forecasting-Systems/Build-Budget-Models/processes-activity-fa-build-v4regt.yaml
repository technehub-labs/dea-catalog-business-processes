plain_language_name: 'Build Budget Models'
plain_language_description: 'This activity works the committed plan structure into working budget models for the scoped cycle. The plan structure arrives as the reference, the models are built against it and checked as they take shape, and the working models are confirmed onward for the integrations. The planning cycle''s arithmetic exists in working form from here.'
business_purpose: 'It exists so the planning cycle runs on budget models actually built to the committed plan structure.'
practical_context: 'It opens the planning system build, once a cycle or tool rebuild is scoped and the plan structure is to hand, and it completes when the working budget models are confirmed onward.'
worked_example:
  agent_type: human
  narrative: 'A finance function builder turns the committed plan structure into working budget models for the scoped cycle, checking each model against the structure as it takes shape.'
