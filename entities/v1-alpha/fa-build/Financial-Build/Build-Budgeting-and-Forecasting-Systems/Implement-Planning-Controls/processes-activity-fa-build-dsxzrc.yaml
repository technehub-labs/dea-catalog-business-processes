plain_language_name: 'Implement Planning Controls'
plain_language_description: 'This activity puts the designed financial controls in place around the planning tools. The controls design arrives as the specification, the controls are implemented across the systems and checked against it, and the implemented planning controls are confirmed onward for readiness. The planning numbers gain protection while they are being built, not after.'
business_purpose: 'It exists so the budgeting and forecasting systems run under designed controls from the start.'
practical_context: 'It follows the model and integration work, when the financial controls design is to hand, and it completes once the implemented planning controls are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A finance function builder implements the designed controls across the planning systems, checks each one against the controls design, and confirms the implemented set.'
