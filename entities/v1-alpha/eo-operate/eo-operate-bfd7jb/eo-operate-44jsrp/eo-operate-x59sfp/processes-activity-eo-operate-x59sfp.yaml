id: processes:activity-eo-operate-x59sfp
type: Activity
name: Report Quality Performance
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Operate Quality Control that aggregates per-batch inspection records into quality performance reporting (first-pass yield, defect rates) for the owning Process Group.
belongs_to_business_process: processes:process-eo-operate-44jsrp
cohesion_rationale: Constituent work shares a single aggregation-and-reporting concern, consumes one input class (per-batch quality records), and serves one audience (the Execution and Fulfillment Process Group). Cohesion score 7/9 assessed at deposition (CR-BP-32 §6; research/l3-candidate-universe.yaml); lowest of the pilot set because reporting cadence varies by stakeholder, retained as a distinct Activity because absorption into Record Inspection Results would mix capture and aggregation concerns.
