name: Plan Quality Inspection
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Operate Quality Control that establishes what, how, and when production output will be inspected: selecting the sampling scheme, resolving the applicable specification and tolerances, and scheduling the inspection for each batch.'
belongs_to_business_process: processes:process-eo-operate-44jsrp
cohesion_rationale: Constituent work shares a single planning concern (preparing inspection of a batch before any measurement exists), draws on the same inputs (specifications, sampling standards, production schedule), and produces one recognizable portion of the parent outcome (an executable inspection plan). Cohesion score 8/9 assessed at deposition (CR-BP-32 §6; research/l3-candidate-universe.yaml).
