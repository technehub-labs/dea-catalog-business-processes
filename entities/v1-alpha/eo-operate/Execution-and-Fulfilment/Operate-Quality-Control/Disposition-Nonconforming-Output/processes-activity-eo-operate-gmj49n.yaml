plain_language_name: 'Disposition Nonconforming Output'
plain_language_description: 'This activity takes each recorded nonconformity and rules on what happens to the output behind it — concession, rework, scrap, or sending back — containing any affected batches meanwhile. The recorded nonconformities arrive as the case list, each disposition is decided and applied, and the dispositions are confirmed for the record. Failed product meets a decision, not a shrug.'
business_purpose: 'It exists so output that fails its specification gets a deliberate, recorded fate before it can reach a customer.'
practical_context: 'It runs once a batch''s results are in the quality record and nonconformities are logged, and it completes when each disposition, including containment, is confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'A quality custodian takes a batch''s recorded nonconformity, contains the affected stock, rules the output to rework rather than concession, and confirms the disposition for the record.'
