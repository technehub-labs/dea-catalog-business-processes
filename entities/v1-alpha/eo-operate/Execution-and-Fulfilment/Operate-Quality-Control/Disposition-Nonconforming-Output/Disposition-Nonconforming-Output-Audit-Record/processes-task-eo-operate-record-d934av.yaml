plain_language_name: 'File the Dispositions Audit Record'
plain_language_description: 'At the close the records custodian preserves the disposition trail at its required retention tier and sets the retrieval handles for it. What was found failing, and what became of it, stays readable whenever a batch''s history is examined.'
business_purpose: 'It exists so the fate of every failing output can be evidenced whenever a batch''s history is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the disposition trail at its retention tier and sets the retrieval handles a quality review would consult.'
