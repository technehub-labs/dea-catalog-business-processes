plain_language_name: 'Check the Plan Before Running the Tests'
plain_language_description: 'Before anything is tested, the verification custodian checks the plan against what inspection requires - that each batch''s tests, tolerances, and sampling are stated and the equipment is matched to them. Defects are logged for rejection or repair before any test runs.'
business_purpose: 'It exists so no batch is tested to a plan that was never fully approved.'
practical_context: 'It runs once the intake is registered and the plan can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a batch whose sampling is unstated and logs the defect before any test runs.'
