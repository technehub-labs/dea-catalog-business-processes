plain_language_name: 'File the Inspection Results Audit Record'
plain_language_description: 'At the close the records custodian preserves the inspection trail at its required retention tier and sets the retrieval handles for it. What was tested, what was measured, and per which batch, stays readable whenever a quality claim is examined.'
business_purpose: 'It exists so the measurements behind every quality judgement can be evidenced whenever a claim is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the inspection trail at its retention tier and sets the retrieval handles a quality review would consult.'
