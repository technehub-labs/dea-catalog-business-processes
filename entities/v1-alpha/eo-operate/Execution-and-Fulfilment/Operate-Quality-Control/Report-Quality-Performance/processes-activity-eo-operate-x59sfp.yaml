plain_language_name: 'Report Quality Performance'
plain_language_description: 'This activity rolls the batch-level quality records up into the bigger picture — how much passes first time, how many defects — for the process group that owns the operation. The per-batch records arrive as the raw material, performance is aggregated and drawn into reporting, and the quality report is confirmed onward. Isolated batch verdicts become a trend the enterprise can manage.'
business_purpose: 'It exists so the enterprise sees its quality as a trend across batches, not just as one verdict at a time.'
practical_context: 'It runs on the reporting cadence once batch records have accumulated, and it completes when the aggregated quality performance report is confirmed and delivered to the owning process group.'
worked_example:
  agent_type: human
  narrative: 'A quality custodian aggregates the per-batch records into first-pass yield and defect-rate reporting, and confirms the quality report for the process group that owns the operation.'
