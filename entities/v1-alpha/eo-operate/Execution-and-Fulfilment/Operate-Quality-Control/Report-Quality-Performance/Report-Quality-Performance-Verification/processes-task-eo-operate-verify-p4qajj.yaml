plain_language_name: 'Check the Records Before Rolling Them Up'
plain_language_description: 'Before anything is aggregated, the verification custodian checks the batch records against what reporting requires - that they cover the batches in the period completely. Gaps are logged for rejection or repair before the roll-up begins.'
business_purpose: 'It exists so the picture is never drawn over batch records with holes in them.'
practical_context: 'It runs once the intake is registered and the records can be compared with the activity''s requirements, and it finishes with them verified or their gaps logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the records missing one shift''s batches and logs the gap before the roll-up begins.'
