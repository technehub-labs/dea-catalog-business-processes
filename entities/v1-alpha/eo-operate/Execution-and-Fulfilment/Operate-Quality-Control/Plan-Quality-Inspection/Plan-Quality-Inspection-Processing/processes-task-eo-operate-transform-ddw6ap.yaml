plain_language_name: 'Set What, How, and When Each Batch Is Checked'
plain_language_description: 'With the inputs verified, the processing custodian does the planning itself: the sampling scheme is selected, the applicable specification and its tolerances are resolved, and the inspection is placed against the production schedule, all set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because inspection improvised at the bench proves nothing - the plan is what makes every measurement mean the same thing.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be planned from, and it ends with the inspection plan produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management sets each batch''s sampling, tolerances, and inspection slot before any measurement exists, keeping the working papers.'
