plain_language_name: 'Plan Quality Inspection'
plain_language_description: 'This activity decides in advance how each batch will be checked — which samples to draw, which specification and tolerances apply, and when the checking happens. The specifications, sampling standards, and production schedule arrive as the inputs, the inspection plan is drawn up per batch, and the plan is confirmed onward for execution. No batch is measured before anyone has decided how to measure it.'
business_purpose: 'It exists so every batch''s inspection is designed before it runs, on the right specification and sampling scheme.'
practical_context: 'It opens the quality operation for each batch, when the specifications and the production schedule are to hand, and it completes once the inspection plan is confirmed for execution.'
worked_example:
  agent_type: human
  narrative: 'A quality planner selects the sampling scheme and resolves the applicable specification and tolerances for an incoming batch, schedules the checking, and confirms the plan for execution.'
