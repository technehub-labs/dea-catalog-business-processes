plain_language_name: 'Report Service Delivery Performance'
plain_language_description: 'This activity rolls the operating window''s actuals up into a performance picture of the service, for the process group that owns it. Window actuals arrive as the raw material, performance is aggregated into reporting, and the service report is confirmed onward. Day-to-day firefighting becomes a trend the enterprise can steer by.'
business_purpose: 'It exists so service performance is seen as an aggregate trend by its owners, not just as one window at a time.'
practical_context: 'It runs on the reporting cadence once operating-window actuals have accumulated, and it completes when the service performance report is confirmed and delivered to the owning process group.'
worked_example:
  agent_type: human
  narrative: 'A service custodian aggregates the window actuals into service performance reporting, and confirms the report for the process group that owns the operation.'
