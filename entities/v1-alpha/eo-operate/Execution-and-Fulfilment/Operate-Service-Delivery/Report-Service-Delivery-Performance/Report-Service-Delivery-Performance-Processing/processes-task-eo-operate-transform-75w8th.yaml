plain_language_name: 'Roll the Window''s Actuals into the Delivery Picture'
plain_language_description: 'With the actuals verified, the processing custodian does the aggregation itself: the windows'' actuals are rolled up into the delivery performance picture, set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because window after window of watching still says nothing until it is read together - the roll-up is where service becomes visible.'
practical_context: 'It starts once checking is complete and the verified actuals are ready to be rolled up, and it ends with the delivery report produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management rolls the windows'' actuals into the delivery performance picture, keeping the working papers.'
