plain_language_name: 'Run Service Delivery'
plain_language_description: 'This is the steady-state running of everything the built operation depends on, day in and day out. Production lines are run to plan while logistics and inventory keep pace, technology platforms stay available, facilities and assets are maintained, and the procurement cycle keeps supplies coming. It is what turns a built capability into a service actually being delivered.'
business_purpose: 'It exists to keep the whole execution engine of production, logistics, inventory, platforms, facilities and procurement working together in steady state so customers keep being served.'
practical_context: 'The everyday backdrop once the built operation is live, with each planning period setting the production plan the lines run to. Product management oversees the whole under the Enablement & Operations Process Owner.'
worked_example:
  agent_type: human
  narrative: 'At the start of the week a product manager checks the production plan against stock and platform availability, sorts a supply delay through the procurement cycle, and keeps the lines, warehouses and platforms running to plan.'
