plain_language_name: 'Turn Delivery Demand into the Routed Transport Plan'
plain_language_description: 'With the inputs verified, the processing custodian does the planning itself: the demand is routed and scheduled across the network''s capacity into the shipment plan, set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because demand and capacity only meet when somebody routes them together - planning is where the network earns its keep.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be planned from, and it ends with the shipment plan produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management routes and schedules the demand across the network''s capacity, keeping the working papers.'
