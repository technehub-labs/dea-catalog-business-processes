plain_language_name: 'Resolve Logistics Exceptions'
plain_language_description: 'This activity steps in when a shipment goes astray — late, damaged, lost, or misrouted — and works to put the delivery promise back on track. The flagged deviations arrive as the triggers, each exception is worked to a recovery, and the handling is recorded. Plans meet reality here, and reality is brought back into line.'
business_purpose: 'It exists so shipment deviations are recovered and the delivery commitment restored rather than quietly missed.'
practical_context: 'It runs whenever tracking or execution flags a deviation, from the flag to the restored delivery, and it completes once the exception handling is recorded and retained.'
worked_example:
  agent_type: human
  narrative: 'A logistics custodian takes a flagged misrouted shipment, works a recovery that still honours the delivery commitment where possible, and records the handling for the file.'
