plain_language_name: 'Execute Shipments'
plain_language_description: 'This activity puts the plan on the road: goods are picked up, moved through the network, and delivered as planned. The planned shipments arrive as the worklist, vehicles and carriers run the movements, and each executed shipment is confirmed for the record. The delivery model''s promises are kept here, in physical motion.'
business_purpose: 'It exists so the network physically moves goods as its plan says, delivering what was promised to whom it was promised.'
practical_context: 'It runs against the shipment plan as each movement falls due, and it closes when each executed shipment is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A logistics crew runs each planned shipment — pickup, line-haul, delivery — with the network''s vehicles and carriers, and confirms each executed movement for the record.'
