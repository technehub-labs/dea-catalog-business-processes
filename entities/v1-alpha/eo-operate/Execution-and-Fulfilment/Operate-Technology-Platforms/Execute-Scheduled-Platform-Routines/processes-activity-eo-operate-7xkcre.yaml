plain_language_name: 'Execute Scheduled Platform Routines'
plain_language_description: 'This activity runs the upkeep routines the operations calendar calls for — backups, key and certificate rotations, renewals, and general housekeeping — so the platforms stay ready to serve. The calendar arrives as the schedule, each routine is performed when due and checked off, and the completed routines are confirmed for the record. Platform upkeep happens by timetable, not by crisis.'
business_purpose: 'It exists so the platforms stay servable through routine care performed on schedule, not through emergency attention.'
practical_context: 'It runs against the operations calendar as each routine falls due across the service windows, and it completes when the performed routines are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A platform custodian works the calendar''s due routines — a backup here, a certificate renewal there — checks each off as performed, and confirms the completed set for the record.'
