plain_language_name: 'Check the Telemetry Before Balancing the Load'
plain_language_description: 'Before anything is tuned, the verification custodian checks the telemetry against what balancing requires - that it covers the platforms in scope and the reading is current. Defects are logged for rejection or repair before the tuning begins.'
business_purpose: 'It exists so the platforms are never tuned from telemetry that stopped last week.'
practical_context: 'It runs once the intake is registered and the telemetry can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the telemetry stale for one platform and logs the defect before any tuning begins.'
