plain_language_name: 'Check the Signals Before Watching the Platforms'
plain_language_description: 'Before anything is watched, the verification custodian checks the health signals against what monitoring requires - that they cover the platforms in scope and are flowing for the window ahead. Defects are logged for rejection or repair before the watching begins.'
business_purpose: 'It exists so no platform goes unwatched because its signals went quietly dark.'
practical_context: 'It runs once the intake is registered and the signals can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds one platform''s signals stopped flowing and logs the defect before the watching begins.'
