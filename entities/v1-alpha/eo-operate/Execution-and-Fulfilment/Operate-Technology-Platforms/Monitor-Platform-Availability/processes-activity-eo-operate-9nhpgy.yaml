plain_language_name: 'Monitor Platform Availability'
plain_language_description: 'This activity watches the platforms'' health through each service window, comparing the availability they deliver with what was promised. Health signals arrive continuously, availability is tracked against the agreed targets, and any shortfall is flagged onward. The platforms'' promises are audited in real time.'
business_purpose: 'It exists so the enterprise knows, window by window, whether its platforms are delivering the availability they promised.'
practical_context: 'It runs continuously across each service window against the agreed availability targets, and each tracked window closes when its outcome is confirmed and flagged onward where needed.'
worked_example:
  agent_type: human
  narrative: 'A platform custodian watches the health signals through the service window, compares delivered availability with the agreed target, and flags the shortfall when the platform dips below it.'
