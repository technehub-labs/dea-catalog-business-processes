plain_language_name: 'Schedule Facility Work Orders'
plain_language_description: 'This activity turns the building''s needs and the preventive calendar into a dated, resourced book of work orders. The facility demand, the preventive plan, and crew availability arrive together, work is scheduled and resourced against all three, and the work-order book is confirmed onward for execution. The buildings'' upkeep acquires an order of battle.'
business_purpose: 'It exists so facility work happens to a resourced schedule instead of piling up as unmanaged demand.'
practical_context: 'It opens the facility work flow, when facility demand and the preventive calendar are presented alongside crew availability, and it completes once the scheduled work-order book is confirmed for execution.'
worked_example:
  agent_type: human
  narrative: 'A product management planner slots the facility''s reported needs and preventive tasks into a dated work-order book, matching each job to crew availability, and confirms the schedule for execution.'
