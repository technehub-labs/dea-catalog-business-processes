plain_language_name: 'Turn Demand and the Preventive Calendar into a Resourced Book'
plain_language_description: 'With the inputs verified, the processing custodian does the scheduling itself: facility demand, the preventive calendar, and crew availability are converted into the scheduled, resourced book of orders, set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because unbooked demand and unstaffed prevention compete for the same crews - the schedule is where they are reconciled.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be scheduled from, and it ends with the scheduled book produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management books the demand and prevention around the crews that can actually do them, keeping the working papers.'
