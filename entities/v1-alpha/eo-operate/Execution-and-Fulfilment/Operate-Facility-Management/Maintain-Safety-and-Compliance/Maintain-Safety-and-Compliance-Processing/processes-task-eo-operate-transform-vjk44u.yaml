plain_language_name: 'Keep the Facilities Inside Their Safety Duties'
plain_language_description: 'With the requirements verified, the processing custodian does the keeping itself: each facility''s daily state is held against what its safety and compliance duties demand, and the maintained position is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because buildings drift out of compliance one unchecked day at a time - the watch is what holds the line.'
practical_context: 'It starts once checking is complete and the verified requirements are ready to be held to, and it ends with the maintained position produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management holds each facility''s daily state against its safety duties and records the position, keeping the working papers.'
