plain_language_name: 'Check the Calendar Before Walking the Rounds'
plain_language_description: 'Before any walk is made, the verification custodian checks the facilities and calendar against what inspection requires - that every facility carries its next due walk and the calendar covers the whole estate. Defects are logged for rejection or repair before any round is walked.'
business_purpose: 'It exists so no facility goes unwalked because the calendar missed it.'
practical_context: 'It runs once the intake is registered and the calendar can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a facility missing from the calendar and logs the defect before the rounds begin.'
