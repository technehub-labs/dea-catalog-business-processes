plain_language_name: 'Confirm the Production Record'
plain_language_description: 'When the record stands written, the confirmation custodian reconciles it against the outcome the activity set out to reach and issues the confirmation. The planning and quality sides learn every cycle''s story is authoritative and usable.'
business_purpose: 'It exists so planning and quality proceed only over a record confirmed as authoritative.'
practical_context: 'It begins once preparation is complete and the production record awaits its consumers, and it closes with the confirmation issued, consumers informed, and the result reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the production record against the activity''s intended outcome and issues the confirmation the planning side needs.'
