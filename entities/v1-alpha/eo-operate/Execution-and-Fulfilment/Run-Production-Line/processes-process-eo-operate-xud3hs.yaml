plain_language_name: 'Run Production Line'
plain_language_description: 'This process is the line actually making things. Each production cycle, the stood-up line is run to plan, turning out the agreed output at the agreed rate, and what is produced and its quality are recorded cycle by cycle. That record keeps performance against the plan visible.'
business_purpose: 'It exists to turn a commissioned line into planned output, cycle after cycle, with output and quality recorded so shortfalls against plan are visible.'
practical_context: 'Met on every production cycle the line works through, shift after shift once the line is stood up. Product management oversees output against plan under the Enablement & Operations Process Owner.'
worked_example:
  agent_type: human
  narrative: 'A product manager reviews the shift''s output against the plan, notes the quality record for a cycle that came in light, and asks the line team to recover the shortfall over the next cycle.'
