plain_language_name: 'Execute Production Run'
plain_language_description: 'This activity sets the line actually working through each cycle on its schedule, turning materials in at one end into product at the other. The scheduled cycle arrives as the order of the day, the line is run with its crew and materials, and the executed run is confirmed onward for recording. Everything the enterprise built the line for happens here.'
business_purpose: 'It exists so the line produces what its schedule says, cycle by cycle, converting materials into output.'
practical_context: 'It runs through each scheduled production cycle, and it completes when the executed run is confirmed and handed to the output recording.'
worked_example:
  agent_type: human
  narrative: 'A line crew runs the scheduled cycle with materials loaded and controls set, converting inputs into finished output, and confirms the executed run for the production record.'
