plain_language_name: 'Confirm the Completed Production Runs'
plain_language_description: 'When the cycles stand run, the confirmation custodian reconciles the completed runs against the outcome the activity set out to reach and issues the confirmation. The recording side learns which cycles finished and the output can be written up.'
business_purpose: 'It exists so output is recorded only over runs confirmed as completed.'
practical_context: 'It begins once preparation is complete and the completed runs await their consumers, and it closes with the confirmation issued, consumers informed, and the result reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the completed runs against the activity''s intended outcome and issues the confirmation the recording side needs.'
