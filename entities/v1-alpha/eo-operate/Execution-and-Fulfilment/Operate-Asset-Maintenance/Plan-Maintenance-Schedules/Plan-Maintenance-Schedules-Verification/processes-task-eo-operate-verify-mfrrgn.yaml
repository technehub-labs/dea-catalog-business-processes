plain_language_name: 'Check the Inputs Before Drawing the Schedule'
plain_language_description: 'Before anything is planned, the verification custodian checks the register and data against what planning requires - that every asset is on the register and its condition and usage are current. Defects are logged for rejection or repair before the schedule is drawn.'
business_purpose: 'It exists so no asset''s care is planned from stale condition data.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds an asset whose condition data is a season old and logs the defect before the schedule is drawn.'
