id: dea:group-regulated-workforce-wind-down
type: ProcessGroup
version: 1.0.0

name: Regulated Workforce Wind-Down

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of retiring an enterprise workforce under
  regulated mass-layoff or regulated wind-down obligations in the
  AgencyAndOrganization x Retire context where statutory triggers
  (WARN, EU Directive 98/59/EC, ILO C158, jurisdictional mass-layoff
  statutes) require distinct group-level work (statutory notice,
  worker-representative consultation, fair selection, severance,
  benefits continuation, transition supports).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-ao-retire

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - "Statutory advance notice to affected employees (WARN 60-day rule)"
    - "Information and consultation with workers' representatives (EU Directive 98/59/EC)"
    - "Fair-selection criteria (anti-discrimination, statutory exclusions)"
    - "Severance, benefits continuation, and recorded statutory liability"
    - "Transition supports: state dislocated-worker referral, training, health-care continuation, outplacement"
  excludes:
    - "Steady-state offboarding of individual agents (Operate coordinate)"
    - "Non-regulated cohort decommission (Operate coordinate or Activity under agent operations)"
    - "Asset retirement and decommissioning (EnablementAndOperations x Retire; CR-BP-66)"
    - "Relationship close-out and regulated offboarding (PartyAndRelationship x Retire; CR-BP-67)"

# Intended enterprise outcomes.
outcomes:
  - "The regulated wind-down is executed under statutory notice with worker-representative consultation obligations satisfied and statutory liabilities recorded and funded; transition supports are routed to the affected population."

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-regulated-workforce-wind-down
    target_id: dea:process-conduct-regulated-workforce-wind-down
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-72
      escape-clause discovery outcome (ADMIT-CANONICAL recommendation)
      landed by CR-BP-73. The discovery evidence (U.S. WARN Act
      29 U.S.C. 2101 et seq.; 20 CFR Part 639; EU Council Directive
      98/59/EC; ILO Conventions 158 and 135; OECD Employment Outlook;
      UK TULRCA s.188; German BetrVG section 17) activates the
      register v2 cell's verbatim escape condition.
    provenance:
      type: architecture-review
      reference: CR-BP-73
      asserted_by: dea-team
      asserted_at: '2026-09-15'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: cross-cutting

