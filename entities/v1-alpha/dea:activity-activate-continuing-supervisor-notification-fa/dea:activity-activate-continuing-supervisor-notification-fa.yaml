name: Activate Continuing-Supervisor Notification (Billing)
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Activate Billing Capability that
  activates the continuing-supervisor notification under the regulator's continuing
  oversight (insurance department continuing notification; PRA / ECB continuing notification;
  PUC continuing-supervision notification; PSD2 / Federal Reserve / ECB continuing
  notification).
belongs_to_business_process: dea:process-activate-billing-capability
cohesion_rationale: Constituent work shares a single continuing-supervisor-notification
  concern, one input class (the billing-capability authorization and the supervisor
  relationship), and one output (the issued continuing-supervisor notification on
  the regulated billing record). Cohesion score 9/9 assessed at deposition (CR-BP-32
  section 6).
