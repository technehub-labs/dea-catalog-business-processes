definition: The bounded unit of work within `processes:activity-ge-improve-9te97d` (Measure Findings Against Standards) that accept custody of the improvement-case input pack (finding register, effectiveness-review scope, policy-gap inventory) and persist a registered intake manifest binding the inputs to the improvement case file.
