trigger: Custody of the Improve-stage input pack for Measure Findings Against Standards ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Measure Findings Against Standards case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
