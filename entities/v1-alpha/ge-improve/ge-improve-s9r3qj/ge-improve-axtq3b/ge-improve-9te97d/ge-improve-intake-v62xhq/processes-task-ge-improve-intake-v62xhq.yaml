  - Receipt and registration of the Measure Findings Against Standards input pack against the Improve-stage intake contract.
  - Binding of the input pack to the Measure Findings Against Standards case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
