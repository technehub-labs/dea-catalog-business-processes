version: 1.0.0
name: Governance Review and Learning
definition: 'The bounded Process Group that organizes the Business Process responsibilities of improving governance effectiveness in the GovernanceAndExistence x Improve context. This group captures the work of reviewing governance effectiveness, scoring audit findings, and feeding lessons back into Conceive/Design/Build/Operate cycles.

  '
process_context: processes:pc-ge-improve-c78ppp
scope:
  includes:
  - Governance effectiveness review
  - Audit finding scoring
  - Policy regime refinement
  - Lessons-learned propagation
  excludes:
  - Governance operation (Operate stage)
  - Strategy framing (Conceive stage)
  - Governance system design (Design stage)
outcomes:
- Governance effectiveness is measured.
- Audit findings drive improvement.
- Lessons learned feed back into Conceive/Design cycles.
