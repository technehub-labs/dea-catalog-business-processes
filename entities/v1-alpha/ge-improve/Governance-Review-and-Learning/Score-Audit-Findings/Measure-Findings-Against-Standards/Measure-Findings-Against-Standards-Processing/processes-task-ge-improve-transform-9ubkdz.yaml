plain_language_name: 'Measure the Distance Between Finding and Standard'
plain_language_description: 'With the certificate in hand, the processing custodian executes the improvement for the delta: each scored finding is set against the codified standards and the compliance delta is bounded, and the outcomes pack is produced for confirmation.'
business_purpose: 'It exists because a finding and a standard are two different things until somebody measures the space between - the delta is what makes the gap closable.'
practical_context: 'It opens once the verification certificate is in hand and the bounded improvement may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the audit function sets each scored finding against the codified standards and bounds the delta.'
