plain_language_name: 'Assess Finding Recurrence'
plain_language_description: 'This activity checks whether each finding is new trouble or the same old trouble returning. The scored findings are set beside the record of findings gone before, recurrence is assessed one by one, and the assessed set is confirmed onward for the standards measurement. Repeat findings earn their own special attention from this point.'
business_purpose: 'It exists so findings that keep coming back are recognised as repeats, and treated as such.'
practical_context: 'It follows the severity scoring, measured against the record of findings gone before, and it completes once the assessed recurrence is confirmed onward for the standards measurement.'
worked_example:
  agent_type: human
  narrative: 'An audit function analyst checks each scored finding against the historical record, marks the ones that are repeat visits, and confirms the assessed set onward.'
