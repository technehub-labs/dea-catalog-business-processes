plain_language_name: 'Read the Pack Against the Audit Method Before the Gaps'
plain_language_description: 'With the manifest registered, the verification custodian reads the whole pack against the method of internal audit and the contract that classifies findings, and issues the report naming whatever deviates and how it will be mended.'
business_purpose: 'It exists because gaps measured short of the audit method would misdirect the improving from day one - the reading is what keeps them honest.'
practical_context: 'It opens once the manifest is registered and the contract and quality checks may run against the pack, and it closes with the verification certificate issued, custody passed onward to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the audit function reads the pack against the method of internal audit, naming whatever deviates and how it will be mended.'
