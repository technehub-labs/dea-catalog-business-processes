definition: The bounded unit of work within `processes:activity-ge-improve-nfn3x5` (Formulate Effectiveness Recommendations) that accept custody of the improvement-case input pack (finding register, effectiveness-review scope, policy-gap inventory) and persist a registered intake manifest binding the inputs to the improvement case file.
