  - Receipt and registration of the Formulate Effectiveness Recommendations input pack against the Improve-stage intake contract.
  - Binding of the input pack to the Formulate Effectiveness Recommendations case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
