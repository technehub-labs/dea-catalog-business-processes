plain_language_name: 'Take Custody of the Recommendations Input Pack'
plain_language_description: 'The intake custodian takes charge of the improvement pack — the finding register, the effectiveness-review scope, and the policy-gap inventory — and writes the manifest that ties the pack into the case file for the improvement.'
business_purpose: 'It exists so the recommendations begin from a registered pack rather than from loose papers.'
practical_context: 'It opens when custody of the pack arrives and the intake contract applies, and it closes with the manifest registered and bound to the case file, custody passed onward to the verification custodian.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the audit function takes charge of the finding register, review scope, and gap inventory, and writes the binding manifest.'
