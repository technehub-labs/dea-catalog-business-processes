plain_language_name: 'Formulate Effectiveness Recommendations'
plain_language_description: 'This activity turns the measured performance and the captured lessons into concrete recommendations for the bodies. Both arrive as the basis, recommendations are formulated against them and each made actionable, and the formulated set is confirmed onward for delivery. Governance''s homework comes back with specific corrections, not vague encouragement.'
business_purpose: 'It exists so governance improvement arrives as specific, actionable recommendations rather than reflections.'
practical_context: 'It follows the lessons capture, working from the measured outcomes and captured lessons, and it completes once the formulated recommendations are confirmed onward for delivery.'
worked_example:
  agent_type: human
  narrative: 'A strategy function officer turns the measured performance and captured lessons into specific recommendations for each body, and confirms the formulated set onward.'
