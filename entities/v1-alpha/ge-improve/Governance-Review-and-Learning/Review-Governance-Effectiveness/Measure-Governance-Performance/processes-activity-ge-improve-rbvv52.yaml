plain_language_name: 'Measure Governance Performance'
plain_language_description: 'This activity checks how well the enterprise''s governance has actually been working, measured against the strategy it was committed under. The operating governance arrives with the committed strategy as the yardstick, performance is measured against it, and the measured outcomes are confirmed onward for the lessons work. Governance is graded here, against its own homework.'
business_purpose: 'It exists so governance effectiveness is known by measurement against strategy, not by the bodies'' own opinion of themselves.'
practical_context: 'It opens each effectiveness review once the bodies have been operating for their periodic cycle, and it completes when the measured outcomes are confirmed onward for the lessons capture.'
worked_example:
  agent_type: human
  narrative: 'An audit function analyst measures the operating bodies'' performance against the committed governance strategy, and confirms the measured outcomes onward for the lessons work.'
