definition: The bounded unit of work within `processes:activity-pr-design-5vsfm6` (Design Touchpoints) that verify the input pack against the experience-quality criteria and the touchpoint-taxonomy contract, and emit a verification report naming any quality-criteria deviations and their remediation.
