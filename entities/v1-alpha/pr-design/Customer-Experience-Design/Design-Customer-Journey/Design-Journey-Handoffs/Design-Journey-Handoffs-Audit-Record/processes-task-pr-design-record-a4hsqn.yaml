plain_language_name: 'Store the Handoff Design File'
plain_language_description: 'Once confirmed, the records custodian places the design file - manifest, verification report, journey artefact, completion confirmation, and remediation notes - into retention under the schedule for journey-design records, protected against tampering. Where storage limits apply, a destruction attestation is recorded.'
business_purpose: 'It exists so the handoff designs remain the reference when processes change on either side of a seam.'
practical_context: 'It opens when the completion confirmation is issued, and it closes with the file retained at its tier and any destruction attestation recorded.'
worked_example:
  agent_type: human
  narrative: 'A records custodian archives the handoff file so a process change can be checked against the designed transitions.'
