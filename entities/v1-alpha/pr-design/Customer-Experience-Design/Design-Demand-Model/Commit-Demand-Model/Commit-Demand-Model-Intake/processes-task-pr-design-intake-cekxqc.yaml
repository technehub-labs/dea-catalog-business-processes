plain_language_name: 'Open the Demand Model File for Commitment'
plain_language_description: 'Bringing the demand model together starts with intake: the segment thesis the design serves, the library of interaction patterns, and the criteria the experience must meet. The intake custodian binds the pack to the design file so the consolidation works from one accounted-for set.'
business_purpose: 'It exists because a committed model is only as sound as the completeness of what fed it.'
practical_context: 'It opens when the Design-stage pack is handed over for the activity, and it closes with the manifest registered and custody passed to the verification custodian.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the supply paths, capacity register, and lever catalogue into the model design file.'
