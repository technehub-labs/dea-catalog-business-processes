plain_language_name: 'Set Down the Principles the Experience Must Honour'
plain_language_description: 'With the certificate in hand, the processing custodian carries out the design: journey stages are mapped, the moments that decide the relationship are identified, touchpoints and their interaction patterns are designed, and the capacity assumptions are modelled. The principles that will govern every later choice are set down as a journey artefact ready for confirmation.'
business_purpose: 'It exists so every later design choice inherits the same governing principles rather than ad-hoc taste.'
practical_context: 'It opens when the verification certificate clears the pack, and it closes with the journey artefact produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function writes down the principles every touchpoint and journey choice must honour.'
