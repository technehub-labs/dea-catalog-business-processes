plain_language_name: 'Set Experience Quality Criteria'
plain_language_description: 'This activity fixes the checks the finished experience will have to pass. The specified patterns and designed touchpoints arrive as the thing to be measured, quality criteria are defined to be measurable and reviewed, and the criteria set is confirmed onward for the design''s commitment. The experience is promised, and now it is examinable.'
business_purpose: 'It exists so the built experience can be objectively tested against designed, measurable criteria.'
practical_context: 'It follows the touchpoints and patterns, when the experience''s shape is settled, and it completes once the quality criteria set is confirmed for the design''s commitment.'
worked_example:
  agent_type: human
  narrative: 'A customer relationship management designer fixes the measurable checks the built experience must pass, reviews them for objectivity, and confirms the criteria set onward.'
