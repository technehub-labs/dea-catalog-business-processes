id: processes:pc-pr-design-hrcdy4
domain: PartyAndRelationship
lifecycle_stage: Design
name: Customer Experience Design
definition: 'The bounded enterprise context for **designing** customer experience, journey, and demand models in the **customer and demand** domain. This context addresses the work of translating customer strategy into a designed experience, an articulated customer journey, and a model of how demand is shaped by the enterprise''s offerings.

  '
scope:
  includes:
  - Customer experience design
  - Customer journey design
  - Demand model design
  - CX pattern selection
  excludes:
  - Customer strategy framing (Conceive stage)
  - Channel implementation (Build stage)
  - Live customer operation (Operate stage)
outcomes:
- Customer experience is designed and testable.
- Customer journey is articulated end-to-end.
- Demand model grounds Build and Operate contexts.
