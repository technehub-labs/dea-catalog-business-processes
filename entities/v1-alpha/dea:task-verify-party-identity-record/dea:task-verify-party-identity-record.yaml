id: dea:task-verify-party-identity-record
type: Task
name: Verify Party Identity Audit Record
definition: The bounded unit of work within `dea:activity-verify-party-identity` (Verify Party Identity) that retain the onboarding case file (intake manifest, verification certificate, activated-party record, confirmation acknowledgement, and any adverse-decision rationale) under the party-records retention schedule with cryptographic integrity protection.
belongs_to_activity: dea:activity-verify-party-identity
trigger: Completion confirmation issued for Verify Party Identity; record gate may retain the closure case file under the records retention schedule with cryptographic integrity protection.
outcome: Closure case file retained for Verify Party Identity under the records retention schedule with cryptographic integrity protection; cryptographic destruction attestation recorded where storage-limitation horizons apply.
responsibility: records custodian
boundary:
  inclusions:
  - Retention of the Verify Party Identity closure case file under the records retention schedule with cryptographic integrity protection.
  - Issuance of cryptographic destruction attestation for Verify Party Identity records past the storage-limitation horizon.
  exclusions:
  - Re-execution of prior phases (no rollback semantics).
  - Re-classification of records already past the storage-limitation horizon (cryptographic destruction is irreversible).
evidence:
- source: FATF Recommendation 10 (Customer Due Diligence)
  claim: governing AML/CDD standard for party-activation verification; binds the identity, sanctions, and adverse-media verification step to a regulator-recognised control. Bounded-work evidence for the record-phase custodian of `dea:activity-verify-party-identity` (CR-BP-L4-02 enrichment).
  strength: E1
- source: FinCEN CDD Rule (31 CFR 1010.230)
  claim: US-specific CDD rule establishing minimum identity-verification procedures that the activate-phase verification step operationalises. Bounded-work evidence for the record-phase custodian of `dea:activity-verify-party-identity` (CR-BP-L4-02 enrichment).
  strength: E1
- source: dea:activity-verify-party-identity
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-02 cell-specific bounded-work prose for this PartyAndRelationship L4 Task.
  strength: E3
