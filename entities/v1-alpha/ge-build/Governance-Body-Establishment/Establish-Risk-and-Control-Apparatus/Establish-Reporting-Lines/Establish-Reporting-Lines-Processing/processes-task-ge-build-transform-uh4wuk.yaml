plain_language_name: 'Draw the Wires from the Apparatus to the Bodies'
plain_language_description: 'With the certificate in hand, the processing custodian executes the build for the lines: the routes by which risk and control findings reach the governance bodies are established per the integration design, joined by the rest of the build, and the build-ready inventory is produced for confirmation.'
business_purpose: 'It exists because apparatus that reports nowhere governs nothing - the lines are what wire the watching to the people who can act.'
practical_context: 'It opens once the verification certificate is in hand and the bounded build may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function establishes the routes by which findings reach the governance bodies.'
