plain_language_name: 'Establish Risk Registers'
plain_language_description: 'This activity stands up the registers where risks will be logged, taking their structure from the taxonomy and scales as designed. The approved risk framework design arrives as the blueprint, registers are established and populated in its shape, and the operating registers are confirmed onward for the tooling. Risk acquires its formal home.'
business_purpose: 'It exists so enterprise risks have their designed home — registers structured to the taxonomy and scales.'
practical_context: 'It opens the risk apparatus build once the risk framework design is approved for build, and it completes as the operating registers are confirmed onward for the tooling and reporting work.'
worked_example:
  agent_type: human
  narrative: 'An operations function officer stands up the risk registers in the shape the designed taxonomy and scales give them, and confirms the operating registers onward.'
