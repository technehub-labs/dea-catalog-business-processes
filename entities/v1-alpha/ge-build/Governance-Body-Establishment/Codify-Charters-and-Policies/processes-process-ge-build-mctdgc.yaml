plain_language_name: 'Codify Charters and Policies'
plain_language_description: 'As new boards and committees stand up, the rules they will run by need to be written down in one consistent set. The team drafts and organises the charters, policies, and standard documents each body needs, then publishes them where members can find them. By the end, every governance body has its own rulebook ready to hand.'
business_purpose: 'Written, well-organised rules give governance bodies a common reference, so decisions and duties rest on documents everyone can consult rather than on memory or habit.'
practical_context: 'Encountered whenever governance bodies are being established: the governing board and strategy function commission and shape the drafting so each body can start operating with its charter and policies in place.'
worked_example:
  agent_type: human
  narrative: 'While a new committee is being formed, a strategy function lead drafts its charter and standing policies, the governing board reviews the wording, and the finished documents are filed in a shared library the members can open at their first meeting.'
