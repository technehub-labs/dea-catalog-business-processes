plain_language_name: 'Codify Charters'
plain_language_description: 'This activity writes the founding documents of the boards and committees about to be stood up. The governance system design arrives as the mandate of record, each charter is codified from it and checked against what the design intended, and the codified charters are confirmed onward for publication. A body''s authority begins in the document this activity produces.'
business_purpose: 'It exists so every governance body is founded on a written charter matching its designed mandate.'
practical_context: 'It runs while governance bodies are being established and their documents must exist for them to operate, and it completes once the codified charters are confirmed onward for publication.'
worked_example:
  agent_type: human
  narrative: 'A governing board officer codifies each designed body''s mandate into its operative charter, checks the text against the governance system design, and confirms the charters for publication.'
