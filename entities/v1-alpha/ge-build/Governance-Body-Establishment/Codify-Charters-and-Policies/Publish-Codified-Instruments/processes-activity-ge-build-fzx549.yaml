plain_language_name: 'Publish Codified Instruments'
plain_language_description: 'This activity puts the finished documents where the bodies and the wider enterprise can actually reach them. The freshly codified instruments arrive as the stock to release, publication is executed and access verified, and the published instruments are confirmed onward for the bodies'' use. Governing by document requires the document to be findable.'
business_purpose: 'It exists so codified instruments are genuinely accessible to the bodies and people meant to operate under them.'
practical_context: 'It closes the codification once the instruments are codified, and it completes when the published, accessible instruments are confirmed onward to the governance bodies.'
worked_example:
  agent_type: human
  narrative: 'An operations function officer publishes the codified charters, policies, and standards to where the bodies can reach them, verifies access works, and confirms the publication.'
