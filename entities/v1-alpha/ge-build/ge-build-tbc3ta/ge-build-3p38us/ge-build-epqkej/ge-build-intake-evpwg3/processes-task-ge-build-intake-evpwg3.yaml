id: processes:task-ge-build-intake-evpwg3
type: Task
name: Verify Body Readiness Intake
definition: The bounded unit of work within `processes:activity-ge-build-epqkej` (Verify Body Readiness) that accept custody of the governance-apparatus input pack (charter drafts, policy drafts, body-constitution proposals, monitoring-tooling specifications) and persist a registered intake manifest binding the build package to the apparatus case file.
belongs_to_activity: processes:activity-ge-build-epqkej
trigger: Custody of the Build-stage input pack for Verify Body Readiness ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Verify Body Readiness case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Verify Body Readiness input pack against the Build-stage intake contract.
  - Binding of the input pack to the Verify Body Readiness case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
evidence:
- source: OECD Principles of Corporate Governance (G20/OECD 2023)
  claim: international governance benchmark binding the build-phase structural verification (charter completeness, body constitution) to a recognised framework. Bounded-work evidence for the intake-phase custodian of `processes:activity-ge-build-epqkej` (CR-BP-L4-03 enrichment).
  strength: E1
- source: King IV Report (IoDSA 2016)
  claim: outcomes-based governance report grounding the build-phase committee-charter completeness rules and operating-cycle design. Bounded-work evidence for the intake-phase custodian of `processes:activity-ge-build-epqkej` (CR-BP-L4-03 enrichment).
  strength: E2
- source: processes:activity-ge-build-epqkej
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-03 cell-specific bounded-work prose for this GovernanceAndExistence L4 Task.
