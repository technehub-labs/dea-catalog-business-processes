id: processes:group-ge-build-tbc3ta
type: ProcessGroup
version: 1.0.0
name: Governance Body Establishment
definition: 'The bounded Process Group that organizes the Business Process responsibilities of building governance bodies, charters, and policy artefacts in the GovernanceAndExistence x Build context. This group captures the work of standing up the operational artefacts that constitute governance: boards, committees, charters, codified policies, and standards.

  '
process_context: processes:pc-ge-build-52hjrc
scope:
  includes:
  - Board and committee establishment
  - Charter codification
  - Policy artefact construction
  - Standard and procedure documentation
  excludes:
  - Strategy framing (Conceive stage)
  - Governance system design (Design stage)
  - Governance operation (Operate stage)
outcomes:
- Governance bodies are established and operational.
- Charters are codified.
- Policy artefacts are operational.
