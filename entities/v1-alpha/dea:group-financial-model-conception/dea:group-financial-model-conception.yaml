  change_history:
    - cr: CR-BP-21e
      date: '2026-09-08'
      change: |
        Initial Process Group record; promoted from the CR-BP-19 register
        v2 (ratified against ECF v2.4.0) as part of the
        FinanceAndAccounting landing tranche. Composes the L2
        dea:process-frame-finance-strategy.
    - cr: CR-BP-21e.1
      date: '2026-09-08'
      change: |
        Composes edges added for the 4 non-Conceive-cell L2s
        already landed under CR-BP-21e (one per cell): Design
        (dea:process-design-financial-plan-structure), Operate
        (dea:process-operate-general-ledger), Improve
        (dea:process-audit-policy-compliance, dea:process-conduct-
        cost-optimization-review). The completion tranche 21e.1
        extends the 4 non-Conceive Process Groups and 5 FA
        Process Contexts; this change_history records the
        upstream group's composes-edge expansion.
    - cr: CR-BP-58
      date: '2026-09-14'
      change: |
        Removed the dangling composes edge to
        dea:process-frame-financial-policy-thesis. The target never
        existed: no canonical BP record, no register v2 entry
        (CR-BP-19), no CR-BP-21e landing-table row, no evidence
        document. The edge was born dangling at CR-BP-21e and
        survived because the PG gate's entity scan was vacuous
        (repaired under the same CR). PG identity and declared
        semantics (definition, scope, coordinate) are unchanged,
        so version remains 1.0.0 per SIV-004 (CR-BP-34d).

