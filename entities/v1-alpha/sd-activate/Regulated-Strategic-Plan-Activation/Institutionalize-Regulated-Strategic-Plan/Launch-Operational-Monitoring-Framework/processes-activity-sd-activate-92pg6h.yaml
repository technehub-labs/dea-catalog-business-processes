plain_language_name: 'Launch Operational Monitoring Framework'
plain_language_description: 'Activation is not complete until someone is actually watching the numbers. At intake the acknowledged plan and the mandated monitoring arrangements are registered, and verification confirms the measures, limits and early warnings match what the supervisor requires. The framework then goes live, confirmation tells the regulator-facing teams it is running, and the live framework is preserved on the regulated strategic-plan record.'
business_purpose: 'It stands up the day-to-day oversight machinery — measures, limits, early warnings — that keeps the activated plan observable to its supervisor.'
practical_context: 'It begins when the acknowledged plan and the monitoring requirements arrive at intake and ends when confirmation declares the framework live and its record preserved.'
worked_example:
  agent_type: human
  narrative: 'Risk function analysts register the acknowledged plan at intake, verify the early-warning indicators against the supervisor''s expectations, and switch on the reporting rhythm; the operations function feeds the monthly figures while the supervising authority receives confirmation that monitoring is live.'
