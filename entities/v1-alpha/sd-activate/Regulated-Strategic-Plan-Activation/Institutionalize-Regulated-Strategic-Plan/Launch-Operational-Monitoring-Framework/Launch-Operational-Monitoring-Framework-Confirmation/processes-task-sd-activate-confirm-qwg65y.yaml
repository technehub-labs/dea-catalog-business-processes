plain_language_name: 'Confirm the Live Framework to the Supervisor and the Business'
plain_language_description: 'The confirming opens once the framework is live. The confirmation custodian tells the downstream teams it is available, and closes the reconciliation against what the activity promised for the launch under continuing oversight.'
business_purpose: 'It exists so the supervisor and the business functions both hear one confirmed word that monitoring is operating, not promised.'
practical_context: 'It opens when the live framework is ready to hand on, and it closes with the confirmation issued and the launch''s promises checked off against what was delivered.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian in the strategy function confirms to the supervising authority and the operations and workforce functions that the monitoring framework is live, reconciles the delivery against what the launch promised, and issues the confirmation.'
