plain_language_name: 'Switch On the Indicators, Risk Appetite and Early Warnings'
plain_language_description: 'With the inputs verified, the launch proper begins. The processing custodian stands up the key indicators, the risk-appetite statement and the early-warning indicators, and opens the continuing-oversight relationship, producing the live framework in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because an acknowledged plan stays unmonitored, and unchecked, until its indicators and oversight relationship are actually live.'
practical_context: 'It opens when the verified framework material is ready to be worked, and it closes with the live framework produced in the agreed form and the workings retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the risk function switches on the key indicators and early-warning thresholds against the risk-appetite statement, opens the continuing-oversight relationship with the supervising authority, and keeps the setup workings for the audit trail.'
