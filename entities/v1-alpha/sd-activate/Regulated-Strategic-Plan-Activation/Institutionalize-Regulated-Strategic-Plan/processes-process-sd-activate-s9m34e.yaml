id: processes:process-sd-activate-s9m34e
name: Institutionalize Regulated Strategic Plan
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
trigger: A regulated entity's board-approved strategic plan must be filed with or activated under the supervision of a competent regulator before the plan takes effect (Basel ICAAP / SAA approval; BRRD recovery-plan activation under SRB; NHS trust 5-year strategy approval; PUC integrated resource plan filing; bank recovery and resolution plan activation under FDIC).
outcome: The regulated strategic plan is formally activated with the supervisor's acknowledgement on record, the filing receipt preserved, the operational monitoring framework live, and the plan's obligations binding on the regulated entity under the regulator's continuing supervision.
description: Institutionalize a regulated entity's strategic plan under the enterprise's regulated-entity approval authority within the dea:pc-sd-activate Cell Charter. The trigger is a board-approved strategic plan that must be filed with or activated under the supervision of a competent regulator; the outcome is the plan formally activated with the supervisor's acknowledgement on record, the filing receipt preserved, the operational monitoring framework live, and the plan's obligations binding on the regulated entity under the regulator's continuing supervision. Distinct from strategy build (Build coordinate) and from steady-state strategy execution (Operate coordinate).
process_specialization: []
process_identity:
  boundary_face: regulated-entity approval authority
  identity_kind: canonical
  is_process: true
  is_project: false
process_scope:
  includes:
  - Supervisor-acknowledged strategic-plan filing (Basel ICAAP / SAA approval by PRA / ECB; BRRD recovery-plan activation under SRB / national-resolution-authority supervision; NHS trust 5-year strategy approval; PUC integrated resource plan and strategic-plan filing; bank recovery and resolution plan activation under FDIC or SRB)
  - Supervisor's review completion and acknowledgement on record (Basel SREP review; NHS England / Department of Health strategy review; PUC rate-case strategic-plan review; SRB resolution-plan review)
  - Filing receipt preservation and regulated-records entry (Basel SREP filing receipt; NHS England strategy-approval letter; PUC strategic-plan filing order; SRB resolution-plan acknowledgment)
  - Operational monitoring framework launch (KPIs; risk-appetite statement; early-warning indicators; supervisor's continuing-oversight relationship)
  - Communications plan activation under the regulator's continuing supervision (disclosure controls; investor-relations briefing; regulated-entity announcement)
  - Regulated strategic-plan record entry preserved for the activated strategic plan
  excludes:
  - Strategic-plan conception, design, and build (StrategyAndDirection x Conceive / Design / Build)
  - Steady-state strategy execution and performance review (StrategyAndDirection x Operate / Improve)
  - Strategic-plan sunset under regulatory mandate (StrategyAndDirection x Retire; CR-BP-80 escape record documented DEFER without admission)
  - Non-regulated strategic-plan launch (single-business-unit rollout without supervisor's review)
