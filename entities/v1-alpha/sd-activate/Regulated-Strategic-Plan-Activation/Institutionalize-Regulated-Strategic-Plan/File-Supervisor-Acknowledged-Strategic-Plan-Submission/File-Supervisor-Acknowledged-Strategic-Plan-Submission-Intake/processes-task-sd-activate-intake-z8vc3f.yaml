plain_language_name: 'Take In the Board-Approved Plan and the Mandated Filing Format'
plain_language_description: 'The filing work opens as its material arrives: the board-approved strategic plan together with the regulator-mandated filing format. The intake custodian logs them against the filing file so the filing starts accounted for.'
business_purpose: 'It exists so the regulatory submission proceeds over logged approved material in the mandated format, not over an unapproved draft.'
practical_context: 'It opens when the approved plan and the filing format are presented for the submission, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the board-approved strategic plan and the regulator-mandated filing format into the filing file, so the submission work starts accounted for.'
