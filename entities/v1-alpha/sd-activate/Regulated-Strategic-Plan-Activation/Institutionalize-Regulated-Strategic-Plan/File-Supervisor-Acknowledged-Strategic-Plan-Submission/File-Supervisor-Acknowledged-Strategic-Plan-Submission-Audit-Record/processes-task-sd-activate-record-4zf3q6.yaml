plain_language_name: 'File the Lodgement Receipt and Submission Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so the receipt proving what was filed, with whom, and when, is retrievable for the life of the plan''s supervision.'
business_purpose: 'It exists because the filing receipt is the plan''s licence to proceed, and losing its evidence undermines every later step.'
practical_context: 'It opens when the confirmation is in place, and it closes with the lodgement evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the lodgement receipt and submission evidence at its required retention tier and sets the retrieval handles, so the proof of timely filing survives every later reorganisation.'
