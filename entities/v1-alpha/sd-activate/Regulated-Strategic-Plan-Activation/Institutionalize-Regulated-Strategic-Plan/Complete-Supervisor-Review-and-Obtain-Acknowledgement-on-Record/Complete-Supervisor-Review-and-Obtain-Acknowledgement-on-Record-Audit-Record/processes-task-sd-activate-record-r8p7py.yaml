plain_language_name: 'File the Supervisor''s Acknowledgement Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so the proof that the acknowledgement was obtained before the plan took effect is always retrievable.'
business_purpose: 'It exists because the sequence of acknowledgement before effect is exactly what a supervisory inspection will test the record for.'
practical_context: 'It opens when the confirmation is in place, and it closes with the acknowledgement evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the acknowledgement evidence at its required retention tier and sets the retrieval handles, so an inspector can verify the acknowledgement preceded the plan taking effect.'
