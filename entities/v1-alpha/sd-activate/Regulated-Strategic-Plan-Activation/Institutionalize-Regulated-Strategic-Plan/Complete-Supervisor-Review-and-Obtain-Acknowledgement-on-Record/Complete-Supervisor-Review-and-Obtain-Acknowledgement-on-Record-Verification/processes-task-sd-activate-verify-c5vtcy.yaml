plain_language_name: 'Test the Submission Against the Supervisor''s Review Criteria'
plain_language_description: 'Before the supervisor''s verdict is pursued, the arriving submission material is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because asking for an acknowledgement over a deficient submission wastes a supervisory cycle and delays the plan.'
practical_context: 'It opens once the intake is registered and the submission material is ready to be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the filed submission against the review criteria, and writes up an incomplete risk-appetite section as a shortfall to be put right before the acknowledgement is sought.'
