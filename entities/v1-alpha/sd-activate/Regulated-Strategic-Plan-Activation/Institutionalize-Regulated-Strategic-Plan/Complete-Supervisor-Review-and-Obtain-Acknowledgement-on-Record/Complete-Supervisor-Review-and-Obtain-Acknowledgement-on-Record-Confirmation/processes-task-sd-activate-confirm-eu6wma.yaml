plain_language_name: 'Announce the Acknowledgement to the Teams Waiting on the Plan'
plain_language_description: 'The confirming opens once the acknowledgement is on record. The confirmation custodian tells the downstream teams it is available, and closes the reconciliation against what the activity promised for the review.'
business_purpose: 'It exists so the activation and communications work starts only once the acknowledgement is confirmed, never on assumption.'
practical_context: 'It opens when the acknowledgement is secured and ready to hand on, and it closes with the confirmation issued and the review''s promises checked off against what was delivered.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian in the strategy function tells the activation and communications teams that the supervising authority''s acknowledgement is on record, reconciles the outcome against what the review promised, and issues the confirmation.'
