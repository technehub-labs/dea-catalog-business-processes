plain_language_name: 'Complete Supervisor Review and Obtain Acknowledgement on Record'
plain_language_description: 'The filed submission now sits with the supervising authority, and this work sees the review through to a formal answer. The team hands the reviewers what they need, tracks their questions against the review criteria, and records how each point is resolved. When the supervisor signs the acknowledgement, it is preserved on the regulated strategic-plan record so the plan''s activation can proceed.'
business_purpose: 'It secures the supervisor''s formal yes, the gate that turns a filed plan into one the entity may act on under supervision.'
practical_context: 'It opens when the filed submission and the review criteria are presented for intake and closes when the signed acknowledgement is issued and stored.'
worked_example:
  agent_type: human
  narrative: 'A supervising authority reviewer works through the lodged plan against the published review criteria while the strategy function supply evidence on request; when the regulator is satisfied, the confirmation custodian issues the acknowledgement and the records custodian preserves it on the regulated strategic-plan record.'
