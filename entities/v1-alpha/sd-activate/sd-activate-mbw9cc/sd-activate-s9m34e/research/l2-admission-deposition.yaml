# This admission-deposition records the L2 evidence trail for the
# canonical admission of `dea:process-institutionalize-regulated-
# strategic-plan` (Institutionalize Regulated Strategic Plan) at the
# StrategyAndDirection x Activate coordinate. The admission follows
# the CR-BP-62 escape-clause method and references the CR-BP-80
# escape-clause discovery record at
# `discovery/v1-alpha/strategy-and-direction-activate-escape.yaml`.

admission_decision:
  disposition: ADMIT-CANONICAL
  escape_clause: true
  evidence_base:
    - "Basel Committee BCBS 425 / BCBS 425a (ICAAP and SREP): supervisor-acknowledged strategic-plan approval and activation in regulated banking"
    - "Bank Recovery and Resolution Directive (BRRD, 2014/59/EU) Article 5: recovery-plan activation under SRB / national-resolution-authority supervision"
    - "UK NHS England / Department of Health and Social Care: trust 5-year strategy approval process"
    - "US state Public Utility Commissions (PUC): integrated resource plan and strategic-plan filings required before utilities may activate capital and operational plans"
    - "TOGAF ADM Phase G (Implementation Governance): regulated-entity architecture-contract approval"
    - "Universal sector practice across banking, healthcare, utilities, and resolution authorities"
  canonicality_score: 9
  canonicality_score_evidence_basis: |
    Score is computed against the CR-BP-62 BP-LIFE-001..015 battery:
    - BP-LIFE-001 (Process Necessity Test): PASS. Regulated
      strategic-plan activation is universally performed across
      regulated sectors.
    - BP-LIFE-002 (Boundary Clarity): PASS. Strong boundary against
      Build (strategic-plan construction), Operate (steady-state
      strategy execution), and Retire (strategic-plan sunset under
      regulatory mandate -- CR-BP-80 escape record documented DEFER
      without admission).
    - BP-LIFE-003 (Regulatory Anchor): PASS. Multi-source authoritative
      regulatory evidence (Basel ICAAP / SAA, BRRD Article 5, NHS
      trust 5-year strategy, PUC integrated resource plan and
      strategic-plan filing).
    - BP-LIFE-004..015: all PASS with regulatory-sector breadth and
      universal practice.
  bp_identity:
    id: processes:process-sd-activate-s9m34e
    name: Institutionalize Regulated Strategic Plan
    verb: Institutionalize
    object: Regulated Strategic Plan
    scope: enterprise
  boundary_clarity: |
    Begins at board approval of the regulated strategic plan; ends at
    the supervisor's acknowledgement on record and the filing receipt
    being preserved in the entity's regulated-records system.
    Strategic-plan conception, design, and build are upstream
    (Conceive/Design/Build). Steady-state strategy execution,
    performance review, and any subsequent plan renewal are
    downstream (Operate/Improve/Retire).
  discovery_source: discovery/v1-alpha/strategy-and-direction-activate-escape.yaml
  discovery_recommended_at: '2026-09-16'
  admission_tranche: CR-BP-86
  admission_tranche_landed_at: '2026-09-16'

