plain_language_name: 'Analyze Evolution Drivers'
plain_language_description: 'Product management studies what outside forces are pushing the offerings to change - market feedback, moves by competitors, and shifts in technology - and states what each means for evolution. Incoming intelligence is registered at intake, checked for credibility, analysed into a driver picture, confirmed with those who will design the response, and archived.'
business_purpose: 'It gives the evolution effort a reasoned account of why change is needed, so enhancements answer real pressures rather than hunches.'
practical_context: 'It opens the evolution sequence: work begins when market feedback and related intelligence arrive for intake and ends when the confirmed driver analysis and its audit record are filed.'
worked_example:
  agent_type: human
  narrative: 'Following a slump in one product line''s reception, product management logs the market feedback at intake, tests the supporting intelligence at verification, works out that a competitor''s new release and a technology shift are the real drivers, and confirms the analysis to the enhancement designers.'
