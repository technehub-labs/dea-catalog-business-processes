plain_language_name: 'Measure Evolution Outcomes'
plain_language_description: 'After enhancements have been in place for a while, product management checks what they actually achieved, comparing results with the driver baseline recorded when the work was approved. Measurement material is registered at intake, verified against that baseline, assembled into an outcome measurement, confirmed, and archived for the next review.'
business_purpose: 'It closes the loop on evolution work, telling product management whether each committed enhancement delivered against the pressure that prompted it.'
practical_context: 'It runs once committed enhancements have had time to take effect: intake opens on the measurement material''s arrival and closure comes with the confirmed outcome measurement on file.'
worked_example:
  agent_type: human
  narrative: 'Two quarters after an enhancement ships, a product management analyst pulls the result figures, registers them at intake, compares them with the baseline captured at approval, assembles the outcome measurement, and confirms it to the reviewers ahead of the next performance review.'
