plain_language_name: 'Open the Findings File'
plain_language_description: 'The findings work opens with the assembled performance evidence arriving to be read for what it says. The intake custodian logs it against the findings file so the forming starts accounted for.'
business_purpose: 'It exists because findings formed from an unlogged evidence set find only what the reader brought.'
practical_context: 'It opens when the activity''s input arrives and the owner is told it has landed, and it closes with the intake registered and custody passed to the verification custodian.'
