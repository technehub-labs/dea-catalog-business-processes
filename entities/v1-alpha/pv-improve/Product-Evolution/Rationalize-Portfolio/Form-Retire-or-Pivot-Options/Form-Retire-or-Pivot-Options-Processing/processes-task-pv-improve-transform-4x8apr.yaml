plain_language_name: 'Draw Up the Retire-or-Pivot Options for Each Failing Proposition'
plain_language_description: 'With the justification assessment checked, the option work proper begins. The processing custodian works each failing proposition into its candidate paths, producing the retire-or-pivot option set in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because a proposition that failed its justification needs concrete retirement and pivot paths on the table before any rationalization decision can be committed.'
practical_context: 'It opens when the checked justification material is ready to be worked, and it closes with the option set produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management takes the checked assessment for an underperforming proposition and drafts its two paths, retire with the offering withdrawn or pivot with a repositioned proposition, keeping the workings for the audit trail.'
