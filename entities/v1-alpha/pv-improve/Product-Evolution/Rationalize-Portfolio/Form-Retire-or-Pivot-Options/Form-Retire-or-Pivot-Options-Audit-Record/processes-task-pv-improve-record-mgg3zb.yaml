plain_language_name: 'Keep the Option Set on File'
plain_language_description: 'Once the confirmation is in, the records custodian preserves the audit record at its required retention tier and sets the retrieval handles for the evidence review. The options formed stay readable for the discipline''s duration.'
business_purpose: 'It exists so the choices that were on the table stay visible when the decision is second-guessed.'
practical_context: 'It opens when the confirmation is issued and retention may begin, and it closes with the audit record preserved and retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in product management files the option set at its retention tier and sets the retrieval handles.'
