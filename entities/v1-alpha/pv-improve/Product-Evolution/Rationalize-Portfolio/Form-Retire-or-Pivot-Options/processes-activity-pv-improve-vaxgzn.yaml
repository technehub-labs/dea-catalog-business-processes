plain_language_name: 'Form Retire-or-Pivot Options'
plain_language_description: 'For every proposition that failed its justification, product management works up the realistic paths - withdraw it from the market, or reshape it into something that can succeed. Each failing case arrives at intake, is checked against the assessment, is turned into a documented option set, confirmed for decision makers, and archived.'
business_purpose: 'It gives decision makers real, worked-through choices for weak propositions instead of a bare verdict, so rationalization decisions are deliberate rather than automatic.'
practical_context: 'It follows the justification assessment in the rationalization sequence, opening when failing cases are presented and closing when the confirmed option sets are filed.'
worked_example:
  agent_type: human
  narrative: 'After the assessments flag a declining service, a product management pair drafts its options at processing: one path retires it on a managed schedule, the other repositions it for a narrower segment; the confirmed option set goes to the deciding forum with the record preserved.'
