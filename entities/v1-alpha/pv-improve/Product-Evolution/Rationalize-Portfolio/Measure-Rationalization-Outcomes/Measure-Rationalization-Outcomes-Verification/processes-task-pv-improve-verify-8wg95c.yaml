plain_language_name: 'Check the Measurement Inputs Against the Baseline'
plain_language_description: 'Before any scoring is done, the arriving measurement material is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because an outcome measurement built on a defective baseline would misreport what the rationalization actually achieved.'
practical_context: 'It opens once intake has registered the material, and it closes with the inputs verified fit for scoring or their shortcomings logged for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in product management checks the pre-decision baseline figures for a decided rationalization wave, notices one closed proposition''s position is missing, and writes the shortfall down for the source team to put right.'
