plain_language_name: 'Measure Rationalization Outcomes'
plain_language_description: 'Once retire-or-pivot decisions have been carried out, product management looks at what the portfolio actually looks like now and compares it with the picture recorded before the decisions. Outcome material is registered at intake, verified against the pre-decision baseline, assembled into a measurement, confirmed, and archived to inform the next rationalization round.'
business_purpose: 'It tells the portfolio''s stewards whether the rationalization decisions actually improved matters, closing the loop and informing the next round of choices.'
practical_context: 'It runs at the end of a rationalization cycle, after decisions have taken effect; intake opens on outcome material arriving and closure comes when the confirmed measurement is archived.'
worked_example:
  agent_type: human
  narrative: 'A quarter after a retirement completes, a product management analyst registers the portfolio''s new state at intake, checks it against the pre-decision snapshot, works out that freed investment now supports the pivoted offering, and confirms the measurement for the stewards.'
