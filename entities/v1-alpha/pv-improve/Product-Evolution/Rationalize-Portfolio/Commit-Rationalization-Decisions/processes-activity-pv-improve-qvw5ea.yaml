plain_language_name: 'Commit Rationalization Decisions'
plain_language_description: 'This is where the portfolio''s fate for underperformers is settled: product management takes the assessed options and fixes the chosen retire-or-pivot calls as decisions of record. The option set is registered at intake, checked for completeness, assembled into the committed decision package, confirmed, and archived so the choices bind the next steps.'
business_purpose: 'It converts formed options into binding rationalization decisions, so every failing proposition has an agreed, recorded way forward.'
practical_context: 'It closes the decide half of rationalization: intake opens when the assessed options are presented and closure comes when the confirmed decisions and their audit trail are preserved.'
worked_example:
  agent_type: human
  narrative: 'Faced with three propositions that failed justification, a product management lead registers the options at intake, weighs each against the assessment, commits two pivots and one retirement, confirms the decisions to the transition planners, and has the trail archived.'
