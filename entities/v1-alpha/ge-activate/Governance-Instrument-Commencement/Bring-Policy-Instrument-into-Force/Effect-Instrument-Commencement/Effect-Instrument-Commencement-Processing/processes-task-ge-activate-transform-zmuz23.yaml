plain_language_name: 'Effect the Commencement the Statute Provides'
plain_language_description: 'With the certificate in hand, the processing custodian effects the commencement the statute provides for: the instrument is registered with the authority competent for it, the baseline is set in force, and the activated record is produced for confirmation.'
business_purpose: 'It exists because an instrument verified but never effected governs nothing - the effecting is where the instrument starts to bind.'
practical_context: 'It opens once the verification certificate is in hand and the bounded work may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the governance design authority effects the commencement by registering the instrument and producing the activated record.'
