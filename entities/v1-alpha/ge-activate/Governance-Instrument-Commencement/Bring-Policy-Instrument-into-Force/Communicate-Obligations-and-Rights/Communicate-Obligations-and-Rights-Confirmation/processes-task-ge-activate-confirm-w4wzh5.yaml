plain_language_name: 'Reconcile the Record and Tell the Bound Parties'
plain_language_description: 'When the activated record exists, the confirmation custodian sets it beside the instrument as constituted and the statute that governs it, reconciles the two, and issues the completion confirmation, which the governance custodian receives first and the parties now bound after, logging it into the case file.'
business_purpose: 'It exists because a commencement nobody has confirmed is a commencement nobody can rely on.'
practical_context: 'It opens once the activated record is produced and the reconciliation may run against the governing contract, and it closes with the completion confirmation issued and acknowledged, custody passed to the records custodian.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian sets the record beside the instrument as constituted and the statute above it, reconciles the two, and issues the confirmation to the custodian of governance and the bound parties.'
