plain_language_name: 'Bringing Governance Instruments into Force'
plain_language_description: 'This family moves adopted policies, mandates and charters from approved-but-dormant to in-force. Its processes verify that commencement conditions are met, promulgate the instruments so people know they apply, and confirm and record their effectiveness dates.'
business_purpose: 'So obligations, rights and duties only attach once commencement conditions are verified, promulgation has happened, and effectiveness is recorded.'
practical_context: 'Encountered when a board adopts a new policy or charter with a commencement date, between adoption in the Build stage and day-to-day enforcement in the Operate stage.'
worked_example:
  agent_type: human
  narrative: 'The board approves a new delegation-of-authority charter effective next quarter. The Governance & Existence Process Owner''s team verifies each commencement condition, promulgates the instrument across the enterprise, and records the effectiveness date — from which point the new authorities bind.'
