version: 1.0.0
name: Governance Instrument Commencement
definition: 'The bounded Process Group that organises the Business Process

  responsibilities of bringing adopted governance instruments into

  force in the GovernanceAndExistence x Activate context

  (commencement verification, promulgation, effectiveness

  confirmation).

  '
process_context: processes:pc-ge-activate-hxtfcv
scope:
  includes:
  - Commencement condition verification
  - Promulgation of adopted instruments
  - Effectiveness confirmation and recording
  excludes:
  - Instrument adoption and approval (Build)
  - Enforcement and operation of in-force instruments (Operate)
  - Instrument review and amendment (Improve)
outcomes:
- Adopted instruments are brought into force with commencement conditions verified and promulgation recorded.
