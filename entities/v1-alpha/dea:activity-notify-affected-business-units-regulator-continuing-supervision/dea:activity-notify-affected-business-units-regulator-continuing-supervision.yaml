id: dea:activity-notify-affected-business-units-regulator-continuing-supervision
type: Activity
name: Notify Affected Business Units Under Regulator Continuing Supervision
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Sunset Regulated Strategic Plan that
  notifies the regulated entity's affected business units of the regulated strategic-plan
  sunset under the regulator's continuing supervision (the regulator-prescribed business-unit
  notification list; the affected business units' plan-record update transmitted;
  the regulator-prescribed notification content honoured; the regulator-prescribed
  notification cadence observed; the regulator-prescribed acknowledgement recorded
  against the regulated strategic-plan record; the regulator-acknowledged sunset communicated
  to the affected business units).
belongs_to_business_process: dea:process-sunset-regulated-strategic-plan
cohesion_rationale: Constituent work shares a single affected-business-unit-notification
  concern, one input class (the regulated strategic-plan record plus the regulator
  directive or rejection notice plus the superseded-plan identification plus the filings
  register update plus the executed communications plan plus the preserved regulator-acknowledged
  sunset record plus the executed retained-records plan), and one output (the affected
  business units notified under the regulator's continuing supervision with the regulator-prescribed
  acknowledgement recorded). Cohesion score 9/9 assessed at deposition (CR-BP-32 section
  6).
