name: Coordinate Renewals Verification
definition: The bounded unit of work within `dea:activity-coordinate-renewals` (Coordinate Renewals) that verify the input pack against the account-review-cadence contract and the KAM-playbook contract, and emit a verification report naming any contract deviations and their remediation.
belongs_to_activity: dea:activity-coordinate-renewals
trigger: Intake manifest registered for Coordinate Renewals; verification gate may execute the contract and quality-criteria checks against the input pack.
outcome: Verification certificate issued for Coordinate Renewals naming verification methods applied and any deviations remediated; verification custodian passes custody to the processing custodian.
responsibility: verification custodian
boundary:
  inclusions:
  - Execution of the Coordinate Renewals contract checks and quality-criteria verification.
  - Reconciliation of the input pack against the Coordinate Renewals verification certificate requirements.
  exclusions:
  - Long-term retention of the closure case file (phase 5).
  - Re-execution of prior phases on rejected or withdrawn cases.
