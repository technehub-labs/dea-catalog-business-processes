id: dea:task-assign-retained-records-custodianship-verify
type: Task
name: Assign Retained-Records Custodianship Verification
definition: The bounded unit of work within `dea:activity-assign-retained-records-custodianship` (Assign Retained-Records Custodianship) that verify the input pack against the dissolution statute (DGCL §§275-283 / UK Insolvency Act 1986 Part IV), the wind-down quorum requirements, and the retained-records custodianship contract, and emit a verification report naming any statutory deviations and their remediation.
belongs_to_activity: dea:activity-assign-retained-records-custodianship
trigger: Intake manifest registered for Assign Retained-Records Custodianship; verification gate may execute the contract and quality-criteria checks against the input pack.
outcome: Verification certificate issued for Assign Retained-Records Custodianship naming verification methods applied and any deviations remediated; verification custodian passes custody to the processing custodian.
responsibility: verification custodian
boundary:
  inclusions:
  - Execution of the Assign Retained-Records Custodianship contract checks and quality-criteria verification.
  - Reconciliation of the input pack against the Assign Retained-Records Custodianship verification certificate requirements.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Re-execution of prior phases on rejected or withdrawn cases.
evidence:
- source: Delaware DGCL §§275-283 (Dissolution)
  claim: statutory dissolution and winding-up provisions binding the retire-phase verification and the statutory dissolution filings. Bounded-work evidence for the verify-phase custodian of `dea:activity-assign-retained-records-custodianship` (CR-BP-L4-03 enrichment).
  strength: E1
- source: UK Insolvency Act 1986 Part IV
  claim: UK winding-up statute grounding the retire-phase wind-down quorum requirements and registrar filings. Bounded-work evidence for the verify-phase custodian of `dea:activity-assign-retained-records-custodianship` (CR-BP-L4-03 enrichment).
  strength: E1
- source: dea:activity-assign-retained-records-custodianship
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-03 cell-specific bounded-work prose for this GovernanceAndExistence L4 Task.
  strength: E3
