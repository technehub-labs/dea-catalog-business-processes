        discovery outcome (9/10, ADMIT-CANONICAL recommendation)
        under the CR-BP-62 method. The admission activates
        the register v2 cell's verbatim escape condition
        ("Retirement of governance is rare and largely an
        attribute of operating-model retirement; defer until a
        sector example (e.g. regulator-mandated unwind)
        requires it"). Evidence base: FCA WDPG 3 (UK firm
        wind-down planning), California Corporations Code
        5033-5034, 6610, 8610, 9680 (US nonprofit
        dissolution), IRS 501(c)(3) federal tax-exempt
        dissolution obligations, state attorney-general
        charity oversight, federal banking regulator
        cease-and-desist orders, court receivership decrees.
        BP-ARC-ID-001 satisfied: name "Effect Regulator-
        Mandated Governance Unwind" is verb + object form;
        id preserved unchanged from the CR-BP-76 discovery
        recommendation.
    - cr: CR-BP-79
      date: '2026-09-16'
      change: |
        L3 Activity decomposition (4 Activity records):
        Assess Regulator Or Court Order Scope, Reduce
        Governance To Wind-Down Quorum, Submit Statutory
        Dissolution Filings, Assign Retained-Records
        Custodianship. All four candidates FAIL standalone
        executability and resource dedication per CR-BP-32
        section 5 and therefore classify as Activities, not
        BPs. Cohesion 9/9 on each. decomposition_boundary:
        l4-reached per CR-BP-32 section 12. Activity
        references added to metadata.activity_references.
        Version unchanged per SIV-004 (additive
        metadata-only).
