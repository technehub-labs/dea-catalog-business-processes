admission:
  carrier_cr: CR-BP-78
  escape_clauses:
    - "Retirement of governance is rare and largely an attribute of operating-model retirement; defer until a sector example (e.g. regulator-mandated unwind) requires it (register v2 cell verbatim escape condition)."
  escape_clause_evaluation:
    - source: CR-BP-19 register v2 per-cell escape condition
      claim: 'Verbatim deferral: "Retirement of governance is rare and largely an attribute of operating-model retirement; defer until a sector example (e.g. regulator-mandated unwind) requires it."'
      strength: E5
      reference: entities/v1-alpha/dea:group-customer-lifecycle-management/research/l1-register.yaml
    - source: FCA Handbook WDPG 3 (Concept and Process of Wind-Down Planning)
      claim: 'UK regulator-mandated wind-down governance expectations: scenarios, plan, resources assessment, governance and internal controls, wind-down thresholds, alert thresholds, cancellation of permissions.'
      strength: E5
      reference: https://handbook.fca.org.uk/handbook/wdpg3
    - source: FCA Wind-Down Plan Requirements announcement (FSCom 2024)
      claim: Three-month minimum wind-down period; nine months typical. Wind-down threshold and alert threshold. Client refund and residual obligation handling.
      strength: E5
      reference: https://fscom.co/insights/blog/fca-announces-wind-down-plan-requirements
    - source: California Corporations Code 5033-5034, 6610, 8610, 9680
      claim: US nonprofit corporation dissolution by board resolution, certificate of dissolution filing with Secretary of State and Attorney General Registry of Charities and Fundraisers.
      strength: E5
      reference: https://oag.ca.gov/charities/dissolution
    - source: IRS 501(c)(3) dissolution notice and asset distribution rules
      claim: 'Federal tax-exempt entity dissolution obligations: notice, asset distribution per exempt purpose, final Form 990 filing.'
      strength: E5
      reference: https://www.501c3.org/dissolving-a-501c3-nonprofit-a-comprehensive-guide
    - source: National Council of Nonprofits Dissolving a Nonprofit Corporation guidance
      claim: US nonprofit dissolution practice under state nonprofit corporation codes and federal tax-exempt entity obligations; board resolution, plan of dissolution, creditor notification, AG filings.
      strength: E5
      reference: https://www.councilofnonprofits.org/running-nonprofit/ending-organization/dissolution
    - source: Federal banking regulator cease-and-desist authority
      claim: US federal banking regulators (OCC, FRB, FDIC) may issue cease-and-desist orders triggering governance-bodies reduction, capital restoration, and dissolution plans.
      strength: E5
      reference: https://www.occ.treas.gov/topics/supervision-and-examination/enforcement-actions/index-enforcement-actions.html
    - source: US court receivership
      claim: US federal and state courts may appoint receivers for entities under statutory or equitable receivership authority, triggering governance unwind under court supervision.
      strength: E5
      reference: https://www.federalreserveconsumerhelp.gov/
  escape_clause_me_verdict: |
    The verbatim escape condition is met by the 2024-2026
    regulatory landscape: FCA WDPG wind-down planning, UK and US
    state nonprofit dissolution codes, IRS 501(c)(3) federal
    tax-exempt dissolution obligations, federal banking regulator
    cease-and-desist authority, and US federal/state court
    receivership authority collectively establish the regulator- or
    court-mandated unwind scenario that the register v2 cell's
    verbatim escape condition defers to. The cell's audit_status
    flips from backlog-deferred to ratified-accepted/landed at
    register v12 by CR-BP-78.

