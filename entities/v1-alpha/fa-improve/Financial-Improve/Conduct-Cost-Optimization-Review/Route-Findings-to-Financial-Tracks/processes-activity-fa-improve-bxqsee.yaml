plain_language_name: 'Route Findings to Financial Tracks'
plain_language_description: 'This activity sends each finding on to the track that can act on it — the reporting work, the disclosure work, or the control strengthening. The formed findings arrive as the dispatch list, each is routed to its acting track with an owner attached, and the routed findings are confirmed onward for commitment. Nothing the review learned is left without a destination.'
business_purpose: 'It exists so every cost finding reaches the financial track equipped to act on it, with an owner who knows it is theirs.'
practical_context: 'It follows the forming of findings, when the finding set is handed over, and it completes once the routed findings with owners are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority custodian routes each formed finding to the reporting, disclosure, or control-strengthening track that can act on it, attaching an owner to each.'
