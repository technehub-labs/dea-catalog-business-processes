plain_language_name: 'File the Cost Finding Audit Record'
plain_language_description: 'At the close the records custodian preserves the formulation trail at its required retention tier and sets the retrieval handles for it. What the review concluded, and bounded how, stays readable whenever a finding''s scope is examined.'
business_purpose: 'It exists so the conclusions behind the routings can be evidenced whenever their basis is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the formulation trail at its retention tier and sets the retrieval handles a cost review inquiry would consult.'
