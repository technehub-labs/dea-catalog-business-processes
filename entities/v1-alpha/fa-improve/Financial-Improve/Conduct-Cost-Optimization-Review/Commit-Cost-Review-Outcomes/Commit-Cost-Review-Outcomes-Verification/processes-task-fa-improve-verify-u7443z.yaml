plain_language_name: 'Check the Pieces Before Committing the Cost Record'
plain_language_description: 'Before the record is committed, the verification custodian checks the pieces against what commitment requires - that every finding is settled and every routing names a track to act on it. Defects are logged for rejection or repair before the commitment is made.'
business_purpose: 'It exists so no finding is committed without somewhere to go and something to do.'
practical_context: 'It runs once the intake is registered and the pieces can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a finding routed to no track at all and logs the defect before the record is committed.'
