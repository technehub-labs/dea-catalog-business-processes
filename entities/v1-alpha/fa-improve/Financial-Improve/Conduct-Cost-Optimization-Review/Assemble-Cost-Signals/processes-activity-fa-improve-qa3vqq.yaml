plain_language_name: 'Assemble Cost Signals'
plain_language_description: 'This activity pulls the raw material of the review together — the cost signals, the evidence of margin squeezing, and the control findings. The scattered records arrive from their separate homes, the evidence is gathered and organised, and the assembled set is confirmed onward for the findings. The review starts from one coherent picture instead of fragments.'
business_purpose: 'It exists so the cost review examines one organised evidence base rather than scattered signals.'
practical_context: 'It opens the cost optimization review when cost signals, margin pressure, or control findings call for one, and it completes once the assembled evidence is confirmed for the findings step.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority analyst gathers the cost signals, the margin-pressure evidence, and the control findings into one pack, checks it for completeness, and confirms the set for the findings step.'
