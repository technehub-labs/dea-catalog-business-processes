plain_language_name: 'Gather the Money''s Warning Signs into One Pack'
plain_language_description: 'With the records verified, the processing custodian does the assembly itself: the cost signals, the margin pressure, and the control findings are gathered into one review-ready pack, set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because cost warnings scattered across reports convince nobody - the pack is what lets the review conclude from one coherent body of proof.'
practical_context: 'It starts once checking is complete and the verified records are ready to be gathered from, and it ends with the evidence pack produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the finance design authority gathers the signals, pressure, and findings into one review-ready pack, keeping the working papers.'
