plain_language_name: 'Measure Refinement Effectiveness'
plain_language_description: 'This activity checks, finding by finding, whether the refinement made actually moved what motivated it. The committed refinements arrive with their originating findings as the yardsticks, effectiveness is measured against each, and the measurement is confirmed for the record. The refinement loop closes on evidence rather than on good intentions.'
business_purpose: 'It exists so the enterprise learns whether its control fixes genuinely cured the findings behind them.'
practical_context: 'It runs once the committed refinements have bedded in, measured against the findings that prompted them, and it completes when the effectiveness measurement is confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority analyst checks each committed refinement against its originating finding, records where the weakness truly closed, and confirms the measurement for the record.'
