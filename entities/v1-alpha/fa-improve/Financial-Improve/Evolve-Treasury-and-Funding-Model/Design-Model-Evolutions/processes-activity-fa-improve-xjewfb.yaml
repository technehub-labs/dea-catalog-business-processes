plain_language_name: 'Design Model Evolutions'
plain_language_description: 'This activity works each reviewed exposure into a designed change to the treasury and funding model. The reviewed exposures arrive as the case for change, evolutions are designed against them and checked for coherence with the rest of the model, and the designed set is confirmed onward for commitment. The model is improved on purpose, piece by piece.'
business_purpose: 'It exists so each named treasury exposure gains a designed model change rather than a vague intention to adapt.'
practical_context: 'It follows the exposure review, when the bounded exposures are handed over, and it completes once the designed model evolutions are confirmed for commitment.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority designer turns each reviewed exposure into a designed change to the treasury and funding model, checks the set hangs together, and confirms it for commitment.'
