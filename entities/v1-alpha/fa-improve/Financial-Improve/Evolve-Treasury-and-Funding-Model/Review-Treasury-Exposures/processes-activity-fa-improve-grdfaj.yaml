plain_language_name: 'Review Treasury Exposures'
plain_language_description: 'This activity weighs what the watched shifts now expose in treasury terms against the model as it stands. The monitored shifts arrive as the input, the exposures they create are reviewed and bounded against the current model, and the reviewed exposures are confirmed onward for the evolution design. The gap between the model and the world it lives in is made explicit.'
business_purpose: 'It exists so the model''s evolution is aimed at exposures that are named and measured, not sensed.'
practical_context: 'It follows the shift monitoring, when the tracked changes are handed over, and it completes once the reviewed treasury exposures are confirmed for the evolution design.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority analyst weighs the exposures the market shift has created against the current treasury model, bounds them, and confirms the review for the evolution design.'
