plain_language_name: 'Receive the Evolution Designs for Commitment'
plain_language_description: 'Commitment opens when the designed model evolutions are handed over as the changes the treasury will be asked to adopt. The intake custodian accepts them, registers them with audit identifiers, and starts the commitment work from a recorded baseline.'
business_purpose: 'It exists so the model moves from registered designs rather than from shifting preference.'
practical_context: 'It opens when the evolution designs are presented for commitment, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the evolution designs as the commitment baseline, with audit references, and opens the adoption work.'
