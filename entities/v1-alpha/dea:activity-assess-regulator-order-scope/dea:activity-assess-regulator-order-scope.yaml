id: dea:activity-assess-regulator-order-scope
type: Activity
version: 1.0.0
lifecycle_status: candidate
status: candidate

name: Assess Regulator Or Court Order Scope

definition: |
  The cohesive grouping of work within Effect Regulator-Mandated Governance Unwind that interprets the controlling regulator or court order, identifies the binding obligations and deadlines, and maps them to the governance regime and policy instruments that the entity must wind down.

belongs_to_business_process: dea:process-effect-regulator-mandated-governance-unwind

cohesion_rationale: "Constituent work shares a single interpretive concern (the binding order and its conditions), one input class (regulator or court order text plus governance constitution), and one output (a documented order-scope register with binding obligations, deadlines, and affected governance instruments). Cohesion score 9/9 assessed at deposition (CR-BP-32 §6)."

