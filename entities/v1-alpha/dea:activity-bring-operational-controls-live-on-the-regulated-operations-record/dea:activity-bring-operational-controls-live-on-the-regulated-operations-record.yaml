definition: The cohesive grouping of work within Activate Operations Capability that
  brings the operational controls live on the regulated operations record (aviation
  safety-of-record checks; PSD2 operational controls; GMP operational controls; MiCA
  operational controls; rail safety-of-record checks; nuclear operational controls).
