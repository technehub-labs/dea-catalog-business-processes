id: dea:task-classify-party-risk-verify
type: Task
name: Classify Party Risk Verification
definition: The bounded unit of work within `dea:activity-classify-party-risk` (Classify Party Risk) that execute the multi-factor identity, sanctions/PEP, and adverse-media verification checks against the registered intake manifest, reconcile the verification results, and emit a verification certificate naming the verification methods applied.
belongs_to_activity: dea:activity-classify-party-risk
trigger: Intake manifest registered for Classify Party Risk; verification gate may execute the contract and quality-criteria checks against the input pack.
outcome: Verification certificate issued for Classify Party Risk naming verification methods applied and any deviations remediated; verification custodian passes custody to the processing custodian.
responsibility: verification custodian
boundary:
  inclusions:
  - Execution of the Classify Party Risk contract checks and quality-criteria verification.
  - Reconciliation of the input pack against the Classify Party Risk verification certificate requirements.
  exclusions:
  - Long-term retention of the closure case file (phase 5).
  - Re-execution of prior phases on rejected or withdrawn cases.
evidence:
- source: FATF Recommendation 10 (Customer Due Diligence)
  claim: governing AML/CDD standard for party-activation verification; binds the identity, sanctions, and adverse-media verification step to a regulator-recognised control. Bounded-work evidence for the verify-phase custodian of `dea:activity-classify-party-risk` (CR-BP-L4-02 enrichment).
  strength: E1
- source: FinCEN CDD Rule (31 CFR 1010.230)
  claim: US-specific CDD rule establishing minimum identity-verification procedures that the activate-phase verification step operationalises. Bounded-work evidence for the verify-phase custodian of `dea:activity-classify-party-risk` (CR-BP-L4-02 enrichment).
  strength: E1
- source: dea:activity-classify-party-risk
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-02 cell-specific bounded-work prose for this PartyAndRelationship L4 Task.
  strength: E3
