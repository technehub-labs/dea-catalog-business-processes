plain_language_name: 'Design Hypothesis Tests'
plain_language_description: 'This activity builds the checks that will prove or disprove each demand hypothesis. The formulated hypotheses arrive as the claims under trial, a test is designed for each and reviewed for rigour, and the test designs are confirmed onward for the thesis commitment. Every belief about the market is assigned the experiment that could kill it.'
business_purpose: 'It exists so each demand hypothesis is paired with a test capable of proving it wrong.'
practical_context: 'It follows the hypothesis formulation, once the claims are on the table, and it completes when the designed tests are confirmed onward for the thesis commitment.'
worked_example:
  agent_type: human
  narrative: 'A customer relationship management analyst designs the check that will prove or disprove each formulated hypothesis, reviews the designs for rigour, and confirms them onward.'
