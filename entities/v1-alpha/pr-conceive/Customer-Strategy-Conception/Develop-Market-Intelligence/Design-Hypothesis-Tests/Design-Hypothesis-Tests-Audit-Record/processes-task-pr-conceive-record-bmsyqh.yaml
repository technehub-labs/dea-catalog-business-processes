plain_language_name: 'Store the Test-Design File'
plain_language_description: 'Once confirmed, the records custodian places the conception file - manifest, verification report, thesis package, completion confirmation, and remediation notes - into retention under the schedule for segment-strategy records, protected against tampering. Where storage limits apply, a destruction attestation is recorded.'
business_purpose: 'It exists so the test designs stay traceable to the hypotheses they were built to judge.'
practical_context: 'It opens when the completion confirmation is issued, and it closes with the file retained at its tier and any destruction attestation recorded.'
worked_example:
  agent_type: human
  narrative: 'A records custodian archives the test-design file so the hypothesis record and its tests stay linked.'
