id: processes:pc-pr-conceive-6xztsq
domain: PartyAndRelationship
lifecycle_stage: Conceive
name: Customer Strategy Conception
definition: 'The bounded enterprise context for **conceiving** customer and demand strategy in the **customer and demand** domain. This context addresses the front-end work of framing customer strategy, market segmentation, and demand thesis: deciding which customer segments the enterprise will serve, what value exchange to offer, and which demand thesis to commit to.

  '
scope:
  includes:
  - Customer strategy framing
  - Market segmentation
  - Demand thesis development
  - Customer portfolio thesis
  excludes:
  - Customer experience design (Design stage; adjacent context)
  - Channel build (Build stage; adjacent context)
  - Active relationship operation (Operate stage; adjacent context)
outcomes:
- Customer strategy is framed with a defensible segment thesis.
- Market segmentation aligns with enterprise value proposition.
- Demand thesis is testable and bounded.
