plain_language_name: 'Select Innovation Focus Areas'
plain_language_description: 'This activity chooses where the enterprise will aim its innovation — the few grounds worth breaking on, beyond what it already sells. The innovation framing need arrives as the mandate, focus areas are selected and justified against it, and the selected areas are confirmed onward for the option assessment. Innovation gets its map coordinates here.'
business_purpose: 'It exists so innovation effort concentrates on chosen grounds rather than scattering everywhere.'
practical_context: 'It opens the innovation thesis framing when the enterprise needs a bounded thesis for where and how it will innovate, and it completes once the selected focus areas are confirmed for the option assessment.'
worked_example:
  agent_type: human
  narrative: 'A proposition design authority lead selects the grounds where the enterprise will innovate beyond its current propositions, justifies each choice, and confirms the areas onward.'
