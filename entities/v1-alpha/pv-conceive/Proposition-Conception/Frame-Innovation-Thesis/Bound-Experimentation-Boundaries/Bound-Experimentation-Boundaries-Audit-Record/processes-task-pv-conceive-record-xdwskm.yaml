plain_language_name: 'Keep the Boundaries Record'
plain_language_description: 'Once the confirmation is in, the records custodian preserves the audit record at its required retention tier and sets the retrieval handles for the evidence review. The agreed limits stay readable for the discipline''s duration.'
business_purpose: 'It exists so the agreed limits stay consultable when an experiment wants to exceed them.'
practical_context: 'It opens when the confirmation is issued and retention may begin, and it closes with the audit record preserved and retrieval handles set.'
