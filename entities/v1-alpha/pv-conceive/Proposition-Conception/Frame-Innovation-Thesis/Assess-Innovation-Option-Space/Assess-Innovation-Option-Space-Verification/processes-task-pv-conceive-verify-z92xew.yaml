plain_language_name: 'Check the Option Pack Before the Assessment'
plain_language_description: 'Before the options are assessed, the verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right, before the assessment proceeds.'
business_purpose: 'It exists because an option map drawn on unchecked inputs misleads the whole thesis.'
practical_context: 'It starts once the intake is on file, and it ends with the checks recorded and custody passed to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian of the proposition design authority checks the option pack against the focus areas before assessing.'
