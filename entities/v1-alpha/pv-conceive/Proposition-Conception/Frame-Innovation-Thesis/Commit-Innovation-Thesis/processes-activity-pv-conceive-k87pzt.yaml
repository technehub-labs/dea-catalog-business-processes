plain_language_name: 'Commit Innovation Thesis'
plain_language_description: 'This activity draws the focus areas, the option assessment, and the experimentation boundaries together into one committed thesis. The framed pieces arrive as its inputs, the whole is consolidated and ratified, and the committed thesis is confirmed as the basis for the experiment design. The enterprise''s answer to where and how it will innovate becomes one owned document.'
business_purpose: 'It exists so innovation experiments proceed from one committed thesis rather than from enthusiasm.'
practical_context: 'It closes the innovation thesis framing once areas, assessment, and boundaries are framed, and it completes when the committed innovation thesis is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian assembles the focus areas, option assessment, and experimentation boundaries into the thesis document, obtains ratification, and records the committed thesis.'
