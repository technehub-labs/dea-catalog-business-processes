plain_language_name: 'Order Portfolio Priorities'
plain_language_description: 'This activity lines the competing propositions up in the order the enterprise will favour them. The assessed balance arrives as the evidence base, priorities are ordered proposition by proposition and the sequence argued, and the priority ordering is confirmed onward for the investment envelopes. When money is short, this list decides who eats first.'
business_purpose: 'It exists so the portfolio''s propositions have a deliberate order of favour for scarce investment.'
practical_context: 'It follows the balance assessment, once the portfolio''s shape is visible, and it completes when the priority ordering is confirmed onward for the investment envelopes.'
worked_example:
  agent_type: human
  narrative: 'A proposition design authority lead lines the competing propositions up in argued order of favour, using the assessed balance as evidence, and confirms the ordering onward.'
