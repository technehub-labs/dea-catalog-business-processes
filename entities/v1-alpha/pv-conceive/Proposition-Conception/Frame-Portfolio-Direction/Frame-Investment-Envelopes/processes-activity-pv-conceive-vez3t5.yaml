plain_language_name: 'Frame Investment Envelopes'
plain_language_description: 'This activity caps what each proposition in the ordered portfolio may receive. The priority ordering arrives as the basis of allocation, envelopes are framed around each proposition and checked against the bounded investment total, and the framed envelopes are confirmed onward for the direction''s commitment. Every proposition learns its allowance here.'
business_purpose: 'It exists so each competing proposition gets a defined investment allowance, not an open tab.'
practical_context: 'It follows the priority ordering, once the sequence of favour is set, and it completes when the framed investment envelopes are confirmed for the direction''s commitment.'
worked_example:
  agent_type: human
  narrative: 'A proposition design authority lead caps each proposition''s investment allowance against the priority ordering and the bounded total, and confirms the framed envelopes onward.'
