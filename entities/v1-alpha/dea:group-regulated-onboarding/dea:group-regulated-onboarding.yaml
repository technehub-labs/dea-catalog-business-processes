    claim: |
      This Process Group's coordinate was evaluated by the CR-BP-70
      escape-clause discovery record
      discovery/v1-alpha/party-and-relationship-activate-escape.yaml:
      the cell's escape clause ("defer until a regulated onboarding
      (e.g. KYC for financial services) requires a distinct group")
      was found met, scoring 9/10 with an ADMIT-CANONICAL
      recommendation on authoritative regulatory evidence (FATF R.10,
      FinCEN CDD 31 CFR 1010.230 + CIP, EU AMLD4/AMLD5/AMLD6, Basel
      BCBS ML/FT guidelines, Wolfsberg Group).
    strength: E5
