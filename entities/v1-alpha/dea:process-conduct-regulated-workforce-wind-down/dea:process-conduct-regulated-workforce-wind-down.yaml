id: dea:process-conduct-regulated-workforce-wind-down
name: Conduct Regulated Workforce Wind-Down
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: 'Conduct a regulated workforce wind-down under statutory mass-layoff, consultation, notice, severance, and transition-support obligations within the dea:pc-ao-retire Cell Charter. See trigger and outcome for the bounded work this process owns; see identity.outcome_statement for the testable outcome the process produces.

  '

trigger: 'A regulated wind-down event is authorized (mass layoff, agent unit decommission, or organizational unit wind-down) where statutory advance-notice and consultation obligations are triggered by the size and nature of the employment reduction.

  '

outcome: 'The wind-down is executed under statutory notice, consultation obligations are satisfied with documentation, statutory liabilities (notice pay, severance, benefits continuation) are recorded and funded, and transition supports (state dislocated-worker referral, training, health-care continuation) are routed to the affected population.

  '

identity:
  verb: Conduct
  object: Regulated Workforce Wind-Down
  scope: enterprise
  outcome_statement: 'The workforce is wound down under controlled regulated obligations: statutory notice is served, worker-representative consultation is documented, fair-selection criteria are applied and recorded, severance and benefits continuation are funded and recorded, and transition supports are routed to the affected population. Affected workers and their representatives, the state dislocated-worker unit, and the local chief elected official all receive the notice the controlling statute or regulation requires. Steady-state offboarding of individual agents and asset retirement are explicitly coordinated out to the Operate and EnablementAndOperations x Retire coordinates respectively.

    '
  evidence_links:
  - type: regulation
    ref: 'https://www.ecfr.gov/current/title-20/chapter-V/part-639'
  - type: regulation
    ref: 'https://www.dol.gov/general/topic/termination/plantclosings'
  - type: regulation
    ref: 'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A31998L0059'
  - type: standard
    ref: 'https://www.ilo.org/dyn/normlex/en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C158'
  - type: standard
    ref: 'https://www.ilo.org/dyn/normlex/en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C135'
  - type: standard
    ref: 'https://www.oecd.org/employment/employment-outlook/'
  - type: regulation
    ref: 'https://www.legislation.gov.uk/ukpga/1992/52/section/188'
