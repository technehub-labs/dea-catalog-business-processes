  \ (the post-dissolution retention of entity records for the statutory period plus\
  \ a service-of-process agent), one input class (order-scope register plus entity\
  \ records plus statutory retention map), and one output (a documented custodian\
  \ designation with regulator or court acknowledgement). Cohesion score 9/9 assessed\
  \ at deposition (CR-BP-32 \xA76)."
