definition: 'The cohesive grouping of work within Effect Regulator-Mandated Governance
  Unwind that assigns retained-records custodianship to a designated custodian (with
  the service-of-process agent retained for the duration of the statutory retention
  period), confirms the custodian accepts the role, and confirms the regulator or
  court is satisfied with the assignment.

  '
