name: Decommission Enterprise Asset
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: transform
process_type: core
process_specialization: []
description: 'Withdraw and retire an operational asset (technology or physical): plan and approve the retirement, isolate and withdraw the asset from service, decommission and dispose of it, and resolve its residual value, data and obligations, within the dea:pc-oe-retire Cell Charter. See trigger and outcome for the bounded work this process owns; see identity.outcome_statement for the testable outcome the process produces. '
trigger: 'An operational asset reaches end of life, is superseded, or is approved for retirement. '
outcome: 'The asset is withdrawn from operation, decommissioned and disposed of through executed retirement and disposal routes, with residual value, data and obligations resolved and recorded. '
identity:
  verb: Decommission
  object: Enterprise Asset
  scope: (all enterprise segments)
  outcome_statement: 'The asset is out of service and disposed of through executed retirement routes, with residual value, data and obligations resolved and recorded. '
