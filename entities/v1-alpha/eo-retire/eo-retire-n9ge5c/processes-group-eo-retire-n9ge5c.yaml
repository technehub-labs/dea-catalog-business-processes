id: processes:group-eo-retire-n9ge5c
type: ProcessGroup
version: 1.0.0
name: Operations and Asset Decommissioning
definition: 'The bounded Process Group that organises the Business Process

  responsibilities of withdrawing and retiring operational assets in

  the EnablementAndOperations x Retire context (retirement planning,

  isolation and withdrawal, decommissioning and disposal, residual

  resolution).

  '
process_context: processes:pc-eo-retire-nw3ynf
scope:
  includes:
  - Retirement planning and approval
  - Isolation and withdrawal from service
  - Decommissioning and disposal (including data sanitization)
  - Residual value and obligation resolution
  excludes:
  - Steady-state operation and maintenance (Operate)
  - Asset improvement and upgrade (Improve)
  - Product and service withdrawal (ProductAndValue x Retire)
outcomes:
- Assets are withdrawn, decommissioned and disposed of under approved retirement plans with residual obligations resolved.
