id: processes:pc-eo-retire-nw3ynf
domain: EnablementAndOperations
lifecycle_stage: Retire
name: Operations and Asset Decommissioning
definition: 'The bounded enterprise context for **withdrawing and retiring

  operational assets** in the **Enablement & Operations** domain.

  This context addresses the retirement-stage work of isolating,

  withdrawing, decommissioning and disposing of technology and

  physical assets, and resolving their residual data, value and

  obligations. Decommissioning is a mature, universally governed

  discipline (ISO 55000 asset end-of-life; APQC asset disposition;
  data center decommissioning practice)

  with a stable identity wholly independent of the ECF stage label.

  '
scope:
  includes:
  - Retirement planning and approval
  - Isolation and withdrawal from service
  - Decommissioning and disposal (including data sanitization)
  - Residual value and obligation resolution
  excludes:
  - Asset acquisition and build (Build stage; adjacent context)
  - Steady-state operation and maintenance (Operate stage; adjacent context)
  - Asset improvement and upgrade (Improve stage; adjacent context)
  - Product and service withdrawal (ProductAndValue x Retire; sibling cell)
outcomes:
- Assets are withdrawn from operation under approved retirement plans.
- Decommissioning and disposal are executed with data sanitization and safety evidence.
- Residual value and obligations are resolved and recorded.
adjacent_contexts:
- processes:pc-eo-conceive-mxmtzq
- processes:pc-eo-design-kxdfnz
- processes:pc-eo-build-zwkhxc
- processes:pc-eo-operate-ydqb96
- processes:pc-eo-improve-pka6dk
processes:
- processes:process-eo-retire-rpg6d4
cell_charter:
  enterprise_concern: 'Enablement & Operations: the withdrawal and retirement of operational assets.'
  lifecycle_concern: 'Retire: retirement planning, isolation and withdrawal, decommissioning and disposal, residual resolution.'
  combined_semantic_meaning: 'The retirement-stage work of taking operational and physical or

    technology assets out of service and resolving what they leave

    behind.

    '
  expected_outcomes:
  - Assets are withdrawn from operation under approved retirement plans.
  - Decommissioning and disposal are executed with data sanitization and safety evidence.
  - Residual value and obligations are resolved and recorded.
  inclusions:
  - Retirement planning and approval
  - Isolation and withdrawal from service
  - Decommissioning and disposal (including data sanitization)
  - Residual value and obligation resolution
  exclusions:
  - Asset acquisition and build (Build stage; adjacent context)
  - Steady-state operation and maintenance (Operate stage; adjacent context)
  - Asset improvement and upgrade (Improve stage; adjacent context)
  - Product and service withdrawal (ProductAndValue x Retire; sibling cell)
  adjacent_boundaries:
  - 'processes:pc-eo-operate-ydqb96 (adjacent context): operating assets hand over at retirement planning and approval.'
  - 'processes:pc-pv-retire-eeck6d (sibling cell): product and service withdrawal is distinct from asset decommissioning.'
