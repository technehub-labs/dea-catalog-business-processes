plain_language_name: 'File the Residual Resolution Audit Record'
plain_language_description: 'At the close the records custodian preserves the resolution trail at its required retention tier and sets the retrieval handles for it. What value was recovered, what data was wiped, and which obligations closed, stays readable whenever the asset''s last chapter is examined.'
business_purpose: 'It exists so the asset''s last chapter can be evidenced whenever its loose ends are questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the resolution trail at its retention tier and sets the retrieval handles a final asset review would consult.'
