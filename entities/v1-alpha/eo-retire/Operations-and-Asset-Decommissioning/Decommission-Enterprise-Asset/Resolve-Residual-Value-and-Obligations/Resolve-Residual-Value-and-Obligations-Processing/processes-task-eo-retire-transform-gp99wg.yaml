plain_language_name: 'Recover the Value, Wipe the Data, Close the Debts'
plain_language_description: 'With the inputs verified, the processing custodian does the settling itself: whatever value the asset still holds is recovered, its data is sanitized beyond recovery, its outstanding obligations are closed off, and the settled state is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because an asset''s ghost lingers in value unclaimed, data unwiped, and obligations unclosed - the settling is what lays it to rest.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be settled, and it ends with the settled residuals produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management recovers the last value, wipes the data, and closes the obligations, keeping the working papers.'
