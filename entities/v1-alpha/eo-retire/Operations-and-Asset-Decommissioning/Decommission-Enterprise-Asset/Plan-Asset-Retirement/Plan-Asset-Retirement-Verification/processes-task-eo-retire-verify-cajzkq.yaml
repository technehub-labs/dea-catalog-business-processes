plain_language_name: 'Check the Approval Before Drawing the Plan'
plain_language_description: 'Before anything is planned, the verification custodian checks the decision against what planning requires - that the approval covers the asset named and carries the authority it claims. Defects are logged for rejection or repair before the plan is drawn.'
business_purpose: 'It exists so no asset is retired on a decision that was never truly approved.'
practical_context: 'It runs once the intake is registered and the decision can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the decision approving an asset other than the one listed and logs the defect before planning begins.'
