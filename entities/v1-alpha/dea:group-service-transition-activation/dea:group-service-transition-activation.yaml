id: dea:group-service-transition-activation
type: ProcessGroup
version: 1.0.0

name: Service Transition Activation

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process responsibilities of transitioning validated propositions, products and services into operational service in the ProductAndValue x Activate context (readiness validation, service transition, operational acceptance).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-pv-activate

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Transition readiness validation
    - Service transition into operation
    - Operational acceptance
  excludes:
    - Proposition development (Build)
    - Steady-state proposition operation (Operate)
    - Operational delivery of the product (enablement-operations)

# Intended enterprise outcomes.
outcomes:
  - Validated propositions are transitioned into operational service with acceptance recorded.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-service-transition-activation
    target_id: dea:process-transition-to-service
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-63 discovery
      outcome (ADMIT-CANONICAL recommendation) landed by CR-BP-64.
    provenance:
      type: architecture-review
      reference: CR-BP-64
      asserted_by: dea-team
      asserted_at: '2026-09-14'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: cross-cutting

# Discovery / governance status (mirrors register values).
status: accepted

# Catalog entry lifecycle (PG-008 enforces).
lifecycle_status: candidate

# ECF Conformance Gate (CR-ECF-CG-001..004).
ecfConformance:
