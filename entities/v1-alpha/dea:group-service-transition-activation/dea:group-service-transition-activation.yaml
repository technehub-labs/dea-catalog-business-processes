    claim: |
      This Process Group's coordinate was evaluated by the CR-BP-63
      discovery record discovery/v1-alpha/product-and-value-activate.yaml: the cell's canonical candidate
      scored 10/10 with an ADMIT-CANONICAL recommendation,
      overturning (with evidence) the register v2 uniform deferral.
    strength: E4
