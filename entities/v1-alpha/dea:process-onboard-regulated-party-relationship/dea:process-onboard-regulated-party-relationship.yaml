id: dea:process-onboard-regulated-party-relationship
name: Onboard Regulated Party Relationship
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: 'Onboard a new party relationship in a regulated context (KYC/AML/CDD): verify identity, resolve beneficial ownership, classify risk, and either authorize commencement with documented approval or record a refusal, within the dea:pc-pr-act Cell Charter. See trigger and outcome for the bounded work this process owns; see identity.outcome_statement for the testable outcome the process produces.

  '
trigger: 'A new party applies to establish a relationship with the enterprise in a jurisdiction or sector where identity verification and due diligence are mandated before the relationship may commence (e.g. KYC/AML obligations in financial services).

  '
outcome: 'The party relationship is activated with verified identity, resolved beneficial ownership, an assigned risk classification, and a documented approval; declined applicants receive a recorded refusal.

  '
identity:
  verb: Onboard
  object: Regulated Party Relationship
  scope: enterprise
  outcome_statement: 'The party relationship is activated under controlled onboarding: identity is verified, beneficial ownership is resolved, the relationship is allocated a risk classification, and an approval is recorded or a refusal is issued with a documented rationale. Ongoing monitoring and periodic due-diligence refresh are coordinated out to the Operate context.

    '
  evidence_links:
