admission_decision:
  recommendation: ADMIT-CANONICAL
  score: 10
  evidence_base: |
    Authoritative regulatory evidence for licensed-workforce mobilization
    across banking, healthcare, insurance, professional services,
    telecoms, and aviation:
    - FCA SMCR (UK) Statements of Responsibilities: CF1..CF11
      controlled functions require fitness-and-propriety attestation
      and Statements of Responsibilities before live work
    - US state healthcare licensure regimes: state licensure is a
      precondition to live practice; the enterprise's credentialing
      process is the controlled mobilization step
    - NAIC Producer Licensing Model Act and state insurance-producer
      licensing: insurance producers must hold state licences and the
      enterprise's appointments before live producer work
    - EASA and FAA crew licensing: airline crew must hold current
      type-rated licences before flight operations; airline
      mobilization is the controlled step
    - UK SRA regulated-professionals regime and US state bar
      admissions: licensed professionals must hold current practising
      certificates or admissions before live client work
  rationale: |
    The 2024-2026 supervised-individual-licensing landscape establishes
    that licence-controlled mobilization is a distinct enterprise
    concern with regulator-controlled scope, fitness-and-propriety
    attestation, supervised-training completion, and continuing-
    supervisor notification -- distinct from general workforce build
    (Build coordinate) and from steady-state workforce performance
    management (Operate coordinate). The cell's deferral rationale
    ("workforce activation is often an attribute of build") is
    superseded by the regulated-sector evidence; the candidate is the
    strongest in the CR-BP-80 escape exercise because of its
    cross-sector breadth across six regulated industries.
