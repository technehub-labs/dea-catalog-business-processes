name: Activate Signing Authority Or Controlled-Function Designation
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Mobilize Licensed Workforce that activates the signing authority or controlled-function designation on the regulated personnel record and issues the continuing-supervisor notification (SMCR CF1..CF11 designation; state healthcare scope of practice; NAIC producer line of authority; FAA / EASA type-rating; SRA role; bar area of practice).
belongs_to_business_process: processes:process-ao-activate-jqxtqn
cohesion_rationale: Constituent work shares a single signing-authority activation concern, one input class (the verified licence and the controlled-function designation), and one output (the activated signing authority and the continuing-supervisor notification). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
