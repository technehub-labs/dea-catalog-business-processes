name: Mobilize Licensed Workforce
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: Mobilize a licensed or regulated workforce under the enterprise regulated-entity approval authority within the dea:pc-ao-activate Cell Charter. The trigger is the enterprise regulated-entity approval for a licensed role; the outcome is the live-readiness activation of the licensed role with the supervisor-controlled scope preserved (signing authority or controlled-function designation), fitness-and-propriety attestation recorded, supervised-training completion preserved, and continuing-supervisor notification activated, so that the licensed individual is live on the regulated personnel record under the regulator continuing supervision.
trigger: A workforce role whose holders must hold a regulator-issued licence is approved by the enterprise regulated-entity approval authority for live work (banking controlled functions under FCA SMCR; healthcare practitioners under US state licensure; licensed professional services under UK SRA / US bar admissions; aviation crew under FAA / EASA type-rating; insurance producers under NAIC Producer Licensing), and the licensed individual is readied for live work on the regulated personnel record.
outcome: The licensed or regulated workforce role is formally mobilized under the enterprise regulated-entity approval authority with the regulator-controlled scope preserved, the fitness-and-propriety attestation recorded, supervised-training completion preserved, and the continuing-supervisor notification activated; the licensed individual is live on the regulated personnel record under the regulator continuing supervision and may perform live work in the licensed role.
identity:
  verb: Mobilize
  object: Licensed Workforce
  scope: enterprise
  outcome_statement: The licensed or regulated workforce role is formally mobilized under the enterprise regulated-entity approval authority. The regulator-controlled scope is preserved (signing authority or controlled-function designation). The fitness-and-propriety attestation is recorded. The supervised-training completion is preserved. The continuing-supervisor notification is activated. The licensed individual is live on the regulated personnel record under the regulator continuing supervision. Workforce recruitment and general onboarding remain coordinated to Build. Steady-state workforce performance and supervision remain coordinated to Operate. Workforce offboarding and licence surrender remain coordinated to Retire. Non-licensed workforce activation is excluded.
