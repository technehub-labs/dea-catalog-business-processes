plain_language_name: 'Activate Signing Authority or Controlled-Function Designation'
plain_language_description: 'Once a licensed individual''s verified licence and designation are on the table, this activity switches on the formal authority the role carries and files it against the personnel record. The work passes through five custodian steps: the request is logged in, the designation details are checked against what was approved, the authority is set up in its final form, the people who rely on it are told it is available, and the audit trail is filed. From that point the individual''s continuing supervisor is on notice, and the role''s formal authority is live.'
business_purpose: 'It exists so a licensed role''s signing or decision-making authority only goes live together with the notification that keeps a continuing supervisor accountable for it.'
practical_context: 'It happens late in mobilizing a licensed workforce, when the verified licence and the designation are presented after licence verification and the fitness attestation, and it closes once the activation''s audit record is preserved for retrieval.'
worked_example:
  agent_type: human
  narrative: 'A workforce management lead receives the verified licence details for a newly approved controlled-function appointee, has the designation set up on the personnel record, and issues the notification that places the continuing supervisor on notice before the appointee''s first day of live work.'
