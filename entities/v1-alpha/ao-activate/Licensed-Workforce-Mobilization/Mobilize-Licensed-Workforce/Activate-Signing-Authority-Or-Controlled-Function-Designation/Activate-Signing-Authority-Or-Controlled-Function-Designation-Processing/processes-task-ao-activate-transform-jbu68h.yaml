plain_language_name: 'Prepare the Activation for the Personnel Record'
plain_language_description: 'Once the request has passed checking, the processing custodian turns it into the activated entry the activity promises: the signing authority is set out in the shape the personnel record expects, with the continuing-supervisor notification drafted alongside it. Working notes from the preparation are kept, so the trail from request to activation stays auditable.'
business_purpose: 'It exists because a checked request only becomes real authority once it is shaped into the record and notification the organisation works from.'
practical_context: 'It runs after checking is complete and the verified request is ready to be worked into its final form, and it ends when the activation output exists in its agreed shape with the working notes preserved.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the operations function converts the checked designation into the personnel-record entry and drafts the continuing-supervisor notification for issue.'
