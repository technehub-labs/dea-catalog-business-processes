plain_language_name: 'File the Licence Verification Audit Record'
plain_language_description: 'Finally the records custodian preserves the whole verification trail - licence in, checks run, record out, confirmation given - at the retention tier the evidence rules demand, with retrieval handles set for the day it is needed.'
business_purpose: 'It exists so the licence verification can be evidenced, end to end, for as long as the retention rules require.'
practical_context: 'It starts when the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record held at its tier and its retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the verification trail at its required tier and sets the retrieval handles a supervision review would use to call up the licence history.'
