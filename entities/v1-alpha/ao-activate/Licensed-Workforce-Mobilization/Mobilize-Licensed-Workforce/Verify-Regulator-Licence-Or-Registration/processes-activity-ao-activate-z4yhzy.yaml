name: Verify Regulator Licence Or Registration
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Mobilize Licensed Workforce that confirms the licence or registration is current, in good standing, and matches the controlled-function designation or signing authority required for the live role (FCA SMCR Statements of Responsibilities; state healthcare licensure verification; NAIC producer licence status; FAA / EASA type-rating currency; SRA practising certificate; bar admission status).
belongs_to_business_process: processes:process-ao-activate-jqxtqn
cohesion_rationale: Constituent work shares a single licence-verification concern, one input class (the regulator-controlled role and the licence record), and one output (the verified licence record and the scope-of-practice attestation). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
