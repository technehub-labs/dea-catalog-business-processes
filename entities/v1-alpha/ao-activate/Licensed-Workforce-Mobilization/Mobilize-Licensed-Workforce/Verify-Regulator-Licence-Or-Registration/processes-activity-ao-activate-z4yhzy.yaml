plain_language_name: 'Verify Regulator Licence or Registration'
plain_language_description: 'This activity checks that the licence or registration behind a licensed role is current, is in good standing, and actually fits the live role it is meant to support. The regulator-controlled role and its licence record are brought in together, the licence is examined against what the role requires, and a verified licence record with the scope of practice attested is produced. Confirmation goes to whoever is waiting on it, and the verification is retained as an auditable record.'
business_purpose: 'It exists so only individuals whose regulator licence genuinely matches the role''s controlled scope are progressed toward live work on the personnel record.'
practical_context: 'It happens at the start of mobilizing a licensed role, when the regulator-controlled role and the licence record are presented together, and it is complete once the verified licence record is confirmed and filed for later reference.'
worked_example:
  agent_type: human
  narrative: 'A workforce management checker takes an insurance producer''s licence details, confirms the line of authority is current and in good standing against the licence record, and files the verified licence record that the remaining mobilization steps rely on.'
