plain_language_name: 'Prepare the Verified Licence Record'
plain_language_description: 'Once the licence has measured up, the processing custodian shapes the finding into the verified licence record the activity promises, together with the scope-of-practice attestation that travels with it. The comparison working papers are preserved so the verification can be retraced later.'
business_purpose: 'It exists so a licence check becomes a usable, evidenced record rather than a conclusion somebody remembers.'
practical_context: 'It starts when checking is complete and the verified findings are ready to be worked into their final form, and it ends with the licence record and scope attestation produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian turns the completed licence checks into the verified licence record and its scope attestation, filing the working papers behind them.'
