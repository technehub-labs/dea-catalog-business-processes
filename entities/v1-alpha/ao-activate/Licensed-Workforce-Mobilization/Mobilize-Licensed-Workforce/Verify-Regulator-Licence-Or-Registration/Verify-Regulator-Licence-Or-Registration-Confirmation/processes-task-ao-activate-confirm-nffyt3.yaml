plain_language_name: 'Confirm the Licence Verification Result'
plain_language_description: 'With the verified record in hand, the confirmation custodian reconciles it against the result the activity set out to reach, then issues the confirmation. Those waiting to put the person live - and the continuing supervision chain - learn that the licence position is settled.'
business_purpose: 'It exists so the verification is treated as settled only once it has been confirmed against the intended result and announced.'
practical_context: 'It begins once preparation is complete and the verified record awaits its consumers, and it closes with the confirmation issued, consumers told, and the outcome reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the verified licence record to the activity''s intended result and issues the confirmation that lets the live-role decision proceed.'
