plain_language_name: 'Resolve Residual Obligations'
plain_language_description: 'An offering can be gone and still owe things: this sweep finds the outstanding support commitments, warranties, and data-retention duties left behind and routes each to whoever must honour it. The withdrawn service and its commitments arrive at intake, are checked for completeness, identified and routed at processing, confirmed, and archived.'
business_purpose: 'It makes sure retirement is honest: duties that survive the offering are named and handed to owners, so obligations are honoured rather than forgotten.'
practical_context: 'It runs once withdrawal has taken effect: intake opens on the withdrawn service and its outstanding commitments, and closure comes when the routed duties and audit trail are confirmed and filed.'
worked_example:
  agent_type: human
  narrative: 'After a retired product''s final cutover, the proposition design authority registers the withdrawn service at intake, lists the support promises and retention duties still live at processing, routes each to the responsible desk, and confirms the routing with the record archived.'
