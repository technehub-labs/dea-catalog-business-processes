plain_language_name: 'Take In the Withdrawn Service and Its Outstanding Commitments'
plain_language_description: 'The residual work opens as its material arrives: the withdrawn service together with the commitments it still carries. The intake custodian logs them against the residuals file so the resolving starts accounted for.'
business_purpose: 'It exists so no warranty, support commitment or retention duty survives the withdrawal unlogged and therefore unhandled.'
practical_context: 'It opens when the withdrawn service and its outstanding commitments are presented for resolution, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the proposition design authority logs the withdrawn service alongside its outstanding warranty and support commitments into the residuals file, so the resolving starts accounted for.'
