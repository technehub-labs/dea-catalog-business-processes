plain_language_name: 'Transition Proposition Out of Service'
plain_language_description: 'When a proposition has an approved retirement decision, this work withdraws it from service in a controlled way. The proposition design authority plans the withdrawal, moves the affected stakeholders onto whatever replaces the offering, and steps the service out of operational reliance. Anything still owed after the withdrawal is identified and routed onward.'
business_purpose: 'It makes retirement orderly rather than abrupt: stakeholders are transitioned, reliance is wound down deliberately, and lingering obligations are caught instead of forgotten when the offering switches off.'
practical_context: 'Encountered once a retirement decision has been approved, with the proposition design authority running the withdrawal plan while affected teams move off the offering; the work continues until residual obligations are routed.'
worked_example:
  agent_type: human
  narrative: 'With retirement approved, the proposition design authority publishes the withdrawal plan, briefs the affected teams on the replacement, and schedules the final switch-off. The obligations that outlive the service are then listed and routed to their owners.'
