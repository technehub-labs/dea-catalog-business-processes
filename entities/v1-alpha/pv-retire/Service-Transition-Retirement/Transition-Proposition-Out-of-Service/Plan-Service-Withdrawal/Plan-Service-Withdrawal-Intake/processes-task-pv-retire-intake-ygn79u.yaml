plain_language_name: 'Take In the Approved Retirement Decision for Withdrawal Planning'
plain_language_description: 'The planning opens as its material arrives: the approved retirement decision that sets the withdrawal in motion. The intake custodian logs it against the withdrawal planning file so the planning starts accounted for.'
business_purpose: 'It exists so the plan is drawn from a logged, approved decision rather than from an informal expectation that a product will be retired.'
practical_context: 'It opens when the approved retirement decision is presented for planning, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the proposition design authority logs the approved retirement decision for an ageing service into the planning file, so the withdrawal planning starts accounted for.'
