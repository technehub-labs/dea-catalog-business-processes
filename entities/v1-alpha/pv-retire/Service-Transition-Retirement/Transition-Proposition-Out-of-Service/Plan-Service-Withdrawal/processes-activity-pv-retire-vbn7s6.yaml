plain_language_name: 'Plan Service Withdrawal'
plain_language_description: 'Before anything is switched off, the design authority lays out how the exit will run: who is told and when, which dependencies must unwind first, the timetable, and how users migrate to what comes next. The approved retirement decision arrives at intake, is verified, worked into the withdrawal plan, confirmed, and archived.'
business_purpose: 'It turns an approved retirement decision into a safe, sequenced exit plan, so withdrawal proceeds without stranding the people who still depend on the offering.'
practical_context: 'It opens the out-of-service transition: intake starts when the approved retirement decision is presented, and closure comes when the confirmed plan and its audit record are filed.'
worked_example:
  agent_type: human
  narrative: 'Given a decision to retire an ageing service, the proposition design authority registers the decision at intake, maps the dependencies and migration routes at processing, sets notice periods and dates, confirms the plan with stakeholders, and files the planning record.'
