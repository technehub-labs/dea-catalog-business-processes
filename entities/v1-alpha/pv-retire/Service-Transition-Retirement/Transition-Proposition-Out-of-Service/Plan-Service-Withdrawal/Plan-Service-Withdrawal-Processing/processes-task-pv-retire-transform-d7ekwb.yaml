plain_language_name: 'Draw Up the Withdrawal Plan with Notice, Timelines and Migration'
plain_language_description: 'With the inputs verified, the planning proper begins. The processing custodian works out notice, dependencies, timelines and user migration provisions, producing the service withdrawal plan in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because retiring a service safely needs one written plan covering who is told, what depends on it, and how users move off.'
practical_context: 'It opens when the verified decision material is ready to be worked, and it closes with the withdrawal plan produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the proposition design authority drafts the withdrawal plan, setting the customer notice, the dependency timeline and the user migration provisions, and keeps the planning workings for the audit trail.'
