plain_language_name: 'File the Withdrawal Execution Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so what was switched off, when, and under which plan stays provable long after the offering is gone.'
business_purpose: 'It exists so the execution of a withdrawal leaves evidence that survives staff turnover and later disputes about what was switched off.'
practical_context: 'It opens when the confirmation is in place, and it closes with the withdrawal evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the proposition design authority files the withdrawal execution evidence at its required retention tier and sets the retrieval handles, so a later question about the switch-off date is answered from the record.'
