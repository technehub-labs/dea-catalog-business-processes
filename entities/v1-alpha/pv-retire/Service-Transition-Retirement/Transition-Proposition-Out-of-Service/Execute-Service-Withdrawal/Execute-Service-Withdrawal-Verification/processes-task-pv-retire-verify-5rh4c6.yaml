plain_language_name: 'Test the Withdrawal Plan Before Any Service Is Removed'
plain_language_description: 'Before anything is switched off, the arriving plan is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because executing an inadequate withdrawal plan risks pulling the proposition out from under customers who still rely on it.'
practical_context: 'It opens once the intake is registered and the plan is ready to be challenged, and it closes with the plan''s shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the proposition design authority tests the withdrawal plan against what the activity requires, and flags a missing user-migration step as a shortfall to be put right before any service is switched off.'
