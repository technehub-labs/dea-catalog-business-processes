plain_language_name: 'File the Retirement Closure Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so the proof that this offering was retired cleanly can be produced years later when a warranty or a data-retention question resurfaces.'
business_purpose: 'It exists so the closed retirement leaves behind retrievable evidence rather than a silence that later obligation questions cannot be answered from.'
practical_context: 'It opens when the confirmation is in place, and it closes with the closure evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the proposition design authority files the retirement closure evidence at its required retention tier and sets the retrieval handles, so a customer warranty claim two years on can be checked against the record.'
