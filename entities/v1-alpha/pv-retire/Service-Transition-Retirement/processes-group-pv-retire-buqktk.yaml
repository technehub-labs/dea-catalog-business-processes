plain_language_name: 'Withdrawing Propositions from Service'
plain_language_description: 'This family takes propositions out of live service in a controlled way. Its processes intake the retirement decision and plan the withdrawal, transition stakeholders off the retiring service, and remove operational reliance so nothing depends on it any more.'
business_purpose: 'So retirement is deliberate rather than accidental: planned withdrawal, stakeholders moved on, and reliance removed with obligations tracked.'
practical_context: 'Encountered when a proposition is withdrawn from the market — after the rationalization or lifecycle decision — ahead of asset-level decommissioning elsewhere.'
worked_example:
  agent_type: human
  narrative: 'A legacy service is being retired. The Product & Value Process Owner plans the withdrawal, communicates with affected stakeholders, transitions customers to successor offerings, and confirms that operational reliance has been removed before the final switch-off date.'
