id: processes:pc-pv-retire-eeck6d
domain: ProductAndValue
lifecycle_stage: Retire
name: Proposition Retirement and Service Withdrawal
definition: 'The bounded enterprise context for **transitioning** propositions,

  products and services out of operational service in the

  **Product & Value** domain. This context addresses the

  retirement-stage work of withdrawal planning, stakeholder

  transition, and removal from operational reliance. v2.4.0 grounding

  (domain-grounding.md §3.5): proposition retirement and service

  withdrawal are the proposition-side retirement responsibilities;

  physical asset retirement is Enablement & Operations.

  '
scope:
  includes:
  - Retirement decision intake and withdrawal planning
  - Service withdrawal and stakeholder transition
  - Removal from operational reliance
  - Residual obligation identification and routing
  excludes:
  - Steady-state proposition operation (Operate stage; adjacent context)
  - Proposition improvement (Improve stage; adjacent context)
  - Physical asset decommissioning (enablement-operations x retire; adjacent domain)
  - Post-exit obligation closure work (Operate/Improve; adjacent contexts)
outcomes:
- Retired propositions are withdrawn from service in a controlled manner.
- Stakeholders are transitioned off the retired proposition.
- Operational reliance is removed with residual obligations routed.
adjacent_contexts:
- processes:pc-pv-conceive-fe9awk
