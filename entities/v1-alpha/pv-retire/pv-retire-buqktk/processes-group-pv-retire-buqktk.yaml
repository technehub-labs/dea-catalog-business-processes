name: Service Transition Retirement
definition: 'The bounded Process Group that organises the Business Process responsibilities of transitioning propositions, products and services out of operational service in the ProductAndValue x Retire context (withdrawal planning, stakeholder transition, removal from operational reliance).

  '
process_context: processes:pc-pv-retire-eeck6d
scope:
  includes:
  - Retirement decision intake and withdrawal planning
  - Service withdrawal and stakeholder transition
  - Removal from operational reliance
  excludes:
  - Steady-state proposition operation (Operate)
  - Physical asset decommissioning (enablement-operations)
  - Post-exit obligation closure (Operate/Improve)
outcomes:
- Retired propositions are withdrawn from service in a controlled manner with reliance removed.
