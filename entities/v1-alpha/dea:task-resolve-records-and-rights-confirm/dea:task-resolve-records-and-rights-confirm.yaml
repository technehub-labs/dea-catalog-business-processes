id: dea:task-resolve-records-and-rights-confirm
type: Task
name: Resolve Records and Rights Confirmation
definition: The bounded unit of work within `dea:activity-resolve-records-and-rights` (Resolve Records and Rights) that reconcile the closure-ready record pack against the records-retention schedule and the obligation-settlement contract, issue the closure-completion confirmation to the relationship custodian and the records custodian, and log the confirmation.
belongs_to_activity: dea:activity-resolve-records-and-rights
trigger: Bounded-work artefact produced for Resolve Records and Rights; confirm gate may reconcile against the governing contract and issue the completion confirmation to the relationship custodian.
outcome: Completion confirmation issued for Resolve Records and Rights and acknowledged by the relationship custodian and any governing-party notify-list; confirmation custodian passes custody to the records custodian.
responsibility: confirmation custodian
boundary:
  inclusions:
  - Reconciliation of the Resolve Records and Rights artefact against the governing contract and any notify-list requirements.
  - Issuance of the Resolve Records and Rights completion confirmation and acknowledgement logging.
  exclusions:
  - Long-term retention of the closure case file (phase 5).
  - Re-execution of prior phases on confirmation rejection.
evidence:
- source: Sarbanes-Oxley §802 records retention
  claim: US records-retention statute binding the retire-phase records custodian retention schedule to a regulator-recognised minimum. Bounded-work evidence for the confirm-phase custodian of `dea:activity-resolve-records-and-rights` (CR-BP-L4-02 enrichment).
  strength: E1
- source: GDPR Art 5(1)(e) storage limitation
  claim: data-protection storage-limitation principle binding the retire-phase storage-limitation rules and the record-phase cryptographic destruction attestation. Bounded-work evidence for the confirm-phase custodian of `dea:activity-resolve-records-and-rights` (CR-BP-L4-02 enrichment).
  strength: E1
- source: dea:activity-resolve-records-and-rights
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-02 cell-specific bounded-work prose for this PartyAndRelationship L4 Task.
  strength: E3
