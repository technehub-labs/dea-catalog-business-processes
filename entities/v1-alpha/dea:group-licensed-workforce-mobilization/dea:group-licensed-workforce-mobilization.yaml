id: dea:group-licensed-workforce-mobilization
type: ProcessGroup
version: 1.0.0

name: Licensed Workforce Mobilization

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of activating a workforce whose individuals must
  hold regulator-issued licences or registrations before performing
  live work, in the AgencyAndOrganization x Activate context where
  regulator-controlled scope, fitness-and-propriety attestation,
  supervised-training completion, and continuing-supervisor
  notification create a distinct group-level mobilization concern
  separate from general workforce build and from steady-state
  performance management.

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-ao-activate

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - "Regulator-issued licence or registration verification (FCA SMCR Statements of Responsibilities; US state healthcare licensure; NAIC producer licence; FAA/EASA crew licence; UK SRA practising certificate; US state bar admission)"
    - "Fitness-and-propriety attestation (SMCR; state healthcare; NAIC producer; FAA/EASA; SRA; bar)"
    - "Supervised-training completion record (SMCR; state healthcare; NAIC; FAA/EASA; SRA; bar)"
    - "Competency assessment for the licensed role"
    - "Enterprise's regulated-entity approval authority framework"
    - "Signing authority or controlled-function designation (SMCR CF1..CF11; NAIC producer line of authority; FAA/EASA type-rating; SRA role; bar area of practice)"
    - "Continuing-supervisor notification and continuing-oversight relationship activation"
    - "Regulated personnel record entry preserved for the licensed individual"
  excludes:
    - "Workforce recruitment, hiring, and general onboarding (AgencyAndOrganization x Build)"
    - "Steady-state workforce performance and development (AgencyAndOrganization x Operate / Improve)"
    - "Workforce offboarding and licence surrender (AgencyAndOrganization x Retire; CR-BP-73 adjacent cells)"
    - "Non-licensed workforce activation (deferred to a future CR)"
    - "Internal non-regulated personnel activation without regulator-issued licence prerequisite"
    - "Capabilities sourcing/licensing absent a regulator-controlled scope"

# Intended enterprise outcomes.
outcomes:
  - "The licensed or regulated workforce is mobilized under the enterprise's regulated-entity approval authority with regulator-controlled scope preserved (signing authority or controlled-function designation), fitness-and-propriety attestation recorded, supervised-training completion preserved, and continuing-supervisor notification activated, so that licensed individuals are live on the regulated personnel record under the regulator's continuing supervision."

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-licensed-workforce-mobilization
    target_id: dea:process-mobilize-licensed-workforce
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-80
      escape-clause discovery outcome (ADMIT-CANONICAL recommendation)
      landed by CR-BP-81. The discovery evidence (FCA SMCR, US state
      healthcare licensure, NAIC Producer Licensing Model Act,
      EASA/FAA crew licensing, UK SRA / US state bar admissions)
      activates the register v2 cell's verbatim escape condition:
      "workforce activation is often an attribute of build" is
      superseded by the regulator-controlled scope, fitness-and-
      propriety attestation, supervised-training completion, and
      continuing-supervisor notification that distinguish licensed
      mobilization from general build.
    provenance:
      type: architecture-review
      reference: CR-BP-81
      asserted_by: dea-team
      asserted_at: '2026-09-16'

# Process Group kind (PG-007 enforces controlled vocabulary).
