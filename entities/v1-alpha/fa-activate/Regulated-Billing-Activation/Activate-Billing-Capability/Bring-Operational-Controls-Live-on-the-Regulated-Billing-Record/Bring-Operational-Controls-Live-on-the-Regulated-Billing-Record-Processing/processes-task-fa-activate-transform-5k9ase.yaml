plain_language_name: 'Make the Billing Controls Live'
plain_language_description: 'With the framework verified, the processing custodian makes the go-live itself: the separation of duties, the audit trail, and the reconciliations are brought live and recorded onto the regulated billing record in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because controls on paper restrain no invoices - the go-live is where the authorization starts to mean trustworthy billing.'
practical_context: 'It starts once checking is complete and the verified framework is ready to be brought live, and it ends with the live controls produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the audit function brings the separation of duties, trail, and reconciliations live on the billing record.'
