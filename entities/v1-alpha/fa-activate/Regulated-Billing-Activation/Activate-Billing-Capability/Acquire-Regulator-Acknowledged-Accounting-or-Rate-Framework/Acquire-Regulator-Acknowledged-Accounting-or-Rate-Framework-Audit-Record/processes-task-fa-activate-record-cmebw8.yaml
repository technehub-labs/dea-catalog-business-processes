plain_language_name: 'File the Framework Acquisition Audit Record'
plain_language_description: 'At the close the records custodian preserves the acquisition trail at its required retention tier and sets the retrieval handles for it. What was filed, what the regulator acknowledged, and on what basis stays provable for the whole life of the framework.'
business_purpose: 'It exists so the regulator''s acknowledgment can be evidenced, with its history, whenever the basis for billing is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the acquisition trail at its retention tier and sets the retrieval handles a billing review would consult.'
