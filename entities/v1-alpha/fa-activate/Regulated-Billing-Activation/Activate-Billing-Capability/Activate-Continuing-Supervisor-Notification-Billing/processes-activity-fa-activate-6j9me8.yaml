plain_language_name: 'Activate the Continuing-Supervisor Notification'
plain_language_description: 'This activity switches on the standing notifications that keep the continuing supervisor informed while the regulator oversees the billing operation. The capability''s authorization and the supervisor relationship arrive as the inputs, the notification arrangements are put into active use and checked against them, and the issued notifications are recorded on the billing record. Oversight is thereby fed without having to ask.'
business_purpose: 'It exists so the supervising authority''s ongoing oversight of billing is fed by standing notification from the first invoice onward.'
practical_context: 'It runs as the billing capability approaches live service, once the authorization and the supervisor relationship are in place, and it completes when the issued notifications are confirmed and retained on the billing record.'
worked_example:
  agent_type: human
  narrative: 'An audit function officer puts the standing notifications to the supervising authority into active use against the billing capability''s authorization, and confirms the issued notification on the record.'
