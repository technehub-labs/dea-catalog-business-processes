  kind: functional
  scope: 'Governs the controlled activation of a billing or revenue- recognition capability whose live invoicing or revenue recognition is gated by regulator-acknowledged accounting or rate framework: regulator-acknowledged accounting or rate framework activation; tariff or pricing approval acquisition and recording; readiness-assessment evidence; supervised-test records; first-invoice or first-recognition runbook; operational controls (segregation of duties, audit trail, reconciliation) live on the regulated billing record; continuing-supervisor notification; regulated billing record entry preserved.'
  processes:
  - processes:process-fa-activate-bzfywk
