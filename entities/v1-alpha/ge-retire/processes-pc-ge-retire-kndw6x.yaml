schema: dea/v1
schema_version: 1
id: processes:pc-ge-retire-kndw6x
domain: GovernanceAndExistence
lifecycle_stage: Retire
name: Governance Unwind
process_context:
  id: processes:pc-ge-retire-kndw6x
  domain: GovernanceAndExistence
  lifecycle_stage: Retire
  scope_summary: Governance-bodies and policy-instrument retirement triggered by a regulator- or court-mandated order, distinct from voluntary governance sunset (Improve) and from adjacent Retire cells (asset decommissioning, counterparty closure, workforce wind-down, regulated entity run-off).
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: 'Governance & Existence: the wind-down of governance bodies, policy regimes, mandates, and constitutional instruments under regulator or court mandate (statutory dissolution, retained-records custodianship, policy sunset, governance-body quorum reduction, statutory dissolution filings, surrender of authorisation or cancellation of permission).'
  lifecycle_concern: 'Retire: governance unwind of an entity triggered by a regulator or court order.'
  combined_semantic_meaning: 'The regulator- or court-mandated governance unwind work that

    moves an enterprise governance regime from active operation to a

    documented, regulator- or court-supervised, governance-bodies-

    reduced-to-wind-down-quorum, mandates-rescinded, policies-sunset

    state, culminating in statutory dissolution filing and surrender

    of authorisation or cancellation of permission, with retained-

    records custodianship assigned per the service-of-process

    regime.

    '
  expected_outcomes:
  - The governance regime is wound down under the controlling regulator or court authority with governance bodies reduced to wind-down quorum per the controlling statute or regulator order.
  - Policy instruments are sunset per the governance constitution.
  - Statutory dissolution filings are submitted to the controlling authority (Secretary of State, AG Registry of Charities and Fundraisers, FCA, federal banking regulator, court clerk).
  - Retained-records custodianship is assigned per the service-of-process regime.
  - The entity is dissolved or the authorisation is cancelled per the regulator or court determination.
  inclusions:
  - Regulator- or court-issued mandatory dissolution, revocation, wind-down, or equivalent order
  - Governance-bodies reduction to wind-down quorum under the controlling statute or regulator order
  - Policy instrument sunset per the governance constitution
  - 'Statutory dissolution filings: certificate of dissolution filing with Secretary of State and forwarding to AG Registry of Charities and Fundraisers, FCA cancellation of permissions, federal banking regulator filings, court decree entry'
  - Retained-records custodianship assignment per the service-of-process regime
  - Successor-entity arrangements documentation
  - Surrender of authorisation or cancellation of permission per the regulator or court determination
  exclusions:
  - Voluntary governance sunset absent regulator or court mandate (GovernanceAndExistence x Improve per CR-BP-63)
  - Asset retirement and decommissioning (EnablementAndOperations x Retire; CR-BP-66)
  - Counterparty and agent relationship closure (PartyAndRelationship x Retire; CR-BP-67)
  - Product line retirement (ProductAndValue x Retire; CR-BP-67 adjacent)
  - Workforce wind-down under statutory mass-layoff thresholds (AgencyAndOrganization x Retire; CR-BP-73)
  - Regulated entity run-off (FinanceAndAccounting x Retire; CR-BP-75)
  adjacent_boundaries:
  - 'Voluntary governance sunset (GovernanceAndExistence x Improve; CR-BP-63) is out of scope: the trigger is regulator or court mandate, not an enterprise-internal governance decision.'
  - 'Asset retirement and decommissioning (EnablementAndOperations x Retire; CR-BP-66) is out of scope: this PC governs the governance regime, not the asset base.'
  - 'Counterparty and agent relationship closure (PartyAndRelationship x Retire; CR-BP-67) is out of scope: this PC governs the governance regime, not the counterparty base.'
  - 'Workforce wind-down under statutory mass-layoff thresholds (AgencyAndOrganization x Retire; CR-BP-73) is out of scope: this PC governs the governance regime, not the workforce.'
  - 'Regulated entity run-off (FinanceAndAccounting x Retire; CR-BP-75) is out of scope: this PC governs the governance regime, not the financial run-off accounting basis.'
