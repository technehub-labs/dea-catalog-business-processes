plain_language_name: 'Confirm the Filings Are Complete and Lodged'
plain_language_description: 'The confirmation custodian checks the record pack against dissolution law and the custodianship arrangements for retained records. With the reconciliation clean, the completion confirmation is received by the governance custodian and by the registrar of companies, which is then logged.'
business_purpose: 'It exists so the filings'' completion is acknowledged by the parties with standing to demand it, before the file is retired.'
practical_context: 'It starts once the record pack exists, and it closes when the acknowledgements are logged and custody passes to the records custodian.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian completes the reconciliation and logs the confirmation acknowledged by the governance custodian.'
