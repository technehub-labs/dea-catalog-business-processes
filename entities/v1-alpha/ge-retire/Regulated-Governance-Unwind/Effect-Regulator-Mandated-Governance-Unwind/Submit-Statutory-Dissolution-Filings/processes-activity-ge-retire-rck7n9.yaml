plain_language_name: 'Submit Statutory Dissolution Filings'
plain_language_description: 'This activity draws up, lodges, and records the dissolution paperwork the controlling statute and the order demand — tax-status termination, corporate dissolution at the registry, charity asset notifications, receivership reports, and the surrender notice — closing the entity''s official life. The reduced regime and settled custodianship arrive as the preconditions, the filings are prepared and lodged with each authority, and the recorded filings are confirmed for the record. The enterprise''s official existence ends in properly filed paperwork.'
business_purpose: 'It exists so the mandated dissolution is completed by properly lodged filings with every authority the law names.'
practical_context: 'It runs once the regime is reduced and custodianship is settled, and it completes when the lodged dissolution filings with each authority''s record are confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'A finance function officer lodges the dissolution filings with each authority — tax-status termination, corporate dissolution, charity notifications, receivership reports, surrender notice — and confirms them recorded.'
