plain_language_name: 'Wind Down Governance on a Regulator or Court Order'
plain_language_description: 'When a regulator or court orders the enterprise to dissolve or give up its authorisation, governance cannot simply stop; it has to be unwound in an orderly, supervised way. The remaining bodies shrink to the quorum the order allows, the policy instruments are retired one by one, and the required statutory dissolution filings go in. Custodians are named for the records that must be retained, and the process ends with dissolution, surrender of the authorisation, or the court''s decree entered.'
business_purpose: 'It ensures the enterprise exits lawfully and traceably, satisfying the regulator or court that every governance duty was closed out under supervision rather than abandoned.'
practical_context: 'Rare and exceptional, triggered only by a binding regulator or court order such as a mandatory wind-down, revocation, or receivership; the operations function and finance function execute the steps under the industry regulator''s supervision.'
worked_example:
  agent_type: human
  narrative: 'After a cease-and-desist order arrives, the operations function cuts the governing bodies back to the permitted wind-down quorum, the finance function submits the statutory dissolution filings, and the industry regulator watches each step through to decree entry.'
