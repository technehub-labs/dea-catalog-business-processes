description: Effect the regulator- or court-mandated governance unwind within the processes:pc-ge-retire-kndw6x Cell
  Charter. The trigger is a binding regulator or court order; the outcome is the documented, regulator-
  or court-supervised wind-down of governance bodies, policy instruments, mandates, and constitutional
  instruments, culminating in statutory dissolution filings, retained-records custodianship assignment,
  and surrender of authorisation or cancellation of permission or court decree entry.
trigger: A regulator or court issues a mandatory dissolution, revocation, wind-down, cease-and-desist,
  or equivalent order (FCA WDPG UK firm wind-down planning, California Corporations Code 5033-5034 dissolution,
  IRS 501(c)(3) federal tax-exempt dissolution obligations, state attorney-general charity oversight,
  federal banking regulator cease-and-desist, court receivership), triggering a formally governed unwind
  of governance bodies, policies, and mandates.
outcome: 'The governance regime is wound down under the controlling regulator or court authority: governance
  bodies are reduced to wind-down quorum per the controlling statute or regulator order, policy instruments
  are sunset per the governance constitution, statutory dissolution filings are submitted, retained-records
  custodianship is assigned per the service-of-process regime, and the entity is dissolved or authorisation
  surrendered per the regulator or court determination.'
identity:
  verb: Effect
  object: Regulator-Mandated Governance Unwind
  scope: enterprise
  outcome_statement: The governance regime is wound down under the controlling regulator or court authority
    with governance bodies reduced to wind-down quorum per the controlling statute or regulator order.
    Policy instruments are sunset per the governance constitution and audited for compliance with the
    dissolution plan. Statutory dissolution filings are prepared and submitted under the controlling quality
    standard. Retained-records custodianship is assigned per the service-of-process regime and audited
    for compliance. The entity is dissolved or authorisation surrendered or court decree entered per the
    regulator or court determination. Voluntary governance sunset is excluded to the Improve coordinate;
    asset retirement to E&O x Retire; counterparty closure to P&R x Retire; workforce wind-down to A&O
    x Retire; regulated entity run-off to F&A x Retire.
