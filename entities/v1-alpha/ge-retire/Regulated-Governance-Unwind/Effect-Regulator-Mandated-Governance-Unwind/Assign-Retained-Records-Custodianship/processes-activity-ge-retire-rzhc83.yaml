name: Assign Retained-Records Custodianship
definition: 'The cohesive grouping of work within Effect Regulator-Mandated Governance Unwind that assigns retained-records custodianship to a designated custodian (with the service-of-process agent retained for the duration of the statutory retention period), confirms the custodian accepts the role, and confirms the regulator or court is satisfied with the assignment.

  '
belongs_to_business_process: processes:process-ge-retire-mjq5hg
cohesion_rationale: Constituent work shares a single records-custodianship concern (the post-dissolution retention of entity records for the statutory period plus a service-of-process agent), one input class (order-scope register plus entity records plus statutory retention map), and one output (a documented custodian designation with regulator or court acknowledgement). Cohesion score 9/9 assessed at deposition (CR-BP-32 §6).
