plain_language_name: 'Carry Out the Custodianship Work and Assemble the Pack'
plain_language_description: 'With the certificate in hand, the processing custodian works the unwind: the order''s scope is assessed, the retained records find their designated custodian, governance shrinks to its wind-down minimum, and the dissolution filings are lodged. Everything produced is bundled into the record pack for confirmation.'
business_purpose: 'It exists so the records that must outlive the entity pass into a designated custodian''s hands as part of a defensible, evidenced unwind.'
practical_context: 'It opens when the verification certificate clears the pack, and it closes with the record pack produced and custody moving to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the operations function secures the custodian designation and lodges the filings, bundling the evidence into the record pack.'
