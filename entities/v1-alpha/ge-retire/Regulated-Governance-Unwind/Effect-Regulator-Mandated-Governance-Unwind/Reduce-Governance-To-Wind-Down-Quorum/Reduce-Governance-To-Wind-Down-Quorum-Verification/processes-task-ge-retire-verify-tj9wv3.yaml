plain_language_name: 'Check the Downscaling Plan Against Quorum Rules'
plain_language_description: 'The verification custodian examines the pack before the reduction executes: does it satisfy the dissolution statute, does it preserve the quorum the wind-down regime needs, and does it respect the custodianship contract for retained records? Deviations are reported with their fixes.'
business_purpose: 'It exists because stripping governance below the required quorum, or misreading the statute, would invalidate the reduced regime''s decisions.'
practical_context: 'It starts once the manifest is registered, and it ends when the certificate is out, deviations are remediated, and the processing custodian takes over.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the risk function confirms the downscaling plan keeps the wind-down quorum intact and clears the pack.'
