plain_language_name: 'Check the Wind-Down Papers Against Dissolution Law'
plain_language_description: 'The verification custodian tests the pack against the statute that governs dissolution, the quorum the wind-down regime must retain, and the custodianship arrangements for the records that will outlive the entity. Shortfalls are written up with their remedies before any scope work proceeds.'
business_purpose: 'It exists because a scope assessment built on papers that breach the statute would misdirect the entire unwind.'
practical_context: 'It starts once the intake manifest is registered, and it ends with the certificate issued, any deviations remediated, and custody passed to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the operations function confirms the retained-records inventory satisfies the custodianship contract and flags a gap for remediation.'
