plain_language_name: 'Work Through the Wind-Down Steps and Bundle the Evidence'
plain_language_description: 'With the certificate in hand, the processing custodian executes the unwind: the order''s reach is assessed, custodianship of the retained records is arranged, governance is scaled back to the quorum the wind-down requires, and the dissolution filings go in. The resulting record pack is bundled for formal confirmation.'
business_purpose: 'It exists so the binding order is answered step by step, with each step''s evidence gathered into one defensible pack.'
practical_context: 'It opens once the verification certificate clears the pack, and it closes with the record pack produced and custody handed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the operations function assesses the order''s reach, arranges custodianship for retained records, and bundles the evidence for confirmation.'
