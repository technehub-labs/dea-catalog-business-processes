plain_language_name: 'Assess Regulator or Court Order Scope'
plain_language_description: 'This activity reads the order from the regulator or the court, works out what it binds the enterprise to do and by when, and maps each obligation onto the governance bodies and instruments that must now stand down. The order arrives as the controlling authority, its scope is assessed and mapped, and the assessed scope is confirmed onward for the unwind. The enterprise learns exactly how much of itself it must now dismantle, and in what order.'
business_purpose: 'It exists so the mandated unwind proceeds against a complete, correct reading of what the order actually demands.'
practical_context: 'It opens the unwind when the dissolution, revocation, wind-down, or equivalent order is issued, and it completes once the assessed scope and its mapped obligations are confirmed onward.'
worked_example:
  agent_type: human
  narrative: 'A workforce management officer reads the regulator''s order line by line, maps each binding obligation and deadline onto the bodies and instruments affected, and confirms the assessed scope onward.'
