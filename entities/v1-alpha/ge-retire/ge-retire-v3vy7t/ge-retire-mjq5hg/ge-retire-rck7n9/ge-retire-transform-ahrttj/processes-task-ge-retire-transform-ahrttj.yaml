name: Submit Statutory Dissolution Filings Processing
definition: 'The bounded unit of work within `processes:activity-ge-retire-rck7n9` (Submit Statutory Dissolution Filings) that execute the wind-down: assess the regulator or court order scope, assign the retained-records custodianship, reduce the governance apparatus to the wind-down quorum, submit the statutory dissolution filings, and produce the wind-down-ready record pack conforming to the dissolution schema.'
belongs_to_activity: processes:activity-ge-retire-rck7n9
trigger: Verification certificate issued for Submit Statutory Dissolution Filings; transform gate may execute the bounded work and emit the conformant artefact under the Retire schema.
outcome: Bounded-work artefact produced for Submit Statutory Dissolution Filings conforming to the Retire schema; processing custodian passes custody to the confirmation custodian.
responsibility: processing custodian
boundary:
  inclusions:
  - Execution of the Submit Statutory Dissolution Filings bounded work producing the conformant artefact.
  - Application of the Submit Statutory Dissolution Filings schema and any derived classifications or computations.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Notification of governing parties outside the notify-list (phase 4).
evidence:
- source: Delaware DGCL §§275-283 (Dissolution)
  claim: statutory dissolution and winding-up provisions binding the retire-phase verification and the statutory dissolution filings. Bounded-work evidence for the transform-phase custodian of `processes:activity-ge-retire-rck7n9` (CR-BP-L4-03 enrichment).
