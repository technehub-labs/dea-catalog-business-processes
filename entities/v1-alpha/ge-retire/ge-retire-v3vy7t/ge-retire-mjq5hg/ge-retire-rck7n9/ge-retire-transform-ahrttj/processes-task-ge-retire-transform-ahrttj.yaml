- source: UK Insolvency Act 1986 Part IV
  claim: UK winding-up statute grounding the retire-phase wind-down quorum requirements and registrar filings. Bounded-work evidence for the transform-phase custodian of `processes:activity-ge-retire-rck7n9` (CR-BP-L4-03 enrichment).
  strength: E1
