cross_domain_findings:
- topic: Technology Management
  finding: CAND-019 (dea-catalog-business-capabilities) is held unmapped per N-006 / R-004; technology is an L5 layer concern,
    not an ECF domain.
  implication: No ECF coordinate carries Technology Management; for the 49-coordinate matrix there is no standalone Technology
    cell. Process candidates touching technology must declare their domain (enablement-operations x operate for run, strategy-direction
    x operate for build/asset).
  evidence:
  - dea-catalog-business-capabilities/docs/research/ecf-overlay-v0.2.yaml R-004
  - docs/research/boundary-decision-cand-019.yaml
  disposition: held_unmapped_propagated
- topic: Change Management
  finding: 'CR-DEA-BC-04 R-005: Change Management is cross-domain; earliest legitimate initiation is governance-existence
    x improve.'
  implication: A Change Management process may legitimately appear at governance-existence x improve; the 49-coordinate matrix
    lists it as the cross-cutting pattern, not as a duplicate cell.
  evidence:
  - CR-DEA-BC-04 R-005
  disposition: cross_cutting_recorded
- topic: Partner Management dual-home
  finding: 'CR-DEA-BC-04 R-001: Partner Management initiated at party-relationship x conceive; supply-side operation is legitimate
    participation.'
  implication: Treat strategy-direction x operate as legitimate participation, party-relationship x conceive as primary.
  evidence:
  - CR-DEA-BC-04 R-001
  disposition: dual_home_recorded
- topic: Resilience, Innovation, Analytics
  finding: CR-DEA-BC-04 R-006/R-007/R-008 lifted deferrals and admitted three capabilities (Resilience, Innovation, Analytics).
  implication: Their process surfaces are now under their primary coordinates (governance-existence x improve for Resilience;
    product-value x conceive for Innovation; enablement-operations x operate for Analytics).
  evidence:
  - CR-DEA-BC-04 R-006, R-007, R-008
  disposition: lifted_deferrals_reflected
- topic: Marketing placement
  finding: 'CR-DEA-BC-04 N-002: Marketing is distinct, not a child of Customer Management.'
  implication: Customer-demand x conceive has Marketing candidate; party-relationship x operate has customer relationship
    management. Distinct groups.
  evidence:
  - CR-DEA-BC-04 N-002
  disposition: boundary_clarified
ratification:
  version: 4
  cr: CR-BP-28
  ratified_at: '2026-09-08'
  ratified_accepted: 86
  backlog_deferred: 16
  deferred_rationale: 'Activate and Retire are lifecycle transition stages, not stable Process Group operating scopes. L1
    Process Groups (CR-BP-12) catalogue the bounded operating scope of a process domain; the Activate stage is the handover
    from Build to Operate (a sub-step of the receiving Process Group), and the Retire stage is the wind-down of the prior
    Process Group (a sub-step of the ending Process Group). Neither forms a stable L1 group on its own. Reconsider if a discrete
    Activate/Retire process identity is later identified (separate CR).

    '
  supersedes: version 2 (CR-BP-19, ratified 2026-09-07)
