plain_language_name: 'Check the Review Pack Against the Account Contracts'
plain_language_description: 'Before the reviews are held, the verification custodian tests the pack against the agreed cadence for account reviews and the contract governing how the accounts are run. Any deviation from the contracts is named with its fix.'
business_purpose: 'It exists because a review outside the agreed cadence breaks the promise the account was sold on.'
practical_context: 'It starts once the intake manifest is registered, and it ends with the report issued, deviations remediated, and custody passed to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in customer relationship management checks the review pack against the cadence contract and clears it.'
