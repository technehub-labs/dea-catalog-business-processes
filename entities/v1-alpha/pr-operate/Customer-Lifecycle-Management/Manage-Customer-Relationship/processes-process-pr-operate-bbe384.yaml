id: processes:process-pr-operate-bbe384
name: Manage Customer Relationship
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: 'Manage the day-to-day operation of an active customer

  relationship across its lifecycle (acquisition → onboarding

  → active use → renewal or win-back). The principal

  organizational locus is the Middle Line (sales / account

  management leadership); the work coordinates customer-

  facing resources, monitors the customer''s value exchange

  with the enterprise, and allocates attention and effort

  across the customer portfolio.

  '
trigger: 'A customer enters the active relationship lifecycle

  (post-onboarding handoff from the Activate stage) or an

  existing active customer signals a change in their

  relationship status (escalation, churn risk, renewal

  approaching, win-back opportunity).

  '
outcome: 'An active customer relationship is sustained across its

  lifecycle through allocation of attention, escalation

  handling, and renewal coordination.

  '
