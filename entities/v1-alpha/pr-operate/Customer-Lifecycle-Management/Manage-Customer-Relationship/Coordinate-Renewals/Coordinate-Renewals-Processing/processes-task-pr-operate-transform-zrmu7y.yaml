plain_language_name: 'Keep the Renewals Moving on Schedule'
plain_language_description: 'With the certificate in hand, the processing custodian works the operating rhythm: reviews are held with the accounts, attention is spread across the portfolio, escalations are resolved, and renewals are kept moving. The approaching terms are prepared and executed, and the results are produced as an outcomes pack ready for confirmation.'
business_purpose: 'It exists because a renewal missed at term is a relationship lost by calendar, not by choice.'
practical_context: 'It opens when the verification certificate clears the pack, and it closes with the outcomes pack produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in customer relationship management tracks the renewal calendar and keeps each approaching term on track.'
