id: processes:group-pr-operate-7ab3ma
type: ProcessGroup
version: 1.0.0
name: Customer Lifecycle Management
definition: 'The bounded Process Group that organizes the Business Process

  responsibilities of operating the customer lifecycle within the

  PartyAndRelationship x Operate context. This group captures the

  end-to-end work of sustaining an active customer relationship:

  ongoing management, escalation handling, renewal coordination,

  win-back, and portfolio allocation. The group is the canonical

  Process Group for the customer-lifecycle value stream; functional

  refinements (e.g. enterprise-customer management, SMB-customer

  management) specialize the L2 processes beneath it, not the

  group itself.

  '
process_context: processes:pc-pr-operate-pwue5a
scope:
  includes:
  - Account management for active customers
  - Customer escalation handling
  - Customer renewal coordination
  - Customer win-back coordination
  - Customer portfolio allocation
  excludes:
  - New customer acquisition (Conceive stage; adjacent context)
  - Customer onboarding implementation (Build stage; adjacent context)
  - Customer support ticket resolution (Support Staff BP, not L2)
  - Customer churn prediction modelling (Analytics BP, not L2)
outcomes:
- Active customer relationships are sustained across their lifecycle.
- Customer escalations are resolved within agreed service-level targets.
- Customer renewals are coordinated with minimal revenue leakage.
- Customer portfolio allocation is data-informed.
