id: processes:pc-pr-operate-pwue5a
domain: PartyAndRelationship
lifecycle_stage: Operate
name: Customer Relationship Operations
definition: 'The bounded enterprise context for the **operation** of

  customer relationships in the **customer and demand**

  domain. This context addresses the day-to-day management

  of active customer relationships — the work of

  allocating attention, handling escalations, and

  coordinating renewal or win-back activities.

  '
scope:
  includes:
  - Active customer relationship management
  - Customer escalation handling
  - Customer renewal coordination
  - Customer win-back activities
  - Customer portfolio allocation
  excludes:
  - New customer acquisition (Conceive stage)
  - Customer onboarding implementation (Build stage)
  - Customer support tickets (Support Staff BP, not L2)
outcomes:
- Active customer relationships are sustained across their lifecycle.
- Customer escalations are resolved within agreed service-level targets.
- Customer renewals are coordinated with minimal revenue leakage.
- Customer portfolio allocation is data-informed.
