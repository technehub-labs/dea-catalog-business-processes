  admission_basis: |
    Targeted escape-clause evaluation of the FinanceAndAccounting x
    Retire register cell against its verbatim deferral condition
    ("defer until a regulated unwind (e.g. mutual insurer run-off)
    requires a standalone group"). The discovery evidence finds
    that condition met: regulated run-off under PRA PS20/24 (UK, in
    force 30 June 2026), FSB Final Guidance on Insurance Resolution
    Strategies (2025), NAIC Model Regulation Service of Legal
    Process (Model 901), IFRS 17 Insurance Contracts (effective
    2023), IFRS 5 Non-current Assets Held for Sale and Discontinued
    Operations, ASC 205-30 Liquidation Basis of Accounting (FASB
    ASU 2013-07), ASC 944 Financial Services - Insurance, IRO Best
    Practice Guidance 2024 is a regulator-supervised, accounting-
    standards-mandated, boundary-clear transformation distinct
    from pre-run-off financial stewardship and from physical asset
    decommissioning. The escape clause is activated by the
    contemporary post-IFRS-17, post-PS20/24 regulatory landscape.
