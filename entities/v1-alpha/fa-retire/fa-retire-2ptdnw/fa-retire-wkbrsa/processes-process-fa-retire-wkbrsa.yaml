description: 'Conclude a regulated run-off of a financial entity (insurer, mutual, or run-off portfolio) under statutory run-off obligations within the dea:pc-fa-retire Cell Charter. See trigger and outcome for the bounded work this process owns; see identity.outcome_statement for the testable outcome the process produces.

  '
trigger: 'A regulator-acknowledged run-off authorisation is granted (PRA PS20/24 UK, FSB 2025, NAIC Model 901, or jurisdictional equivalent), triggering statutory accounting-basis transition and policyholder-priority creditor treatment.

  '
outcome: The regulated run-off of the financial entity (or run-off portfolio) is executed under the controlling regulator supervision with statutory accounting basis established and all policyholder claims adjudicated and paid. Reserving, capital adequacy, and asset-liability matching are maintained throughout the run-off period. Policyholder-priority credi
identity:
  verb: Conclude
  object: Regulated Run-Off
  scope: enterprise
  outcome_statement: The regulated run-off of the financial entity (or run-off portfolio) is executed under the controlling regulator supervision with statutory accounting basis established and all policyholder claims adjudicated and paid. Reserving, capital adequacy, and asset-liability matching are maintained throughout the run-off period. Policyholder-priority creditor treatment is applied to all policyholder claims. The entity authorisation is surrendered or the run-off portfolio is fully transferred, with solvent-exit certification (PRA) or run-off completion certification (FSB) obtained. Retained-records and service-of-process obligations are satisfied throughout the run-off and post-run-off retention period. Pre-run-off stewardship is coordinated out to Operate; physical asset decommissioning to EnablementAndOperations x Retire; counterparty closure to PartyAndRelationship x Retire; non-insurance regulated wind-downs are deferred.
  evidence_links:
  - type: regulation
    ref: https://www.bankofengland.co.uk/prudential-regulation/publication/2024/december/solvent-exit-planning-for-insurers-policy-statement
  - type: regulation
    ref: https://www.fsb.org/uploads/Final-guidance-on-insurance-resolution-strategies.pdf
  - type: standard
    ref: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-17-insurance-contracts/
  - type: standard
    ref: https://www.cpajournal.com/2019/07/23/liquidation-basis-accounting-and-reporting
  - type: regulation
    ref: https://content.naic.org/sites/default/files/inline-files/mdl_901.pdf
  - type: standard
    ref: https://www.actuaries.org.uk/system/files/field/document/IRO%2520Best%2520Practice%2520Guidance%25202024.pdf
