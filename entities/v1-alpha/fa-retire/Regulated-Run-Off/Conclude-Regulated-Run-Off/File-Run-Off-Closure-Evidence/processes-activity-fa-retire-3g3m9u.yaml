plain_language_name: 'File Run-Off Closure Evidence'
plain_language_description: 'This activity assembles the closing evidence — the final accounts, proof the claims are cleared, the plan for what remains of the assets, and the ask to give up the licence — and files it with the regulator for acknowledgement. The final financial position arrives with the clearance certificate and the distribution plan, the submission is prepared and filed, and the regulator''s acknowledgement is confirmed for the record. The run-off ends by demonstrating it has ended.'
business_purpose: 'It exists so the run-off closes with formal, filed evidence that everything it owed has been done.'
practical_context: 'It runs once the claims are adjudicated and the final position is struck, and it completes when the filed closure submission with the regulator''s acknowledgement is confirmed and the residual distribution recorded.'
worked_example:
  agent_type: human
  narrative: 'A finance officer files the closure submission with the controlling regulator — final accounts, the claim clearance certificate, the residual-asset distribution plan, and the licence surrender request — and confirms the acknowledgement.'
