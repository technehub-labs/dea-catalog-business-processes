plain_language_name: 'Check the Pieces Before the Submission Goes'
plain_language_description: 'Before anything is filed, the verification custodian checks the accounts, certificate, and distribution against what filing requires - that every piece the regulator expects is present and none arrived half-drawn. Defects are logged for rejection or repair before the submission goes.'
business_purpose: 'It exists so the regulator never receives an ending with pieces missing from it.'
practical_context: 'It runs once the intake is registered and the pieces can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the surrender request absent from the assembly and logs the defect before the submission goes.'
