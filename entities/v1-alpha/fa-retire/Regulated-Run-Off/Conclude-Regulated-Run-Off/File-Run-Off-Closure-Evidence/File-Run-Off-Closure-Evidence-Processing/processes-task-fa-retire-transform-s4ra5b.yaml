plain_language_name: 'Assemble the Ending and Hand It to the Regulator'
plain_language_description: 'With the materials verified, the processing custodian does the assembling itself: the final accounts, the clearance certificate, the distribution plan, and the surrender request are bound into the closure submission and filed, set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because a run-off that ends without evidence never really ends - the filing is what asks the regulator to close the book.'
practical_context: 'It starts once checking is complete and the verified materials are ready to be assembled, and it ends with the filed submission produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the operations function binds the ending into its submission and hands it to the regulator, keeping the working papers.'
