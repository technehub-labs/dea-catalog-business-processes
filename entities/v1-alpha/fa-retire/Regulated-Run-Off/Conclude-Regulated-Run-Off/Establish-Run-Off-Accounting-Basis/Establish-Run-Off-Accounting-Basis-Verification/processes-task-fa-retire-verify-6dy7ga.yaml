plain_language_name: 'Check the Rule Set Before Moving the Books'
plain_language_description: 'Before anything is restated, the verification custodian checks the position and rules against what transitioning requires - that the position is the going-concern one and the rule set is the regulator''s own. Defects are logged for rejection or repair before the moving begins.'
business_purpose: 'It exists so the books never change basis under rules nobody acknowledged.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the rule set lacking the regulator''s acknowledgment and logs the defect before the moving begins.'
