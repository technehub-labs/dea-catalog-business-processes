plain_language_name: 'File the Accounting Basis Audit Record'
plain_language_description: 'At the close the records custodian preserves the transition trail at its required retention tier and sets the retrieval handles for it. How the books changed their basis, and what the move adjusted, stays readable whenever the run-off''s accounts are examined.'
business_purpose: 'It exists so the change of accounting basis can be evidenced whenever the run-off''s accounts are questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the transition trail at its retention tier and sets the retrieval handles a run-off accounts review would consult.'
