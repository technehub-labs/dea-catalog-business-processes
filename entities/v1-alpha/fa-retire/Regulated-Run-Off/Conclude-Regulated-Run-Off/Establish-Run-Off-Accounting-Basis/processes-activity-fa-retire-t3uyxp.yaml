plain_language_name: 'Establish Run-Off Accounting Basis'
plain_language_description: 'This activity moves the books off their going-concern footing and onto the run-off statutory basis the regulator requires, reworking how value is recognized, how liabilities are measured, and which assets still count. The going-concern position, the run-off authorisation, and the controlling rule set arrive together, the transition is executed and its adjustments recorded, and the run-off statutory accounts are confirmed onward. The enterprise''s financial story formally changes its ending here.'
business_purpose: 'It exists so the winding-down entity reports on the statutory basis its run-off regime demands from day one.'
practical_context: 'It opens the run-off once the authorisation is granted, transitioning the statements from going-concern to the statutory basis, and it completes when the run-off statutory accounts with basis-of-preparation disclosure are confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'A finance officer transitions the statements from going-concern to the run-off statutory basis under the controlling rule set, records the transition adjustments, and confirms the run-off accounts.'
