plain_language_name: 'Confirm the Maintained Reserving Discipline'
plain_language_description: 'When the discipline stands kept, the confirmation custodian reconciles it against the outcome the activity set out to reach and issues the confirmation. The run-off learns its reserve is tended, its capital watched, and its corrections made.'
business_purpose: 'It exists so the run-off relies only on a reserve confirmed as tended.'
practical_context: 'It begins once preparation is complete and the maintained discipline awaits its consumers, and it closes with the confirmation issued, consumers informed, and the result reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the tended reserve against the activity''s intended outcome and issues the confirmation the run-off needs.'
