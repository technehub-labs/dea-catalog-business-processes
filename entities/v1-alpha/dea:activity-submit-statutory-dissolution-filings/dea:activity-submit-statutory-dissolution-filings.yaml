id: dea:activity-submit-statutory-dissolution-filings
type: Activity
version: 1.0.0
lifecycle_status: candidate
status: candidate

name: Submit Statutory Dissolution Filings

definition: |
  The cohesive grouping of work within Effect Regulator-Mandated Governance Unwind that prepares, executes, and records the statutory dissolution filings required by the controlling statute or regulator or court, including IRS tax-status termination filings, Secretary of State corporate dissolution filings, Attorney General charity asset-disposition notifications, court reports for receivership termination, and FCA authorisation surrender notifications.

belongs_to_business_process: dea:process-effect-regulator-mandated-governance-unwind

cohesion_rationale: "Constituent work shares a single statutory-filing concern (the regulated filings required to dissolve the entity or surrender authorisation under the controlling authority), one input class (order-scope register plus reduced governance regime plus entity records), and one output (filed and recorded statutory dissolution submissions with filing receipts preserved). Cohesion score 9/9 assessed at deposition (CR-BP-32 §6)."

decomposition_boundary: l4-reached

