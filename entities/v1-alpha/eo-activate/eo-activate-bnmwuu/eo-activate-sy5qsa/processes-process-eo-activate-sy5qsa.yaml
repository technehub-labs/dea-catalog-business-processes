id: processes:process-eo-activate-sy5qsa
name: Activate Operations Capability
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
trigger: An operations capability requires formal regulator-issued authorization or certification before it may enter live service (aviation AOC under EASA Part-OR or FAA Part 119; PSD2 / ECB / PRA payment-institution authorization under PSD2 Articles 11 and 28; EMA / FDA / MHRA GMP certification; MiCA Article 59 crypto-asset-service-provider authorization; ORR / ERA rail safety-case authorization; nuclear operations authorization).
outcome: The operations capability is formally activated with the regulator's authorization on record, operations manuals and runbooks live, operational controls (incident management, capacity, security, compliance) live, and the supervisor's continuing-oversight relationship active.
description: Activate an operations capability under the enterprise's regulated-entity approval authority within the dea:pc-oe-activate Cell Charter. The trigger is a regulator-issued authorization or certification gating live service; the outcome is the capability live on the regulated operations record with the supervisor's continuing-oversight relationship active and operational controls running, so that the operations capability moves from regulator-authorized-but-not-live to regulator-authorized-and-live. Distinct from general capability build (Build coordinate) and from steady-state operation (Operate coordinate).
process_specialization: []
process_identity:
  boundary_face: regulated-entity approval authority
  identity_kind: canonical
  is_process: true
  is_project: false
process_scope:
  includes:
  - Regulator-issued authorization or certification acquisition and recording (EASA / FAA AOC; PSD2 / ECB / PRA payment-institution authorization; EMA / FDA / MHRA GMP; FAA Part 119; MiCA Article 59; ORR / ERA rail safety case; nuclear operations authorization; payments-issuer authorization under PSD2 Article 11)
  - Operations capability description and readiness-assessment evidence (supervised-test records, operational-control framework, service-level commitments)
  - Continuing-supervisor notification activation under the regulator's continuing oversight
  - Operations manuals and runbooks live
  - Operational controls (incident management, capacity, security, compliance) live on the regulated operations record
  - Regulated operations record entry preserved for the activated operations capability
  excludes:
  - Operations capability conception and design (EnablementAndOperations x Conceive / Design)
  - Operations capability build and configuration (EnablementAndOperations x Build)
  - Steady-state operations performance management (EnablementAndOperations x Operate)
  - Operations capability decommission and deregistration (EnablementAndOperations x Retire)
  - Non-regulated operations-capability activation (internal-product go-live without regulator's authorization)
