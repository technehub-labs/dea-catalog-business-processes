schema: dea/v1
schema_version: 1
id: processes:pc-eo-activate-xdfscw
domain: EnablementAndOperations
lifecycle_stage: Activate
name: Activate Operations Capability
process_context:
  id: processes:pc-eo-activate-xdfscw
  domain: EnablementAndOperations
  lifecycle_stage: Activate
  scope_summary: Governed activation of an operations capability whose live service is gated by formal regulator-issued authorization or certification, distinct from capability build and from steady-state operation.
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: 'Enablement & Operations: the controlled activation of an operations capability whose live service is gated by regulator-issued authorization or certification (AOC; PSD2 / MiCA payment-institution authorization; GMP; FAA Part 119; ORR / ERA rail safety case; nuclear operations authorization), with the regulator''s continuing-oversight relationship active and operational controls live on the regulated operations record -- distinct from capability build and from steady-state operation.'
  lifecycle_concern: 'Activate: the live-readiness activation of an operations capability, moving it from regulator-authorized-but-not-live to regulator-authorized-and-live under the regulator''s continuing oversight.'
  combined_semantic_meaning: 'The regulated-operations activation work that moves an operations

    capability from regulator-authorized-but-not-live to regulator-

    authorized-and-live under the enterprise''s regulated-entity

    approval authority, with the regulator''s authorization on record,

    operations manuals and runbooks live, operational controls

    (incident management, capacity, security, compliance) live, and

    the supervisor''s continuing-oversight relationship active, so

    that the operations capability is formally live on the regulated

    operations record under the regulator''s continuing supervision.

    '
  expected_outcomes:
  - Regulator's authorization on record for the operations capability (AOC; PSD2 payment-institution authorization; GMP; FAA Part 119; MiCA Article 59; ORR / ERA rail safety case; nuclear operations authorization; payments-issuer authorization under PSD2 Article 11)
  - Operations manuals and runbooks live under the regulator's continuing oversight
  - Operational controls (incident management, capacity, security, compliance) live on the regulated operations record
  - Continuing-supervisor notification issued and supervisor's continuing-oversight relationship active
  - Readiness-assessment evidence (supervised-test records, operational-control framework, service-level commitments) recorded
  - Regulated operations record entry preserved for the activated operations capability
  inclusions:
  - Regulator-issued authorization or certification acquisition and recording (EASA / FAA AOC; PSD2 / ECB / PRA payment-institution authorization; EMA / FDA / MHRA GMP; FAA Part 119; MiCA Article 59; ORR / ERA rail safety case; nuclear operations authorization; payments-issuer authorization under PSD2 Article 11)
  - Operations capability description and readiness-assessment evidence (supervised-test records, operational-control framework, service-level commitments)
  - Continuing-supervisor notification activation under the regulator's continuing oversight
  - Operations manuals and runbooks live
  - Operational controls (incident management, capacity, security, compliance) live on the regulated operations record
  - Regulated operations record entry preserved for the activated operations capability
  exclusions:
  - Operations capability conception and design (EnablementAndOperations x Conceive / Design)
  - Operations capability build and configuration (EnablementAndOperations x Build)
  - Steady-state operations performance management (EnablementAndOperations x Operate)
  - Operations capability decommission and deregistration (EnablementAndOperations x Retire)
  - Non-regulated operations-capability activation (internal-product go-live without regulator's authorization) -- RECORD-PATTERN or MERGE per CR-BP-63 baseline
  - Capabilities sourcing or licensing absent a regulator-issued authorization regime
  adjacent_boundaries:
  - 'processes:pc-eo-build-zwkhxc (adjacent context): the Build cell handles operations-capability construction and configuration; the Activate cell governs the regulator-issued authorization step that moves the capability from authorized-but-not-live to authorized-and-live.'
  - 'processes:pc-eo-operate-ydqb96 (adjacent context): the Operate cell handles steady-state operations performance management; the Activate cell only governs the regulator-issued activation step.'
  - 'processes:pc-eo-retire-nw3ynf (adjacent context): the Retire cell handles operations-capability decommission and deregistration; the Activate cell handles the regulated live-readiness activation.'
  - 'processes:pc-ao-activate-kusw2u (sibling cell, CR-BP-81): the A&O Activate cell governs regulator-controlled individual-workforce mobilization; the EO Activate cell governs regulator-authorized operations-capability activation -- separate concerns (individual vs capability).'
  - 'processes:pc-pv-activate-f7kne7 (sibling cell, CR-BP-71-era): the PV Activate cell governs product/service transition-to-service; the EO Activate cell governs operations-capability activation under regulator-issued authorization.'
process_groups:
