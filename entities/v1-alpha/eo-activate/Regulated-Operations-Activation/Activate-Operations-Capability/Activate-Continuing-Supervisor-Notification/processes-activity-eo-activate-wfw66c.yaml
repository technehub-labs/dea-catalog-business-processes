plain_language_name: 'Activate the Continuing-Supervisor Notification'
plain_language_description: 'This activity switches on the standing notifications that keep the continuing supervisor informed under the regulator''s ongoing oversight. The capability''s authorization and the supervisor relationship arrive as the inputs, the notification arrangements are put into active use and checked against them, and the issued notifications are recorded on the operations record. From then on, oversight does not wait to be asked; it is told.'
business_purpose: 'It exists so the supervising authority''s continuing oversight is fed by standing notification from the moment the capability goes live.'
practical_context: 'It runs as the capability approaches live service, once the authorization is on record and the supervisor relationship is set, and it completes when the issued notifications are confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'A compliance function officer puts the standing notifications for the supervising authority into active use against the capability''s fresh authorization, and confirms the issued notification on the operations record.'
