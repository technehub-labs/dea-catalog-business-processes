plain_language_name: 'Switch On the Continuing-Supervisor Notification'
plain_language_description: 'With the inputs verified, the processing custodian makes the activation itself: the continuing-supervisor notification is activated under the regulator''s continuing oversight, and the issued notification is set down on the regulated operations record in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because an authorization is not the end - live operations run under continuing oversight, and the notification is where that oversight begins.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be activated from, and it ends with the issued notification produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian activates the continuing-supervisor notification under the oversight regime and records it on the regulated operations record.'
