plain_language_name: 'Bring the Operational Controls Live'
plain_language_description: 'This activity switches the capability''s everyday operational controls on and records them as live. The regulator-mandated control framework and the fresh authorization come in together, each control — incident handling, capacity, security, compliance — is brought into active use and checked against the framework, and the live state is written onto the operations record. The capability thereby runs under its controls from its first day, not after them.'
business_purpose: 'It exists so operational controls are demonstrably running when live service starts, as the regulator''s framework requires.'
practical_context: 'It runs late in activation, once the authorization is on record, and it completes when the controls'' live state is confirmed on the regulated operations record and retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function lead brings each control in the mandated framework — incident handling, capacity, security, and compliance — into active use, checks the set against the framework, and has the live state recorded on the operations record.'
