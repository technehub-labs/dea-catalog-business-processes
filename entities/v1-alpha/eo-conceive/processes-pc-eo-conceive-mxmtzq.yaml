plain_language_name: 'Operations Model and Enablement Conception'
plain_language_description: 'This context covers the Enablement & Operations area at the Conceive stage: framing how the enterprise will produce and deliver. It shapes operations strategy, settles the delivery model, and sets the broad approach to technology enablement and physical assets. Detailed designs and construction follow in later contexts.'
business_purpose: 'To commit early to an operations and enablement approach so later design and build decisions share one coherent intent.'
practical_context: 'Encountered early in planning horizons, before major investment in facilities or platforms, when the question is how work should get done rather than doing it.'
worked_example:
  agent_type: human
  narrative: 'Considering a shift toward regional fulfilment, the Enablement & Operations Process Owner frames three delivery model options with their cost and service implications and recommends one for detailed design.'
