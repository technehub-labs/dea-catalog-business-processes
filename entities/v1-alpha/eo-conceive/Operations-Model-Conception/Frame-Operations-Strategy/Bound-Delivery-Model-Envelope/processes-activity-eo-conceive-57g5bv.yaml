plain_language_name: 'Set the Delivery Model Envelope'
plain_language_description: 'This activity draws the outer limits within which the delivery model must be conceived — the envelope the strategy mandates for the conception and design stages. The assessed context arrives as the basis, the envelope''s bounds are worked out and reviewed against it, and the bounded envelope is confirmed onward for the enablement and asset direction. Broadly what kind of delivery machine this will be is settled here.'
business_purpose: 'It exists so the delivery model conceived later stays inside limits the strategy actually chose.'
practical_context: 'It follows the context assessment, when the assessed picture is presented for bounding, and it completes once the bounded envelope is confirmed for the companion direction-setting.'
worked_example:
  agent_type: human
  narrative: 'A strategy function lead draws the delivery envelope''s bounds from the assessed context, checks them with the operations function, and confirms the envelope for the enablement and asset direction work.'
