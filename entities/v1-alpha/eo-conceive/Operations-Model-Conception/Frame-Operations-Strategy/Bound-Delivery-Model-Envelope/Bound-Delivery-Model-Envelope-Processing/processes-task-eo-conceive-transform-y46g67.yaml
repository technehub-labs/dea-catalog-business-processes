plain_language_name: 'Draw the Delivery Model Envelope the Strategy Mandates'
plain_language_description: 'With the context verified, the processing custodian does the bounding itself: the delivery model envelope the strategy will mandate for conception and design is worked out and set down in the form the activity defines. Working papers behind the bounds are preserved.'
business_purpose: 'It exists because a strategy without an envelope delegates every decision downstream - the envelope is what the strategy actually mandates.'
practical_context: 'It starts once checking is complete and the verified context is ready to be bounded from, and it ends with the bounded envelope produced and the working papers kept.'
