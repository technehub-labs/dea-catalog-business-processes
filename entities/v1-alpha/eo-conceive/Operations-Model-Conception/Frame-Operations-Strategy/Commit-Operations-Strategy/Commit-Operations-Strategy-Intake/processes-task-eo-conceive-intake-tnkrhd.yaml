plain_language_name: 'Receive the Framed Pieces for the Strategy Commit'
plain_language_description: 'The commit opens when the assessed context, bounded envelope, and framed directions are handed over together as the pieces the strategy must be consolidated from. The intake custodian accepts them, registers them with audit identifiers, and starts the commitment from a recorded base.'
business_purpose: 'It exists so the strategy is committed from registered pieces rather than from a loose sheaf of framings.'
practical_context: 'It opens when the framed pieces are presented for the commitment, with the activity owner alerted, and it closes with the intake registered and the remaining steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the context, envelope, and directions as the commitment baseline, with audit references, and opens the consolidation.'
