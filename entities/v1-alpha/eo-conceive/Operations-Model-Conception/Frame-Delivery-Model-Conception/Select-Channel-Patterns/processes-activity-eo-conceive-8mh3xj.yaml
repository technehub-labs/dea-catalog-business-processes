plain_language_name: 'Select Channel Patterns'
plain_language_description: 'This activity chooses which channel patterns, of the options open to it, the delivery model will use to reach and serve customers. The operations strategy envelope and the customer journey designs arrive as the basis, the options are weighed and a set chosen, and the selection is confirmed onward for the service-level work. How customers will be reached is thereby settled in principle.'
business_purpose: 'It exists so the delivery model commits early to how it will reach customers, before detail design begins.'
practical_context: 'It opens the delivery model conception, once the strategy envelope and customer journey designs are to hand, and it completes when the chosen channel set is confirmed for the service-level framing.'
worked_example:
  agent_type: human
  narrative: 'A strategy function lead weighs the channel options against the strategy envelope and the customer journeys, picks the set the model will use, and confirms the selection with the operations function.'
