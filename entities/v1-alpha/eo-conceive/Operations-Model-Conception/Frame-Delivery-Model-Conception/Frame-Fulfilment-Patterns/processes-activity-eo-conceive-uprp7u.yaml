plain_language_name: 'Frame Fulfilment Patterns'
plain_language_description: 'This activity settles how products will be fulfilled — made to order, made to stock, or a blend of the two — within the bounds already set. The demand thesis and the bounded envelope arrive as the inputs, the pattern options are weighed and a set chosen, and the fulfilment approach is confirmed onward for commitment. The model now knows not just how it sells but how it supplies.'
business_purpose: 'It exists so the delivery model commits to a fulfilment approach that its demand thesis and service bounds can actually sustain.'
practical_context: 'It follows the bounding of service levels, when the demand thesis and bounded envelope are to hand, and it completes once the fulfilment pattern set is confirmed for the conception''s commitment.'
worked_example:
  agent_type: human
  narrative: 'An operations function lead weighs make-to-order, make-to-stock, and blended options against the demand thesis and the agreed envelope, picks the fulfilment set, and confirms it with the strategy function.'
