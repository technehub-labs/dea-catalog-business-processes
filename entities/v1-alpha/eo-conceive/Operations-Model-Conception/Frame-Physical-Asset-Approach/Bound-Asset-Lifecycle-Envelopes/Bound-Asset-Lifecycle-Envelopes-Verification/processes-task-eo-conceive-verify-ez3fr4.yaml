plain_language_name: 'Check the Principles Before Bounding the Envelopes'
plain_language_description: 'Before any envelope is drawn, the verification custodian checks the principles against what bounding requires - that they cover acquisition, renewal, and retirement questions. Defects are flagged for rejection or repair before any envelope is drawn.'
business_purpose: 'It exists so lifecycle postures are never set inside principles that answer only part of the life.'
practical_context: 'It runs once the intake is registered and the principles can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the principles silent on retirement and logs the defect before any envelope is drawn.'
