plain_language_name: 'Assess Footprint Options'
plain_language_description: 'This activity puts the candidate site-and-capacity options side by side and weighs each against the agreed principles. The principles and the market geography arrive as the frame, options are assessed and a recommended set is drawn out, and the assessed options are confirmed onward for the lifecycle bounding. Choice among footprints becomes a reasoned comparison, not a hunch.'
business_purpose: 'It exists so the enterprise''s footprint commitment rests on options tested against principles, with a recommendation anyone can audit.'
practical_context: 'It follows the framing of footprint principles, when the options and the market geography are presented, and it completes once the assessed option set is confirmed for the lifecycle bounding.'
worked_example:
  agent_type: human
  narrative: 'An operations function lead weighs each candidate footprint option against the agreed principles and the market geography, draws out the recommended set, and confirms the assessment for the lifecycle bounding.'
