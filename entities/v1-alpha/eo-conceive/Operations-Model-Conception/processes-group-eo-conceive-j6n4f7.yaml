plain_language_name: 'Operations Model Conception'
plain_language_description: 'This family frames how the enterprise will make and deliver before anything is built. Its processes set the operations strategy, conceive the delivery model, sketch how technology will enable the work, and decide the handling of physical assets — the shared thinking that later design and build follow.'
business_purpose: 'To agree early on how production, delivery, technology and physical assets will combine, so downstream design starts from one coherent operations model.'
practical_context: 'Encountered in the Conceive stage, when leadership is shaping the operations model ahead of detailed design and build.'
worked_example:
  agent_type: human
  narrative: 'Planning a new service, the Enablement & Operations Process Owner runs the framing workshop: the operations strategy is set, the delivery model is conceived, the technology enablement approach is sketched, and the approach to physical assets — own or lease — is decided.'
