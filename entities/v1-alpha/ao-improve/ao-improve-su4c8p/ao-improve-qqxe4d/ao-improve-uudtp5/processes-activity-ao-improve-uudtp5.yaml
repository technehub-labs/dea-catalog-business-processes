type: Activity
name: Notify Continuing Supervisor Of Improvement
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Improve Regulated Workforce Capability
  that Notify the continuing supervisor of each regulator-licensed role of the recorded
  improvement: the recurrent training completion, the fit-and-proper re-assessment,
  the remediation completion, and the regulator continuing-supervision framework status.
  Shared concern: supervisor notification of improvement. Input: the improvement record;
  the supervisor notification path. Output: the supervisor notification record.'
belongs_to_business_process: processes:process-ao-improve-qqxe4d
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single notify continuing supervisor of improvement concern,
  one input class, and one output (the notify continuing supervisor of improvement
  record on the regulated personnel record).
