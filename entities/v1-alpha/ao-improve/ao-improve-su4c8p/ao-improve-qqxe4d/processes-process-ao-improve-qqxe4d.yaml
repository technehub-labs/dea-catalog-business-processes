id: processes:process-ao-improve-qqxe4d
name: Improve Regulated Workforce Capability
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: >-
  Improve the regulator-tied capability of regulator-licensed roles under the enterprise regulated-entity approval authority. The trigger is the regulator-mandated continuing-competence program cycle or a remediation requirement. The outcome is regulator-tied capability improvement recorded on the regulated personnel record: regulator-mandated training cycles (FCA SMCR fit-and-proper annual assessment under SYSC 25 / FIT; state bar MCLE; state healthcare CME; NAIC CE; FAA Part 121 subpart Y recurrent training; EU AI Act Article 14 ongoing training), fit-and-proper re-assessment cycles, regulator-mandated remediation programs executed, and the continuing-supervisor notified.
trigger: >-
  The enterprise is improving regulator-licensed roles' capability through regulator-mandated continuing-competence programs, fit-and-proper annual assessments, recurrent training, and remediation programs that differ from substrate-neutral learning-and-development operations, and the improvement must align to the regulator's continuing-supervision framework before being recorded on the regulated personnel record.
outcome: >-
  The regulator-licensed roles' capability is improved per the regulator's continuing-competence framework; regulator-mandated training, fit-and-proper re-assessment, and remediation cycles are recorded on the regulated personnel record, and the continuing-supervisor has been notified.
identity:
  verb: Improve
  object: Regulated Workforce Capability
  scope: enterprise
  outcome_statement: >-
    The regulator-tied Regulated Workforce Capability improve work has been carried out
    at the AgencyAndOrganization x Improve coordinate under the enterprise
    regulated-entity approval authority. The outcome is recorded on the regulated
    personnel record with the supervisor-controlled scope, the fitness-and-propriety
    attestation regime, the supervised-training completion requirements, and the
    continuing-supervisor notification path documented per the regulator's
    continuing-supervision framework. Substrate-neutral improve work is
    excluded. Adjacent lifecycle stages (Conceive / Design / Build / Activate /
    Operate / Improve / Retire) are excluded.
