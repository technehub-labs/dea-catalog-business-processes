name: Agent and Organization Improvement
definition: 'The bounded Process Group that organises the Business Process responsibilities of improving agents and the organization in the AgencyAndOrganization x Improve context: agent and organization development, engagement and alignment review, capability gap analysis, and structural reorganization. v2.4.0 grounding (domain-grounding.md §3.3).

  '
process_context: processes:pc-ao-improve-qkmh6b
scope:
  includes:
  - Agent and organization development
  - Engagement and alignment review
  - Capability gap analysis
  - Structural reorganization
  excludes:
  - Continuous improvement of business capabilities (owning domains)
  - Learning delivery operation (Operate stage; adjacent context)
outcomes:
- Agents and the organization are developed on evidence.
- Engagement, alignment, and capability gaps are reviewed.
- Structures are reorganized with transition sequencing.
