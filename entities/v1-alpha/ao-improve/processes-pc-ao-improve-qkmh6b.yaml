plain_language_name: 'Agent Development and Organization Improvement'
plain_language_description: 'This context covers the Agency & Organization area at the Improve stage: making the organization and its agents better over time. It runs engagement and alignment reviews, analyses capability gaps, commits reorganizations where warranted, and drives agent performance improvement. Routine supervision of people at work belongs to the operating context next door.'
business_purpose: 'To keep the workforce and agent base effective by closing capability gaps and adapting structure as evidence accumulates.'
practical_context: 'Encountered after survey cycles, performance reviews, or structural reviews, when findings point to gaps that need a deliberate response rather than day-to-day correction.'
worked_example:
  agent_type: human
  narrative: 'Following a dip in engagement scores, the Agency & Organization Process Owner commissions a capability gap analysis, agrees a targeted reorganization, and commits an improvement plan for the underperforming agent group.'
