plain_language_name: 'Check the Transition Record Before Logging the Handovers'
plain_language_description: 'Before any handover is logged, the verification custodian checks the executed transition against what recording requires - that the record shows every accountability that moved and who it moved to. Defects are logged for rejection or repair before the handovers are written.'
business_purpose: 'It exists so no handover goes unlogged because the transition record missed the movement.'
practical_context: 'It runs once the intake is registered and the transition can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a role whose accountability moved without appearing in the record and logs the defect before handovers are written.'
