plain_language_name: 'Check the Findings and Direction Before Scoping'
plain_language_description: 'Before any scope is fixed, the verification custodian checks the findings and direction changes against what scoping requires - that they are committed versions and together settle what structural change is actually required. Defects are flagged for rejection or repair before the scope is fixed.'
business_purpose: 'It exists so the reorganization never draws its bounds from findings that were never committed.'
practical_context: 'It runs once the intake is registered and the material can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a direction change still in draft among the committed findings and flags the defect before scoping begins.'
