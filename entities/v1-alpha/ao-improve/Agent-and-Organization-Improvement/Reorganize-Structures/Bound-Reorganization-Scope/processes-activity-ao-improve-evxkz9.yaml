plain_language_name: 'Set the Scope of the Reorganization'
plain_language_description: 'This activity decides exactly how much structural change the reorganization will cover, taking its cue from committed review findings and any change of direction. Those inputs come in and are examined, the boundary of the required change is drawn around the affected units, roles, and reporting lines, and the bounded scope is confirmed with the design authority. Work outside that line is expressly out of scope.'
business_purpose: 'It exists so structural change addresses the named findings without scope creeping across the rest of the organization.'
practical_context: 'It opens the reorganization, when committed review findings or a direction change require structural change, and it closes once the bounded scope is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A designer for the organization design authority reads the committed review findings, draws the change boundary around the affected units and reporting lines, and confirms the scope before any sequencing begins.'
