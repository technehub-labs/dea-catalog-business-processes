plain_language_name: 'Collect the Engagement Signals'
plain_language_description: 'This activity gathers, at the review''s regular intervals, the evidence of how engaged the operating population actually is. The operating agents and teams are taken in as the source, the periodic signals are collected and logged, and the compiled set is confirmed for the review to work from. What is filed gives the review real evidence rather than anecdotes about engagement.'
business_purpose: 'It exists so engagement conclusions rest on collected evidence from the population itself, gathered on a regular rhythm.'
practical_context: 'It happens at each engagement and alignment review cycle, when the operating population is presented for evidence gathering, and it closes once the collected signals are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian gathers the periodic engagement evidence from teams across the operating population, logs each signal with its audit identifiers, and hands the compiled set to the review.'
