plain_language_name: 'Gather the Periodic Engagement Evidence'
plain_language_description: 'With the population verified, the processing custodian does the collection itself: the periodic engagement evidence from the operating agents is gathered and set down as the collected engagement signals, in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because alignment can only be assessed against engagement evidence somebody has actually gathered and recorded.'
practical_context: 'It starts once checking is complete and the verified population is ready to be gathered from, and it ends with the collected engagement signals produced and the working papers kept.'
