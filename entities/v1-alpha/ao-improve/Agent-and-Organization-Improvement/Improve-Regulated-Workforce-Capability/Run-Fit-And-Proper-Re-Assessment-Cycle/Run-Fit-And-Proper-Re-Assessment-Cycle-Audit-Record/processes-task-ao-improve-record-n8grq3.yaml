plain_language_name: 'File the Fitness Re-Assessment Audit Record'
plain_language_description: 'At the close the records custodian preserves the cycle trail at its required retention tier and sets the retrieval handles for it. How each role''s fitness stood at each re-assessment stays provable across the whole history of the cycle.'
business_purpose: 'It exists so each role''s fitness history can be evidenced whenever a re-assessment outcome is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record stored at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the cycle trail at its retention tier and sets the retrieval handles a fitness review would consult.'
