type: Activity
name: Run Fit-And-Proper Re-Assessment Cycle
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Improve Regulated Workforce Capability
  that Run the fit-and-proper re-assessment cycle for each regulator-licensed role:
  SMCR FIT annual re-assessment; state healthcare re-licensure; bar MCLE re-admission;
  NAIC license renewal; FAA airmen re-certification. Shared concern: fit-and-proper
  re-assessment. Input: the live role list; the re-assessment calendar. Output: the
  fit-and-proper re-assessment record.'
belongs_to_business_process: processes:process-ao-improve-qqxe4d
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single run fit-and-proper re-assessment cycle concern,
  one input class, and one output (the run fit-and-proper re-assessment cycle record
  on the regulated personnel record).
