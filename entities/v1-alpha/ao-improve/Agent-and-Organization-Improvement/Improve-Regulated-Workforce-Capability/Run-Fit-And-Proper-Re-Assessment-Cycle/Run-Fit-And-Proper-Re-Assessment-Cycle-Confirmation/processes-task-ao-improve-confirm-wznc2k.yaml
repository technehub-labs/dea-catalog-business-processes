plain_language_name: 'Confirm the Fitness Re-Assessment Record'
plain_language_description: 'When the cycle stands run, the confirmation custodian reconciles the re-assessment record against the outcome the activity set out to reach and issues the confirmation. The supervisor notification that follows learns the re-assessment results are settled and available.'
business_purpose: 'It exists so re-assessment results are relied on only after the record is confirmed against the intended result.'
practical_context: 'It begins once preparation is complete and the re-assessment record awaits its consumers, and it closes with the confirmation issued, consumers told, and the result reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the re-assessment record against the activity''s intended outcome and issues the confirmation the notification step needs.'
