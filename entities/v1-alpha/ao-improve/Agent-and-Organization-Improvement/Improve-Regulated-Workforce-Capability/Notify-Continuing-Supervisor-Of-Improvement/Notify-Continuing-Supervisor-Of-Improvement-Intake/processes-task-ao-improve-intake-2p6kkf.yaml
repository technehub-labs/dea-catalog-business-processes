plain_language_name: 'Receive the Improvement Record and Notification Path'
plain_language_description: 'Notification opens when the improvement record and the supervisor notification path are handed to the intake custodian. Both are accepted, registered with audit identifiers, and set down as the material the notifications will be made from.'
business_purpose: 'It exists so supervisor notifications are made from a registered improvement record along a registered path.'
practical_context: 'It opens when the improvement record and notification path are presented for the notification, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the improvement record and notification path as the notification baseline, with audit references.'
