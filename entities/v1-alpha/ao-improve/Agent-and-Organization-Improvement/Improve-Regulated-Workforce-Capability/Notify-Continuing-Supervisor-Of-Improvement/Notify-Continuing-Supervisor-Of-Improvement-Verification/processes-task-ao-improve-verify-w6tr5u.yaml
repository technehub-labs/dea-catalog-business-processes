plain_language_name: 'Check the Record and Path Before Notifying'
plain_language_description: 'Before any notification is made, the verification custodian checks the improvement record and the notification path against what notification requires - that the record carries every improvement to be reported and the path names who must hear of it. Gaps are logged for rejection or repair before the notifications go out.'
business_purpose: 'It exists so no improvement goes unreported, and no report lands anywhere but the supervisor''s path.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their gaps logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the improvement record missing a completed remediation and logs the gap before any notification goes out.'
