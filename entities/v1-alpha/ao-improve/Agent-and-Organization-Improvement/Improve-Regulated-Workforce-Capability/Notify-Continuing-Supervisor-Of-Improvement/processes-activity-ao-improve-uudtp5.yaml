plain_language_name: 'Notify the Continuing Supervisor of the Improvement'
plain_language_description: 'This activity tells the ongoing supervisor of each licensed role what has been recorded: training completions, fitness re-assessments, and remediation outcomes alike. The improvement record and the defined notification path arrive together, the notices go out along that path with the content and cadence it specifies, and the notification record is confirmed and filed. The supervisor is thereby kept current on the role holder''s competence picture.'
business_purpose: 'It exists so the supervisor overseeing a licensed role always holds the role holder''s current competence and remediation picture.'
practical_context: 'It runs as each improvement cycle completes and its record lands on the personnel file, and it closes when the notification record is confirmed and retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian sends the ongoing supervisor notice of a completed fitness re-assessment along the agreed notification path, and files the notification record for audit.'
