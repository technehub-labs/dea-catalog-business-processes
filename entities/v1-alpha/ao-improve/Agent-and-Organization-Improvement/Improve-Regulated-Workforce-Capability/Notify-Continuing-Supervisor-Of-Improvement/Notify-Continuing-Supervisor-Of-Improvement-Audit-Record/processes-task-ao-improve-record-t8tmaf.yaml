plain_language_name: 'File the Supervisor Notification Audit Record'
plain_language_description: 'At the close the records custodian preserves the notification trail at its required retention tier and sets the retrieval handles for it. Who was told of what, along which path, and when, stays provable whenever the supervision of improvement is examined.'
business_purpose: 'It exists so the notifications to supervisors can be evidenced whenever the supervision chain''s awareness is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record stored at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the notification trail at its retention tier and sets the retrieval handles a supervision review would consult.'
