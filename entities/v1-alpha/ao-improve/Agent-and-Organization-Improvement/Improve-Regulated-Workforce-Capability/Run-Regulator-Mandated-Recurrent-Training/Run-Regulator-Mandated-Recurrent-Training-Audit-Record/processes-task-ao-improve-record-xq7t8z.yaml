plain_language_name: 'File the Recurrent Training Audit Record'
plain_language_description: 'At the close the records custodian preserves the training trail at its required retention tier and sets the retrieval handles for it. Which roles trained, under which mandate, and when, stays provable for as long as the completions matter.'
business_purpose: 'It exists so the recurrent training of the licensed workforce can be evidenced whenever completions are questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the training trail at its retention tier and sets the retrieval handles a training review would consult.'
