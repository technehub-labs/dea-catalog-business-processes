plain_language_name: 'Carry Out the Remediation to Completion'
plain_language_description: 'With the inputs verified, the processing custodian executes the remediation itself: the regulator-supervised or employer-driven program is carried out per the plan, and the completion record is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because a remediation obligation only lifts once the required program has actually been run and recorded.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be executed from, and it ends with the remediation completion record produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian carries the remediation program through to completion per the plan and records it, keeping the working papers.'
