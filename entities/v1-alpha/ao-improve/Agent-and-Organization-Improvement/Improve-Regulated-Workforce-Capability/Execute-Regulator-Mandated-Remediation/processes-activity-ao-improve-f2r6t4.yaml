cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single execute regulator-mandated remediation concern,
  one input class, and one output (the execute regulator-mandated remediation record
  on the regulated personnel record).
