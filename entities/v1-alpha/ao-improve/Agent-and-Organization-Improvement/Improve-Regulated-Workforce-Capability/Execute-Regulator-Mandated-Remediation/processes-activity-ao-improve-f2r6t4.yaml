version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Improve Regulated Workforce Capability
  that Execute regulator-mandated remediation programs: regulator-supervised remediation
  (consent orders, undertakings, settlements); employer-driven remediation (performance
  plans, supervised practice). Shared concern: remediation program execution. Input:
  the remediation trigger; the remediation plan. Output: the remediation completion
  record.'
