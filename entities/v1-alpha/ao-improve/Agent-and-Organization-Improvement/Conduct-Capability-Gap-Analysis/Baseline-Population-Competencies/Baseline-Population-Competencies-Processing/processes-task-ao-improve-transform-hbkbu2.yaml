plain_language_name: 'Measure the Population''s Competencies Against the Framework'
plain_language_description: 'With the inputs verified, the processing custodian does the baselining itself: the current agent population''s competencies are measured against the framework''s requirements and set down as the population competency baseline, in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because gaps can only be identified against a baseline somebody has actually measured and written down.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be measured from, and it ends with the population competency baseline produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian measures the population''s competencies against the framework and sets down the baseline, keeping the working papers.'
