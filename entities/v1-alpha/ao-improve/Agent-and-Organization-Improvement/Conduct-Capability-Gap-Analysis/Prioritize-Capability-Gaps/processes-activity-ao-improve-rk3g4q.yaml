plain_language_name: 'Prioritize the Capability Gaps'
plain_language_description: 'This activity ranks the identified shortfalls by how much each one matters to the organization''s structure and direction. The gap list comes in, each entry is weighed for its impact and placed in order, and the ranking is confirmed with the design authority. The output tells development planning which shortfalls to treat first rather than presenting an undifferentiated list.'
business_purpose: 'It exists so development effort goes first to the shortfalls that hurt the organization most, rather than being spent evenly across everything found.'
practical_context: 'It runs once the capability gaps have been identified, when the gap list is presented for ranking, and it closes when the prioritized list is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian weighs each identified gap by its bearing on critical roles and the organization''s direction, puts the one affecting a key role at the top, and confirms the ranking with the design authority.'
