plain_language_name: 'Rank the Gaps by Their Impact on Structure and Direction'
plain_language_description: 'With the gaps verified, the processing custodian makes the prioritization itself: each identified gap is weighed for its impact on the organization structure and direction, and the ranked list is set down in the form the activity defines. Working papers behind the ranking are preserved.'
business_purpose: 'It exists because development effort is finite, and it must land where the organisation''s shape and course need it most.'
practical_context: 'It starts once checking is complete and the verified gaps are ready to be ranked, and it ends with the prioritized capability gaps produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the organization design authority weighs each gap for its impact on structure and direction and records the ranked list.'
