plain_language_name: 'Read the Gaps Between Baseline and Framework Requirements'
plain_language_description: 'With the baseline verified, the processing custodian makes the identification itself: where the population''s measured competencies fall short of the framework''s requirements is read out and set down as the identified capability gaps, in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because development can only be aimed at shortfalls somebody has actually identified and recorded.'
practical_context: 'It starts once checking is complete and the verified baseline is ready to be read from, and it ends with the identified capability gaps produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian reads where the population falls short of the framework and records the identified gaps, keeping the working papers.'
