plain_language_name: 'Conduct a Capability Gap Analysis'
plain_language_description: 'This process compares the capabilities the enterprise has designed for against the ones its current agents actually show. Shortfalls are identified, sized, and ranked so the most important ones are addressed first. The prioritised findings feed straight into the development plan.'
business_purpose: 'It exists to surface, early and honestly, where the workforce''s capability falls short of what the organization needs, so development effort goes where it matters most.'
practical_context: 'Encountered whenever the competency framework must be checked against the current agent population, typically in review cycles run by the organization design authority whose output feeds the development plan.'
worked_example:
  agent_type: human
  narrative: 'In a quarterly capability review, the organization design authority rates the current agent population against the competency framework''s levels, identifies where key skills fall short, and hands a prioritised gap list to the owners of the development plan.'
