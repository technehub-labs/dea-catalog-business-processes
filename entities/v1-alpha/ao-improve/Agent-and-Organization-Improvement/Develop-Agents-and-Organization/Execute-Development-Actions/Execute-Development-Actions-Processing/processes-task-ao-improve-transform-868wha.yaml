plain_language_name: 'Carry Out the Planned Development Actions'
plain_language_description: 'With the plan verified, the processing custodian does the execution itself: the planned development actions are carried out across the agentive mix, and the executed actions are set down in the form the activity defines. Working papers from the execution are preserved.'
business_purpose: 'It exists because a plan on paper develops nobody - execution is where the mix actually changes.'
practical_context: 'It starts once checking is complete and the verified plan is ready to be executed from, and it ends with the executed development actions produced and the working papers kept for audit.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian carries the planned development actions across the agentive mix and records what was executed, keeping the working papers.'
