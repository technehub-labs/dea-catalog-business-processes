plain_language_name: 'Agent and Organization Improvement'
plain_language_description: 'This family strengthens the workforce and the organization that supports it. Its processes run agent and organization development, review engagement and alignment, analyse where capability gaps hold the enterprise back, plan structural reorganizations when structure itself is the problem, and lift the capability of the regulated workforce.'
business_purpose: 'To keep the enterprise''s agents — people and artificial alike — and its structures improving on evidence rather than drifting.'
practical_context: 'Encountered in the Improve stage: development cycles, engagement surveys, capability reviews and reorganization projects that follow operating experience.'
worked_example:
  agent_type: mixed
  narrative: 'After a rough year, the Agency & Organization Process Owner commissions a capability gap analysis; the team reviews engagement and alignment, schedules fine-tuning for the underperforming artificial agents and coaching for people teams, and sequences a reorganization with a managed transition.'
