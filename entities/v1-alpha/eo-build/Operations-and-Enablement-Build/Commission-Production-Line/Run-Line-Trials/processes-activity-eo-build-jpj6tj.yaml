plain_language_name: 'Run Line Trials'
plain_language_description: 'This activity exercises the fully set-up line through trial runs until it produces at the planned trial pace. The trial production plans arrive as the script, runs are executed and their results gathered, and the trial outcomes are confirmed onward for certification. The line proves in practice what the configuration promised on paper.'
business_purpose: 'It exists so the line''s fitness is demonstrated by actually producing, before anyone certifies it for full production.'
practical_context: 'It follows control configuration, when the configured line is ready to be exercised, and it completes once the trial results are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian runs the line through the scripted trial production, gathers the results as output builds toward the trial pace, and confirms the outcomes for the certification step.'
