plain_language_name: 'Check the Blueprint Before Securing the Sites'
plain_language_description: 'Before any site is secured, the verification custodian checks the blueprint against what securing requires - that every position the facilities need is stated and none is contested. Defects are logged for rejection or repair before any site is secured.'
business_purpose: 'It exists so the facilities are never sited on positions the blueprint left undefined or disputed.'
practical_context: 'It runs once the intake is registered and the blueprint can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds one blueprint position still contested and logs the defect before any site is secured.'
