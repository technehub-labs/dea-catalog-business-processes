plain_language_name: 'Secure the Sites the Facility Blueprint Requires'
plain_language_description: 'With the blueprint verified, the processing custodian does the securing itself: each position the blueprint requires is secured under the organisation''s control, and the secured sites are set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because nothing can be fitted out until the ground itself belongs to the plan - securing is the first physical act of the facilities build.'
practical_context: 'It starts once checking is complete and the verified blueprint is ready to be secured from, and it ends with the secured sites produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in product management secures each blueprint position under the organisation''s control, keeping the working papers.'
