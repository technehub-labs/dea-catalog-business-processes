plain_language_name: 'Secure Facility Sites'
plain_language_description: 'This activity acquires and takes control of the sites the facility blueprint calls for. The committed blueprint arrives as the requirement, sites are secured at the required positions and checked against it, and the secured sites are confirmed onward for fitting out. The operation''s buildings stop being plans and become places the enterprise controls.'
business_purpose: 'It exists so the enterprise holds actual control of the sites its operation needs before any fitting out begins.'
practical_context: 'It opens facility provisioning, once the facility blueprint is committed, and it completes when the secured sites are confirmed for fit-out.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian secures each site at the position the blueprint requires, checks the acquisitions against it, and confirms the secured sites for the fit-out step.'
