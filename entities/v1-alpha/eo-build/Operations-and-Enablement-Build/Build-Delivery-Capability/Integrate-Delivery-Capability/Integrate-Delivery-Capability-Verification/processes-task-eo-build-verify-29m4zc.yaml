plain_language_name: 'Check the Components Before Fitting Them Together'
plain_language_description: 'Before anything is joined, the verification custodian checks the components against what integration requires - that every bounded component is present and standing, and none arrived half-finished. Defects are logged for rejection or repair before the joining begins.'
business_purpose: 'It exists so the capability is never integrated around a component that was never finished.'
practical_context: 'It runs once the intake is registered and the components can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds one component still mid-build and logs the defect before the joining begins.'
