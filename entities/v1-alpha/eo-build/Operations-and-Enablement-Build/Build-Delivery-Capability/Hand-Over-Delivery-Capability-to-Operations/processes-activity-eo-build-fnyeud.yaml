plain_language_name: 'Hand Over Delivery Capability to Operations'
plain_language_description: 'This activity formally passes the checked-out delivery capability from the build side to the teams who will run it. The verified capability arrives as the handover package, acceptance is reviewed and given by the receiving side, and the accepted capability is confirmed for steady-state operation. Build responsibility ends; operational responsibility begins.'
business_purpose: 'It exists so the enterprise''s new delivery capability changes hands cleanly, with operations accepting a capability it has seen perform.'
practical_context: 'It closes the delivery capability build, once verification is complete, and it finishes when the accepted capability is confirmed and its handover record retained.'
worked_example:
  agent_type: human
  narrative: 'A product management lead presents the verified capability to the operations function''s receiving team, walks them through the evidence, and records their acceptance for the move to steady-state running.'
