definition: The cohesive grouping of work within Institutionalize Regulated Strategic
  Plan that files the supervisor-acknowledged strategic-plan submission with the competent
  regulator before the plan takes effect (Basel ICAAP / SAA submission; BRRD recovery-plan
  submission; NHS trust 5-year strategy submission; PUC integrated resource plan submission;
  bank recovery and resolution plan submission).
