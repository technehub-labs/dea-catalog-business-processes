id: dea:task-scan-market-and-segments-intake
type: Task
name: Scan Market and Segments Intake
definition: The bounded unit of work within `dea:activity-scan-market-and-segments` (Scan Market and Segments) that accept custody of the segment-thesis input pack (market-research artefacts, JTBD evidence, demand-thesis drafts) and persist a registered intake manifest binding the inputs to the conceive case file.
belongs_to_activity: dea:activity-scan-market-and-segments
trigger: Custody of the Conceive-stage input pack for Scan Market and Segments ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Scan Market and Segments case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Scan Market and Segments input pack against the Conceive-stage intake contract.
  - Binding of the input pack to the Scan Market and Segments case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the closure case file (phase 5).
