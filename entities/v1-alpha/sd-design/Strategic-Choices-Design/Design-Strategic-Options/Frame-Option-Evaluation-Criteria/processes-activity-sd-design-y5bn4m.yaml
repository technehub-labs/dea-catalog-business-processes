plain_language_name: 'Frame Option Evaluation Criteria'
plain_language_description: 'Choices are only comparable if everyone agrees on the yardsticks first. Intake registers the drafted options and the space they came from, verification tests each proposed yardstick for fairness, and processing writes the criteria the option set will be scored against. Confirmation circulates the agreed criteria and the records custodian preserves them for the evaluation work that follows.'
business_purpose: 'It supplies the shared yardsticks that make the later comparison of options fair, transparent and repeatable.'
practical_context: 'It sits alongside option drafting, opening at intake of the drafted set and closing when the criteria are confirmed and preserved for evaluation.'
worked_example:
  agent_type: human
  narrative: 'A strategy function pair drafts the scoring yardsticks, tests them against each drafted option with the activity owner, and the confirmation custodian passes the agreed criteria to the colleagues preparing the evaluation scope.'
