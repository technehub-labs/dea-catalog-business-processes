plain_language_name: 'Release the Committed Option Designs to the Evaluation Teams'
plain_language_description: 'The confirming opens once the option designs are committed. The confirmation custodian tells the downstream teams the committed option designs are available, and closes the reconciliation against what the activity promised for the commitment.'
business_purpose: 'It exists so the evaluation teams start from one confirmed design set rather than from competing drafts.'
practical_context: 'It opens when the committed option designs are ready to hand on, and it closes with the confirmation issued and the commitment''s promises checked off against what was delivered.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian in the strategy function releases the committed option designs to the evaluation teams, reconciles them against what the commitment promised, and issues the confirmation.'
