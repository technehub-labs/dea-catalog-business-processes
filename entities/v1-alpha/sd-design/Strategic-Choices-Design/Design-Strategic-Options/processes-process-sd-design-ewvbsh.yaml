plain_language_name: 'Design Strategic Options'
plain_language_description: 'This work turns strategic intent into a menu of genuinely different ways forward. The strategy function designs each option as a set of bounded trade-offs, what it would cost and what it would deliver, and sets the criteria against which the options will be judged. The committed option designs then go forward for evaluation and translation.'
business_purpose: 'It creates real choice: designing distinct options with explicit trade-offs and evaluation criteria up front lets the enterprise compare paths honestly instead of defaulting to the first idea.'
practical_context: 'Runs when the conceived strategic intent needs candidate paths; the strategy function designs the options and their trade-offs before any evaluation takes place.'
worked_example:
  agent_type: human
  narrative: 'The strategy function sketches the candidate options for the intent, writes each one''s trade-offs in plain terms, and agrees the criteria the leadership will judge them on. The option designs are committed and sent for evaluation.'
