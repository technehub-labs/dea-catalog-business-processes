plain_language_name: 'Take In the Bounded Design Space for Option Drafting'
plain_language_description: 'The drafting opens as its material arrives: the bounded design space that says what the options may explore. The intake custodian logs it against the drafting file so the drafting starts accounted for.'
business_purpose: 'It exists so the options are drafted inside the logged space rather than wherever each drafter''s imagination wanders.'
practical_context: 'It opens when the bounded design space is presented for drafting, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the bounded design space into the drafting file, so the option drafting starts accounted for.'
