id: processes:group-sd-design-q4mj9z
type: ProcessGroup
version: 1.0.0
name: Strategic Choices Design
definition: 'The bounded Process Group that organises the Business Process responsibilities of designing strategic choices in the StrategyAndDirection x Design context. This group covers the analytical work of designing strategic options, evaluating strategic alternatives, designing objectives and targets, and designing strategic scenarios. v2.4.0 grounding (domain-grounding.md §3.2): Strategy & Direction directs within the frame that Governance & Existence authorises.

  '
process_context: processes:pc-sd-design-g3es76
scope:
  includes:
  - Strategic option design
  - Strategic alternatives evaluation
  - Objectives and targets design
  - Strategic scenarios design
  excludes:
  - Operational planning (enablement-operations x design)
  - Financial plan design (finance-accounting x design)
  - Strategic intent conception (Conceive stage; adjacent context)
outcomes:
- Strategic options are designed and evaluated.
- Objectives and targets are designed with bounded measures.
- Strategic scenarios are designed with bounded assumptions.
