plain_language_name: 'Test the Scenarios and Signposts Before Committing Them'
plain_language_description: 'Before the scenarios are committed for operation, the arriving scenario and signpost material is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because a scenario committed without workable signposts can never be watched, only remembered.'
practical_context: 'It opens once the intake is registered and the scenario material is ready to be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the logged scenarios and signposts against what the activity requires, and writes up a scenario with no observable signpost as a shortfall to be put right.'
