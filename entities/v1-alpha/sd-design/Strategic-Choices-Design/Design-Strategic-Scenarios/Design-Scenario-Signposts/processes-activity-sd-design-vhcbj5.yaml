plain_language_name: 'Design Scenario Signposts'
plain_language_description: 'A scenario is only useful if you can tell it is coming true. Intake brings the drafted scenarios in, verification tests the candidate indicators for observability, and processing sets out the signposts — concrete signals showing which future is actually unfolding. Confirmation passes the signpost designs downstream and the records custodian preserves them ready for commitment.'
business_purpose: 'It equips each scenario with observable tells, so monitoring can spot early which assumed future is materialising and steering can react in time.'
practical_context: 'It follows scenario drafting, opening at intake of the drafted set and closing when the signpost designs are confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'The strategy function picks observable indicators for each drafted scenario, checks with the activity owner that each tell can genuinely be seen in normal reporting, and the confirmation custodian releases the signpost designs for commitment.'
