plain_language_name: 'Draft Strategic Scenarios'
plain_language_description: 'With the assumptions fixed, the alternative futures get written. Intake registers the assumption set, verification checks the drafting instructions are complete, and processing writes the scenarios — coherent pictures of how conditions could unfold, each one staying inside the agreed assumptions. Confirmation announces the drafted scenarios downstream and the working papers are preserved for the signpost step.'
business_purpose: 'It gives the enterprise a small set of plausible alternative futures, so choices can be stress-tested rather than judged on one forecast.'
practical_context: 'It runs once the assumptions are set, opening at intake of the assumption set and closing when the drafted scenarios are confirmed ready for signposts.'
worked_example:
  agent_type: human
  narrative: 'Strategy function writers draft each scenario inside the agreed assumptions, a verification custodian returns any that quietly contradict them, and the confirmation custodian tells the signpost team the scenario set is with them.'
