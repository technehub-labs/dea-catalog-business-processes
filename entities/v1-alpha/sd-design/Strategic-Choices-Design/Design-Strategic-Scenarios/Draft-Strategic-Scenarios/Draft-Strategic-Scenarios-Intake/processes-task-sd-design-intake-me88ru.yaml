plain_language_name: 'Take In the Bounded Assumption Set for Scenario Drafting'
plain_language_description: 'The drafting opens as its material arrives: the bounded assumption set that says which worlds the scenarios must cover. The intake custodian logs it against the drafting file so the drafting starts accounted for.'
business_purpose: 'It exists so the scenarios are drafted over the logged assumptions rather than over whichever future fascinates the writers.'
practical_context: 'It opens when the bounded assumption set is presented for drafting, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the bounded assumption set into the drafting file, so the scenario drafting starts accounted for.'
