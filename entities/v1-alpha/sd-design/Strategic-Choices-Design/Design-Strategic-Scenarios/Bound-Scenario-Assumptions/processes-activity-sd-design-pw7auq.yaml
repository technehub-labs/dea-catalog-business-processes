plain_language_name: 'Set the Scenario Assumptions'
plain_language_description: 'Options are only as good as the futures they are tested against, so the assumptions come first. The committed options and fresh environment cues arrive at intake, verification tests each candidate assumption for realism, and processing draws the bounded assumption set the options must be tested against. Confirmation hands the set downstream and the records custodian preserves it for scenario drafting.'
business_purpose: 'It fixes the assumed future conditions up front, so the scenarios built on them are honest stress tests rather than wishful stories.'
practical_context: 'It opens this process at intake when the committed options and environment cues are presented, closing once the assumption set is confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'A strategy function scenario lead works through the committed options against fresh environment cues, agrees the assumption set with the activity owner, and the records custodian preserves the bounded assumptions ahead of the drafting workshop.'
