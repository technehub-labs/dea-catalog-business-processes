plain_language_name: 'Set the Evaluation Scope'
plain_language_description: 'Before options are compared, the contest rules are fixed. The committed option designs and their criteria arrive at intake, verification confirms both are usable, and processing marks which comparisons will be run — which options, measured against which yardsticks, over what horizon. Confirmation passes the marked scope downstream and the records custodian preserves it for the comparison itself.'
business_purpose: 'It keeps the comparison focused and fair by fixing in advance which alternatives are judged and by which measures.'
practical_context: 'It opens this process at intake when the committed option designs and criteria are presented, closing once the scope lines are confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'A strategy function analyst agrees with the activity owner which option pairs the evaluation will cover and which criteria apply, a verification custodian confirms the inputs are current, and the records custodian preserves the marked scope ahead of the comparison.'
