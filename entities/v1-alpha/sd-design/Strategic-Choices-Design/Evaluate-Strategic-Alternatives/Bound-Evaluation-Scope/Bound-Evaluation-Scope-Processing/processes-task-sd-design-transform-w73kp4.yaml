plain_language_name: 'Bound the Scope of the Strategic Alternatives Evaluation'
plain_language_description: 'With the inputs verified, the bounding proper begins. The processing custodian fixes how far the comparison will run: which options, which criteria, at what depth, producing the bounded evaluation scope in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because an unbounded comparison either drowns in detail or stops the moment one option looks good.'
practical_context: 'It opens when the verified material is ready to be worked, and it closes with the bounded evaluation scope produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function fixes how far the comparison will run, marking the options, criteria and depth it covers, and keeps the bounding workings for the audit trail.'
