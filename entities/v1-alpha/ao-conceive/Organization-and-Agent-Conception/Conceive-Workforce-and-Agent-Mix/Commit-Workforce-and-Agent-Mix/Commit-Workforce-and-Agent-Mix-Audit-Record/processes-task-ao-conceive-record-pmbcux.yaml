plain_language_name: 'File the Mix Commitment Audit Record'
plain_language_description: 'At the close the records custodian preserves the commitment trail at its required retention tier and sets the retrieval handles for it. What was committed, within which bounds, and on whose confirmation, stays on file for the life of the mix.'
business_purpose: 'It exists so the mix''s standing as committed capacity can be evidenced whenever its consequences are reviewed.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the commitment trail at its retention tier and sets the retrieval handles a later design review would draw on.'
