plain_language_name: 'Draft the Workforce and Agent Mix'
plain_language_description: 'This activity puts together the actual composition of the workforce mix, working inside the proportions and capacity envelopes already agreed. The envelopes arrive first, the mix is drafted against them and checked for fit, and the draft is confirmed with the people who will ratify it. It ends with a complete draft mix ready to be committed as the organization''s reference for acquisition and planning.'
business_purpose: 'It exists so the blend of people and artificial agents is shaped deliberately within agreed limits before anything is committed.'
practical_context: 'It runs once the capacity envelopes are in place during mix conception, and it completes when the drafted mix has been confirmed and its record preserved for the commitment step.'
worked_example:
  agent_type: human
  narrative: 'A workforce management planner drafts the shape of the future mix inside the agreed envelopes, tests the draft against each proportion, and hands the confirmed draft to the strategy function for commitment.'
