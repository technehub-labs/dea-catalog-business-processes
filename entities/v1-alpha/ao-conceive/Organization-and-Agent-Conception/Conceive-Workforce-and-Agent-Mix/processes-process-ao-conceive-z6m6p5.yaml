plain_language_name: 'Conceive the Workforce and Agent Mix'
plain_language_description: 'This process decides the blend of people and artificial agents the organization will run on, once the organization and agent strategy is committed. It sets the proportions between human and artificial capacity and draws the capacity envelopes that each part of the business can plan against. The agreed mix becomes the reference point for later acquisition and planning decisions.'
business_purpose: 'It exists to give the enterprise a deliberate answer to how much of its work is done by people versus artificial agents, instead of letting the balance drift over time.'
practical_context: 'Follows commitment of the organization and agent strategy, typically in planning cycles where workforce management and the strategy function need agreed proportions and capacity envelopes to plan against.'
worked_example:
  agent_type: human
  narrative: 'During the yearly planning round, workforce management and the strategy function sketch out how many roles stay human, where artificial agents take over volume work, and the capacity envelopes for each division, then commit the mix to guide hiring and deployment.'
