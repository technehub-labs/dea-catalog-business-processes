plain_language_name: 'Set the Reporting Spans the Model Will Permit'
plain_language_description: 'With the principles verified, the processing custodian sets the spans themselves: the reporting limits the organization model will permit are worked out and fixed in the form the activity defines. Working papers behind each limit are preserved for audit.'
business_purpose: 'It exists because a model without settled reporting spans invites the sprawl the principles were drawn to prevent.'
practical_context: 'It starts once checking is complete and the verified principles are ready to be bounded from, and it ends with the bounded reporting spans produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in workforce management fixes the reporting spans the model will permit, keeping the working papers for audit.'
