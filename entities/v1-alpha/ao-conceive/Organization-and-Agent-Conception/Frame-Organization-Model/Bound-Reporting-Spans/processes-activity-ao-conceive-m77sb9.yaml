plain_language_name: 'Set the Permitted Reporting Spans'
plain_language_description: 'This activity decides how wide reporting relationships may run anywhere in the organization model. The derived structure principles come in and are reviewed, the permitted span limits are worked out against them, and the agreed spans are confirmed to the framers of the model. The limits are then recorded so no later design step can quietly stretch a reporting line beyond what the model allows.'
business_purpose: 'It exists so reporting loads stay manageable by design, with span limits fixed before concrete roles are drawn up.'
practical_context: 'It follows derivation of the structure principles, when those principles are presented for span setting, and it closes once the bounded spans are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A workforce management lead takes the agreed structure principles and sets the maximum number of direct reports any position in the model may carry, confirming the limits before coordination boundaries are marked out.'
