plain_language_name: 'Derive the Structure Principles'
plain_language_description: 'This activity turns the newly committed strategy for the organization and its agents into the structural ground rules the organization model will have to respect. The strategy is brought in and studied, the principles the structure must follow are derived from it, and the derived principles are confirmed with those framing the model. From then on, decisions about spans and boundaries are made inside those principles.'
business_purpose: 'It exists so the organization model is framed from explicit strategic principles rather than from habit or ad hoc preference.'
practical_context: 'It opens the framing of the organization model, when the committed organization and agent strategy is presented, and it closes once the derived principles are confirmed and their record preserved.'
worked_example:
  agent_type: human
  narrative: 'A strategy function lead reads the newly committed strategy and draws out the structural principles it implies, such as how decision rights should sit, then confirms those principles with workforce management before reporting spans are set.'
