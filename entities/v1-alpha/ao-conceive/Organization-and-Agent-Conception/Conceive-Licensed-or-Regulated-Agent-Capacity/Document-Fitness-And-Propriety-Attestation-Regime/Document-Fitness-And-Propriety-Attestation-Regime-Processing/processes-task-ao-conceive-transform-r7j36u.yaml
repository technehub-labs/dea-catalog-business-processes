plain_language_name: 'Document the Attestation Regime for Each Role'
plain_language_description: 'With the inputs verified, the processing custodian writes the regime itself: for every licensed role the attestation forms - initial, periodic, and event-driven - who attests for each, and the framing the regulator applies are set down on the regulated personnel record in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because fitness attestations only hold water when the regime governing them is documented in advance.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be documented from, and it ends with the documented regime produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in workforce management documents each licensed role''s attestation forms, attestors, and framing on the personnel record.'
