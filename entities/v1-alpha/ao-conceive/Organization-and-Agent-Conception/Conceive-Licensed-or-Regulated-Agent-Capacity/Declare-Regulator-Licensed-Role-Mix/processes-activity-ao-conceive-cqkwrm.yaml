definition: 'The cohesive grouping of work within Conceive Licensed or Regulated Agent
  Capacity that Declare the regulator-licensed role mix on the regulated personnel
  record: count and category of regulator-licensed roles, the regulator-tied scope
  of each, and the alignment between the regulated personnel record and the regulator
  continuing-supervision framework. Shared concern: regulated-scope declaration. Input:
  the enterprise agent-capacity strategy; the regulator licensing taxonomy. Output:
  the committed regulated-scope declaration.'
