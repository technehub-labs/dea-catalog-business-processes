plain_language_name: 'File the Notification Path Audit Record'
plain_language_description: 'At the close the records custodian preserves the capture trail at its required retention tier and sets the retrieval handles for it. Why each role notifies whom, at what cadence, and through which escalation, stays readable whenever supervision arrangements are reviewed.'
business_purpose: 'It exists so the supervision arrangements behind each role can be evidenced when they are later questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the capture trail at its retention tier and sets the retrieval handles a supervision review would consult.'
