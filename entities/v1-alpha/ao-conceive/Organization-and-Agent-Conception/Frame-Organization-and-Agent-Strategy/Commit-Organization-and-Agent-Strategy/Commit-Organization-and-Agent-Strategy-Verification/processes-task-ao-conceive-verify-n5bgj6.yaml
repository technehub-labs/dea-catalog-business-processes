plain_language_name: 'Check the Drafted Strategy Before Commitment'
plain_language_description: 'Before the enterprise commits, the verification custodian checks the drafted strategy against what commitment requires - that it sits within the bounded capacity and settles the direction for both the model and the mix. Anything out of bounds is logged for rejection or repair before the commitment is made.'
business_purpose: 'It exists so the enterprise never commits a strategy that breaks its own capacity bounds.'
practical_context: 'It runs once the intake is registered and the draft can be compared with the activity''s requirements, and it finishes with the draft verified or its defects logged for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the drafted strategy reaching past its capacity bound and logs the breach for repair before commitment.'
