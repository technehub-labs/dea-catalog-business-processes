plain_language_name: 'File the Agent Capacity Audit Record'
plain_language_description: 'At the close the records custodian preserves the capacity trail at its required retention tier and sets the retrieval handles for it. How much capacity was committed, and against which imperatives, remains readable whenever the strategy''s reach is questioned.'
business_purpose: 'It exists so the capacity behind the strategy can be evidenced against the imperatives it answers.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record held at its tier and retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the capacity trail at its retention tier and sets the retrieval handles a later strategy review would consult.'
