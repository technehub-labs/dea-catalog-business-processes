plain_language_name: 'Draft the Organization and Agent Strategy'
plain_language_description: 'This activity writes the first full version of the strategy that will steer how the enterprise organizes its workforce, including where artificial agents fit. The bounded agent capacity arrives first, the strategy is drafted from it and reviewed for coherence, and the draft is confirmed with those who will ratify it. Once accepted, it sets the direction for framing the organization model and conceiving the workforce mix.'
business_purpose: 'It exists so the enterprise has a coherent written direction for its workforce and agents before committing to it.'
practical_context: 'It runs after agent capacity has been bounded, when the capacity boundary is presented for strategy drafting, and it completes when the drafted strategy is confirmed and its record preserved.'
worked_example:
  agent_type: human
  narrative: 'A strategy function lead turns the agreed agent capacity boundary into a draft strategy covering the organization model and the workforce mix, then confirms the draft with workforce management ahead of formal commitment.'
