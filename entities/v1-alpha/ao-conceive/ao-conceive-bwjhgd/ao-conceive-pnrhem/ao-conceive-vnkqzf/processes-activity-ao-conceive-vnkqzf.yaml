id: processes:activity-ao-conceive-vnkqzf
type: Activity
name: Document Fitness-And-Propriety Attestation Regime
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Conceive Licensed or Regulated Agent
  Capacity that Document the fitness-and-propriety attestation regime that will apply
  to each regulator-licensed role: the attestation form (initial, periodic, event-driven),
  the attestor (candidate, employer, regulator), and the regulator framing (SMCR FIT;
  state healthcare CME; bar MCLE; NAIC CE; FAA recurrent). Shared concern: fitness-and-propriety
  regime declaration. Input: the regulator licensing taxonomy; the attestation regime
  matrix. Output: the documented fitness-and-propriety attestation regime on the regulated
  personnel record.'
belongs_to_business_process: processes:process-ao-conceive-pnrhem
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single document fitness-and-propriety attestation regime
  concern, one input class, and one output (the document fitness-and-propriety attestation
  regime record on the regulated personnel record).
