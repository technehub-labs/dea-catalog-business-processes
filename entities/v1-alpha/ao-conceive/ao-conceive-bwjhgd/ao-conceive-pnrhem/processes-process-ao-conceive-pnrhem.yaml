id: processes:process-ao-conceive-pnrhem
name: Conceive Licensed or Regulated Agent Capacity
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: >-
  Conceive the regulated-scope composition of the enterprise's agentive mix under the enterprise regulated-entity approval authority. The trigger is the enterprise's decision that the agent-capacity strategy will include regulator-licensed roles. The outcome is a regulated-scope declaration committed to the regulated personnel record with the fitness-and-propriety attestation regime documented, the supervisor-controlled scope of each licensed role declared, and the alignment to the regulator's continuing-supervision framework committed.
trigger: >-
  The enterprise's agent-capacity strategy will include roles whose holders
  must hold regulator-issued licences or registrations (FCA SMCR CF1..CF11;
  state healthcare licensure; FAA / EASA type-rating; NAIC producer line of
  authority; state bar admissions; EU AI Act high-risk human-oversight roles),
  and the enterprise must determine the regulated-scope of those roles
  before they enter Design or Build.
outcome: >-
  The enterprise's agent-capacity strategy carries an explicit regulated-scope declaration: the count and category of regulator-licensed roles, the supervisor-controlled scope of each, the fitness-and-propriety attestation regime, and the alignment between the regulated personnel record and the regulator's continuing-supervision framework.
identity:
  verb: Conceive
  object: Licensed or Regulated Agent Capacity
  scope: enterprise
  outcome_statement: >-
    The regulator-tied Licensed or Regulated Agent Capacity conceive work has been carried out
    at the AgencyAndOrganization x Conceive coordinate under the enterprise
    regulated-entity approval authority. The outcome is recorded on the regulated
    personnel record with the supervisor-controlled scope, the fitness-and-propriety
    attestation regime, the supervised-training completion requirements, and the
    continuing-supervisor notification path documented per the regulator's
    continuing-supervision framework. Substrate-neutral conceive work is
    excluded. Adjacent lifecycle stages (Conceive / Design / Build / Activate /
    Operate / Improve / Retire) are excluded.
