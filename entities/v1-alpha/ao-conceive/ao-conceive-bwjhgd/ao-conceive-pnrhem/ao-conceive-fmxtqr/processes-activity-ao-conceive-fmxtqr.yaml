id: processes:activity-ao-conceive-fmxtqr
type: Activity
name: Map Supervised-Training Completion Requirements
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Conceive Licensed or Regulated Agent
  Capacity that Map the supervised-training completion requirements for each regulator-licensed
  role: the training plan, the supervised-completion evidence class, and the regulator
  recording path (SMCR Statement of Responsibilities; state healthcare CE; NAIC CE;
  FAA / EASA type-rating; SRA Continuing Competence; bar MCLE). Shared concern: supervised-training
  mapping. Input: the regulator licensing taxonomy; the supervised-training matrix.
  Output: the mapped supervised-training completion requirements.'
belongs_to_business_process: processes:process-ao-conceive-pnrhem
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single map supervised-training completion requirements
  concern, one input class, and one output (the map supervised-training completion
  requirements record on the regulated personnel record).
