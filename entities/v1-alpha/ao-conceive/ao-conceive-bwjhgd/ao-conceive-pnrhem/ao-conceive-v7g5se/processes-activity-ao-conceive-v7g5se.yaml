type: Activity
name: Capture Continuing-Supervisor Notification Path
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Conceive Licensed or Regulated Agent
  Capacity that Capture the continuing-supervisor notification path for each regulator-licensed
  role: the supervisor identity, the notification cadence, the notification content
  (SMCR Conduct Rules; fitness attestations; training completions), and the escalation
  matrix. Shared concern: continuing-supervisor notification path. Input: the regulator
  licensing taxonomy; the supervision matrix. Output: the captured continuing-supervisor
  notification path on the regulated personnel record.'
belongs_to_business_process: processes:process-ao-conceive-pnrhem
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single capture continuing-supervisor notification path
  concern, one input class, and one output (the capture continuing-supervisor notification
  path record on the regulated personnel record).
