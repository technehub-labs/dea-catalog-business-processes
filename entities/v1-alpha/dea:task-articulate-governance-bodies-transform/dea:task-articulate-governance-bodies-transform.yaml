  claim: board-responsibilities chapter binding the design-phase body articulation and delegation-of-authority design. Bounded-work evidence for the transform-phase custodian of `dea:activity-articulate-governance-bodies` (CR-BP-L4-03 enrichment).
  strength: E1
- source: COSO Internal Control 2013
  claim: internal-control framework grounding the design-phase control-objective definition and compliance-regime design. Bounded-work evidence for the transform-phase custodian of `dea:activity-articulate-governance-bodies` (CR-BP-L4-03 enrichment).
  strength: E2
