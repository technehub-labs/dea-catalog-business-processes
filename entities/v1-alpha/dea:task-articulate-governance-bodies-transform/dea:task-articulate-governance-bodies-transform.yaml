id: dea:task-articulate-governance-bodies-transform
type: Task
name: Articulate Governance Bodies Processing
definition: 'The bounded unit of work within `dea:activity-articulate-governance-bodies` (Articulate Governance Bodies) that execute the design: articulate the governance bodies, design the authority delegations and decision rights, design the policy artifacts and control objectives, design the risk taxonomy and assessment scales, design the compliance regime and governance integration, and produce the design-ready governance artefact conforming to the governance-design schema.'
belongs_to_activity: dea:activity-articulate-governance-bodies
trigger: Verification certificate issued for Articulate Governance Bodies; transform gate may execute the bounded work and emit the conformant artefact under the Design schema.
outcome: Bounded-work artefact produced for Articulate Governance Bodies conforming to the Design schema; processing custodian passes custody to the confirmation custodian.
responsibility: processing custodian
boundary:
  inclusions:
  - Execution of the Articulate Governance Bodies bounded work producing the conformant artefact.
  - Application of the Articulate Governance Bodies schema and any derived classifications or computations.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Notification of governing parties outside the notify-list (phase 4).
evidence:
