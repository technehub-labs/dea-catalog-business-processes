# Evidence (CR-BP-11 register strength scale E0..E5).
evidence:
  - source: CR-BP-80 escape-clause discovery (StrategyAndDirection x Activate)
    claim: |
      Authoritative multi-source regulatory evidence (Basel BCBS 425 /
      425a ICAAP and SAA approval; BRRD Article 5 recovery-plan
      activation; NHS England trust 5-year strategy approval; PUC
      integrated resource plan and strategic-plan filing; bank recovery
      and resolution plan activation). Universal sector practice across
      regulated banking, healthcare, utilities, and resolution
      authorities. Strong boundary against Build / Operate / Retire
      coordinates. Score 9/10 with ADMIT-CANONICAL recommendation.
    strength: E5
    reference: discovery/v1-alpha/strategy-and-direction-activate-escape.yaml
  - source: Basel Committee BCBS 425 / BCBS 425a (ICAAP and SREP)
    claim: "Basel BCBS 425 / BCBS 425a: Internal Capital Adequacy Assessment Process (ICAAP) and Supervisory Review and Evaluation Process (SRA / SREP); strategic-plan approval and activation is a supervisor-acknowledged transformation in regulated banking."
    strength: E4
  - source: Bank Recovery and Resolution Directive (BRRD, 2014/59/EU) Article 5
    claim: "BRRD Article 5: recovery-plan activation under SRB / national-resolution-authority supervision; plan activation is a regulator-controlled transformation."
    strength: E4
  - source: UK NHS England / Department of Health and Social Care trust 5-year strategy approval
    claim: "NHS trust 5-year strategy approval process; strategic plans must be approved before the trust may operate against them."
    strength: E4
  - source: US state Public Utility Commissions (PUC) integrated resource plan and strategic-plan filings
    claim: "PUC integrated resource plan and strategic-plan filings required before utilities may activate capital and operational plans; PUC approval is a precondition to plan activation."
    strength: E4
  - source: TOGAF ADM Phase G (Implementation Governance) regulated-entity overlay
    claim: "TOGAF ADM Phase G establishes architecture-contract approval; for regulated entities the architecture contract is the strategic plan activated under supervisor acknowledgement."
    strength: E4

