# L2 admission deposition: dea:process-bring-into-force
# CR-BP-65, 2026-09-14. Population-slice pattern: deposition first,
# canonical record second. The substantive evaluation lives in the
# CR-BP-63 discovery record; this deposition cites it and records
# the admission decision.

deposition:
  subject: dea:process-bring-into-force
  cr: CR-BP-65
  date: '2026-09-14'
  discovery_record: discovery/v1-alpha/governance-and-existence-activate.yaml
  discovery_outcome:
    candidate: Bring into Force
    score: 9/10
    disposition: ADMIT-CANONICAL (recommended; governed admission
