      commencement are distinct, universally governed events. This
      tranche enacts the recommendation: the register cell flips to
      ratified-accepted / landed and the canonical PC, PG and BP
      records land together.
    naming_note: >-
      The admitted record name is refined at admission to satisfy the
      BP-ARC-ID-001 identity contract (name = verb + object): the
      discovery candidate name (Bring into Force) is retained in the
      discovery record; the canonical record name and identity object
      carry the full form (Bring Policy Instrument into Force). The id
      is unchanged from the discovery proposal.
  follow_ons:
    - L3 decomposition of this Business Process under the CR-BP-32
      pattern (4 Activities + deposition), to be scheduled as an L3
      tranche slice.
    - Discovery-recommended canonical admissions at the remaining cells
      (E&O Retire; P&R Retire) land as their own slices.
