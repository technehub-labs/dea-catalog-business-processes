id: dea:task-propose-authority-and-decision-rights-intake
type: Task
name: Propose Authority and Decision Rights Intake
definition: The bounded unit of work within `dea:activity-propose-authority-and-decision-rights` (Propose Authority and Decision Rights) that accept custody of the policy-conception input pack (risk-appetite drafts, policy-scope proposals, authority-and-decision-rights proposals) and persist a registered intake manifest binding the inputs to the conception case file.
belongs_to_activity: dea:activity-propose-authority-and-decision-rights
trigger: Custody of the Conceive-stage input pack for Propose Authority and Decision Rights ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Propose Authority and Decision Rights case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Propose Authority and Decision Rights input pack against the Conceive-stage intake contract.
  - Binding of the input pack to the Propose Authority and Decision Rights case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
