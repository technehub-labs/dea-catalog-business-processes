  strength: E1
- source: COSO ERM 2017
  claim: enterprise risk-management framework grounding the conceive-phase risk-appetite articulation and governance-posture framing. Bounded-work evidence for the intake-phase custodian of `dea:activity-propose-authority-and-decision-rights` (CR-BP-L4-03 enrichment).
  strength: E2
