definition: The cohesive grouping of work within Institutionalize Regulated Strategic
  Plan that completes the supervisor's review and obtains the acknowledgement on record
  before the strategic plan takes effect (Basel SREP review completion; SRB resolution-plan
  review completion; NHS England / Department of Health strategy review completion;
  PUC rate-case strategic-plan review completion).
belongs_to_business_process: dea:process-institutionalize-regulated-strategic-plan
cohesion_rationale: Constituent work shares a single supervisor-review-completion
  concern, one input class (the filed strategic-plan submission and the supervisor's
  review criteria), and one output (the supervisor's acknowledgement on record preserved
  on the regulated strategic-plan record). Cohesion score 9/9 assessed at deposition
  (CR-BP-32 section 6).
