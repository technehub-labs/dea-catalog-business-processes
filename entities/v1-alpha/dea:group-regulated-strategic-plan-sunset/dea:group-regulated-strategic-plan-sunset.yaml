# Canonical Process Group entry: dea:group-regulated-strategic-plan-sunset.
#
# Lands as part of CR-BP-101 (SD Retire admission tranche), closing
# the 7x7 = 49-cell matrix. Sister cell to dea:group-regulated-
# strategic-plan-activation (CR-BP-86 at SD.Activate), but the
# Retire cell is distinct: it handles regulator-directed sunset of
# a supervisor-acknowledged-and-live strategic plan, not the
# live-readiness activation of a board-approved-but-not-live plan.
#
# Design (CR-BP-12 §4):
#   - Catalog-owned record, NOT a metamodel entity.
#   - ID family: dea:group-* (CR-BP-04 §4).
#   - Canonical containment: L1 group --composes--> L2 process.
#   - The L2 entities carry the inverse `part_of` for navigation.
#   - MECE within Process Context (PG-006) is enforced.

id: dea:group-regulated-strategic-plan-sunset
type: ProcessGroup
version: 1.0.0

name: Regulated Strategic Plan Sunset

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of moving a regulated entity's strategic plan
  from supervisor-acknowledged-and-live to regulator-acknowledged-
  and-sunset in the StrategyAndDirection x Retire context where a
  competent regulator has required the plan's retirement (failed
  stress test triggers plan replacement; bank recovery-plan
  rejection by the SRB; FDIC directive to retire an inadequate
  resolution plan; state PUC retraction of an approved strategic
  plan; NHS England directive to retire a non-viable 5-year
  strategy). The group captures the work of winding down a
  regulated strategic plan under the regulator's continuing
  supervision, with the replacement plan's status preserved and
  the retired plan's records retained per the regulated-entity
  retention policy.

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-sd-retire

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - "Regulator directive or rejection notice (failed stress test triggers plan replacement; bank recovery-plan rejection by the SRB; FDIC directive to retire an inadequate resolution plan; state PUC retraction of an approved strategic plan; NHS England directive to retire a non-viable 5-year strategy)"
    - "Superseded or replaced plan identification on the regulated strategic-plan record"
    - "Filings register update for the regulated strategic plan"
    - "Communications plan execution for the regulated strategic-plan sunset under the regulator's continuing supervision"
    - "Regulator-acknowledged sunset record preservation on the regulated strategic-plan record"
    - "Retained-records plan execution per the regulated-entity retention policy"
    - "Affected business-unit notification under the regulator's continuing supervision"
  excludes:
    - "Strategic-plan conception, design, build, activation, steady-state execution, and improvement (StrategyAndDirection x Conceive / Design / Build / Activate / Operate / Improve)"
    - "Non-regulated strategic-plan sunset (single-business-unit rollout without regulator's review): remains RECORD-PATTERN or MERGE per CR-BP-63 baseline"
    - "Strategic plans absent a regulator-directed sunset regime"
    - "Strategic-plan disposition where no competent regulator has required retirement"
    - "Replacement-plan activation (handled at StrategyAndDirection x Activate)"

# Intended enterprise outcomes.
outcomes:
  - "The regulated strategic plan is formally sunset under the enterprise's regulated-entity retention policy with the regulator directive on record, the replacement plan's status preserved, the retired plan's records retained per the regulated-entity retention policy, and the supervisor's acknowledgement of the sunset recorded."

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
# This Process Group composes 1 L2 Business Process specialisation(s)
# that landed as part of the same CR-BP-101 tranche.
composes:
  - source_id: dea:group-regulated-strategic-plan-sunset
    target_id: dea:process-sunset-regulated-strategic-plan
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-80
      escape-clause discovery outcome (Sunset Regulated Strategic
      Plan, score 8) landed by CR-BP-101. The discovery evidence
      (FDICIA Section 131; SRB rejection; Bank of England PRA
      SS9/17; state PUC retraction; NHS England directive)
      activates the register v2 cell's verbatim escape condition:
      "Activate and Retire are lifecycle transition stages" is
      superseded for the Retire coordinate by the regulator-directed
      sunset regime that creates a distinct sunset step with
      regulator directive on record, replacement-plan status
      preserved, retired-plan records retained, and supervisor's
      acknowledgement of the sunset recorded.
    provenance:
      type: architecture-review
      reference: CR-BP-101
      asserted_by: dea-team
      asserted_at: '2026-09-19'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: functional

