id: dea:task-report-quality-performance-intake
type: Task
name: Report Quality Performance Intake
definition: 'The bounded unit of work within `dea:activity-report-quality-performance`
  (Report Quality Performance) that carries out the intake phase of the parent''s
  verb-object decomposition. Phase responsibility: designated intake custodian. Phase
  trigger: Parent Activity''s input class is presented for processing and the activity
  owner is notified of intake. Phase outcome: Intake registered; input artifact preserved
  with audit identifiers; downstream phases may proceed.'
belongs_to_activity: dea:activity-report-quality-performance
trigger: Parent Activity's input class is presented for processing and the activity
  owner is notified of intake.
outcome: Intake registered; input artifact preserved with audit identifiers; downstream
  phases may proceed.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Acceptance of the input artifact per parent Activity scope.
  - Issuance of intake acknowledgment with audit identifiers.
  exclusions:
  - Validation of the input against specifications (phase 2).
  - Transformation of the input to the specified form (phase 3).
evidence:
- source: dea:activity-report-quality-performance
  claim: "Parent Activity cohesion rationale (CR-BP-32 \xA76): Constituent work shares\
    \ a single aggregation-and-reporting concern, consumes one input class (per-batch\
    \ quality records), and serves one audience (the Execution and Fulfillment Process\
    \ Group). Cohesion score 7/9 assessed at deposition (CR-BP-32 \xA76; research/l3-candidate-universe.yaml);\
    \ lowest of the pilot set because reporting cadence varies by stakeholder, retained\
    \ as a distinct Activity because absorption into Record Inspection Results would\
    \ mix capture and aggregation concerns."
  strength: E3
- source: CR-BP-102
  claim: Task decomposition pattern (5-phase verb-object completion) authored by `scripts/decompose_l4.py`.
  strength: E2
