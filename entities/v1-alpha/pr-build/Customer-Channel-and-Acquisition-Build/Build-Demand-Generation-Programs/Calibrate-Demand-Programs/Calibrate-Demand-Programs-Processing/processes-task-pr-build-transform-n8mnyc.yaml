plain_language_name: 'Tune the Programmes Against Early Demand'
plain_language_description: 'With the report in hand, the processing custodian tunes: the integration surface for the channels is adjusted, the programme assets are re-instantiated where the response demands, and the attribution model is recalibrated against the early signal. The result is captured as an inventory of build-ready assets.'
business_purpose: 'It exists so the programmes reach steady state tuned to real demand rather than to the assumptions in the original brief.'
practical_context: 'It opens when the verification report clears the build, and it closes with the asset inventory produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function recalibrates the programmes against the first demand signals.'
