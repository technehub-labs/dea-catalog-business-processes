plain_language_name: 'Produce the First Demand and Measure It'
plain_language_description: 'With the report in hand, the processing custodian produces and measures: the integration surface for the channels carries the programmes, the programme assets are instantiated, and the attribution model is calibrated against the first responses. The evidence is captured as an inventory of build-ready assets.'
business_purpose: 'It exists so the enterprise learns whether the engine actually generates demand, not merely that it is switched on.'
practical_context: 'It opens when the verification report clears the build, and it closes with the asset inventory produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function runs the programmes, measures the first demand, and gathers the evidence.'
