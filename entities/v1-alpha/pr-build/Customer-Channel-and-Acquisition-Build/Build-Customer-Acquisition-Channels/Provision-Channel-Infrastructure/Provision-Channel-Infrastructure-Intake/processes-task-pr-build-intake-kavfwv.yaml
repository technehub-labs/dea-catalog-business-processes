plain_language_name: 'Take Charge of the Infrastructure Build Pack'
plain_language_description: 'Provisioning opens with the design brief in hand: which channels are in the mix, what the demand programmes call for, and what the asset library already holds. The intake custodian settles the scope of the build with the owners of the channels and the demand programmes, then logs the pack.'
business_purpose: 'It exists so the infrastructure work starts from a brief the channel and programme owners have actually agreed to.'
practical_context: 'It opens when the Build-stage pack is handed over, and it closes with the manifest registered and custody passed to the verification custodian.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function walks the channel owner through the design brief and logs the agreed scope for the stand-up.'
