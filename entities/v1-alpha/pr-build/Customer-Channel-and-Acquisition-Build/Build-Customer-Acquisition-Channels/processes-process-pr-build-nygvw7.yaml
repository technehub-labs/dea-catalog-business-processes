plain_language_name: 'Build Customer Acquisition Channels'
plain_language_description: 'With the experience and journey designs agreed, the routes that will actually bring customers in have to be constructed. This work stands up the channel infrastructure, connects it to the designed experience, and tests that the acquisition engines work end to end. It finishes with the pipes ready to deliver the first customers.'
business_purpose: 'Designs attract no one until channels exist; this work turns the plans into working routes to market, ready to acquire the enterprise''s first customers.'
practical_context: 'Follows the commitment of the customer experience and journey designs: customer relationship management and the strategy function build and validate the channels, with readiness reported to the governing board.'
worked_example:
  agent_type: human
  narrative: 'Once the journey design is signed off, the strategy function specifies each acquisition channel, customer relationship management configures and tests the flows against the designed experience, and the governing board hears that the routes are ready for the first customers.'
