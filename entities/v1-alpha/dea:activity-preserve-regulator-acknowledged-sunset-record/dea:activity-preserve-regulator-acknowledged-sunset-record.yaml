id: dea:activity-preserve-regulator-acknowledged-sunset-record
type: Activity
name: Preserve Regulator-Acknowledged Sunset Record
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Sunset Regulated Strategic Plan that
  preserves the regulator-acknowledged sunset record on the regulated strategic-plan
  record for the regulated-entity retention policy (the supervisor's acknowledgement
  of the sunset recorded against the plan; the regulator identifier, directive date,
  and effective-retirement date preserved; the replacement plan's status preserved
  on the same record; the retired plan's records retained per the regulated-entity
  retention policy; the regulator-acknowledged sunset record available for downstream
  supervisor review).
belongs_to_business_process: dea:process-sunset-regulated-strategic-plan
cohesion_rationale: Constituent work shares a single regulator-acknowledged-sunset-record-preservation
  concern, one input class (the regulated strategic-plan record plus the regulator
  directive or rejection notice plus the superseded-plan identification plus the filings
  register update plus the executed communications plan), and one output (the regulator-acknowledged
  sunset record preserved on the regulated strategic-plan record per the regulated-entity
  retention policy). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
