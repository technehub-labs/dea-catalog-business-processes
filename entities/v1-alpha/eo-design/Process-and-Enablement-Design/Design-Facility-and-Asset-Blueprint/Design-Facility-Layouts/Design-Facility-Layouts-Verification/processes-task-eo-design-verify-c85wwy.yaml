plain_language_name: 'Check the Inputs Before Designing the Layouts'
plain_language_description: 'Before any layout is designed, the verification custodian checks the principles and model against what layout design requires - that the principles are the framed set and the model states what each facility must host. Defects are logged for rejection or repair before the design is made.'
business_purpose: 'It exists so layouts are never organized around a model that was only partly stated.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the model silent on one facility''s purpose and logs the defect before layouts are designed.'
