plain_language_name: 'Specify Equipment'
plain_language_description: 'This activity names the equipment that will populate each designed layout, to a stated standard. The layouts arrive with the lifecycle postures as the frame, equipment is specified position by position and checked against both, and the equipment specification is confirmed onward for the capacity modelling. A builder could order from this document.'
business_purpose: 'It exists so the enterprise knows exactly which equipment fills its layouts and to what standard, before any money is spent.'
practical_context: 'It follows the layout design, when the layouts and the lifecycle postures are to hand, and it completes once the equipment specification is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer specifies the equipment for each position in the drawn layouts, checks the choices against the lifecycle postures, and confirms the specification for capacity modelling.'
