plain_language_name: 'Consolidate the Logistics Design for the Build'
plain_language_description: 'With the pieces verified, the processing custodian does the consolidation itself: transport modes, routing logic, and node positions are brought together into the committed logistics and routing design, and the committed design is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because designs scattered across documents build nothing - the commit is where the logistics design becomes one authority ready for build.'
practical_context: 'It starts once checking is complete and the verified pieces are ready to be consolidated, and it ends with the committed logistics design produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the operations function consolidates the pieces into the committed logistics and routing design, ready for build, keeping the working papers.'
