plain_language_name: 'Design Routing Logic'
plain_language_description: 'This activity writes the rules that decide which way each shipment travels across the network. The chosen modes and the service-level designs arrive as the constraints, the routing specification is drawn and checked against them, and the routing logic is confirmed onward for the design''s commitment. Shipments will follow rules, not improvisation.'
business_purpose: 'It exists so every shipment moves by designed logic that honours the chosen modes and promised service levels.'
practical_context: 'It follows the node positioning, when the mode selections and service-level designs are to hand, and it completes once the routing specification is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer draws the rules deciding each shipment''s path through the positioned nodes, checks them against the mode and service constraints, and confirms the routing specification.'
