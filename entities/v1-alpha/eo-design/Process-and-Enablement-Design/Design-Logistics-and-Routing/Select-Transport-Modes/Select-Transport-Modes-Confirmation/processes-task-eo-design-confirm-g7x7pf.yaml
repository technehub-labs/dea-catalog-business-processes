plain_language_name: 'Confirm the Selected Transport Modes'
plain_language_description: 'When the modes stand chosen, the confirmation custodian reconciles them against the outcome the activity set out to reach and issues the confirmation. The routing design that follows learns the modes are chosen and the logic can be written to honour them.'
business_purpose: 'It exists so the network is designed only around modes confirmed as chosen.'
practical_context: 'It begins once preparation is complete and the chosen modes await their consumers, and it closes with the confirmation issued, consumers informed, and the result reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the chosen modes against the activity''s intended outcome and issues the confirmation the routing work needs.'
