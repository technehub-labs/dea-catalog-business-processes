plain_language_name: 'Check the Design and Geography Before Placing the Nodes'
plain_language_description: 'Before any node is placed, the verification custodian checks the delivery model design and the demand geography against what positioning requires - that the design is the committed one and the geography is current. Defects are logged for rejection or repair before any node is positioned.'
business_purpose: 'It exists so nodes are never placed against a design that was superseded or a geography that has moved.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the geography a cycle behind the demand picture and logs the defect before any node is placed.'
