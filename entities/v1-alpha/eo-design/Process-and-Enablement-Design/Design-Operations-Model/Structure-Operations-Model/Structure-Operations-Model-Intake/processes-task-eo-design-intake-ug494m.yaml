plain_language_name: 'Receive the Committed Strategy for the Model Build-Out'
plain_language_description: 'Structuring opens when the committed operations strategy is handed over as the source the model will be structured from. The intake custodian accepts it, registers it with audit identifiers, and starts the structuring from a recorded baseline.'
business_purpose: 'It exists so the model is structured from the committed strategy rather than from preference.'
practical_context: 'It opens when the committed strategy is presented for the structuring, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the operations function registers the committed strategy as the structuring baseline, with audit references, and opens the shaping work.'
