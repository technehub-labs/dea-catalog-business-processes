plain_language_name: 'Integrate Model Components'
plain_language_description: 'This activity brings the four bounded strands — the delivery design, the platform architecture, the facility blueprint, and the routing design — into one coherent whole. The finished component designs arrive one by one, their joins are reconciled and clashes resolved, and the integrated model is confirmed onward for the rhythm work. Four good designs become one workable model.'
business_purpose: 'It exists so the enterprise designs one operations model, not four designs that have never met each other.'
practical_context: 'It follows the four component designs, when each bounded design is handed over complete, and it completes once the integrated model is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer reconciles the delivery, technology, facility, and routing designs into one model, resolves the clashes where they meet, and confirms the integrated whole for the rhythm specification.'
