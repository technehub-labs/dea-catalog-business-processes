plain_language_name: 'Commit Delivery Model Design'
plain_language_description: 'This activity gathers the channel configurations, the service-level specification, and the fulfilment flow designs into one design and gives it formal standing. The three strands arrive as its inputs, the whole is consolidated and reviewed for coherence, and the committed design is confirmed for the build stage. The delivery model stops being three documents and becomes one decision.'
business_purpose: 'It exists so the enterprise holds one committed delivery model design that delivery capability build can start from.'
practical_context: 'It closes the delivery model design, once channels, service levels, and flows are designed, and it completes when the committed design is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian assembles the channel configurations, service-level specification, and flow designs into the design document, checks the three hang together, and records the commitment for the build teams.'
