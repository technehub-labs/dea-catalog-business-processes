plain_language_name: 'Design Integration Patterns'
plain_language_description: 'This activity draws the ways the platform''s specified components will connect to one another. The component specification arrives as the map of what must join, integration approaches are designed pair by pair and gathered into a catalogue, and the catalogue is confirmed onward for the topology work. No component is left an island.'
business_purpose: 'It exists so the platform''s components connect by designed, repeatable patterns rather than ad hoc wiring.'
practical_context: 'It follows the component specification, when the specified components are presented for connecting, and it completes once the integration catalogue is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer designs how each pair of specified components connects, gathers the approaches into a catalogue, and confirms it for the topology definition.'
