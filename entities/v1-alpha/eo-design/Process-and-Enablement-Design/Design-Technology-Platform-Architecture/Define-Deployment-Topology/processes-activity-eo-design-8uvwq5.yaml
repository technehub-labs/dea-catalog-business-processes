plain_language_name: 'Define Deployment Topology'
plain_language_description: 'This activity settles where each component will run — which environments, how they are distributed, and where they sit geographically. The component specification and the integration catalogue arrive as the inputs, the topology is defined and checked against both, and the definition is confirmed onward for the architecture''s commitment. The platform gains a geography as well as a shape.'
business_purpose: 'It exists so every platform component has a designed place to run, decided with the connections in mind.'
practical_context: 'It follows the integration design, when the components and their connections are specified, and it completes once the topology definition is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer assigns each specified component its environments and distribution, checks the layout against the integration catalogue, and confirms the topology definition.'
