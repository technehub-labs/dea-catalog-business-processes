plain_language_name: 'Check the Inputs Before Defining the Topology'
plain_language_description: 'Before anything is defined, the verification custodian checks the specification and patterns against what definition requires - that every component is specified and every connection carries a pattern. Defects are logged for rejection or repair before the topology is defined.'
business_purpose: 'It exists so the topology is never defined around components that were only partly specified.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a component connection with no pattern behind it and logs the defect before the topology is defined.'
