plain_language_name: 'Specify Platform Components'
plain_language_description: 'This activity turns each platform family identified during framing into concrete components with a stated purpose. The framed enablement approach arrives as the source, components are specified family by family and checked against it, and the component specification is confirmed onward for the integration work. Platform kinds become platform parts.'
business_purpose: 'It exists so the platform families the enterprise committed to become buildable components with clear purposes.'
practical_context: 'It opens the platform architecture design, when the framed enablement approach is presented for detailing, and it completes once the component specification is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'An operations function designer works each identified platform family into named components with stated purposes, checks the set against the enablement approach, and confirms the specification.'
