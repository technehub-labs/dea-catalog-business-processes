plain_language_name: 'Name the Components Each Family Needs'
plain_language_description: 'With the approach verified, the processing custodian does the specification itself: the platform components that realize each identified family are named and set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because families are categories, not kit - the specification is where each family becomes the components that will actually run.'
practical_context: 'It starts once checking is complete and the verified approach is ready to be specified from, and it ends with the component specification produced and the working papers kept.'
