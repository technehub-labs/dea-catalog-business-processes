id: dea:group-relationship-termination
type: ProcessGroup
version: 1.0.0

name: Relationship Termination

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of closing out enterprise relationships in the
  PartyAndRelationship x Retire context (contract close-out, party
  offboarding, residual obligation and record resolution).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-pr-retire

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Contract close-out and termination settlement
    - Party offboarding across roles (customer, supplier, partner)
    - Residual obligation and record resolution
  excludes:
    - Steady-state relationship operation (Operate)
    - Relationship improvement and development (Improve)
    - Asset retirement and decommissioning (EnablementAndOperations x Retire)

# Intended enterprise outcomes.
outcomes:
  - Relationships are closed out under approved termination plans with residual obligations settled and regulated offboarding evidenced.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-relationship-termination
    target_id: dea:process-close-enterprise-relationship
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-63 discovery
      outcome (ADMIT-CANONICAL recommendation) landed by CR-BP-67.
    provenance:
      type: architecture-review
      reference: CR-BP-67
      asserted_by: dea-team
      asserted_at: '2026-09-14'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: cross-cutting

# Discovery / governance status (mirrors register values).
status: accepted

# Catalog entry lifecycle (PG-008 enforces).
lifecycle_status: candidate

