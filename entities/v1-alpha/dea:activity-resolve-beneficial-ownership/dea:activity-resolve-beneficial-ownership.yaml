id: dea:activity-resolve-beneficial-ownership
type: Activity
name: Resolve Beneficial Ownership
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Onboard Regulated Party Relationship
  that identifies every natural person who ultimately owns or controls the applicant
  legal entity to the threshold set by the controlling regime and records the ownership
  chain with source evidence.
belongs_to_business_process: dea:process-onboard-regulated-party-relationship
cohesion_rationale: Constituent work shares a single beneficial-ownership resolution
  concern, one input class (the applicant's legal-entity structure and ownership declarations),
  and one output (the beneficial-owner register with thresholds met, control-person
  identification, and source evidence per natural person). Cohesion score 9/9 assessed
  at deposition (CR-BP-32 section 6).
