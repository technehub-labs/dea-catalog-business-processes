id: dea:group-governance-instrument-commencement
type: ProcessGroup
version: 1.0.0

name: Governance Instrument Commencement

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of bringing adopted governance instruments into
  force in the GovernanceAndExistence x Activate context
  (commencement verification, promulgation, effectiveness
  confirmation).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-ge-activate

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Commencement condition verification
    - Promulgation of adopted instruments
    - Effectiveness confirmation and recording
  excludes:
    - Instrument adoption and approval (Build)
    - Enforcement and operation of in-force instruments (Operate)
    - Instrument review and amendment (Improve)

# Intended enterprise outcomes.
outcomes:
  - Adopted instruments are brought into force with commencement conditions verified and promulgation recorded.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-governance-instrument-commencement
    target_id: dea:process-bring-into-force
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-63 discovery
      outcome (ADMIT-CANONICAL recommendation) landed by CR-BP-65.
    provenance:
      type: architecture-review
      reference: CR-BP-65
      asserted_by: dea-team
      asserted_at: '2026-09-14'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: governance

# Discovery / governance status (mirrors register values).
status: accepted

# Catalog entry lifecycle (PG-008 enforces).
lifecycle_status: candidate

# ECF Conformance Gate (CR-ECF-CG-001..004).
ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: '1.0.0'
  profile: dea:ecf@1.0.0
  status: conformant
  affiliation: inherits-catalog
  canonicalReferences:
    - kind: coordinate
      domain: GovernanceAndExistence
      stage: Activate
      identifier: ecf:governanceExistence.activate

# Evidence (CR-BP-11 register strength scale E0..E5).
evidence:
  - source: CR-BP-63 lifecycle discovery exercise
    claim: |
      This Process Group's coordinate was evaluated by the CR-BP-63
      discovery record
      discovery/v1-alpha/governance-and-existence-activate.yaml: the
      cell's canonical candidate Bring into Force scored 9/10 with an
      ADMIT-CANONICAL recommendation on universal entry-into-force
      evidence, overturning (with evidence) the register v2 per-cell
      deferral note.
    strength: E4
    reference: discovery/v1-alpha/governance-and-existence-activate.yaml
  - source: CR-BP-65 admission tranche
    claim: |
      CR-BP-65 lands this Process Group as the L1 home of the
      discovery-admitted Business Process and flips the register cell
      to ratified-accepted / landed.
    strength: E4
    reference: change-requests/CR-BP-65-ge-activate-admission.md

# Metadata (PG-006 cross-context overlap exception path lives here).
metadata:
  established_by: CR-BP-65
  established_at: '2026-09-14'
  cross_context_overlap: []
  change_history:
