id: dea:group-operations-and-asset-decommissioning
type: ProcessGroup
version: 1.0.0

name: Operations and Asset Decommissioning

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of withdrawing and retiring operational assets in
  the EnablementAndOperations x Retire context (retirement planning,
  isolation and withdrawal, decommissioning and disposal, residual
  resolution).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-oe-retire

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Retirement planning and approval
    - Isolation and withdrawal from service
    - Decommissioning and disposal (including data sanitization)
    - Residual value and obligation resolution
  excludes:
    - Steady-state operation and maintenance (Operate)
    - Asset improvement and upgrade (Improve)
    - Product and service withdrawal (ProductAndValue x Retire)

# Intended enterprise outcomes.
outcomes:
  - Assets are withdrawn, decommissioned and disposed of under approved retirement plans with residual obligations resolved.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-operations-and-asset-decommissioning
    target_id: dea:process-decommission
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-63 discovery
      outcome (ADMIT-CANONICAL recommendation) landed by CR-BP-66.
    provenance:
      type: architecture-review
      reference: CR-BP-66
      asserted_by: dea-team
      asserted_at: '2026-09-14'

# Process Group kind (PG-007 enforces controlled vocabulary).
