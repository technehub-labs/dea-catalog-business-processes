id: processes:group-ao-operate-35gmps
type: ProcessGroup
version: 1.0.0
name: Agent Operations
definition: 'The bounded Process Group that organises the Business Process responsibilities
  of operating agents in service in the AgencyAndOrganization x Operate context: agent
  performance operation, payroll and benefits, time and attendance, learning and development
  delivery (training for humans, fine-tuning for artificial agents), and collaboration
  coordination. Substrate-neutral per ADR-ECF-002 section 5. v2.4.0 grounding (domain-grounding.md
  §3.3).

  '
process_context: processes:pc-ao-operate-zfevmp
scope:
  includes:
  - Agent performance operation
  - Payroll and benefits operation
  - Time and attendance operation
  - Learning and development delivery (all substrates)
  - Collaboration coordination
  excludes:
  - Agent capacity planning (Conceive/Design; adjacent contexts)
  - Service delivery to customers (product-value x operate)
  - Agent development improvement (Improve stage; adjacent context)
outcomes:
- Agent performance is operated with review cadence.
- Payroll, benefits, time, and attendance are operated accurately.
- Learning and development are delivered with completion recorded.
- Collaboration is coordinated across agents and teams.
