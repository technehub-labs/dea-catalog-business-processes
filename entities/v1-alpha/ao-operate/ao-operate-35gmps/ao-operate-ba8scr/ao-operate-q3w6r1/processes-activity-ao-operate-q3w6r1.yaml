name: Track Hours-Of-Work And Rest-Rule Compliance
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Operate Regulated Performance Oversight
  that Track hours-of-work and rest-rule compliance for each regulator-licensed role:
  FAA Part 117 flight / duty / rest; state healthcare work-hour limits; SMCR fitness-and-propriety
  indicators; EU AI Act Article 14 oversight-hours. Shared concern: hours-of-work
  compliance. Input: the live role list; the hours-of-work recording. Output: the
  hours-of-work and rest-rule compliance record.'
belongs_to_business_process: processes:process-ao-operate-ba8scr
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single track hours-of-work and rest-rule compliance concern,
  one input class, and one output (the track hours-of-work and rest-rule compliance
  record on the regulated personnel record).
