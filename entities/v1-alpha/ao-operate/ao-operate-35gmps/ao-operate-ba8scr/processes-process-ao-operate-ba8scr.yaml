id: processes:process-ao-operate-ba8scr
name: Operate Regulated Performance Oversight
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: >-
  Operate the regulator-aligned continuing-compliance oversight of regulator-licensed roles under the enterprise regulated-entity approval authority. The trigger is the regulator-licensed role becoming live on the regulated personnel record. The outcome is regulator-aligned compliance evidence current and auditable on the regulated personnel record: continuing-supervisor notification, conduct-rule compliance (FCA SMCR COCON, FINRA Rule 3110, FAA Part 117, EU AI Act Article 14), fitness-and-propriety annual attestations, hours-of-work and rest-rule compliance, and continuing-competence tracking (state bar MCLE, state healthcare CME, NAIC CE).
trigger: >-
  The enterprise is operating regulator-licensed roles whose continuing-supervisor notification obligations, conduct-rule compliance, fitness-and-propriety annual attestations, hours-of-work and rest-rule compliance, and continuing-competence tracking must be maintained on the regulated personnel record throughout the role's live operation period, separate from substrate-neutral agent performance operations.
outcome: >-
  The regulator-licensed roles' regulator-aligned compliance evidence is current on the regulated personnel record; continuing-supervisor notification, conduct-rule compliance, fitness-and-propriety annual attestation, hours-of-work and rest-rule compliance, and continuing-competence tracking are current and auditable.
identity:
  verb: Operate
  object: Regulated Performance Oversight
  scope: enterprise
  outcome_statement: >-
    The regulator-tied Regulated Performance Oversight operate work has been carried out
    at the AgencyAndOrganization x Operate coordinate under the enterprise
    regulated-entity approval authority. The outcome is recorded on the regulated
    personnel record with the supervisor-controlled scope, the fitness-and-propriety
    attestation regime, the supervised-training completion requirements, and the
    continuing-supervisor notification path documented per the regulator's
    continuing-supervision framework. Substrate-neutral operate work is
    excluded. Adjacent lifecycle stages (Conceive / Design / Build / Activate /
    Operate / Improve / Retire) are excluded.
