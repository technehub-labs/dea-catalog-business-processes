version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Operate Regulated Performance Oversight
  that Audit regulator-licensed role conduct-rule compliance: FCA SMCR COCON (Conduct
  Rules); FINRA Rule 3110; FAA Part 117 (flight / duty time); EU AI Act Article 14
  (human-oversight conduct); state bar professional conduct; state healthcare professional
  conduct. Shared concern: conduct-rule compliance audit. Input: the live regulator-licensed
  role list; the conduct-rule matrix. Output: the conduct-rule compliance audit record.'
belongs_to_business_process: processes:process-ao-operate-ba8scr
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single audit conduct-rule compliance concern, one input
  class, and one output (the audit conduct-rule compliance record on the regulated
  personnel record).
