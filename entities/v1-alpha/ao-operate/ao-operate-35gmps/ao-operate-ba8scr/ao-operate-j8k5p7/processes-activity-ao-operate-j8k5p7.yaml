name: Annual Fitness-And-Propriety Re-Attestation
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Operate Regulated Performance Oversight
  that Run the annual fitness-and-propriety re-attestation for each regulator-licensed
  role: SMCR FIT annual assessment under SYSC 25; state healthcare annual fitness;
  bar MCLE annual fitness; NAIC annual CE; FAA recurrent. Shared concern: annual fitness
  re-attestation. Input: the live role list; the annual attestation calendar. Output:
  the annual fitness re-attestation record.'
belongs_to_business_process: processes:process-ao-operate-ba8scr
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single annual fitness-and-propriety re-attestation concern,
  one input class, and one output (the annual fitness-and-propriety re-attestation
  record on the regulated personnel record).
