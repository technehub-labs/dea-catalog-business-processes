plain_language_name: 'Run Agent Performance'
plain_language_description: 'This process is the steady-state running of the workforce once agents are onboarded and in active operation. It covers coordination and collaboration, time and attendance, compensation, and learning and development, applied consistently however the work is done. The aim is that every agent, human or artificial, is supported and productive in day-to-day service.'
business_purpose: 'It exists to keep the whole agentive workforce performing reliably in service, by running the everyday operations that performance depends on.'
practical_context: 'Runs continuously once onboarded agents are in active operation across the organization, with workforce management responsible for the steady-state performance, coordination, compensation, and learning operations.'
worked_example:
  agent_type: human
  narrative: 'In any given week, workforce management runs the routines that keep the workforce operating: coordinating collaboration across teams, processing time and attendance records, keeping compensation flowing, and scheduling development sessions.'
