plain_language_name: 'Receive the Live Role List and Competence Plan'
plain_language_description: 'Tracking opens when the live role list and the continuing-competence plan are handed to the intake custodian. Both are accepted, registered with audit identifiers, and set down as the material the completion tracking will run from.'
business_purpose: 'It exists so competence tracking runs from a registered role list against a registered plan.'
practical_context: 'It opens when the role list and competence plan are presented for tracking, with the activity owner alerted, and it closes with the intake registered and the remaining steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the live role list and competence plan as the tracking baseline, with audit references.'
