plain_language_name: 'Re-Attest Each Role''s Fitness on Its Annual Date'
plain_language_description: 'With the inputs verified, the processing custodian runs the annual cycle itself: each live role''s fitness-and-propriety position is re-attested per the calendar, and the annual fitness re-attestation record is set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because fitness decays silently; the annual re-attestation is where the organisation re-proves each role still merits its authority.'
practical_context: 'It starts once checking is complete and the verified inputs are ready to be run from, and it ends with the annual fitness re-attestation record produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian re-attests each live role''s fitness per its annual date and records the results, keeping the working papers.'
