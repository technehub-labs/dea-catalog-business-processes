plain_language_name: 'File the Programme Evaluation Audit Record'
plain_language_description: 'At the close the records custodian preserves the evaluation trail at its required retention tier and sets the retrieval handles for it. How each completed programme measured against the gaps it targeted stays readable whenever the learning investment is questioned.'
business_purpose: 'It exists so the effectiveness judgements behind the learning spend can be evidenced whenever they are challenged.'
practical_context: 'It starts once the evaluation confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the evaluation trail at its retention tier and sets the retrieval handles a learning investment review would consult.'
