plain_language_name: 'Check the Completions Before Evaluating the Programmes'
plain_language_description: 'Before any programme is judged, the verification custodian checks the completions against what evaluation requires - that the record covers the whole programme and its targeted gaps. Gaps in the record itself are logged for rejection or repair before the judgement is made.'
business_purpose: 'It exists so a programme is never judged effective or not over an incomplete completion record.'
practical_context: 'It runs once the intake is registered and the completions can be compared with the activity''s requirements, and it finishes with them verified or their gaps logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds one programme''s completions missing a whole cohort and logs the gap before the evaluation judges it.'
