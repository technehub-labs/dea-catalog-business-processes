plain_language_name: 'Check the Priorities and Plan Before Scheduling'
plain_language_description: 'Before anything is put on the schedule, the verification custodian checks the priorities and plan against what scheduling requires - that every committed priority has a programme to answer it and the plan is the current committed version. Defects are flagged for rejection or repair before the schedule is drawn up.'
business_purpose: 'It exists so the learning calendar never answers a priority list that was superseded or half committed.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a committed priority with no programme behind it and flags the defect before the schedule is drawn up.'
