plain_language_name: 'Deliver Learning Sessions'
plain_language_description: 'This activity runs the learning sessions the calendar calls for, for people and artificial agents alike. The schedule comes in first, each session is delivered as planned and its running is logged, and the delivered sessions are confirmed for the record. What agents attend is thereby delivery by timetable, not by chance.'
business_purpose: 'It exists so the scheduled development actually reaches the agents it was planned for, on the timetable committed.'
practical_context: 'It follows the scheduling of development programmes, when the calendar is presented for delivery, and it completes as each delivered session is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A workforce management custodian runs each session on the calendar as planned, logs how the delivery went, and confirms the delivered sessions for completion recording.'
