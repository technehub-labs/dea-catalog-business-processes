plain_language_name: 'Resolve the Collaboration Frictions'
plain_language_description: 'This activity takes the frictions that surface in cross-team work and works them through to resolution. The facilitated interactions arrive as the source, each friction is examined and settled against the agreed norms, and the resolutions are confirmed and filed. Left alone, such frictions accumulate; here they are cleared while they are still small.'
business_purpose: 'It exists so friction between teams and agents is settled early, before it accumulates into disruption of day-to-day service.'
practical_context: 'It happens when facilitated cross-team work surfaces a friction, and it closes once each resolution is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A workforce management custodian settles a handoff disagreement between a team and the team owning an artificial agent, lands the resolution within the agreed norms, and files it for the record.'
