plain_language_name: 'Provision the Collaboration Workspaces'
plain_language_description: 'This activity sets up the shared working arrangements that agents and teams need in order to work together once in service. The operating organization and its teams arrive as the input, the workspaces each grouping needs are provisioned and made ready, and the provisioned set is confirmed for the teams involved. Joint work then has somewhere defined to happen, shared across people and artificial agents alike.'
business_purpose: 'It exists so collaboration in service has proper shared ground to happen on, rather than each grouping improvising its own.'
practical_context: 'It happens when the operating organization and its teams need shared working arrangements for joint work, and it completes once the provisioned workspaces are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A workforce management custodian sets up the shared workspace a mixed team of people and artificial agents will use, checks it is ready for joint work, and confirms it to the team.'
