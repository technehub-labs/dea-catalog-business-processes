plain_language_name: 'Run Time and Attendance'
plain_language_description: 'This process captures when and how much the workforce works, accurately and every day. Exceptions such as missing records or unusual hours are spotted and handled rather than left to accumulate. The clean attendance data then feeds payroll so people are paid for the time they actually worked.'
business_purpose: 'It exists to keep an accurate, exception-free record of working time, because payroll execution and workforce planning both depend on it.'
practical_context: 'Runs continuously across service delivery, with workforce management handling daily capture and exception resolution so the data is ready to feed payroll execution.'
worked_example:
  agent_type: human
  narrative: 'During a normal week, workforce management reviews the captured time records, chases the few exceptions such as a missing clock-in or an unapproved overtime entry, and clears them before the payroll cut-off.'
