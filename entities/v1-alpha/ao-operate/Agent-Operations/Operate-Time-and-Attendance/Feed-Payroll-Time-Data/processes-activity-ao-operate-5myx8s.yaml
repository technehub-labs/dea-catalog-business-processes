plain_language_name: 'Pass the Time Data to Payroll'
plain_language_description: 'This activity hands the cycle''s settled time data over to payroll so it can calculate. The resolved exceptions and checked records come in as the final inputs, the feed is assembled and delivered for the cycle, and the handover is confirmed for the record. This is the bridge that lets attendance become pay.'
business_purpose: 'It exists so payroll receives, each cycle, time data that has been captured, checked, and settled.'
practical_context: 'It closes the time and attendance cycle, running once validation and exception resolution are done, and it completes when the feed is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian assembles the cycle''s settled attendance records, hands them to payroll for calculation, and confirms the handover with its audit identifiers on file.'
