plain_language_name: 'Validate Attendance Records'
plain_language_description: 'This activity checks the captured attendance entries for accuracy before anything moves toward pay. The captured records come in first, each entry is examined against expectations, and the checked records are confirmed onward, with anything questionable flagged for the exception step rather than waved through.'
business_purpose: 'It exists so payroll only ever receives attendance data that has been checked for accuracy.'
practical_context: 'It follows the daily capture of time and attendance, when the captured records are presented, and it completes once the validated records are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian examines the day''s captured attendance entries for accuracy, flags the questionable ones for exception handling, and confirms the clean records onward.'
