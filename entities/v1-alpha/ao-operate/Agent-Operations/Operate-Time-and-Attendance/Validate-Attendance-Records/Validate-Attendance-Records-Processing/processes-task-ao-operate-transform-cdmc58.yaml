plain_language_name: 'Confirm the Captured Records Are Accurate'
plain_language_description: 'With the capture verified, the processing custodian does the validation itself: each captured record is checked for accuracy, corrections are marked where needed, and the validated attendance records are set down in the form the activity defines. Working papers are preserved for audit.'
business_purpose: 'It exists because payroll figures are only as good as the time behind them - validation is where accuracy is actually proven.'
practical_context: 'It starts once checking is complete and the verified capture is ready to be validated, and it ends with the validated records produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian checks each captured record for accuracy and sets down the validated set, keeping the working papers.'
