plain_language_name: 'Check the Validated Set Before Resolving the Exceptions'
plain_language_description: 'Before any exception is resolved, the verification custodian checks the validated set against what resolution requires - that the anomalies it flags are real against the validated record. Defects are logged for rejection or repair before any exception is worked.'
business_purpose: 'It exists so agents are never pulled into exception handling over anomalies the validation raised in error.'
practical_context: 'It runs once the intake is registered and the set can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds an exception flagged against time that was never captured and logs the defect before it is worked.'
