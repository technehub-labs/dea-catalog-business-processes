plain_language_name: 'File Statutory Returns'
plain_language_description: 'This activity prepares and files the returns the pay cycle''s rules demand, working from the payments made and the benefits administered. The executed disbursements and administered benefits come in as the inputs, each return is prepared, checked, and filed, and the filed returns are confirmed and retained. The enterprise''s filing obligations are thereby met every cycle.'
business_purpose: 'It exists so the filings that go with paying people are completed properly, every cycle.'
practical_context: 'It closes the pay cycle, running once payments have been executed and benefits administered, and it completes when the filed returns are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian prepares the cycle''s returns from the executed payments and benefits records, checks each filing against the applicable rules, and files it with the confirmation step recording the outcome.'
