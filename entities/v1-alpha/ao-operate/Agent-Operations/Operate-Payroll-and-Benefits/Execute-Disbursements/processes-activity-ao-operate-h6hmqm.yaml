plain_language_name: 'Pay Out the Cycle''s Payroll on Time'
plain_language_description: 'This activity moves the money: it pays out what the cycle''s payroll calculated, correctly and by the due date. The computed payroll arrives first, each disbursement is executed and checked as it goes, and the executed payments are confirmed for the record. This is the moment the workforce actually gets paid.'
business_purpose: 'It exists so agents receive what they are owed, accurately and on the day it falls due.'
practical_context: 'It follows the payroll calculation and benefits administration each cycle, and it closes when the executed payments are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian releases the cycle''s payments from the confirmed payroll figures, checks each disbursement landed as calculated, and confirms the executed payments went out on time.'
