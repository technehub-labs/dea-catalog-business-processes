definition: The bounded unit of work within `dea:activity-design-touchpoints` (Design Touchpoints) that retain the design package (intake manifest, verification report, design-ready journey artefact, design-completion confirmation, and any quality-criteria remediations) under the journey-design records retention schedule with cryptographic integrity protection.
belongs_to_activity: dea:activity-design-touchpoints
trigger: Completion confirmation issued for Design Touchpoints; record gate may retain the closure case file under the records retention schedule with cryptographic integrity protection.
outcome: Closure case file retained for Design Touchpoints under the records retention schedule with cryptographic integrity protection; cryptographic destruction attestation recorded where storage-limitation horizons apply.
responsibility: records custodian
boundary:
  inclusions:
  - Retention of the Design Touchpoints closure case file under the records retention schedule with cryptographic integrity protection.
  - Issuance of cryptographic destruction attestation for Design Touchpoints records past the storage-limitation horizon.
  exclusions:
  - Re-execution of prior phases (no rollback semantics).
  - Re-classification of records already past the storage-limitation horizon (cryptographic destruction is irreversible).
