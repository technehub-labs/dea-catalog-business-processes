notes:
- "All five candidates FAIL standalone_executability and resource_dedication and therefore classify as L3 Activities, not L2 Business Processes (CR-BP-32 §5)."
- "Decomposition terminates at L4 (Task); no Task records exist yet (dea:Task is metamodel-owned, lifecycle: proposed). Each landed Activity therefore carries decomposition_boundary: l4-reached per CR-BP-32 §12 and ACT-004."
- "cohesion_score uses the established 0-9 Cohesion Evaluation Score (CR-BP-32 §6) as a deposition-time assessment; the numerical threshold remains governed by the conformance specification."
