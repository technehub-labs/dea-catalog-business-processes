l3_candidate_universe_version: 0.1.0
cr: CR-BP-42
status: candidate-not-canonical; subject to review
parent_business_process: dea:process-operate-quality-control
coordinate:
  domain: EnablementAndOperations
  stage: Operate
  process_context: dea:pc-oe-operate
  process_group: dea:group-execution-and-fulfillment
deposition_approach: structured (research deposition before canonical landing;
  mirrors the CR-BP-11 L1 candidate-universe pattern one layer down)
selection_rationale: |
  Pilot BP for the first L3 (Activity) deposition. Chosen because the BP is
  well-bounded (trigger: production output must be inspected against
  specifications before it can serve customers; outcome: inspections and
  dispositions recorded per batch), carries process_type: core in the
  thickest ECF coordinate (EnablementAndOperations / Operate, 9 BPs), and
  has strong external-framework anchoring (APQC PCF quality management
  activities, ISO 9001 clause 8.7 nonconformity control, ISO 2859/ISO 3951
  sampling inspection). The five candidates below decompose the BP outcome
  into cohesive logical work groupings per CR-BP-32 §4.
sources:
- dea-metaframework/framework/*
- dea-catalog-processes/entities/v1-alpha/dea:process-operate-quality-control
- change-requests/CR-BP-32 (Activity Model)
- APQC PCF 7.0 (Manage quality; Inspect/test products and services)
- ISO 9001:2015 clause 8.7 (Control of nonconforming outputs)
- ISO 2859-1 / ISO 3951 (sampling procedures for inspection)
l2_criteria_legend:
  input_output_transformation: candidate transforms a definable input into a
    definable output (CR-BP-32 §5)
  objective_contribution: candidate contributes to the parent BP outcome
    (CR-BP-32 §5)
  standalone_executability: candidate is NOT independently executable as an
    enterprise process (fail => Activity, not BP)
  resource_dedication: candidate does NOT command dedicated enterprise
    resources in its own right (fail => Activity, not BP)
l3_candidate_count: 5
l3_candidates:
