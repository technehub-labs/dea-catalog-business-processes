  cohesion_score: 8
  in_scope: "Inspection planning for production batches; sampling scheme selection; specification and tolerance lookup; inspection scheduling"
  out_of_scope:
  - "Quality management system design (L2 peer family under dea:pc-oe-design)"
  - "Execution of the inspection itself (dea:activity-execute-inspection-and-testing)"
  evidence:
