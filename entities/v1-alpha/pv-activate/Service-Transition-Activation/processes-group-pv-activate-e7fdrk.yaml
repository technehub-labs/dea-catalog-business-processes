plain_language_name: 'Launching Propositions into Service'
plain_language_description: 'This family moves validated propositions into live operational service. Its processes validate transition readiness, carry out the service transition, and secure operational acceptance so the launch is completed with evidence on record.'
business_purpose: 'So propositions reach customers only after readiness is validated and acceptance recorded — a controlled launch rather than a hopeful one.'
practical_context: 'Encountered at launch time, between development and market-readiness build and the steady-state running of the portfolio.'
worked_example:
  agent_type: human
  narrative: 'A new service variant has finished development. The Product & Value Process Owner validates the transition readiness checklist, runs the cutover into operational service, and obtains the operational acceptance signature before the launch is declared complete.'
