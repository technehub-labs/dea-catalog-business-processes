plain_language_name: 'Confirm Operational Acceptance'
plain_language_description: 'This activity collects the formal handover signature — the operational owner accepts the service, with the evidence attached. The stabilised service arrives as the candidate for acceptance, sign-off is obtained from the accepting owner and evidenced, and the accepted service is confirmed onward for operational life. The transition ends when someone with ownership says, in writing, that it is theirs now.'
business_purpose: 'It exists so operational reliance on the service begins with a formal, evidenced acceptance by its owner.'
practical_context: 'It closes the transition once early operations are stabilised, and it completes when the formal acceptance with ownership sign-off and evidence is confirmed into operational service.'
worked_example:
  agent_type: human
  narrative: 'A product management officer presents the stabilised service for acceptance, obtains the operational owner''s signed sign-off with the evidence attached, and confirms the accepted service into operation.'
