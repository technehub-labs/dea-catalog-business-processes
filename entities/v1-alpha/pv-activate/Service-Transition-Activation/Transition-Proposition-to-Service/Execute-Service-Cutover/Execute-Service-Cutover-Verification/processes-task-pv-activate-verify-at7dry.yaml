plain_language_name: 'Check the Package Before the Switch'
plain_language_description: 'Before the service is switched on, the verification custodian tests the arriving package against what the activity requires. Shortfalls are written down, either for rejection or for putting right, before anything moves.'
business_purpose: 'It exists so the operational environment only receives a service that has passed its checks.'
practical_context: 'It starts once the intake is on file, and it ends with the checks recorded and custody passed to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian of the proposition design authority clears the package for the switch and logs each shortfall found.'
