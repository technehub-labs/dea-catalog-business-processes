plain_language_name: 'Frame Funding and Capital Approach'
plain_language_description: 'This activity sets where the enterprise''s money will come from and on what capital terms — the sources, the structure, and the posture it will take. The bounded monetary model arrives as the frame, the approach to funding and capital is worked out and reviewed against it, and the framed approach is confirmed onward for the strategy''s commitment. How the enterprise is capitalized is thereby settled in principle.'
business_purpose: 'It exists so the enterprise commits early to how it will be funded and capitalized, within the bounds its monetary model sets.'
practical_context: 'It follows the monetary framing, when the bounded model is presented for the funding work, and it completes once the funding and capital approach is confirmed for the strategy''s commitment.'
worked_example:
  agent_type: human
  narrative: 'A finance function lead sets the funding sources, structure, and posture against the bounded monetary model, reviews the approach with the strategy function, and confirms it for commitment.'
