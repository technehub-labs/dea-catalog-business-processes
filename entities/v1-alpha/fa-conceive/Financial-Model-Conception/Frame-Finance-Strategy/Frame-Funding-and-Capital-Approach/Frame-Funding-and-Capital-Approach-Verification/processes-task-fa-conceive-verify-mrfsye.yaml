plain_language_name: 'Check the Model Before Framing the Capital Posture'
plain_language_description: 'Before anything is framed, the verification custodian checks the bounded monetary model against what framing requires - that its bounds are stated completely enough to frame a capital posture within. Defects are flagged for rejection or repair before the framing is made.'
business_purpose: 'It exists so the capital posture is never framed inside a model that was only partly bounded.'
practical_context: 'It runs once the intake is registered and the model can be compared with the activity''s requirements, and it finishes with it verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the model''s bounds unstated for one currency posture and flags the defect before the capital posture is framed.'
