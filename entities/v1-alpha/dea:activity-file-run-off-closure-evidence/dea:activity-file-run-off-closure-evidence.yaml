id: dea:activity-file-run-off-closure-evidence
type: Activity
name: File Run-Off Closure Evidence
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Conclude Regulated Run-Off that prepares
  and files the run-off closure evidence with the controlling regulator, including
  the final run-off accounts, the policyholder-claim clearance certificate, the residual-asset
  distribution plan, and the request for cancellation of the authorisation or surrender
  of the licence.
belongs_to_business_process: dea:process-conclude-regulated-run-off
cohesion_rationale: Constituent work shares a single closure evidence filing concern,
  one input class (the final run-off financial position, the claim clearance certificate,
  and the residual asset distribution), and one output (the filed closure submission
  with regulator acknowledgement and the residual-asset distribution recorded). Cohesion
  score 9/9 assessed at deposition (CR-BP-32 section 6).
