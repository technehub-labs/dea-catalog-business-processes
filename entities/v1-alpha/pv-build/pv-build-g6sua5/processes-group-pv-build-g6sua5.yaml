name: Product Development
definition: 'The bounded Process Group that organises the Business Process responsibilities of building product variants, service capabilities, innovation prototypes, and market readiness in the ProductAndValue x Build context. v2.4.0 grounding (domain-grounding.md §3.5).

  '
process_context: processes:pc-pv-build-ygbmxb
scope:
  includes:
  - Product variant development
  - Service capability build
  - Innovation prototype build
  - Market readiness preparation
  excludes:
  - Technology build (enablement-operations)
  - Proposition design (Design stage; adjacent context)
  - Catalogue operation (Operate stage; adjacent context)
outcomes:
- Product variants and service capabilities are built.
- Innovation prototypes are built for hypothesis testing.
- Market readiness is prepared with go-to-market assets.
