plain_language_name: 'Verify Prototype Readiness'
plain_language_description: 'This activity proves the finished prototype can actually run its hypothesis test inside the time the experiment allows. The documented, instrumented prototype arrives with the experiment design and timebox as the yardstick, readiness is examined against both, and the determination is confirmed for testing. The experiment starts only when the prototype is proven test-ready.'
business_purpose: 'It exists so the experiment begins on a prototype proven able to test its hypothesis in time.'
practical_context: 'It closes the prototype build once construction, instrumentation, and documentation are complete, and it completes when the readiness determination is confirmed within the experiment''s timebox.'
worked_example:
  agent_type: human
  narrative: 'A product management verifier checks the instrumented prototype can run the hypothesis test inside the timebox, and confirms the readiness determination for testing.'
