plain_language_name: 'Keep the Personnel Preparation Record'
plain_language_description: 'Once the confirmation is in, the records custodian preserves the audit record at its required retention tier and sets the retrieval handles for the evidence review. The story of who was readied, and how, stays readable for the discipline''s duration.'
business_purpose: 'It exists so who was prepared, on what design, stays answerable when service questions arise.'
practical_context: 'It opens when the confirmation is issued and retention may begin, and it closes with the audit record preserved and retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in product management files the personnel preparation record at its retention tier and sets the retrieval handles.'
