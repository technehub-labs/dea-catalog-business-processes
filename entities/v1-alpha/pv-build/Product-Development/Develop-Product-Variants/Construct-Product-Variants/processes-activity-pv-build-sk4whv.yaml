plain_language_name: 'Construct Product Variants'
plain_language_description: 'This activity builds out each bounded variant of the product that the designed propositions call for. The designed propositions arrive as the specification of what must exist, variants are constructed within their bounds and checked as they build, and the constructed variants are confirmed onward for conformance checking. One product becomes a family here.'
business_purpose: 'It exists so every variant the designed propositions require exists as a constructed reality.'
practical_context: 'It opens the variant development when the designed propositions require bounded variant construction, and it completes as the constructed variants are confirmed onward for conformance verification.'
worked_example:
  agent_type: human
  narrative: 'A product management builder constructs each bounded variant the designed propositions call for, and confirms the constructed variants onward for conformance checking.'
