plain_language_name: 'Assemble Go-to-Market Assets'
plain_language_description: 'This activity gathers everything the offering will need in front of customers — the materials, the messaging, the supporting artefacts — into one launch kit. The freshly built offering arrives as the thing to be sold, go-to-market assets are assembled against it and checked, and the assembled kit is confirmed onward for the pricing and channels. The product learns to speak for itself here.'
business_purpose: 'It exists so the offering goes to market with its complete kit of selling materials.'
practical_context: 'It opens the market readiness preparation once the product or service is built, and it completes as the assembled go-to-market assets are confirmed onward for pricing and channel setup.'
worked_example:
  agent_type: human
  narrative: 'A product management officer assembles the launch materials and messaging the built offering needs, checks the kit, and confirms the assembled assets onward.'
