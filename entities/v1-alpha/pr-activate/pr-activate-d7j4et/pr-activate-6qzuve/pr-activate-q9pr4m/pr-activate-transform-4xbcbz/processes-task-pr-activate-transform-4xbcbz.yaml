name: Record Onboarding Decision Processing
definition: 'The bounded unit of work within `processes:activity-pr-activate-q9pr4m` (Record Onboarding Decision) that execute the verified-record transformation: resolve the canonical party identifier, compute the risk classification, derive the due-diligence tier, and produce the activated-party record conforming to the master-data model.'
belongs_to_activity: processes:activity-pr-activate-q9pr4m
trigger: Verification certificate issued for Record Onboarding Decision; transform gate may execute the bounded work and emit the conformant artefact under the Activate schema.
outcome: Bounded-work artefact produced for Record Onboarding Decision conforming to the Activate schema; processing custodian passes custody to the confirmation custodian.
responsibility: processing custodian
boundary:
  inclusions:
  - Execution of the Record Onboarding Decision bounded work producing the conformant artefact.
  - Application of the Record Onboarding Decision schema and any derived classifications or computations.
  exclusions:
  - Long-term retention of the closure case file (phase 5).
  - Notification of governing parties outside the notify-list (phase 4).
