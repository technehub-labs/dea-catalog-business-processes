status: candidate
definition: The cohesive grouping of work within Onboard Regulated Party Relationship that assigns the applicant a risk classification by combining the verified identity, resolved beneficial ownership, jurisdictional risk, product and channel exposure, and the controlling regime's risk-sensitive sectors into a defensible risk rating.
