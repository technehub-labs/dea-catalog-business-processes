id: processes:group-pr-activate-d7j4et
type: ProcessGroup
version: 1.0.0
name: Regulated Onboarding
definition: 'The bounded Process Group that organises the Business Process

  responsibilities of activating enterprise relationships in the

  PartyAndRelationship x Activate context where regulatory

  obligations trigger distinct group-level work (KYC/AML/CDD;

  identity verification; beneficial-ownership resolution; risk

  classification; onboarding approval).

  '
process_context: processes:pc-pr-activate-mwq7bj
scope:
  includes:
  - Customer Identification Program (CIP) and Customer Due Diligence (CDD/EDD)
  - Beneficial-ownership identification, verification, and resolution at account opening
  - Sanctions and PEP screening; risk classification and onboarding approval
  - Onboarding refusal with recorded rationale
  excludes:
  - Non-regulated first-time activation (handled inside dea:pc-pr-operate per register v2 doctrine)
  - Steady-state relationship operation (Operate)
  - Relationship improvement and development (Improve)
  - Relationship close-out and regulated offboarding (Retire, CR-BP-67)
outcomes:
- Relationships are activated under verified identity, resolved beneficial ownership, and an assigned risk classification, with downstream monitoring obligations handed off to the Operate context.
composes:
- source_id: processes:group-pr-activate-d7j4et
  target_id: processes:process-pr-activate-6qzuve
  relationship_type: composes
  direction: source-to-target
  status: active
  asserted_by: dea-team
  rationale: 'The L2 process belongs to this cell per the CR-BP-70 escape-clause

    discovery outcome (ADMIT-CANONICAL recommendation) landed by

    CR-BP-71. The discovery evidence (FATF R.10, FinCEN CDD

    31 CFR 1010.230 + CIP, EU AMLD4/AMLD5/AMLD6, Basel BCBS ML/FT

    guidelines, Wolfsberg Group) activates the register v2 cell''s

    verbatim escape condition.

    '
  provenance:
    type: architecture-review
    reference: CR-BP-71
    asserted_by: dea-team
    asserted_at: '2026-09-15'
