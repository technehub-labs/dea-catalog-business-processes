id: processes:pc-pr-activate-mwq7bj
domain: PartyAndRelationship
lifecycle_stage: Activate
name: Enterprise Relationship Activation
definition: 'The bounded enterprise context for **activating enterprise

  relationships** in the **Party & Relationship** domain where

  regulatory obligations (identity verification, beneficial-ownership

  resolution, risk classification, onboarding approval) trigger

  distinct group-level work before the relationship may commence.

  This context addresses the regulated-onboarding dimension of

  relationship activation; non-regulated first-time activation remains

  covered by the receiving Operate cell (relationship operation

  includes habitual onboarding) and is excluded.

  '
scope:
  includes:
  - Regulated onboarding (KYC/AML/CDD) and identity verification
  - Beneficial-ownership identification, verification, and resolution
  - Risk classification and onboarding approval
  - Onboarding refusal with recorded rationale
  excludes:
  - Relationship establishment and acquisition work (Build stage; sibling coordinate)
  - Steady-state relationship operation (Operate stage; adjacent context)
  - Relationship improvement and development (Improve stage; adjacent context)
  - Relationship close-out and regulated offboarding (Retire stage; sibling coordinate, CR-BP-67)
  - Non-regulated first-time activation (handled inside dea:pc-pr-operate per register v2 doctrine)
outcomes:
- Relationships are activated under verified identity, resolved beneficial ownership, and an assigned risk classification.
- Onboarding decisions (approve / decline) are recorded with their evidence.
- Downstream monitoring obligations are handed off to the Operate context.
adjacent_contexts:
- processes:pc-pr-conceive-6xztsq
- processes:pc-pr-design-hrcdy4
- processes:pc-pr-build-a46hp7
- processes:pc-pr-operate-pwue5a
- processes:pc-pr-improve-k8phkn
- processes:pc-pr-retire-2cusde
processes:
- processes:process-pr-activate-6qzuve
cell_charter:
  enterprise_concern: 'Party & Relationship: the regulated activation of enterprise relationships across party roles (customer, supplier, partner).'
  lifecycle_concern: 'Activate: regulated onboarding with verified identity, resolved beneficial ownership, and onboarding approval.'
  combined_semantic_meaning: 'The regulated-onboarding activation work that brings an enterprise

    relationship from unverified applicant to verified, risk-rated,

    approved (or declined) party under KYC/AML/CDD controls, before

    commencement of the relationship itself.

    '
  expected_outcomes:
  - Verified identity and resolved beneficial ownership at the time of activation
  - Risk classification assigned and onboarding decision recorded
  - Downstream monitoring obligations handed off to the Operate context
  inclusions:
  - Customer Identification Program (CIP) and Customer Due Diligence (CDD/EDD)
  - Beneficial-ownership resolution at account opening (FinCEN CDD Rule, 31 CFR 1010.230)
  - Sanctions and PEP screening; onboarding approval authority
  - Onboarding refusal with recorded rationale
  exclusions:
  - Non-regulated first-time activation (handled inside dea:pc-pr-operate)
  - Steady-state relationship operation (Operate context)
  - Relationship close-out and regulated offboarding (Retire context, CR-BP-67)
  - Asset retirement and decommissioning (EnablementAndOperations x Retire; sibling cell)
  adjacent_boundaries:
  - 'processes:pc-pr-operate-pwue5a (adjacent context): the Operate cell continues onboarding decisions not gated by regulated onboarding and conducts ongoing monitoring.'
  - 'processes:pc-pr-retire-2cusde (sibling cell, CR-BP-67): the Retire cell handles close-out and regulated offboarding (including GDPR-driven erasure); the Activate cell handles regulated onboarding at the relationship''s start.'
  - 'processes:pc-ge-activate-hxtfcv (sibling cell, CR-BP-65): Bring Policy Instrument into Force handles regulatory instrument commencement, distinct from party-relationship activation.'
lifecycle_status: candidate
status: candidate
