plain_language_name: 'Keep the Decision File for the Required Years'
plain_language_description: 'With the decision confirmed, the records custodian places the onboarding file into retention under the schedule for party records, protected against tampering. It holds the manifest, the certificate, the record, the acknowledgement, and the reasoning behind any refusal.'
business_purpose: 'It exists because regulators and courts may later ask who approved a relationship, when, and on what evidence.'
practical_context: 'It opens when the completion confirmation is issued, and it closes with the file retained at its tier and any destruction attestation recorded.'
worked_example:
  agent_type: human
  narrative: 'A records custodian archives an approval file, keeping the approver identities and rationale retrievable for the retention period.'
