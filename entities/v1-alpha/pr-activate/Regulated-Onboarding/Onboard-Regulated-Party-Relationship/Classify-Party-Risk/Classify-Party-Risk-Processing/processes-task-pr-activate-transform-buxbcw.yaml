plain_language_name: 'Rate the Applicant''s Risk and Set the Diligence Tier'
plain_language_description: 'With the certificate in hand, the processing custodian turns verification results into a rating: the party identifier is pinned down, the risk classification is computed, and the diligence tier follows from it. The output is a party record that meets the master-data standard.'
business_purpose: 'It exists so the enterprise treats each applicant according to the risk they actually present, with the tier driving how much scrutiny follows.'
practical_context: 'It opens when the verification certificate clears the application, and it closes with the rated party record produced and custody passed to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the risk function rates a new corporate applicant, sets the enhanced-diligence tier, and produces the party record.'
