plain_language_name: 'Classify Party Risk'
plain_language_description: 'This activity weighs everything already learned — who the applicant is, who really owns them, where they operate, what they will buy — into one defensible risk rating, weighed against the sectors the regime flags as risk-sensitive. The verified identity and resolved ownership arrive as its inputs, the rating is assigned and justified, and the classified applicant is confirmed onward for the decision. Due diligence becomes a single, arguable judgement here.'
business_purpose: 'It exists so every applicant carries a defensible risk rating built from verified facts, not impressions.'
practical_context: 'It follows the identity and ownership work, once both are verified and resolved, and it completes when the assigned risk classification is confirmed onward for the approval decision.'
worked_example:
  agent_type: human
  narrative: 'A risk function officer weighs the verified identity, the resolved ownership, and the jurisdictional exposure into a defensible risk rating, and confirms the classification onward.'
