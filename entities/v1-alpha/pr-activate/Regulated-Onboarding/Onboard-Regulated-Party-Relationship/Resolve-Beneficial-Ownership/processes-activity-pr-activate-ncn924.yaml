plain_language_name: 'Resolve Beneficial Ownership'
plain_language_description: 'This activity traces the applicant entity''s ownership to the living people ultimately behind it, to whatever depth the regime sets, and records the chain with its evidence. The verified identity arrives as the starting point, the ownership chain is worked through and documented, and the resolved ownership is confirmed onward for the risk classification. Shell fronts stop being effective here.'
business_purpose: 'It exists so the enterprise knows the natural people ultimately behind an applicant entity, evidenced to the regime''s threshold.'
practical_context: 'It follows the identity verification, working down the applicant entity''s ownership, and it completes once the ownership chain is recorded with source evidence and confirmed onward.'
worked_example:
  agent_type: human
  narrative: 'A risk function analyst traces the applicant entity''s ownership down to the natural persons ultimately in control, records each link with its evidence, and confirms the resolved chain onward.'
