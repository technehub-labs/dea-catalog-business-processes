plain_language_name: 'Take In the Ownership Declarations'
plain_language_description: 'Ownership work opens with intake: the applicant''s party record, the identity documents, and the request packet are received and logged. The intake custodian logs the request against the activation case file so the ownership chain work starts from a documented base.'
business_purpose: 'It exists because a beneficial-ownership resolution is only credible when the declarations and documents behind it are accounted for.'
practical_context: 'It opens when the Activate-stage pack is handed over, and it closes with the manifest registered and the verification custodian in custody.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in customer relationship management logs a holding company''s ownership declarations against the activation case file.'
