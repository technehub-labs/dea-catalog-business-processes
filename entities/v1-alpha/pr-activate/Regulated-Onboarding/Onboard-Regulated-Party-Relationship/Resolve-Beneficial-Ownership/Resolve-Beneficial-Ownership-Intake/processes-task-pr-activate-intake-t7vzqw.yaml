id: processes:task-pr-activate-intake-t7vzqw
type: Task
name: Resolve Beneficial Ownership Intake
definition: The bounded unit of work within `processes:activity-pr-activate-ncn924` (Resolve Beneficial Ownership) that accept custody of the incoming party record, identity-document package, and onboarding-request packet, and persist a registered intake manifest binding the request to the activation case file.
belongs_to_activity: processes:activity-pr-activate-ncn924
trigger: Custody of the Activate-stage input pack for Resolve Beneficial Ownership ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Resolve Beneficial Ownership case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Resolve Beneficial Ownership input pack against the Activate-stage intake contract.
  - Binding of the input pack to the Resolve Beneficial Ownership case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the closure case file (phase 5).
evidence:
- source: FATF Recommendation 10 (Customer Due Diligence)
  claim: governing AML/CDD standard for party-activation verification; binds the identity, sanctions, and adverse-media verification step to a regulator-recognised control. Bounded-work evidence for the intake-phase custodian of `processes:activity-pr-activate-ncn924` (CR-BP-L4-02 enrichment).
  strength: E1
- source: FinCEN CDD Rule (31 CFR 1010.230)
  claim: US-specific CDD rule establishing minimum identity-verification procedures that the activate-phase verification step operationalises. Bounded-work evidence for the intake-phase custodian of `processes:activity-pr-activate-ncn924` (CR-BP-L4-02 enrichment).
  strength: E1
- source: processes:activity-pr-activate-ncn924
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-02 cell-specific bounded-work prose for this PartyAndRelationship L4 Task.
  strength: E3
