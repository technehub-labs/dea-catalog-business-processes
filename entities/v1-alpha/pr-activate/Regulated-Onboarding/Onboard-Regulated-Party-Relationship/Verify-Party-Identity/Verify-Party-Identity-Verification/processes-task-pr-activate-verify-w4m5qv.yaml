plain_language_name: 'Verify Who the Applicant Really Is'
plain_language_description: 'The verification custodian establishes who the applicant is to the standard the regime demands: multi-factor identity confirmation, sanctions and politically-exposed screening, and adverse-media searches. The reconciled results are issued as a certificate naming the checks performed.'
business_purpose: 'It exists so the enterprise never opens a relationship with someone it cannot prove exists as claimed.'
practical_context: 'It starts once the intake manifest is registered, and it ends with the certificate issued and custody passed to the processing custodian.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the risk function confirms an applicant''s identity from documents and electronic traces, then issues the certificate.'
