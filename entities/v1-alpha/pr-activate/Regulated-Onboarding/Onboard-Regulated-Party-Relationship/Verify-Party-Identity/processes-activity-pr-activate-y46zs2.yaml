plain_language_name: 'Verify Party Identity'
plain_language_description: 'This activity proves who the applicant really is, to the standard the controlling regime sets — documents collected and checked, electronic identity verification run, independent sources brought in to corroborate. The application arrives as the trigger, identity is established piece by piece, and the verified identity is confirmed onward. Nothing else in onboarding can proceed on an unproven name.'
business_purpose: 'It exists so the enterprise knows, to its regulator''s standard, exactly who it is about to do business with.'
practical_context: 'It opens the regulated onboarding when a party applies in a jurisdiction or sector mandating identity verification first, and it completes once the verified identity is confirmed onward for the ownership work.'
worked_example:
  agent_type: human
  narrative: 'A customer relationship management officer checks the applicant''s identity documents, runs the electronic verification, and corroborates against independent sources before confirming the identity onward.'
