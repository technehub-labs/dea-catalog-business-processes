name: Communicate Obligations and Rights Intake
definition: The bounded unit of work within `dea:activity-communicate-obligations-and-rights` (Communicate Obligations and Rights) that accept custody of the legal-commencement input pack (constitutive instrument, commencement-order reference, obligations-and-rights schedule) and persist a registered intake manifest binding the commencement event to the activation case file.
belongs_to_activity: dea:activity-communicate-obligations-and-rights
trigger: Custody of the Activate-stage input pack for Communicate Obligations and Rights ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Communicate Obligations and Rights case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Communicate Obligations and Rights input pack against the Activate-stage intake contract.
  - Binding of the input pack to the Communicate Obligations and Rights case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
