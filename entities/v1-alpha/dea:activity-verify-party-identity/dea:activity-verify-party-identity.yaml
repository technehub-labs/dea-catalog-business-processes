name: Verify Party Identity
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Onboard Regulated Party Relationship
  that establishes the applicant's identity to the standard required by the controlling
  KYC/AML regime, including the collection and verification of identity documents,
  electronic identity checks, and corroborating independent sources.
belongs_to_business_process: dea:process-onboard-regulated-party-relationship
