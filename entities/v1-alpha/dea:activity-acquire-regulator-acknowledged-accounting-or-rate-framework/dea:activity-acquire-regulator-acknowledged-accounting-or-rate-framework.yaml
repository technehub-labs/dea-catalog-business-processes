id: dea:activity-acquire-regulator-acknowledged-accounting-or-rate-framework
type: Activity
name: Acquire Regulator-Acknowledged Accounting or Rate Framework
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Activate Billing Capability that
  acquires and records the regulator-acknowledged accounting or rate framework required
  for live invoicing or revenue recognition (IFRS 17 transition to active; NAIC statutory
  accounting framework activation; Solvency II framework activation; PUC rate-effective
  framework activation; PSD2 / Federal Reserve / ECB settlement-account framework
  activation).
belongs_to_business_process: dea:process-activate-billing-capability
cohesion_rationale: Constituent work shares a single accounting-or-rate-framework-acquisition
  concern, one input class (the billing-capability description and the regulator-mandated
  filing format), and one output (the regulator-acknowledged framework preserved on
  the regulated billing record). Cohesion score 9/9 assessed at deposition (CR-BP-32
  section 6).
