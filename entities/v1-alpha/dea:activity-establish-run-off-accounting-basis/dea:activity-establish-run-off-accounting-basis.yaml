id: dea:activity-establish-run-off-accounting-basis
type: Activity
name: Establish Run-Off Accounting Basis
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Conclude Regulated Run-Off that transitions
  the financial statements from going-concern to run-off statutory accounting basis
  as required by the controlling regulator, including recognition basis, liability
  measurement, and asset admissibility under the run-off rule set.
belongs_to_business_process: dea:process-conclude-regulated-run-off
cohesion_rationale: Constituent work shares a single run-off accounting basis concern,
  one input class (the going-concern financial position, the regulator-acknowledged
  run-off authorisation, and the controlling statutory accounting rule set), and one
  output (the run-off statutory accounts with basis-of-preparation disclosure and
  transition adjustments). Cohesion score 9/9 assessed at deposition (CR-BP-32 section
  6).
