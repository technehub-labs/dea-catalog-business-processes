plain_language_name: 'Receive the Reviewed Design for Structure Commitment'
plain_language_description: 'Commitment opens when the reviewed structure design is handed over as the arrangement the enterprise will build on. The intake custodian accepts the handover, registers it with audit identifiers, and opens the commitment work from a recorded base.'
business_purpose: 'It exists so the structure is committed from a registered reviewed design rather than from a working draft.'
practical_context: 'It opens when the reviewed design is presented for commitment, with the activity owner alerted, and it closes with the intake registered and the remaining steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the reviewed design as the commitment baseline, with audit references, and opens the commitment work.'
