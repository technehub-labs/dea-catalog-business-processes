plain_language_name: 'Draft the Organizational Architecture'
plain_language_description: 'This activity lays out the enterprise''s units and how they sit together, working from the model frame that strategy committed earlier. The frame is brought in and checked, the unit arrangement is drawn up from it, and the resulting draft is confirmed with the design authority before anyone adds authority detail. It ends with a drafted architecture on file that the rest of structure design can build on.'
business_purpose: 'It exists so structure design starts from a concrete arrangement of units that answers to the agreed model rather than from a blank page.'
practical_context: 'It opens the design of the organization structure, when the committed model frame is presented for drafting, and it completes once the drafted architecture is confirmed and its audit record retained.'
worked_example:
  agent_type: human
  narrative: 'A designer working for the organization design authority arranges the enterprise''s units according to the model''s principles and spans, then confirms the drafted arrangement with the authority before delegation detail is added.'
