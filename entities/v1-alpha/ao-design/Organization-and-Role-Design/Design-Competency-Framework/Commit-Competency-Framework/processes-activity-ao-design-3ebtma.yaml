plain_language_name: 'Commit the Competency Framework'
plain_language_description: 'This activity gathers the domains, levels, and assessment anchors into the finished competency framework and gives it formal standing. The anchored assessment arrives last, the whole framework is consolidated and reviewed, and its commitment is confirmed so the enterprise can use it as its yardstick for capability. The committed framework is then preserved as an audit record.'
business_purpose: 'It exists so the enterprise holds one ratified standard for capability that gap analysis and development planning can rely on.'
practical_context: 'It takes place at the close of competency framework design, once the assessment anchors are in place, and it completes when the committed framework is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian consolidates the identified domains, defined levels, and assessment anchors into the complete framework, obtains the organization design authority''s commitment, and preserves the audit record that establishes the framework as the capability yardstick.'
