plain_language_name: 'Anchor How Proficiency Is Assessed at Each Level'
plain_language_description: 'With the levels verified, the processing custodian sets the anchors themselves: how proficiency is assessed at each defined level is worked out and set down in the form the activity defines. Working papers behind the anchors are preserved for audit.'
business_purpose: 'It exists because levels only mean something once the evidence for holding each one is fixed in advance.'
practical_context: 'It starts once checking is complete and the verified levels are ready to be anchored, and it ends with the anchored competency assessment produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian pins the assessment evidence to each proficiency level, keeping the working papers for audit.'
