plain_language_name: 'File the Assessment Anchoring Audit Record'
plain_language_description: 'At the close the records custodian preserves the anchoring trail at its required retention tier and sets the retrieval handles for it. How each level''s assessment was anchored stays readable whenever assessment outcomes are later disputed.'
business_purpose: 'It exists so the anchors behind every assessment can be evidenced whenever a result is challenged.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the anchoring trail at its retention tier and sets the retrieval handles a disputed assessment review would consult.'
