plain_language_name: 'Design the Competency Framework'
plain_language_description: 'This process defines what good capability looks like across the organization. It sets out the proficiency levels that people and agents progress through and fixes the assessment anchors that distinguish one level from the next. Once in place, the framework becomes the yardstick for spotting capability gaps and planning development.'
business_purpose: 'It gives the enterprise a consistent way to describe and measure capability, so hiring, development, and gap analysis all judge performance against the same standard.'
practical_context: 'Runs during organization design, when the designed structure calls for defined proficiency levels and assessment anchors; the organization design authority leads it, and the framework then feeds ongoing capability gap monitoring.'
worked_example:
  agent_type: human
  narrative: 'While designing a new operations structure, the organization design authority drafts the proficiency levels for each role family, agrees the assessment anchors that separate one level from the next, and publishes the framework that managers will later use in capability reviews.'
