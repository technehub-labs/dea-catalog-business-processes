plain_language_name: 'Classify the Placement Candidates'
plain_language_description: 'This activity sorts the roles and pieces of work in the designed structure into candidates for people, artificial agents, or a blend of both. The committed organization model frame comes in first, each role and work item is examined and typed, and the classified candidates are confirmed with the design authority. The typing then anchors the placement decisions that follow.'
business_purpose: 'It exists so placement decisions start from an explicit classification of what work could sit where, rather than from assumptions.'
practical_context: 'It opens the design of the agent topology, when the framed organization model is presented for placement work, and it closes once the classified candidates are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A designer working for the organization design authority goes through the roles in the new structure, marks which are suited to people, artificial agents, or hybrid arrangements, and files the classification that placement decisions will build on.'
