description: >-
  Design the regulator-tied role catalogue and competency framework entries under the enterprise regulated-entity approval authority. The trigger is the decision that the role catalogue will include regulator-licensed roles. The outcome is a regulator-tied role catalogue committed, with each licensed-role entry aligned to its regulator's continuing-supervision framework, its competency and fitness-and-propriety attestation regime documented, its supervised-training completion requirements documented, and its continuing-supervisor notification path documented.
trigger: >-
  The enterprise's role catalogue and competency framework include roles whose holders must hold regulator-issued licences or admissions, and the design must align each role's authority, signing capacity, and scope to the regulator's continuing-supervision framework before the role enters Build or Activate.
outcome: >-
  The role catalogue carries regulator-tied role entries; each licensed-role entry is aligned to its regulator's continuing-supervision framework, its competency and fitness-and-propriety attestation regime is documented, and the role is ready to enter Build and Activate stages without re-scoping.
identity:
  verb: Design
  object: Regulated Role Architecture
  scope: enterprise
  outcome_statement: >-
    The regulator-tied Regulated Role Architecture design work has been carried out
    at the AgencyAndOrganization x Design coordinate under the enterprise
    regulated-entity approval authority. The outcome is recorded on the regulated
    personnel record with the supervisor-controlled scope, the fitness-and-propriety
    attestation regime, the supervised-training completion requirements, and the
    continuing-supervisor notification path documented per the regulator's
    continuing-supervision framework. Substrate-neutral design work is
    excluded. Adjacent lifecycle stages (Conceive / Design / Build / Activate /
    Operate / Improve / Retire) are excluded.
