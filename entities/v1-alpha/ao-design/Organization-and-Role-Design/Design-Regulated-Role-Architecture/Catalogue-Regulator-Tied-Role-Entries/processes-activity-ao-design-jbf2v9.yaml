plain_language_name: 'Catalogue the Regulator-Tied Role Entries'
plain_language_description: 'This activity writes the licensed roles into the role catalogue as regulator-tied entries. The approved regulated-scope declaration and the catalogue skeleton arrive first, and for each role the entry records the authority it carries, its signing capacity, its controlled-function designation, the licensing basis behind it, and the scope tied to its regulator. The completed entries are confirmed and retained so later design and activation work staffs against an accurate catalogue.'
business_purpose: 'It exists so the role catalogue states precisely which roles carry regulator-tied authority and on what licensing basis.'
practical_context: 'It opens the design of the regulated role architecture, when the regulated-scope declaration is presented alongside the catalogue skeleton, and it closes once the entries are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A designer for the organization design authority turns the approved scope declaration into catalogue entries for the enterprise''s controlled-function roles, recording each role''s authority, signing capacity, and licensing basis for the teams that will staff them.'
