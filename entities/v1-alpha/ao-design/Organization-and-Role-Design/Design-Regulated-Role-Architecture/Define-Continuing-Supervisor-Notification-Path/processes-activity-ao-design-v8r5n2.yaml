plain_language_name: 'Define the Continuing-Supervisor Notification Path'
plain_language_description: 'This activity designs, for each licensed role in the catalogue, exactly how its ongoing supervisor will be kept informed. The regulator-tied entries and the supervision matrix are taken in, and the work fixes who the supervisor is, how often notices go out, what those notices contain, and how escalations run when something needs attention. The defined path is confirmed and filed so activation later simply issues the notifications this design already settled.'
business_purpose: 'It exists so supervision arrangements are designed into each licensed role before anyone occupies it, ready for activation to trigger.'
practical_context: 'It runs during regulated role architecture design, once the catalogue entries and the supervision matrix are presented, and it completes when the defined path is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A designer for the organization design authority pairs each licensed role with its ongoing supervisor, sets the cadence and content of the notices and the escalation arrangements, and files the path for activation to use.'
