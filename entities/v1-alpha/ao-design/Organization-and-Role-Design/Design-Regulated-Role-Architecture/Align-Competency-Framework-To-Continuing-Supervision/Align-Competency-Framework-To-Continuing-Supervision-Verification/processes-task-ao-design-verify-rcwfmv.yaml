plain_language_name: 'Check the Alignment Inputs Before Aligning'
plain_language_description: 'Before any entry is aligned, the verification custodian checks the catalogue and skeleton against what alignment requires - that each licensed role in the catalogue has a framework place to be aligned into. Gaps are flagged for rejection or repair before the alignment is made.'
business_purpose: 'It exists so no licensed role''s competency entry is left floating outside the continuing-supervision framework.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their gaps logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds a licensed role missing its framework slot and flags the gap before any entry is aligned.'
