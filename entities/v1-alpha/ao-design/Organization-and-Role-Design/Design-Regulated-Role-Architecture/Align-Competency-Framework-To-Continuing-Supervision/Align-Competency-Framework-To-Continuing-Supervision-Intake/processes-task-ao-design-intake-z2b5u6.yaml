plain_language_name: 'Receive the Role Catalogue and Framework Skeleton'
plain_language_description: 'Alignment opens when the regulator-tied role catalogue and the competency framework skeleton are handed to the intake custodian. Both are accepted, registered with audit identifiers, and set down as the material the framework entries will be aligned from.'
business_purpose: 'It exists so competency entries are aligned from a registered catalogue against a registered framework skeleton.'
practical_context: 'It opens when the role catalogue and framework skeleton are presented for the alignment, with the activity owner alerted, and it closes with the intake registered and the later steps free to run.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the role catalogue and framework skeleton as the alignment baseline, with audit references.'
