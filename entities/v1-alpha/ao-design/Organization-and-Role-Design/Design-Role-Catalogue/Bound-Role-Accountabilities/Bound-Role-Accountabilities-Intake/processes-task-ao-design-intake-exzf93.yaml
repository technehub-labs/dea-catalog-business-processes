plain_language_name: 'Receive the Role Levels for Accountability Bounding'
plain_language_description: 'Accountability bounding opens when the defined role levels are handed over as the roles whose boundaries of accountability must be drawn. The intake custodian accepts them, registers the handover with audit identifiers, and starts the bounding work from a recorded baseline.'
business_purpose: 'It exists so accountabilities are bounded within a registered set of role levels rather than informally.'
practical_context: 'It opens when the role levels are presented for the bounding, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the defined role levels as the bounding baseline, with audit references, and opens the accountability work.'
