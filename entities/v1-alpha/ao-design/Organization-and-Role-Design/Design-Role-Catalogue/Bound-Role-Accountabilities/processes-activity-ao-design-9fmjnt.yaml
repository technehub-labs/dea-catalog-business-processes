plain_language_name: 'Set the Accountability Boundaries of Each Role'
plain_language_description: 'This activity marks, for every role the catalogue now lists, what that role is answerable for and where its responsibility ends. The defined levels come in last, the accountability boundary of each role is worked out and checked against its neighbours, and the bounded accountabilities are confirmed with the design authority. What is filed leaves no doubt about who owns which piece of work.'
business_purpose: 'It exists so responsibility between roles is unambiguous, with no gaps where work falls between two roles and no overlaps where both claim it.'
practical_context: 'It runs late in role catalogue design, once the levels within each family are set, and it closes when the bounded accountabilities are confirmed and their audit record retained.'
worked_example:
  agent_type: human
  narrative: 'A designer for the organization design authority draws the accountability line between two adjacent levels so handovers between them are unambiguous, then confirms each role''s boundary with the authority.'
