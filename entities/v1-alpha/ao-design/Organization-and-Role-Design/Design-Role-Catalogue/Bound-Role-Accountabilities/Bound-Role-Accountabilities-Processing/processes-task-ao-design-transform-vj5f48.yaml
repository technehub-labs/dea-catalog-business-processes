plain_language_name: 'Bound the Accountabilities of Each Catalogued Role'
plain_language_description: 'With the levels verified, the processing custodian bounds the accountabilities themselves: what each catalogued role is answerable for, and where its accountability ends, is worked out and fixed in the form the activity defines. Working papers behind each boundary are preserved.'
business_purpose: 'It exists because a role with unbounded accountabilities becomes either a bottleneck or a scapegoat.'
practical_context: 'It starts once checking is complete and the verified levels are ready to be bounded, and it ends with the bounded role accountabilities produced and the working papers kept.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the organization design authority fixes what each catalogued role answers for and where its accountability ends, keeping the working papers.'
