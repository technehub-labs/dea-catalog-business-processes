plain_language_name: 'Define the Role Levels'
plain_language_description: 'This activity sets the steps of seniority that each role family will carry in the catalogue. The defined families arrive first, the leveling structure within each is worked out and reviewed for sensible progression, and the defined levels are confirmed with the design authority. The catalogue then has, for every family, a common ladder that staffing and development decisions can use.'
business_purpose: 'It exists so each role family carries an agreed ladder of levels that the rest of the enterprise can plan careers and staffing against.'
practical_context: 'It follows the definition of the role families, when they are presented for leveling, and it completes once the defined levels are confirmed and their record preserved.'
worked_example:
  agent_type: human
  narrative: 'A designer for the organization design authority works through a newly defined family and sets its steps from entry to senior positions, checks the progression makes sense, and confirms the levels before accountability boundaries are drawn.'
