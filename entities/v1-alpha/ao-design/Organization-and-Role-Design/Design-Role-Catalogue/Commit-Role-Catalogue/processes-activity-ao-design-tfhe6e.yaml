plain_language_name: 'Commit the Role Catalogue'
plain_language_description: 'This activity gathers the families, levels, and accountability boundaries into the finished role catalogue and gives it formal standing. The bounded accountabilities arrive as the last piece, the whole catalogue is consolidated and reviewed, and its commitment is confirmed so downstream provisioning has one authoritative list of roles to work from. The committed catalogue is then preserved as an audit record.'
business_purpose: 'It exists so the enterprise holds one ratified list of roles that provisioning, planning, and staffing all answer to.'
practical_context: 'It takes place at the close of role catalogue design, once accountability boundaries are set, and it completes when the committed catalogue is confirmed, handed to provisioning, and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian consolidates the defined families, levels, and accountability boundaries into the complete catalogue, obtains the organization design authority''s commitment, and files the audit record that lets provisioning begin.'
