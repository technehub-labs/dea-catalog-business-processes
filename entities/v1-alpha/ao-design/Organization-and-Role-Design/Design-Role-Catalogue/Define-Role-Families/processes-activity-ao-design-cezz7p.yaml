plain_language_name: 'Define the Role Families'
plain_language_description: 'This activity groups the roles the designed structure needs into families of related work. The committed model frame comes in first, the natural groupings are worked out from it and reviewed, and the defined families are confirmed with the design authority. With the families set, the catalogue has its top-level organization and the leveling work can begin.'
business_purpose: 'It exists so the role catalogue organizes roles into recognizable groupings that planning and staffing can navigate.'
practical_context: 'It opens the design of the role catalogue, when the model frame is presented for family definition, and it closes once the defined families are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A designer for the organization design authority clusters the structure''s roles into families of related work, checks the grouping against the model frame, and confirms the families before levels are defined within them.'
