name: Catalogue Regulator-Tied Role Entries
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Design Regulated Role Architecture
  that Catalogue the regulator-tied role entries in the role catalogue: each role
  authority, signing capacity, controlled-function designation (FCA SMCR CF1..CF11),
  the regulator licensing basis, and the regulator-tied scope of each. Shared concern:
  regulator-tied role catalogue. Input: the regulated-scope declaration; the role
  catalogue skeleton. Output: the regulator-tied role catalogue entries.'
