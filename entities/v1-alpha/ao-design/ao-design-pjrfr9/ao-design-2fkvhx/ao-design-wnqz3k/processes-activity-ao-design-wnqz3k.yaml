name: Align Competency Framework To Continuing-Supervision
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Design Regulated Role Architecture
  that Align the competency framework entries for each regulator-licensed role to
  the regulator continuing-supervision framework: the competency statements, the assessment
  cadence, the assessor (employer / regulator), and the alignment to the regulator
  continuing-competence program. Shared concern: competency-framework alignment. Input:
  the regulator-tied role catalogue; the competency framework skeleton. Output: the
  aligned competency framework entries.'
belongs_to_business_process: processes:process-ao-design-2fkvhx
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single align competency framework to continuing-supervision
  concern, one input class, and one output (the align competency framework to continuing-supervision
  record on the regulated personnel record).
