cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single define fitness-and-propriety assessment regime
  concern, one input class, and one output (the define fitness-and-propriety assessment
  regime record on the regulated personnel record).
