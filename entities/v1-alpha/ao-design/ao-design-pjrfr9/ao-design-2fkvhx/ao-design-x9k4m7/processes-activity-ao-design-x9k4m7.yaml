name: Define Fitness-And-Propriety Assessment Regime
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Design Regulated Role Architecture
  that Define the fitness-and-propriety assessment regime for each regulator-licensed
  role: the assessment form (initial / annual / event-driven), the criteria, the attestor,
  and the regulator framing (SMCR FIT; state healthcare CME attestation; bar MCLE;
  NAIC CE; FAA recurrent). Shared concern: fitness-and-propriety assessment regime.
  Input: the regulator-tied role catalogue; the fitness-and-propriety matrix. Output:
  the defined fitness-and-propriety assessment regime.'
