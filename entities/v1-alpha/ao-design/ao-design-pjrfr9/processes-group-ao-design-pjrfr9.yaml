id: processes:group-ao-design-pjrfr9
type: ProcessGroup
version: 1.0.0
name: Organization and Role Design
definition: 'The bounded Process Group that organises the Business Process responsibilities of designing the organization, its roles, its competency framework, and its agent topology in the AgencyAndOrganization x Design context. Substrate-neutral per ADR-ECF-002 section 5: covers biological, artificial, and hybrid agents. v2.4.0 grounding (domain-grounding.md §3.3).

  '
process_context: processes:pc-ao-design-a4hq2r
scope:
  includes:
  - Organization structure design
  - Role catalogue design
  - Competency framework design
  - Agent topology design (human/artificial/hybrid)
  excludes:
  - Specific job description authoring (Build stage; adjacent context)
  - Organization model framing (Conceive stage; adjacent context)
  - Product or service design (product-value x design)
outcomes:
- Organization structure is designed with bounded spans.
- Role catalogue and competency framework are designed.
- Agent topology is designed with substrate placement decisions.
