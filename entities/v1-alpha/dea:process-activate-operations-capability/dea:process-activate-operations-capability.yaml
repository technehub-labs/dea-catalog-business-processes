# Evidence (CR-BP-11 register strength scale E0..E5).
evidence:
  - source: CR-BP-80 escape-clause discovery (EnablementAndOperations x Activate)
    claim: |
      Authoritative multi-source regulatory evidence (EASA / FAA AOC,
      PSD2 Articles 11 and 28, EMA / FDA / MHRA GMP, FAA Part 119,
      MiCA Article 59, ORR / ERA rail safety case, nuclear
      operations authorization). Universal sector practice across
      aviation, banking payments, pharmaceuticals, telecoms, rail,
      and nuclear. Strong boundary against Build / Operate / Retire
      coordinates. Score 10/10 with ADMIT-CANONICAL recommendation.
    strength: E5
    reference: discovery/v1-alpha/enablement-and-operations-activate-escape.yaml
  - source: EU Regulation 2018/1139 (EASA Basic Regulation) and EASA Part-OR / Part-ARO
    claim: "Air Operator Certificate (AOC) issuance authorizes commercial air operations; AOC issuance is the regulator-issued activation step."
    strength: E4
  - source: EU PSD2 (Directive 2015/2366) Articles 11 and 28
    claim: "Payment-institution and account-information-service-provider authorization; authorization under PSD2 is a precondition to live payment-services operation."
    strength: E4
  - source: EU GMP EudraLex Volume 4 and US FDA 21 CFR Parts 210-211
    claim: "Manufacturing GMP certification by EMA / FDA / MHRA is the regulator-issued authorization for pharmaceutical manufacturing."
    strength: E4
  - source: US FAA 14 CFR Part 119 and EASA Part-OR
    claim: "AOC certification is the regulator's authorization for live commercial aviation operations."
    strength: E4
  - source: EU MiCA (Regulation 2023/1114) Article 59 and UK FSMA authorization regimes
    claim: "Crypto-asset-service-provider and payment-institution authorization under the regulator's continuing supervision."
    strength: E4

