id: dea:group-regulated-operations-activation
type: ProcessGroup
version: 1.0.0

name: Regulated Operations Activation

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of moving an operations capability from
  regulator-authorized-but-not-live to regulator-authorized-and-live
  in the EnablementAndOperations x Activate context where
  regulator-issued authorization or certification (Air Operator
  Certificate, PSD2 / MiCA payment-institution authorization, GMP
  certification, FAA Part 119 air carrier authorization, ORR/ERA
  rail safety-case authorization, nuclear operations authorization)
  creates a distinct group-level activation concern separate from
  steady-state operation.

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-oe-activate

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - "Regulator-issued authorization or certification gating (EASA / FAA Air Operator Certificate; PSD2 / ECB / PRA payment-institution authorization; EMA / FDA / MHRA GMP certification; FAA Part 119 air carrier authorization; MiCA crypto-asset-service-provider authorization; ORR / ERA rail safety-case authorization; nuclear operations authorization; payments-issuer authorization under PSD2 Article 11)"
    - "Operations capability description and readiness-assessment evidence (supervised-test records, operational-control framework, service-level commitments to customers or counterparties)"
    - "Continuing-supervisor notification activation under the regulator's continuing oversight regime"
    - "Operations manuals and runbooks live under the regulator's continuing oversight"
    - "Operational controls (incident management, capacity, security, compliance) live on the regulated operations record"
    - "Regulated operations record entry preserved for the activated operations capability"
  excludes:
    - "Operations capability conception and design (EnablementAndOperations x Conceive / Design)"
    - "Operations capability build and configuration (EnablementAndOperations x Build)"
    - "Steady-state operations performance management (EnablementAndOperations x Operate)"
    - "Operations capability decommission and deregistration (EnablementAndOperations x Retire; CR-BP-78 adjacent cells)"
    - "Non-regulated operations-capability activation (internal-product go-live without regulator's authorization): remains RECORD-PATTERN or MERGE per CR-BP-63 baseline"
    - "Capabilities sourcing or licensing absent a regulator-issued authorization regime"

# Intended enterprise outcomes.
outcomes:
  - "The operations capability is formally activated under the enterprise's regulated-entity approval authority with the regulator's authorization on record, operations manuals and runbooks live, operational controls (incident management, capacity, security, compliance) live, and the supervisor's continuing-oversight relationship active."

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-regulated-operations-activation
    target_id: dea:process-activate-operations-capability
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per the CR-BP-80
      escape-clause discovery outcome (ADMIT-CANONICAL recommendation
      at 10/10) landed by CR-BP-82. The discovery evidence
      (EASA / FAA AOC; PSD2 Articles 11 and 28; EMA / FDA / MHRA GMP;
      FAA Part 119; MiCA Article 59; ORR / ERA rail safety case)
      activates the register v2 cell's verbatim escape condition:
      "operations-capability activation is often an attribute of
      build or steady-state operation" is superseded by the
      regulator-issued authorization or certification that creates
      a distinct activation step with continuing-supervisor
      notification, operations manuals, and operational controls
      live on the regulated operations record.
    provenance:
      type: architecture-review
      reference: CR-BP-82
      asserted_by: dea-team
      asserted_at: '2026-09-16'

