plain_language_name: 'Hand Each Exposed Risk Its Answer'
plain_language_description: 'With the certificate in hand, the processing custodian executes the operating for the delivery: the mitigation responses for the surfaced exposures are delivered to the governance bodies, and the outcomes pack is produced for confirmation.'
business_purpose: 'It exists because an exposure surfaced without an answer in front of its body is an exposure still waiting to happen - the delivery is what completes the surfacing.'
practical_context: 'It opens once the verification certificate is in hand and the bounded operating may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the risk function hands each governance body the mitigation responses for the exposures it owns.'
