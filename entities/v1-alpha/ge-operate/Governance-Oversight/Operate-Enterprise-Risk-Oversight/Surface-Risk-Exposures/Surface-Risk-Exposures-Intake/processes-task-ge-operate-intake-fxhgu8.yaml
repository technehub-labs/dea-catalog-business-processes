plain_language_name: 'Take Custody of the Exposures Input Pack'
plain_language_description: 'The intake custodian takes charge of the operating pack — the board and committee cycles, the assurance-evidence queue, the risk-review calendar, and the audit plan — and writes the manifest that ties the pack into the case file for the operating.'
business_purpose: 'It exists so the surfacing begins from a registered pack rather than from loose papers.'
practical_context: 'It opens when custody of the pack arrives and the intake contract applies, and it closes with the manifest registered and bound to the case file, custody passed onward to the verification custodian.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the risk function takes charge of the cycles, queue, calendar, and plan, and writes the binding manifest.'
