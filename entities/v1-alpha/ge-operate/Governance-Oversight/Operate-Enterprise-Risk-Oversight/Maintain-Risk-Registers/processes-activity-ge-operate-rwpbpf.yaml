plain_language_name: 'Maintain Risk Registers'
plain_language_description: 'This activity keeps the risk registers alive — current, accurate, and actually used — across the review cycles. Register movements arrive continuously from the operation, entries are maintained as events land, and the living record is confirmed onward for the reviews. A stale register is a fiction; this prevents the fiction.'
business_purpose: 'It exists so the enterprise''s risk registers stay a living record rather than a museum piece.'
practical_context: 'It runs continuously across the review cycles as register events land, and each maintained update closes when it is confirmed onward for the reviews.'
worked_example:
  agent_type: human
  narrative: 'A risk function custodian posts each register movement as it lands — new risks, changed scores, closed entries — keeping the record living across the cycles.'
