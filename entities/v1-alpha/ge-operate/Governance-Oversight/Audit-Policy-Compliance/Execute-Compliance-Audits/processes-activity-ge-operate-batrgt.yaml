plain_language_name: 'Execute Compliance Audits'
plain_language_description: 'This activity carries the planned audits out, testing the enterprise against its codified policies. The audit plan arrives as the worklist, each audit is executed as designed and its evidence gathered, and the executed audits are confirmed onward for the findings reporting. The policies are tested here against the enterprise''s actual behaviour.'
business_purpose: 'It exists so the planned compliance audits genuinely happen, and produce real evidence.'
practical_context: 'It follows the audit planning, working the plan as each audit falls due, and it completes once the executed audits are confirmed onward for the findings reporting.'
worked_example:
  agent_type: human
  narrative: 'A compliance function auditor executes each planned audit against the codified policies, gathering the evidence the plan calls for, and confirms the executed audits onward.'
