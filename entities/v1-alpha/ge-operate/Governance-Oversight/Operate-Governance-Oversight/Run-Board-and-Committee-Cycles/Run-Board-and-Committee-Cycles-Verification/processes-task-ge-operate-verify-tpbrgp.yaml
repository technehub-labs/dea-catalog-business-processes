plain_language_name: 'Check the Cycle Pack Against Meeting Rules and Methods'
plain_language_description: 'The verification custodian tests the pack before the round begins: do the scheduled meetings satisfy the legal frequency requirements, does the assurance material meet the professional standards, and do the risk reviews follow the agreed method? Any deviation is written up with its remedy.'
business_purpose: 'It exists because a cycle run on non-conforming inputs would compromise every decision taken in it.'
practical_context: 'It starts once the intake manifest is on file, and it ends when the certificate is issued, deviations are remediated, and the processing custodian takes custody.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian from the compliance function checks the draft meeting schedule against the statutory frequency rules and clears the pack for the round.'
