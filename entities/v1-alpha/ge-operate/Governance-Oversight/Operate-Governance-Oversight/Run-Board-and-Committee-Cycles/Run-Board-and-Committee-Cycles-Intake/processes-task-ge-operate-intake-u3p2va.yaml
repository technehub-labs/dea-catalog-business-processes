plain_language_name: 'Receive the Cycle Pack and Open the File'
plain_language_description: 'At the top of each cycle round, the intake custodian takes delivery of the working pack: the timetable of board and committee meetings, the queue of assurance material, the diary of risk reviews, and the compliance audit plan. Every item is logged into the cycle''s case file so nothing enters the round unaccounted.'
business_purpose: 'It exists so the cycles run from a controlled, fully logged starting point rather than ad-hoc papers.'
practical_context: 'It opens when the Operate-stage pack is ready to be handed over, and it closes with the manifest registered and the verification custodian holding custody.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the risk function logs the meeting timetable and assurance queue into the cycle file, then passes the pack to the verification custodian.'
