plain_language_name: 'Run the Meetings and Keep the Governance Machinery Turning'
plain_language_description: 'This is the round itself: the board and its committees convene as scheduled, the risk registers stay current, exposures are brought forward, reviews and audits are executed, and the assurance material is assembled. What the round yields is consolidated into a results pack ready for formal sign-off.'
business_purpose: 'It exists so the obligations carried by the charters and operating calendars are actually discharged, cycle after cycle.'
practical_context: 'It opens on the strength of the verification certificate, and it closes when the results pack exists and custody moves to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the governance secretariat convenes the scheduled meetings, refreshes the risk registers, and consolidates the round''s outputs.'
