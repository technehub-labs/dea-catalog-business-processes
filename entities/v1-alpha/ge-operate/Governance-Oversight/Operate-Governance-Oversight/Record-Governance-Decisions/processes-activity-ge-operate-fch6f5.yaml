plain_language_name: 'Record Governance Decisions'
plain_language_description: 'This activity writes down what the bodies decided, into the record of record. The made decisions arrive from the facilitated cycles, each is recorded with its terms and its rationale, and the recorded decisions are confirmed onward. Tomorrow''s enterprise can know exactly what its governance chose, and why.'
business_purpose: 'It exists so governance decisions are preserved with their reasoning in the authoritative record.'
practical_context: 'It follows each facilitated decision as it is made within the cycles, and it completes when the recorded decision is confirmed into the decision record of record.'
worked_example:
  agent_type: human
  narrative: 'A governance custodian writes each made decision into the record of record — terms, rationale, and dissent noted — and confirms the recorded decision onward.'
