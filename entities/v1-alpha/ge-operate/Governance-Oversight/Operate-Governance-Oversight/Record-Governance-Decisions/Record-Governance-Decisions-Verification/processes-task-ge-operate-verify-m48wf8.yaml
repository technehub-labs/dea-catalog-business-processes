plain_language_name: 'Check the Governance Inputs Against Their Standards'
plain_language_description: 'Before any recording work starts, the verification custodian tests the incoming pack against the rules that govern it: how often the board must meet, what good assurance evidence looks like, and how risk reviews are to be run. Where the pack falls short, the shortfalls are named and a fix is set out.'
business_purpose: 'It exists because recording decisions on flawed inputs would put the decision record of record on shaky ground.'
practical_context: 'It starts once the manifest is registered and the pack is ready for scrutiny, and it ends with a certificate that states what was checked, what deviated, and what was remediated.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian from the risk function confirms the meeting timetable satisfies the statutory frequency rules and flags a missing assurance item for correction.'
