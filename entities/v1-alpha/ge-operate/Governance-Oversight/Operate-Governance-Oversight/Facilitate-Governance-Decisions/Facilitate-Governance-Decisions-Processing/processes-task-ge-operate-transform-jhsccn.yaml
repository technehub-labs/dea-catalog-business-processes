plain_language_name: 'Steer the Agenda Items to Actual Decisions'
plain_language_description: 'With the certificate in hand, the processing custodian executes the operating for the facilitating: the agenda items in the running cycles are steered to actual decisions under the decision rights, and the outcomes pack is produced for confirmation.'
business_purpose: 'It exists because an agenda item discussed but never decided is governance as theatre - the facilitating is what turns talk into a decision.'
practical_context: 'It opens once the verification certificate is in hand and the bounded operating may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the risk function steers each agenda item in the running cycles to an actual decision.'
