plain_language_name: 'Gather What the Mandate Needs into One Pack'
plain_language_description: 'With the certificate in hand, the processing custodian executes the operating for the assembly: what the assurance cycle or audit mandate requires is gathered into one review-ready evidence pack, and the outcomes pack is produced for confirmation.'
business_purpose: 'It exists because evidence scattered across systems is evidence the review cannot use - the gathering is what makes it answerable.'
practical_context: 'It opens once the verification certificate is in hand and the bounded operating may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the compliance function gathers what the assurance cycle requires into one review-ready pack, keeping the working papers.'
