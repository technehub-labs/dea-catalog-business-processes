plain_language_name: 'Say What the Measured Evidence Found'
plain_language_description: 'With the certificate in hand, the processing custodian executes the operating for the reporting: the findings arising from the measured evidence are written up and reported, and the outcomes pack is produced for confirmation.'
business_purpose: 'It exists because evidence measured but unreported changes nothing - the reporting is where the measurement earns its keep.'
practical_context: 'It opens once the verification certificate is in hand and the bounded operating may be executed, and it closes with the artefact produced and custody passed onward to the confirmation custodian.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the compliance function writes up the findings the measured evidence produced and reports them.'
