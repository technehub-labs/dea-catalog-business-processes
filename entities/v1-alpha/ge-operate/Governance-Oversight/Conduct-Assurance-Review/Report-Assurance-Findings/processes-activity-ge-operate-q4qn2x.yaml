plain_language_name: 'Report Assurance Findings'
plain_language_description: 'This activity states what the measured evidence showed, as findings delivered to those charged with acting on them. The measured position arrives as the source, findings are written up and delivered to their audiences, and the reported findings are confirmed for the record. Measurement becomes message here.'
business_purpose: 'It exists so assurance measurement becomes delivered findings someone can act on.'
practical_context: 'It follows the evidence measurement, once the measured position is in hand, and it completes when the reported findings are confirmed and their record retained.'
worked_example:
  agent_type: human
  narrative: 'A compliance function analyst writes up the findings from the measured evidence, delivers them to the audiences charged with acting, and confirms the reporting for the record.'
