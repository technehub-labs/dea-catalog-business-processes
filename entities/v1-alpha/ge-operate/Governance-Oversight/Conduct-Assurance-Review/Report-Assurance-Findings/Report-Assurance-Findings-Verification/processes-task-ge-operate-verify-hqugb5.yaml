id: processes:task-ge-operate-verify-hqugb5
type: Task
name: Report Assurance Findings Verification
definition: The bounded unit of work within `processes:activity-ge-operate-q4qn2x` (Report Assurance Findings) that verify the input pack against the board-cycle contract (statutory meeting-frequency requirements), the assurance-evidence standards (IIA), and the risk-review methodology (ISO 31000), and emit a verification report naming any contract deviations and their remediation.
belongs_to_activity: processes:activity-ge-operate-q4qn2x
trigger: Intake manifest registered for Report Assurance Findings; verification gate may execute the contract and quality-criteria checks against the input pack.
outcome: Verification certificate issued for Report Assurance Findings naming verification methods applied and any deviations remediated; verification custodian passes custody to the processing custodian.
responsibility: verification custodian
boundary:
  inclusions:
  - Execution of the Report Assurance Findings contract checks and quality-criteria verification.
  - Reconciliation of the input pack against the Report Assurance Findings verification certificate requirements.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Re-execution of prior phases on rejected or withdrawn cases.
