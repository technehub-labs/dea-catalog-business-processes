plain_language_name: 'Reconcile the Pack and Confirm the Assurance Findings'
plain_language_description: 'When the outcomes pack exists, the confirmation custodian sets it beside the cycle''s contract and the evidence standards for assurance, reconciles the two, and issues the operating confirmation to the custodian of governance and the board secretary, logging it into the case file.'
business_purpose: 'It exists because findings nobody has confirmed are findings nobody would act on.'
practical_context: 'It opens once the artefact is produced and the reconciliation may run against the governing contract, and it closes with the completion confirmation issued and acknowledged, custody passed to the records custodian.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian sets the pack beside the cycle''s contract and the assurance standards and issues the operating confirmation to the custodian of governance and the board secretary.'
