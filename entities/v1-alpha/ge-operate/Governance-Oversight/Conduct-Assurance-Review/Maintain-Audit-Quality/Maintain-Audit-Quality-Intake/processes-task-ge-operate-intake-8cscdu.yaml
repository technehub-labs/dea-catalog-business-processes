id: processes:task-ge-operate-intake-8cscdu
type: Task
name: Maintain Audit Quality Intake
definition: The bounded unit of work within `processes:activity-ge-operate-yczj9n` (Maintain Audit Quality) that accept custody of the governance-operating input pack (board and committee cycle schedule, assurance-evidence queue, risk-review calendar, compliance-audit plan) and persist a registered intake manifest binding the inputs to the operating case file.
belongs_to_activity: processes:activity-ge-operate-yczj9n
trigger: Custody of the Operate-stage input pack for Maintain Audit Quality ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Maintain Audit Quality case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Maintain Audit Quality input pack against the Operate-stage intake contract.
  - Binding of the input pack to the Maintain Audit Quality case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the case file (phase 5).
evidence:
