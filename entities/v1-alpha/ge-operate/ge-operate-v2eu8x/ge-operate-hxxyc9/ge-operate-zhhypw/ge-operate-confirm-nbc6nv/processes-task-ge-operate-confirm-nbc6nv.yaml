boundary:
  inclusions:
  - Reconciliation of the Track Follow-Up Actions artefact against the governing contract and any notify-list requirements.
  - Issuance of the Track Follow-Up Actions completion confirmation and acknowledgement logging.
  exclusions:
  - Long-term retention of the case file (phase 5).
  - Re-execution of prior phases on confirmation rejection.
