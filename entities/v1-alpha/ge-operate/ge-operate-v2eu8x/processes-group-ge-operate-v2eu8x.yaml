id: processes:group-ge-operate-v2eu8x
type: ProcessGroup
version: 1.0.0
name: Governance Oversight
definition: 'The bounded Process Group that organizes the Business Process responsibilities of operating governance oversight, board and committee cycles, risk oversight, and policy compliance execution in the GovernanceAndExistence x Operate context. This group captures the day-to-day work of running the governance machinery: convening boards, executing risk reviews, auditing policy compliance, and making governance decisions.

  '
process_context: processes:pc-ge-operate-hb2dac
scope:
  includes:
  - Board and committee cycle operation
  - Risk oversight
  - Policy compliance execution
  - Audit and assurance
  excludes:
  - Strategy framing (Conceive stage)
  - Governance system design (Design stage)
  - Body establishment (Build stage)
outcomes:
- Board and committee cycles run on schedule.
- Risk is identified and mitigated.
- Policy compliance is maintained.
