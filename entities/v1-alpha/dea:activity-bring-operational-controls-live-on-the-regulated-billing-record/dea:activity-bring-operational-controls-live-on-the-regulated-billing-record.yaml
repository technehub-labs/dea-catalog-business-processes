id: dea:activity-bring-operational-controls-live-on-the-regulated-billing-record
type: Activity
name: Bring Operational Controls Live on the Regulated Billing Record
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Activate Billing Capability that
  brings the operational controls (segregation of duties, audit trail, reconciliation)
  live on the regulated billing record (insurance statutory accounting operational
  controls; IFRS 17 operational controls; PUC rate-effective operational controls;
  PSD2 settlement-account operational controls).
belongs_to_business_process: dea:process-activate-billing-capability
cohesion_rationale: Constituent work shares a single operational-controls-live-launch
  concern, one input class (the regulator-mandated control framework and the billing-capability
  authorization), and one output (the operational controls live on the regulated billing
  record). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
