plain_language_name: 'Commit Treasury and Funding Model'
plain_language_description: 'This activity draws the liquidity rules, the funding make-up, and the treasury way of working together into one committed model. The three strands arrive as its inputs, the whole is consolidated and ratified, and the committed model is confirmed as the basis for securing the facilities and running treasury. The enterprise''s money mechanics become one owned design.'
business_purpose: 'It exists so treasury operations and facility securing start from one committed model rather than three designs.'
practical_context: 'It closes the treasury and funding model design, once liquidity, funding, and operating model are designed, and it completes when the committed model is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian assembles the liquidity policy, funding structure, and operating model into the model document, obtains ratification, and records the commitment for facility securing.'
