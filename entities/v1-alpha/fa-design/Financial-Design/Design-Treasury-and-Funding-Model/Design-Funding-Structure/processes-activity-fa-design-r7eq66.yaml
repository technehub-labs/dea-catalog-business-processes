plain_language_name: 'Design Funding Structure'
plain_language_description: 'This activity works out the make-up of the enterprise''s funding — which facilities and instruments, maturing when — that the finance strategy needs behind it. The funding and capital approach arrives as the frame, the funding structure is designed and checked against it, and the structure design is confirmed onward for the operating model. The debt and capital mix becomes a drawing, not a hope.'
business_purpose: 'It exists so the enterprise''s funding composition is designed to match the strategy''s capital approach.'
practical_context: 'It follows the liquidity policy, when the funding and capital approach is to hand, and it completes once the funding structure design is confirmed for the operating model.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority designer works out the facilities, instruments, and maturities making up the funding structure, checks the design against the capital approach, and confirms it.'
