plain_language_name: 'Receive the Framed Finance Strategy'
plain_language_description: 'Chart work opens when the framed finance strategy is handed over as the ground the accounts will be organized from. The intake custodian accepts it, registers it with audit identifiers, and starts the designing from a recorded baseline.'
business_purpose: 'It exists so accounts are organized from the committed strategy rather than from inherited habit.'
practical_context: 'It opens when the framed strategy is presented for the chart work, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the finance design authority registers the framed strategy as the chart baseline, with audit references.'
