plain_language_name: 'Design Chart of Accounts'
plain_language_description: 'This activity draws up the account structure that will organize every entry in the enterprise''s books. The framed finance strategy arrives as the source, the chart of accounts is designed from it and reviewed for completeness, and the account design is confirmed onward for the allocation work. Every future transaction gains a place to live.'
business_purpose: 'It exists so the enterprise''s financial record is organized from the start by a deliberately designed account structure.'
practical_context: 'It opens the financial plan structure design, when the framed finance strategy is presented, and it completes once the chart of accounts design is confirmed for the allocation model.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority designer draws the account structure from the framed finance strategy, reviews it for completeness, and confirms the chart design for the allocation model.'
