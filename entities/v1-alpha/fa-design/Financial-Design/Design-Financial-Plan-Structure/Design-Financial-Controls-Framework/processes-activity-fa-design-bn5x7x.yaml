plain_language_name: 'Design Financial Controls Framework'
plain_language_description: 'This activity builds the safeguards directly into the account structure and allocation rules. The chart and the allocation model arrive as the structure to protect, the controls are designed into its fabric and checked against it, and the embedded controls design is confirmed onward for the structure''s commitment. The plan structure arrives at build already defended.'
business_purpose: 'It exists so the financial plan structure carries its own safeguards, designed in rather than bolted on.'
practical_context: 'It follows the allocation model, once the chart and allocation rules are in hand, and it completes when the embedded controls design is confirmed for the structure''s commitment.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority designer designs the safeguards into the account structure and allocation rules themselves, checks the coverage, and confirms the embedded controls design.'
