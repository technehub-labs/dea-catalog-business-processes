plain_language_name: 'Check the Pieces Before Weaving the Safeguards'
plain_language_description: 'Before anything is woven, the verification custodian checks the chart and allocation model against what designing requires - that the structure is complete enough to carry safeguards through it. Defects are logged for rejection or repair before the weaving begins.'
business_purpose: 'It exists so safeguards are never woven through a structure that was only partly drawn.'
practical_context: 'It runs once the intake is registered and the pieces can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the allocation model incomplete over one cost class and logs the defect before the weaving begins.'
