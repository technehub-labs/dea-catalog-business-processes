plain_language_name: 'Design Tax Strategy'
plain_language_description: 'This activity pulls the separately documented stances into one coherent tax approach. The documented positions arrive as the pieces, the strategy is designed to coordinate them and checked for consistency, and the strategy design is confirmed onward for commitment. Individual tax answers become a single, deliberate posture.'
business_purpose: 'It exists so the enterprise''s tax positions work together as one strategy rather than as unrelated stances.'
practical_context: 'It follows the position documentation, when the documented positions are to hand, and it completes once the tax strategy design is confirmed for the design''s commitment.'
worked_example:
  agent_type: human
  narrative: 'A finance design authority designer draws the documented positions into one coordinated tax approach, checks the stances for consistency, and confirms the strategy design.'
