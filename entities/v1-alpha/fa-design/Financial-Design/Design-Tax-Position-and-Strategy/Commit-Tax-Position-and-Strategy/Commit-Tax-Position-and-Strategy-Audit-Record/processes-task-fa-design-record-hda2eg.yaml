plain_language_name: 'File the Tax Design Audit Record'
plain_language_description: 'At the close the records custodian preserves the commitment trail at its required retention tier and sets the retrieval handles for it. What the committed design contains, and from which pieces it was consolidated, stays on file for the life of the tax design.'
business_purpose: 'It exists so the design''s standing as committed authority can be evidenced whenever tax planning leans on it.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record preserved at its tier and retrieval handles standing.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the commitment trail at its retention tier and sets the retrieval handles a tax planning review would draw on.'
