plain_language_name: 'Check the Change Before Bounding the Exposure'
plain_language_description: 'Before anything is bounded, the verification custodian checks the change and footprint against what assessing requires - that the change is the recorded one and the footprint is current. Defects are flagged for rejection or repair before the bounding is made.'
business_purpose: 'It exists so no exposure is bounded against a footprint that has since moved.'
practical_context: 'It runs once the intake is registered and the inputs can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the footprint missing the change''s second site and flags the defect before the bounding is made.'
