plain_language_name: 'Receive the Control Objectives and Governance Posture'
plain_language_description: 'Policy work opens when the control objectives and the governance posture are handed over together as the two sides the policies will be written between. The intake custodian accepts both, registers them with audit identifiers, and starts the designing from a recorded baseline.'
business_purpose: 'It exists so policies are written from registered objectives under a registered posture.'
practical_context: 'It opens when the objectives and posture are presented for the policy work, with the activity owner alerted, and it closes with the intake registered and the later steps cleared to proceed.'
