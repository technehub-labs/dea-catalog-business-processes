id: dea:activity-maintain-reserving-discipline
type: Activity
name: Maintain Reserving Discipline
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Conclude Regulated Run-Off that maintains
  the actuarial reserve, capital adequacy, and asset-liability matching discipline
  throughout the run-off period, with periodic reviews and regulator reporting per
  the controlling regime's reserving expectations.
belongs_to_business_process: dea:process-conclude-regulated-run-off
cohesion_rationale: 'Constituent work shares a single reserving discipline concern,
  one input class (claim runoff experience, asset valuations, liability cashflow projections,
  and the controlling regime''s reserving standard), and one output (the maintained
  reserve with periodic actuarial certification and any capital or asset-liability
  corrective action). Cohesion score 8/9 assessed at deposition (CR-BP-32 section
  6): cadence is regime-driven and the discipline integrates multiple actuarial reviews.'
