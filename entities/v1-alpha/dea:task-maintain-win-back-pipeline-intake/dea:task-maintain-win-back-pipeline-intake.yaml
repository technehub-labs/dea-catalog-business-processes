id: dea:task-maintain-win-back-pipeline-intake
type: Task
name: Maintain Win-Back Pipeline Intake
definition: The bounded unit of work within `dea:activity-maintain-win-back-pipeline` (Maintain Win-Back Pipeline) that accept custody of the improvement-case input pack (churn-risk register, VoC feedback stream, retention-action candidates) and persist a registered intake manifest binding the inputs to the improvement case file.
belongs_to_activity: dea:activity-maintain-win-back-pipeline
trigger: Custody of the Improve-stage input pack for Maintain Win-Back Pipeline ready for intake; predecessor phase has produced the case file context and intake contract applies.
outcome: Intake manifest registered and bound to the Maintain Win-Back Pipeline case file; registered intake custodian passes custody to the verification custodian.
responsibility: designated intake custodian
boundary:
  inclusions:
  - Receipt and registration of the Maintain Win-Back Pipeline input pack against the Improve-stage intake contract.
  - Binding of the input pack to the Maintain Win-Back Pipeline case file with cryptographic chain-of-custody.
  exclusions:
  - Re-execution of prior intake phases on rejected or withdrawn cases (no rollback semantics).
  - Long-term retention of the closure case file (phase 5).
evidence:
- source: Gartner Subscriber Retention Benchmark 2024
  claim: industry benchmark grounding the improve-phase churn-risk-model contract and the transform-phase churn-risk assessment. Bounded-work evidence for the intake-phase custodian of `dea:activity-maintain-win-back-pipeline` (CR-BP-L4-02 enrichment).
  strength: E2
- source: Bain Loyalty Economics (Reichheld)
  claim: loyalty-economics methodology grounding the improve-phase retention-actions execution and the retention-outcomes schema. Bounded-work evidence for the intake-phase custodian of `dea:activity-maintain-win-back-pipeline` (CR-BP-L4-02 enrichment).
  strength: E2
- source: dea:activity-maintain-win-back-pipeline
  claim: Parent Activity cohesion rationale (CR-BP-32 §6) and the CR-BP-L4-02 cell-specific bounded-work prose for this PartyAndRelationship L4 Task.
  strength: E3
