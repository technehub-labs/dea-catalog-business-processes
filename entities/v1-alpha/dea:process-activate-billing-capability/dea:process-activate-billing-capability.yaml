# Evidence (CR-BP-11 register strength scale E0..E5).
evidence:
  - source: CR-BP-80 escape-clause discovery (FinanceAndAccounting x Activate)
    claim: |
      Authoritative multi-source regulatory evidence (IFRS 17 transition;
      NAIC annual statement and statutory accounting; Solvency II; PUC
      rate-effective billing; PSD2 / Federal Reserve / ECB settlement-
      account activation). Universal sector practice across insurance,
      banking, utilities, and payments. Strong boundary against Build
      / Operate / Retire coordinates. Score 10/10 with ADMIT-CANONICAL
      recommendation.
    strength: E5
    reference: discovery/v1-alpha/finance-and-accounting-activate-escape.yaml
  - source: IFRS 17 Insurance Contracts (IASB effective 2023)
    claim: "IFRS 17 transition to active establishes the regulator-acknowledged accounting framework for live insurer revenue recognition."
    strength: E4
  - source: NAIC Annual Statement and Statutory Accounting (state insurance department supervision)
    claim: "NAIC annual statement under statutory accounting principles (SAP) is the regulator-acknowledged framework for US insurer live billing activation."
    strength: E4
  - source: EU Solvency II Directive 2009/138/EC
    claim: "Solvency II establishes the regulator-acknowledged framework for EU insurer technical-provisions and live billing activation."
    strength: E4
  - source: US PUC rate-effective billing frameworks
    claim: "PUC rate-effective billing approval is the regulator-acknowledged activation step for utility live invoicing."
    strength: E4
  - source: EU PSD2 (Directive 2015/2366) and Federal Reserve Regulation E
    claim: "PSD2 / Federal Reserve / ECB settlement-account activation governs payment-issuer live settlement."
    strength: E4

