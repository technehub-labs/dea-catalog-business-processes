id: dea:process-activate-billing-capability
name: Activate Billing Capability
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management

# Trigger and outcome (BP-ARC-ID-002: trigger / outcome blocks nested
# inside identity; pre-existing baseline -- does not block CI under
# check_admission_gate.py --strict-provenance).
trigger: 'A billing or revenue-recognition capability requires formal regulator-acknowledged activation before live invoicing or revenue recognition may commence (insurance statutory accounting; IFRS 17 transition; bank treasury under capital-rules supervision; PUC rate-effective billing; PSD2 / Federal Reserve / ECB settlement-account).'

outcome: 'The billing or revenue-recognition capability is formally activated with the regulator''s acknowledgement on record, the tariff or pricing approval preserved, operational controls (segregation of duties, audit trail, reconciliation) live, and the supervisor''s continuing-oversight relationship active.'

description: 'Activate a billing or revenue-recognition capability under the enterprise''s regulated-entity approval authority within the dea:pc-fa-activate Cell Charter. The trigger is a regulator-acknowledged accounting or rate framework gating live invoicing or revenue recognition; the outcome is the capability live on the regulated billing record with the supervisor''s continuing-oversight relationship active and operational controls running, so that the billing or revenue-recognition capability moves from regulator-acknowledged-but-not-live to regulator-acknowledged-and-live. Distinct from general capability build (Build coordinate) and from steady-state billing (Operate coordinate).'

# Process specialization (BP-ARC-ID-005: empty until specialization
# program is approved).
process_specialization: []

# Process identity / definitions / processes_and_projects distinction
# (BP-001..008 enforce; CR-BP-12 register faces).
process_identity:
  boundary_face: regulated-entity approval authority
  identity_kind: canonical
  is_process: true
  is_project: false

# Process scope (BP-006: bounded on inputs and outcomes).
process_scope:
  includes:
    - "Regulator-acknowledged accounting or rate framework activation (state insurance department supervision; IFRS 17 transition; ECB / PRA capital-rules supervision; PUC rate-effective framework; PSD2 / Federal Reserve / ECB settlement-account framework)"
    - "Tariff or pricing approval acquisition and recording (insurance statutory accounting rate filings; PUC rate-case approval; PSD2 interchange-fee framework; bank treasury capital-rule pricing; settlement-account fee schedule)"
    - "Billing-capability description and readiness-assessment evidence (supervised-test records, operational-control framework, first-invoice or first-recognition runbook)"
    - "Continuing-supervisor notification activation under the regulator's continuing oversight"
    - "Operational controls (segregation of duties, audit trail, reconciliation) live on the regulated billing record"
    - "Regulated billing record entry preserved for the activated billing capability"
  excludes:
    - "Billing-capability conception and design (FinanceAndAccounting x Conceive / Design)"
    - "Billing-capability build and configuration (FinanceAndAccounting x Build)"
    - "Steady-state billing operations performance management (FinanceAndAccounting x Operate)"
    - "Billing-capability decommission and deregistration (FinanceAndAccounting x Retire)"
    - "Non-regulated billing-capability activation (internal-finance cutover without regulator's acknowledgement)"

# Canonical context block (BP-SEM-007 enforces; replaces legacy scalar
# process_context for downstream gate compliance).
context:
- ref: dea:pc-fa-activate

# Process identity sub-block (BP-C1..C4 enforces).
identity:
