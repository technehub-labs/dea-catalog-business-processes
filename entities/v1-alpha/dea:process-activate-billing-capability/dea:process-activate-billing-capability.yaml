  outcome_statement: 'The billing or revenue-recognition capability is formally activated with the regulator''s acknowledgement on record, the tariff or pricing approval preserved, operational controls (segregation of duties, audit trail, reconciliation) live, and the supervisor''s continuing-oversight relationship active.'
  evidence_links:
    - type: documentation
      ref: discovery/v1-alpha/finance-and-accounting-activate-escape.yaml
    - type: governance
      ref: change-requests/CR-BP-80-l0-discovery-five-backlog-cells.md
