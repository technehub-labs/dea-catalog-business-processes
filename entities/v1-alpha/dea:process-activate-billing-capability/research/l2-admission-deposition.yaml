# This admission-deposition records the L2 evidence trail for the
# canonical admission of `dea:process-activate-billing-capability`
# (Activate Billing Capability) at the FinanceAndAccounting x Activate
# coordinate. The admission follows the CR-BP-62 escape-clause method
# and references the CR-BP-80 escape-clause discovery record at
# `discovery/v1-alpha/finance-and-accounting-activate-escape.yaml`.

admission_decision:
  disposition: ADMIT-CANONICAL
  escape_clause: true
  evidence_base:
    - "IFRS 17 Insurance Contracts (IASB effective 2023): regulator-acknowledged accounting framework for live insurer revenue recognition"
    - "NAIC Annual Statement and Statutory Accounting (state insurance department supervision): US insurer live billing activation"
    - "EU Solvency II Directive 2009/138/EC: EU insurer technical-provisions and live billing activation"
    - "US PUC rate-effective billing frameworks: utility live invoicing activation"
    - "EU PSD2 (Directive 2015/2366) and Federal Reserve Regulation E: payment-issuer settlement-account activation"
    - "Universal sector practice across insurance, banking, utilities, payments"
  canonicality_score: 10
  canonicality_score_evidence_basis: |
    Score is computed against the CR-BP-62 BP-LIFE-001..015 battery:
    - BP-LIFE-001 (Process Necessity Test): PASS. Billing-capability
      activation is universally performed across regulated sectors.
    - BP-LIFE-002 (Boundary Clarity): PASS. Strong boundary against
      Build (capability construction), Operate (steady-state billing),
      and Retire (regulated run-off per CR-BP-75).
    - BP-LIFE-003 (Regulatory Anchor): PASS. Multi-source authoritative
      regulatory evidence (IFRS 17, NAIC statutory accounting, Solvency
      II, PUC rate-effective, PSD2 / Federal Reserve / ECB settlement-
      account).
    - BP-LIFE-004..015: all PASS with regulatory-sector breadth and
      universal practice.
  bp_identity:
    id: dea:process-activate-billing-capability
    name: Activate Billing Capability
    verb: Activate
    object: Billing Capability
    scope: enterprise
  boundary_clarity: |
    Begins at the regulator's framework acknowledgement or pricing
    approval; ends at the capability being live on the regulated
    billing record. Capability conception, design, and build are
    upstream (Conceive/Design/Build). Steady-state billing, revenue
    recognition, margin analysis, and write-off are downstream
    (Operate/Improve/Retire).
  discovery_source: discovery/v1-alpha/finance-and-accounting-activate-escape.yaml
  discovery_recommended_at: '2026-09-16'
  admission_tranche: CR-BP-83
  admission_tranche_landed_at: '2026-09-16'

