plain_language_name: 'Identify Pool Demand'
plain_language_description: 'This activity works out where the enterprise needs surge or specialist help that ordinary direct acquisition cannot supply in time. The committed structure design and capacity plan are taken in and examined, the gaps are identified and written up as pool demand, and the finding is confirmed with those planning the response. It ends with the identified pool demand recorded so the pool build can target it.'
business_purpose: 'It exists so the contractor and partner pool is built against genuinely identified demand rather than built speculatively.'
practical_context: 'It occurs when the committed organization structure design and capacity plan show demand that direct acquisition cannot serve within the required timeframes, and it closes once the identified demand is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A strategy function lead reviewing the capacity plan spots a seasonal surge that direct acquisition cannot staff in time, has the gap written up as identified pool demand, and confirms it with workforce management.'
