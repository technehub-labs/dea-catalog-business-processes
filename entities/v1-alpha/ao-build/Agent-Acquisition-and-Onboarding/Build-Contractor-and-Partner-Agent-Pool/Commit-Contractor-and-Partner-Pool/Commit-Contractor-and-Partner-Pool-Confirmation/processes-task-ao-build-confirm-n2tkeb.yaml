plain_language_name: 'Confirm the Committed Pool'
plain_language_description: 'Once the pool stands committed, the confirmation custodian reconciles it against the outcome the activity set out to reach and issues the confirmation. The wider organisation learns the pool is available as capacity alongside what direct acquisition supplies.'
business_purpose: 'It exists so reliance on the pool begins only from a confirmed, announced commitment.'
practical_context: 'It begins once preparation is complete and the committed pool awaits its consumers, and it closes with the confirmation issued, consumers informed, and the result reconciled to the activity''s promise.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian reconciles the committed pool against the activity''s intended outcome and issues the confirmation that opens it for use.'
