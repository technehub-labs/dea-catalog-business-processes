plain_language_name: 'Receive the Established Paths for Commitment'
plain_language_description: 'Commitment opens when the established activation paths are handed over as the foundation the pool will be committed on. The intake custodian accepts them, registers the handover with audit identifiers, and puts the commitment work on a recorded footing.'
business_purpose: 'It exists so the pool is committed from a registered baseline of paths rather than from loose assurances.'
practical_context: 'It opens when the established paths are presented for commitment, with the activity owner alerted, and it closes with the intake registered and the remaining steps free to run.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the established paths as the commitment baseline, with audit references, and opens the commitment work.'
