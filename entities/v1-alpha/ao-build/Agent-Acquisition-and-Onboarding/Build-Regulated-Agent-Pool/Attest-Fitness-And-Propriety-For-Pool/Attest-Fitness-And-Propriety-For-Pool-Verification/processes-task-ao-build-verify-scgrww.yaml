plain_language_name: 'Check the Candidate List Against the Attestation Regime'
plain_language_description: 'Before anyone is attested, the verification custodian tests the candidate list and the regime against what the activity requires - that every candidate is in scope and the criteria are complete enough to judge against. Defects are flagged for rejection or repair before attestations are made.'
business_purpose: 'It exists so no candidate is attested under a regime that has not itself been checked.'
practical_context: 'It runs once the intake is registered and the list and regime can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian finds the candidate list carrying one candidate outside the regime''s scope and flags the defect for repair before attestation.'
