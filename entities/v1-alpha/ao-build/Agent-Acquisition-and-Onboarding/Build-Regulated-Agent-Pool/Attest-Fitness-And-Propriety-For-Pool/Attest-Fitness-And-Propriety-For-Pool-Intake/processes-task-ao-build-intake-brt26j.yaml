plain_language_name: 'Receive the Candidates and Attestation Regime'
plain_language_description: 'Pool building turns to fitness here: the verified candidate list and the attestation regime it will be judged under arrive together. The intake custodian accepts both, registers them with audit identifiers, and puts the attestation work on a traceable footing.'
business_purpose: 'It exists so pool fitness attestations start from a registered candidate list and a registered regime, not from loose assumptions.'
practical_context: 'It opens when the verified candidates and the attestation regime are presented for the activity, with the activity owner alerted to their arrival, and it closes with the intake registered and the later steps cleared to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian registers the verified candidate list alongside the attestation regime, with audit references, and opens the fitness work for the pool.'
