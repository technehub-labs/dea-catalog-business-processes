id: processes:activity-ao-build-w2n8p4
type: Activity
name: Attest Fitness-And-Propriety For Pool
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Build Regulated Agent Pool that
  Attest fitness-and-propriety for each candidate in the regulator-ready pool: the
  initial attestation, the attestor (employer / regulator), the criteria, and the
  regulator framing (SMCR FIT; state healthcare initial fitness; bar admissions fitness;
  NAIC producer fitness; FAA airmen fitness; EU AI Act Article 14). Shared concern:
  fitness-and-propriety attestation. Input: the verified-candidate list; the attestation
  regime. Output: the fitness-and-propriety attested candidate list.'
belongs_to_business_process: processes:process-ao-build-9my4jr
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single attest fitness-and-propriety for pool concern,
  one input class, and one output (the attest fitness-and-propriety for pool record
  on the regulated personnel record).
