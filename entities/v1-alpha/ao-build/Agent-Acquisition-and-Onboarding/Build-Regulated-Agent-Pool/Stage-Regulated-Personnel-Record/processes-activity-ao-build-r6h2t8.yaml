name: Stage Regulated Personnel Record
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Build Regulated Agent Pool that
  Stage the regulated personnel record for each cleared candidate: the supervisor-controlled
  scope, the fitness-and-propriety attestation, the supervised-training completion
  plan, the continuing-supervisor notification path, and the regulator-tied readiness
  for Activate. Shared concern: regulated personnel record staging. Input: the screened
  candidate list; the regulated personnel record schema. Output: the staged regulated
  personnel record ready for Activate.'
belongs_to_business_process: processes:process-ao-build-9my4jr
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single stage regulated personnel record concern, one input
  class, and one output (the stage regulated personnel record record on the regulated
  personnel record).
