plain_language_name: 'Stage the Regulated Personnel Record'
plain_language_description: 'This activity assembles the personnel file each cleared candidate needs before being activated into a licensed role. The screened candidate list is taken in, and for each person the file is built up with the scope a supervisor controls, the fitness attestation, the plan for supervised training, and the route for notifying the continuing supervisor. Once the staged records are confirmed as ready, activation can proceed later without any of these checks being repeated.'
business_purpose: 'It exists so every cleared candidate arrives at activation with a complete, staged personnel record already waiting for them.'
practical_context: 'It runs at the end of the pool build, once candidates have cleared screening, and it completes when the staged records are confirmed and preserved, leaving the pool ready for activation without re-screening.'
worked_example:
  agent_type: human
  narrative: 'A records custodian sets up the personnel file for a newly cleared candidate, attaching the supervisor-controlled scope, the fitness attestation, and the training plan, and confirms the staged record is ready so later activation needs no repeated screening.'
