plain_language_name: 'File the Registry Verification Audit Record'
plain_language_description: 'Finally the records custodian preserves the registry-verification trail at its required retention tier and sets the retrieval handles for it. What the registry said about each candidate, and when, stays provable for as long as the pool''s licence positions matter.'
business_purpose: 'It exists so the registry answers behind each candidate can be evidenced whenever licence standing is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record held at its tier and retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the registry trail at its retention tier and sets the retrieval handles a licence review would consult years later.'
