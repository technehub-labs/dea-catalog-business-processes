plain_language_name: 'Screen Candidates Against Sanctions, AML, FCRA, and ADA Requirements'
plain_language_description: 'This activity runs each fitness-attested candidate through the regulator-specific clearances the enterprise must apply before they join the regulated pool. The candidate list comes in with the screening matrix, every person is checked against the sanctions, financial-crime, background, and fitness requirements that apply, and a screened candidate list with those clearances is produced. The results are confirmed to the next stage and kept as evidence that the screening happened before activation.'
business_purpose: 'It exists so the pool carries only candidates who have cleared the sanctions, financial-crime, background, and fitness screening that regulator-tied work demands.'
practical_context: 'It follows the fitness attestation of the pool, when the attested candidate list and the screening matrix are presented, and it closes once the screened candidate list is confirmed and its record retained.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian runs each attested candidate through the sanctions and financial-crime screening matrix, notes the clearances obtained, and hands the screened list to the records step so the evidence is preserved on the personnel file.'
