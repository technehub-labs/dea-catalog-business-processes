plain_language_name: 'File the Screening Audit Record'
plain_language_description: 'To close, the records custodian preserves the screening trail at its required retention tier and establishes the retrieval handles for it. Every clearance - and every hit that was resolved - stays on file for the scrutiny these checks invite.'
business_purpose: 'It exists so the screening of pool candidates can be evidenced whenever a clearance is questioned.'
practical_context: 'It starts once the confirmation has been issued and retention may begin under the activity''s evidence requirements, and it ends with the audit record held at its tier and retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the screening trail at its retention tier and sets the retrieval handles a clearance review would draw on.'
