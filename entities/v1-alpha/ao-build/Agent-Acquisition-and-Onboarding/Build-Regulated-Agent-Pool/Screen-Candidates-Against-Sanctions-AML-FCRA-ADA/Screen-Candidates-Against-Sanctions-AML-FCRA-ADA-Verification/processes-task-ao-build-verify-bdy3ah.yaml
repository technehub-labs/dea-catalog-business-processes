plain_language_name: 'Check the Screening Inputs Before Screening'
plain_language_description: 'Before any check runs, the verification custodian examines the candidate list and the screening matrix against what the activity requires of them. A matrix with gaps would let a candidate slip through uncleared, so defects are flagged for rejection or repair at this point.'
business_purpose: 'It exists so no candidate is screened under a matrix that would miss what it must catch.'
practical_context: 'It runs once the intake is registered and the list and matrix can be compared with the activity''s requirements, and it finishes with them verified or their defects logged for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian spots a screening line missing from the matrix and flags the defect so the checks catch everything the pool requires.'
