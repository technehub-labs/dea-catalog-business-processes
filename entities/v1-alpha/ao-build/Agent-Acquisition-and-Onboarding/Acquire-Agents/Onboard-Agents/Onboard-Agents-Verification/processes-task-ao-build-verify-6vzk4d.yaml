plain_language_name: 'Check the Acquired Agents Before Onboarding'
plain_language_description: 'The verification custodian examines each acquired agent against what its intended role and competencies demand before any onboarding work is invested. An agent that misses the requirement is logged as a shortfall for rejection or repair, so effort is not spent on the wrong material.'
business_purpose: 'It exists so onboarding effort is spent only on agents that genuinely fit the roles awaiting them.'
practical_context: 'It runs once the intake is registered and each agent can be compared with the activity''s requirements, and it finishes with the agents verified or their gaps recorded for rejection or repair.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian checks each acquired agent against its intended role''s competencies and logs one shortfall where an agent lacks a required skill.'
