plain_language_name: 'Select and Acquire Agents'
plain_language_description: 'This activity chooses and brings in the agents needed to fill the provisioned capacity, judging candidates on merit rather than on the kind of agent they are. The capacity to be filled is logged in and checked, the selections are made and executed as acquisitions, and the outcome is confirmed with the planners. It ends with acquired agents handed over for onboarding and the acquisition record preserved.'
business_purpose: 'It exists so the organization fills its provisioned capacity with the right agents, whether people or artificial agents, chosen on suitability alone.'
practical_context: 'It runs when the provisioned agent capacity is presented during acquisition, and it finishes once the acquired agents are confirmed and the acquisition record is kept for audit.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian compares candidates for a provisioned capacity slot, selects the strongest fit whether that is a person or an artificial agent, records the acquisition, and notifies the onboarding step that the acquired agents are on their way.'
