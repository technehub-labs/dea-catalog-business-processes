plain_language_name: 'Provision Agent Capacity'
plain_language_description: 'This activity sets up the agent capacity that the committed organization structure has called for. The structure design is taken in and reviewed, the capacity it requires is worked out and arranged, and the provisioned capacity is confirmed back to those who planned the structure. It ends with capacity in place for the structure that needs it and an audit record of the provisioning kept.'
business_purpose: 'It exists so selection and acquisition work against a real, provisioned amount of capacity rather than an unquantified staffing intention.'
practical_context: 'It happens when the committed organization structure design arrives during agent acquisition, and it closes once the provisioned agent capacity is confirmed and the provisioning record is retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian takes the committed organization structure, works out the agent capacity it calls for across people and artificial agents, confirms the provisioned capacity, and files the audit record for the records custodian to preserve.'
