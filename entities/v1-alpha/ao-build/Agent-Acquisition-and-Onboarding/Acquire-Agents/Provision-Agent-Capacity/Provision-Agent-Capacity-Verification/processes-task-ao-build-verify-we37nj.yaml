plain_language_name: 'Check the Design Against the Provisioning Requirements'
plain_language_description: 'Before capacity is committed, the verification custodian tests the design against what provisioning requires of it - completeness, consistency, and fitness to be built. Defects are written up as nonconformances for rejection or repair, so no capacity gets built on a flawed base.'
business_purpose: 'It exists so the organisation never provisions capacity from a design that would not survive scrutiny.'
practical_context: 'It runs once the intake is registered and the design can be compared with the activity''s requirements, and it finishes with the design verified or its defects logged for rejection or remediation.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian checks the committed design for completeness and consistency, finds a capacity line left unspecified, and records the defect for repair.'
