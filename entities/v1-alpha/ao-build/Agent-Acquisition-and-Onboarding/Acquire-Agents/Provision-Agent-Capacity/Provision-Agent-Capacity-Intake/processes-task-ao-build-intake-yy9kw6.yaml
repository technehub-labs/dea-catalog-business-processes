plain_language_name: 'Receive the Structure Design for Provisioning'
plain_language_description: 'Provisioning starts when the committed organisation structure design lands with the intake custodian. The design is accepted, registered with audit identifiers, and logged as the standing reference the capacity work will be built from.'
business_purpose: 'It exists so capacity is provisioned from a registered, traceable design rather than an informal sketch.'
practical_context: 'It opens when the committed structure design is presented for provisioning, with the activity owner alerted to its arrival, and it closes with the intake registered and the later steps cleared to proceed.'
