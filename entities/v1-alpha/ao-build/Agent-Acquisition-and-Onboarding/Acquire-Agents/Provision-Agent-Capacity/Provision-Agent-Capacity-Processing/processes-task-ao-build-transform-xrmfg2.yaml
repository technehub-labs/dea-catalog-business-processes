plain_language_name: 'Build the Agent Capacity the Design Calls For'
plain_language_description: 'With the design verified, the processing custodian provisions the capacity itself, producing the agent capacity in exactly the shape the design commits to. The intermediate working artifacts are preserved along the way, so every capacity decision can be audited later.'
business_purpose: 'It exists because a design on paper staffs nothing until the capacity it calls for is actually provisioned.'
practical_context: 'It starts once checking is complete and the verified design is ready to be built from, and it ends with the capacity produced in its committed shape and the working artifacts kept for audit.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian provisions the agent capacity line by line from the verified design, preserving the working artifacts behind each decision.'
