plain_language_name: 'File the Integration Audit Record'
plain_language_description: 'The records custodian closes the activity by preserving the integration''s audit trail at the retention tier its evidence rules set, with retrieval handles ready for later inspection. Who was placed where, and on what basis, stays answerable long after the placement work has moved on.'
business_purpose: 'It exists so the integration of agents into the organisation remains evidenced and retrievable for future scrutiny.'
practical_context: 'It starts once the confirmation has been issued and retention may begin, and it ends with the audit record stored at its tier and retrieval handles established.'
worked_example:
  agent_type: human
  narrative: 'A records custodian files the integration trail at its retention tier and sets the retrieval handles a future review would use to see who was placed where.'
