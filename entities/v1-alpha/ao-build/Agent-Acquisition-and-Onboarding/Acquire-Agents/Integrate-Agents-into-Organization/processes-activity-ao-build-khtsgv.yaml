plain_language_name: 'Integrate Agents into the Organization'
plain_language_description: 'Once agents have been onboarded into their roles, this activity connects them into the teams and ways of working they will operate in. The onboarded agents are brought in and logged, their placements are checked against the team structure, the connections are put in place, and the teams involved are told the agents are ready to work with them. The work ends with the agents operating inside the organization''s team arrangements rather than standing outside them.'
business_purpose: 'It exists so newly onboarded agents stop being a list of arrivals and start working as part of the organization''s teams and coordination patterns.'
practical_context: 'It follows onboarding during agent acquisition, when the onboarded agents are presented for placement into teams, and it closes once the integrated agents are confirmed and an audit record of the integration is retained.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian places a batch of newly onboarded agents into their assigned teams, checks each connection against the agreed coordination patterns, and files the audit record once the teams confirm the agents are ready to collaborate.'
