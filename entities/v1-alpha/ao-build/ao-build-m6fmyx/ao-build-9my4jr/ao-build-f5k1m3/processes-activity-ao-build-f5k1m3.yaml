type: Activity
name: Screen Candidates Against Sanctions / AML / FCRA / ADA
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Build Regulated Agent Pool that
  Screen each candidate against OFAC sanctions (31 CFR 501), Bank Secrecy Act AML
  / KYC (31 USC 5311), FCRA background (15 USC 1681), and ADA fitness (42 USC 12112).
  Shared concern: regulator-specific screening. Input: the fitness-attested candidate
  list; the screening matrix. Output: the screened candidate list with the sanctions
  / AML / FCRA / ADA clearances.'
belongs_to_business_process: processes:process-ao-build-9my4jr
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single screen candidates against sanctions / aml / fcra
  / ada concern, one input class, and one output (the screen candidates against sanctions
  / aml / fcra / ada record on the regulated personnel record).
