type: Activity
name: Verify Candidates Against Regulator Licence Registry
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: 'The cohesive grouping of work within Build Regulated Agent Pool that
  Verify each candidate against the regulator licence registry: FCA Financial Services
  Register; NMLS / NAIC Producer Database; FAA airmen certification database; US state
  bar admissions registries; state healthcare licensure registries (FSMB, Nursys,
  NABP, ARRT, ARDMS, NBRC). Shared concern: licence-registry verification. Input:
  the candidate list; the regulator registry access. Output: the verified-candidate
  list with the regulator licence record.'
belongs_to_business_process: processes:process-ao-build-9my4jr
cohesion_rationale: Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
  Constituent work shares a single verify candidates against regulator licence registry
  concern, one input class, and one output (the verify candidates against regulator
  licence registry record on the regulated personnel record).
