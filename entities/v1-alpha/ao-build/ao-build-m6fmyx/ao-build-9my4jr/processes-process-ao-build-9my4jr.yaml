id: processes:process-ao-build-9my4jr
name: Build Regulated Agent Pool
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
process_specialization: []
description: >-
  Build the regulator-ready licensed-candidate pool under the enterprise regulated-entity approval authority. The trigger is the decision to source candidates for regulator-licensed roles. The outcome is a regulator-ready pool committed to the regulated personnel record, with each candidate verified against the regulator's licence registry, fitness-and-propriety attested, cleared against OFAC sanctions (31 CFR 501), Bank Secrecy Act AML/KYC (31 USC 5311), FCRA background (15 USC 1681), and ADA fitness (42 USC 12112), and ready for regulator-tied Activate without re-screening.
trigger: >-
  The enterprise is sourcing candidates for regulator-licensed roles whose qualifications must be verified against the regulator's licence registry and whose fitness-and-propriety must be attested before they enter the regulated personnel record, and the enterprise must apply regulator-specific screening (KYC, AML, sanctions, fitness declarations, FCRA-compliant background, ADA-compliant fitness) that differs from the substrate-neutral agent-acquisition flow.
outcome: >-
  The licensed-candidate pool is verified, cleared, and on the regulated personnel record; each candidate is fitness-and-propriety attested and ready for regulator-tied Activate without re-screening.
identity:
  verb: Build
  object: Regulated Agent Pool
  scope: enterprise
  outcome_statement: >-
    The regulator-tied Regulated Agent Pool build work has been carried out
    at the AgencyAndOrganization x Build coordinate under the enterprise
    regulated-entity approval authority. The outcome is recorded on the regulated
    personnel record with the supervisor-controlled scope, the fitness-and-propriety
    attestation regime, the supervised-training completion requirements, and the
    continuing-supervisor notification path documented per the regulator's
    continuing-supervision framework. Substrate-neutral build work is
    excluded. Adjacent lifecycle stages (Conceive / Design / Build / Activate /
    Operate / Improve / Retire) are excluded.
