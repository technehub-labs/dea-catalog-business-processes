id: processes:group-ao-build-m6fmyx
type: ProcessGroup
version: 1.0.0
name: Agent Acquisition and Onboarding
definition: 'The bounded Process Group that organises the Business Process responsibilities of acquiring and onboarding agents of all substrates in the AgencyAndOrganization x Build context: sourcing and recruiting human talent, provisioning artificial agents (model deployment, API integration), onboarding and integrating agents, and building the contractor and partner-agent pool. v2.4.0 grounding (domain-grounding.md §3.3, Acquisition and Onboarding sub-concern).

  '
process_context: processes:pc-ao-build-pjk4rz
scope:
  includes:
  - Agent sourcing, recruiting, provisioning (all substrates)
  - Agent onboarding and integration
  - Contractor and partner-agent pool build
  excludes:
  - Supplier relationship onboarding (party-relationship)
  - Agent topology design (Design stage; adjacent context)
  - Agent performance operation (Operate stage; adjacent context)
outcomes:
- Agents are acquired and onboarded per the designed topology.
- Contractor and partner-agent pool is built with vetted sources.
