id: dea:process-transition-to-service
name: Transition Proposition to Service
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: transform
process_type: core
process_specialization: []
description: 'Transition a validated proposition, product or service from a prepared state into operational service, with ownership, controls and operational readiness confirmed, within the dea:pc-pv-activate Cell Charter. See trigger and outcome for the bounded work this process owns; see identity.outcome_statement for the testable outcome the process produces.
  '
trigger: 'A validated proposition, product or service has met its readiness threshold and is authorized for operational transition.
  '
outcome: 'The proposition, product or service is accepted into operational service and relied upon operationally.
  '
