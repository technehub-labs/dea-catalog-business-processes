plain_language_name: 'File the Drafting Record of the Candidate Adjustments'
plain_language_description: 'After the handover, the trail must be kept. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles.'
business_purpose: 'It exists so the organisation can later show which candidates were drafted, on whose case, and why they took the shape they did.'
practical_context: 'It opens once the confirmation has been issued and the audit trail can be laid down, and it closes with the drafting record preserved at its required tier and its retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the candidate adjustments with the case they answered, sets the retrieval handles, and leaves the trail ready for whoever reviews the decision next year.'
