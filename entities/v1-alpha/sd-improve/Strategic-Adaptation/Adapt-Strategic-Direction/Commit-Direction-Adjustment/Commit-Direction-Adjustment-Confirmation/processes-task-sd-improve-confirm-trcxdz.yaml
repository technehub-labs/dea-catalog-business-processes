plain_language_name: 'Hand the Committed Direction to Refresh and Review Teams'
plain_language_description: 'The direction is settled and the handoff must be sealed. The confirmation custodian tells the downstream teams the committed direction adjustment is available, and closes the reconciliation against what the activity promised.'
business_purpose: 'It exists because the objectives refresh and the effectiveness review cannot start until someone has formally told them the new direction is in force.'
practical_context: 'It opens when the commitment work is finished and the new direction is ready to travel, and it closes with the downstream teams told and the reconciliation against the activity''s promise closed out.'
worked_example:
  agent_type: human
  narrative: 'A confirmation custodian in the strategy function tells the objectives refresh and effectiveness review teams the committed direction is available, then closes the handover by reconciling it against what the commitment promised.'
