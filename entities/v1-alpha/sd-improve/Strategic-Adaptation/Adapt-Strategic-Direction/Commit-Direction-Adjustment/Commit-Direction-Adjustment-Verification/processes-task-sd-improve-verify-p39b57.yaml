plain_language_name: 'Test the Assessed Implications Before the Direction Is Changed'
plain_language_description: 'Before the direction is committed, the arriving implications material is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because a direction committed on incomplete or untested implications commits the organisation to consequences nobody traced.'
practical_context: 'It opens once the intake is registered and the implications can be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the arriving implications against what the commitment needs, and writes up a candidate whose portfolio impact was never traced as a shortfall to be put right.'
