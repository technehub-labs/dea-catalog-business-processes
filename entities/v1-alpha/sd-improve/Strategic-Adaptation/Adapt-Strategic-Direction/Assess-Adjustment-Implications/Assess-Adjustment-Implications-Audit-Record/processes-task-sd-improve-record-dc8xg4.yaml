plain_language_name: 'File the Adjustment Implications Assessment Evidence'
plain_language_description: 'The filing work opens once confirmation is given. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles, so what each candidate adjustment would cost the objectives, targets, plan and portfolio stays answerable when the direction debate resumes.'
business_purpose: 'It exists because adjustment debates recur, and the assessed implications must be retrievable rather than re-argued from scratch.'
practical_context: 'It opens when the confirmation is in place, and it closes with the assessment evidence filed at its required tier and the retrieval handles set.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the assessment evidence at its required retention tier and sets the retrieval handles, so each adjustment''s known cost to the plan and portfolio is traceable from the record.'
