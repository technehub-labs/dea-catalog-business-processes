plain_language_name: 'Trace What Each Candidate Would Mean for Plan and Portfolio'
plain_language_description: 'With the inputs verified, the assessment proper begins. The processing custodian works each tested candidate through objectives, targets, the strategic plan and the initiative portfolio, producing the assessed implications in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because the choice between candidates is blind until someone has traced what each would do to objectives, targets, plan and portfolio.'
practical_context: 'It opens when the verified candidates are ready to be worked, and it closes with the assessed adjustment implications produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function traces each candidate adjustment through the objectives, the targets, the plan and the live initiative portfolio, writing up the assessed implications with the workings kept.'
