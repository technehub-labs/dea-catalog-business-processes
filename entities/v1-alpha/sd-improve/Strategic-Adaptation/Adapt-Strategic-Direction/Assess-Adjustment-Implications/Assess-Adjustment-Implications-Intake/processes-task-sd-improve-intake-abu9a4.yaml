plain_language_name: 'Take In the Candidate Adjustments for Implications Work'
plain_language_description: 'The assessment opens as its material arrives: the candidate direction adjustments drafted against the adaptation case. The intake custodian logs them against the assessment file so the assessment starts accounted for.'
business_purpose: 'It exists so the implications work covers exactly the candidates on the register, with none slipping in or out unrecorded.'
practical_context: 'It opens when the candidate adjustments are presented for assessment, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
