plain_language_name: 'Consolidate Adaptation Drivers'
plain_language_description: 'Adaptation starts by assembling the case for change. Sensed signals, monitored performance and review findings arrive at intake, verification confirms each stream is current, and processing merges them into one adaptation case that states plainly why the direction can no longer stand still. Confirmation shares the consolidated case downstream and the records custodian preserves it for the formulation step.'
business_purpose: 'It builds one coherent evidence case for changing course, so adaptation rests on documented drivers rather than scattered impressions.'
practical_context: 'It opens this process at intake when the sensed signals, monitored performance and review findings arrive, closing once the consolidated case is confirmed and stored.'
worked_example:
  agent_type: human
  narrative: 'A strategy function analyst pulls the environmental briefs, performance reports and review findings into a single case-for-change pack, a verification custodian confirms each stream is up to date, and the confirmation custodian passes the case to the adjustment team.'
