plain_language_name: 'Build the Consolidated Case for Changing Direction'
plain_language_description: 'With the inputs verified, the consolidation proper begins. The processing custodian draws the tested signals, performance evidence and findings together into a single adaptation case, producing it in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because scattered signals and loose figures persuade no one; the direction change needs one case that carries the whole argument.'
practical_context: 'It opens when the verified material is ready to be worked, and it closes with the consolidated adaptation case produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function brings the tested market signals, the performance figures and the review findings together into one adaptation case, keeping the workings for the audit trail.'
