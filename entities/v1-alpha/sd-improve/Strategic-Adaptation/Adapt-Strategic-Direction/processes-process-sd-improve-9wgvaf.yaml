plain_language_name: 'Adapt Strategic Direction'
plain_language_description: 'When the evidence says the current course no longer fits, this work changes it deliberately. The strategy function adapts the strategic direction, has the objectives and targets refreshed to match, and carries the lessons of the effectiveness review into the result. The adapted direction is then ready to drive the next planning cycle.'
business_purpose: 'It keeps strategy honest in the face of change: signals and review findings are turned into a revised direction rather than ignored, so the enterprise corrects course while the correction is still affordable.'
practical_context: 'Encountered when environmental signals, performance monitoring, or an effectiveness review show the direction needs adjusting; the strategy function leads the adaptation ahead of the next planning cycle.'
worked_example:
  agent_type: human
  narrative: 'Acting on the effectiveness review findings, the strategy function revises the strategic direction, and the objectives and targets are refreshed to match the new course. The adapted direction is tabled as the starting point of the next planning cycle.'
