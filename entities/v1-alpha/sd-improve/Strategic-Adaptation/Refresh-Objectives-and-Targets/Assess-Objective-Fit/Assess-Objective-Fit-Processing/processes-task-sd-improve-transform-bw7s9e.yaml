plain_language_name: 'Judge How Well Each Objective Still Fits the Evidence'
plain_language_description: 'With the inputs verified, the assessment proper begins. The processing custodian weighs every objective and target against the tested evidence, producing the objective fit assessment in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because the redraft that follows needs to know precisely which objectives still hold and which the evidence has overtaken.'
practical_context: 'It opens when the verified evidence is ready to be worked, and it closes with the objective fit assessment produced in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function weighs each objective and target against the tested evidence and writes the fit verdict per objective, keeping the reasoning for the audit trail.'
