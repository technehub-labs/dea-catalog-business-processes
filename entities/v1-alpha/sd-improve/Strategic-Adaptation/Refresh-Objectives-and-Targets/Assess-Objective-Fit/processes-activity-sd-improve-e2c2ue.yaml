plain_language_name: 'Assess Objective Fit'
plain_language_description: 'The evidence is in; the question is whether the current measures still make sense. Intake registers the gathered evidence, scrutiny tests each objective and its target against what performance is actually showing, and processing records a fit verdict for every line — keep, tighten, or retire. Confirmation communicates the assessment downstream and the records custodian preserves it ready for redrafting.'
business_purpose: 'It separates the measures that still serve the direction from those that have gone stale, focusing the redraft where it matters.'
practical_context: 'It follows evidence gathering, opening at intake of the gathered evidence and closing when the fit verdicts are confirmed and preserved.'
worked_example:
  agent_type: human
  narrative: 'Strategy function reviewers read each objective and target against the evidence pack, mark one measure for retirement and two for tightening, and the confirmation custodian passes the fit verdicts to the redrafting team.'
