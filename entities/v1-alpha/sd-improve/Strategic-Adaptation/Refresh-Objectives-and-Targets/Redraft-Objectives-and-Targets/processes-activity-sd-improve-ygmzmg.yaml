plain_language_name: 'Redraft Objectives and Targets'
plain_language_description: 'The verdicts are in, so the wording gets rewritten. Intake registers the fit assessment, verification checks every verdict has a redrafting instruction, and processing rewrites the measures so they once more track the adapted course and what the evidence actually shows. Confirmation announces the redrafted set downstream and the working papers are preserved for commitment.'
business_purpose: 'It rewrites the stale measures into ones that fit where the direction now points, restoring a steerable objective set.'
practical_context: 'It follows the fit assessment, opening at intake of the verdicts and closing when the redrafted set is confirmed ready for commitment.'
worked_example:
  agent_type: human
  narrative: 'Strategy function writers rewrite the flagged objectives and targets against the fit verdicts, a verification custodian sends any half-rewritten line back, and the confirmation custodian announces the refreshed set is ready for ratification.'
