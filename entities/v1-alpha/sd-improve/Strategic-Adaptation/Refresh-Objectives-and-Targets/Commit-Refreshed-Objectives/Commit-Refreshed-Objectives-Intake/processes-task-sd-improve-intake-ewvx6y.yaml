plain_language_name: 'Take In the Redrafted Objectives for Ratification'
plain_language_description: 'The commitment opens as its material arrives: the redrafted objectives and targets ready to be ratified. The intake custodian logs them against the commitment file so the commitment starts accounted for.'
business_purpose: 'It exists so the ratification covers the registered redraft in full, with no rewritten objective arriving by side door.'
practical_context: 'It opens when the redrafted objectives are presented for commitment, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
