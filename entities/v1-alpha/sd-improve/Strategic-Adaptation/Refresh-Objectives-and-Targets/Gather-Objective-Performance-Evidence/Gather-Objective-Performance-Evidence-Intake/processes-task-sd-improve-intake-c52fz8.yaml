plain_language_name: 'Take In the Monitored Performance for the Evidence Gathering'
plain_language_description: 'The gathering opens as its material arrives: the monitored strategic performance that shows how the current objectives are really doing. The intake custodian logs it against the gathering file so the gathering starts accounted for.'
business_purpose: 'It exists so the evidence against which objectives will be judged is complete on arrival, not assembled from whatever reports happen to surface.'
practical_context: 'It opens when the monitored performance is presented for gathering, with the activity''s owner told that it has landed, and it closes with the intake registered and the later phases free to proceed.'
worked_example:
  agent_type: human
  narrative: 'An intake custodian in the strategy function logs the monitored performance reports into the gathering file, so the evidence work on the current objectives starts accounted for.'
