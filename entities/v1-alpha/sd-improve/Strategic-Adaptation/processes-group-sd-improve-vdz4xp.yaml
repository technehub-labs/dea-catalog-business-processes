plain_language_name: 'Strategic Adaptation'
plain_language_description: 'This family adapts direction as reality teaches. Its processes adapt the strategic direction on evidence, refresh objectives and targets when they drift from relevance, and review strategy effectiveness with findings committed for the next cycle.'
business_purpose: 'So strategy stays alive: direction adjusted on evidence, objectives refreshed, and effectiveness reviewed rather than assumed.'
practical_context: 'Encountered in the Improve stage: annual strategy reviews, mid-course corrections after environmental shifts, and target refreshes.'
worked_example:
  agent_type: human
  narrative: 'After a market shock, the Strategy & Direction Process Owner reviews strategy effectiveness, adapts the strategic direction toward the changed landscape, refreshes the objectives and targets, and commits the findings for the next planning cycle.'
