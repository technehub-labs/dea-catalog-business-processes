plain_language_name: 'File the Committed Findings and Their Routes'
plain_language_description: 'After the handover, the trail must be kept. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles.'
business_purpose: 'It exists so the organisation can later trace which findings were committed, where each was routed, and what came of them.'
practical_context: 'It opens once the confirmation has been issued and the audit trail can be laid down, and it closes with the routing record preserved at its required tier and its retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the committed findings with their adaptation routes at the agreed retention tier, and sets the retrieval handles a follow-up review will use.'
