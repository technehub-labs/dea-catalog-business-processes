id: processes:activity-sd-retire-48khkt
type: Activity
name: Execute Retained-Records Plan for Regulated Entity
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Sunset Regulated Strategic Plan that executes the regulated-entity's retained-records plan for the retired strategic plan per the regulated-entity retention policy (the regulated-entity retention policy's records-retention schedule applied to the retired strategic plan; the regulator-prescribed retention period honored; the retired plan's records catalogued under the retained-records plan; the retired plan's records preserved against the supervisor's continuing supervision; the retained-records plan execution recorded against the regulated strategic-plan record).
belongs_to_business_process: processes:process-sd-retire-umxf3c
cohesion_rationale: Constituent work shares a single retained-records-plan-execution concern, one input class (the regulated strategic-plan record plus the regulator directive or rejection notice plus the superseded-plan identification plus the filings register update plus the executed communications plan plus the preserved regulator-acknowledged sunset record), and one output (the retained-records plan executed per the regulated-entity retention policy with the retired plan's records catalogued and preserved). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
