id: processes:activity-sd-retire-6m38cq
type: Activity
name: Update Filings Register for Regulated Strategic Plan
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Sunset Regulated Strategic Plan that updates the regulated-entity filings register to reflect the regulated strategic plan's retirement (the supervisor-filed filings register entry marking the plan as retired under regulator directive; the replacement plan's status preserved on the same register; the regulator identifier, directive date, and effective-retirement date recorded; the filings register update transmitted to the supervisor under the regulator's continuing supervision).
belongs_to_business_process: processes:process-sd-retire-umxf3c
cohesion_rationale: Constituent work shares a single filings-register-update concern, one input class (the regulated strategic-plan record plus the regulator directive or rejection notice plus the superseded-plan identification), and one output (the filings register updated with the regulated strategic-plan retirement recorded and the replacement plan's status preserved). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
