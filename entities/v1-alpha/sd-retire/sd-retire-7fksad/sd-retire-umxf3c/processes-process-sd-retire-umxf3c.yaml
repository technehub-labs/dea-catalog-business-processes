id: processes:process-sd-retire-umxf3c
name: Sunset Regulated Strategic Plan
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate
process_intent: manage
process_type: management
trigger: A regulated entity's supervisor-acknowledged-and-live strategic plan must be sunset because a competent regulator has required its retirement (failed stress test triggers plan replacement; bank recovery-plan rejection by the SRB; FDIC directive to retire an inadequate resolution plan; state PUC retraction of an approved strategic plan; NHS England directive to retire a non-viable 5-year strategy).
outcome: The regulated strategic plan is formally sunset with the regulator directive on record, the replacement plan's status preserved, the retired plan's records retained per the regulated-entity retention policy, and the supervisor's acknowledgement of the sunset recorded.
description: Sunset a regulated entity's supervisor-acknowledged-and-live strategic plan under the enterprise's regulated-entity retention policy within the dea:pc-sd-retire Cell Charter. The trigger is a competent regulator's directive or rejection that requires the plan's retirement; the outcome is the plan formally sunset with the regulator directive on record, the replacement plan's status preserved, the retired plan's records retained per the regulated-entity retention policy, and the supervisor's acknowledgement of the sunset recorded. Distinct from strategy improvement (Improve coordinate) and from strategy activation (Activate coordinate, which handles replacement-plan activation).
process_specialization: []
process_identity:
  boundary_face: regulated-entity retention policy
  identity_kind: canonical
  is_process: true
  is_project: false
process_scope:
  includes:
  - Regulator directive or rejection notice (failed stress test triggers plan replacement; bank recovery-plan rejection by the SRB; FDIC directive to retire an inadequate resolution plan; state PUC retraction of an approved strategic plan; NHS England directive to retire a non-viable 5-year strategy)
  - Superseded or replaced plan identification on the regulated strategic-plan record
  - Filings register update for the regulated strategic plan
  - Communications plan execution for the regulated strategic-plan sunset under the regulator's continuing supervision
  - Regulator-acknowledged sunset record preservation on the regulated strategic-plan record
  - Retained-records plan execution per the regulated-entity retention policy
  - Affected business-unit notification under the regulator's continuing supervision
  excludes:
  - Strategic-plan conception, design, build, activation, steady-state execution, and improvement (StrategyAndDirection x Conceive / Design / Build / Activate / Operate / Improve)
  - Non-regulated strategic-plan sunset (single-business-unit rollout without regulator's review)
  - Strategic plans absent a regulator-directed sunset regime
  - Strategic-plan disposition where no competent regulator has required retirement
  - Replacement-plan activation (handled at StrategyAndDirection x Activate)
context:
- ref: processes:pc-sd-retire-zxnc3c
identity:
  verb: Sunset
  object: Regulated Strategic Plan
  scope: enterprise
  outcome_statement: The regulated strategic plan is formally sunset with the regulator directive on record, the replacement plan's status preserved, the retired plan's records retained per the regulated-entity retention policy, and the supervisor's acknowledgement of the sunset recorded.
