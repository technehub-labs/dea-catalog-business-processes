id: processes:activity-sd-retire-z2y3pr
type: Activity
name: Receive Regulator Sunset Directive
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Sunset Regulated Strategic Plan that receives and records the regulator's directive or rejection notice that requires the regulated strategic plan's retirement (failed stress test triggers plan replacement; bank recovery-plan rejection by the SRB; FDIC directive to retire an inadequate resolution plan; state PUC retraction of an approved strategic plan; NHS England directive to retire a non-viable 5-year strategy).
belongs_to_business_process: processes:process-sd-retire-umxf3c
cohesion_rationale: Constituent work shares a single regulator-directive-acquisition concern, one input class (the regulated entity's strategic-plan record plus the regulator-issued directive or rejection notice), and one output (the directive recorded against the regulated strategic-plan record with the regulator identifier, directive date, and effective-retirement date preserved). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
