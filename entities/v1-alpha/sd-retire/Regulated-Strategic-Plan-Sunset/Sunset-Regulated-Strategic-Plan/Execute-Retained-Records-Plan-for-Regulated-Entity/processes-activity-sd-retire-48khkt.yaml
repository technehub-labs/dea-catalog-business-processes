plain_language_name: 'Execute Retained-Records Plan for Regulated Entity'
plain_language_description: 'Retired does not mean discarded; the retired plan''s papers must be kept on schedule. Intake registers the completed sunset record and the entity''s retention plan, verification reconciles the schedule against what the supervisor requires, and processing catalogues the retired plan''s papers, applies the prescribed keeping periods and stores them where continuing oversight can reach them. Confirmation logs the execution against the plan record and the records custodian preserves the catalogue itself.'
business_purpose: 'It keeps the retired plan''s papers findable and intact for as long as the policy and the supervisor require, so history stays answerable.'
practical_context: 'It follows the sunset record, opening at intake of the retention plan and closing when the catalogued, stored papers are confirmed and the execution logged.'
worked_example:
  agent_type: human
  narrative: 'The finance function records team catalogues the retired plan''s papers against the retention schedule, a verification custodian reconciles the keeping periods with the supervisor''s requirements, and the execution is logged where the industry regulator can inspect it.'
