definition: The cohesive grouping of work within Sunset Regulated Strategic Plan that updates the regulated-entity filings register to reflect the regulated strategic plan's retirement (the supervisor-filed filings register entry marking the plan as retired under regulator directive; the replacement plan's status preserved on the same register; the regulator identifier, directive date, and effective-retirement date recorded; the filings register update transmitted to the supervisor under the regulator's continuing supervision).
