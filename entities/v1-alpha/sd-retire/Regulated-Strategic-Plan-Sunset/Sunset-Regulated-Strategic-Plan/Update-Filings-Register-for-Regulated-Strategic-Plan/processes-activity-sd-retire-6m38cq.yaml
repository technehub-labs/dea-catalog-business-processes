plain_language_name: 'Update Filings Register for Regulated Strategic Plan'
plain_language_description: 'The official list of lodged plans must now show the truth. Intake registers the identified pairing and the register itself, verification checks the entry to be amended, and processing marks the plan as retired on the register, records the issuing authority and the directive and retirement dates, and keeps the successor''s standing visible on the same entry. Confirmation transmits the amended register to the supervisor and the records custodian preserves the update evidence.'
business_purpose: 'It keeps the public record of lodged plans truthful, marking the retirement where the supervisor and every future reader can see it.'
practical_context: 'It follows supersession identification, opening at intake of the register and pairing and closing when the transmitted update is confirmed and preserved.'
worked_example:
  agent_type: human
  narrative: 'A strategy function registrar amends the register entry to mark the plan retired, enters the authority and the two dates, and the confirmation custodian transmits the amended register to the supervising authority for their records.'
