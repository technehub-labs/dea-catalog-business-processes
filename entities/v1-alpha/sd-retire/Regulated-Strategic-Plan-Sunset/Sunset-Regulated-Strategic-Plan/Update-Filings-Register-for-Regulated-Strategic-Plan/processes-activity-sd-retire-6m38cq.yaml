cohesion_rationale: Constituent work shares a single filings-register-update concern, one input class (the regulated strategic-plan record plus the regulator directive or rejection notice plus the superseded-plan identification), and one output (the filings register updated with the regulated strategic-plan retirement recorded and the replacement plan's status preserved). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
