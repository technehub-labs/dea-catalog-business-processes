plain_language_name: 'File the Register Update as Transmitted'
plain_language_description: 'After the handover, the trail must be kept. The records custodian preserves the audit record at its required retention tier and sets the retrieval handles.'
business_purpose: 'It exists so the entity can show the supervisor exactly what was filed, and when, if the retirement is ever queried.'
practical_context: 'It opens once the confirmation has been issued and the audit trail can be laid down, and it closes with the register record preserved at its required tier and its retrieval handles in place.'
worked_example:
  agent_type: human
  narrative: 'A records custodian in the strategy function files the register update exactly as transmitted, at the agreed retention tier, and sets the retrieval handles for the supervisor''s follow-up queries.'
