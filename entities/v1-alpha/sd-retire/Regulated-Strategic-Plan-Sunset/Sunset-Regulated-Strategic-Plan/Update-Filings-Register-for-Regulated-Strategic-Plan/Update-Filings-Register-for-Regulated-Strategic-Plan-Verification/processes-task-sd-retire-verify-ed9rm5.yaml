plain_language_name: 'Test the Supersession Material Before the Register Changes'
plain_language_description: 'Before the filings register is changed, the arriving material is put to the test. The verification custodian tests the arriving material against what the activity requires. Shortfalls are written down, either for rejection or for putting right.'
business_purpose: 'It exists because a register showing a plan retired on the wrong date would put the entity out of step with its supervisor on paper.'
practical_context: 'It opens once the intake is registered and the material can be challenged, and it closes with its shortfalls written down for rejection or putting right.'
worked_example:
  agent_type: human
  narrative: 'A verification custodian in the strategy function tests the supersession material against what the register update needs, and writes up a retirement date that misses the directive as a shortfall to be put right.'
