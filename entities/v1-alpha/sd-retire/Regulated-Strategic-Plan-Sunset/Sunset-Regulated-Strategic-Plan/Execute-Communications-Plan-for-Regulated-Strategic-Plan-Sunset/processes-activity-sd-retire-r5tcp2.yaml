id: processes:activity-sd-retire-r5tcp2
type: Activity
name: Execute Communications Plan for Regulated Strategic Plan Sunset
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: The cohesive grouping of work within Sunset Regulated Strategic Plan that executes the regulated-entity communications plan for the regulated strategic-plan sunset under the regulator's continuing supervision (the supervisor-filed communications plan; the affected business-unit notification; the regulated-entity external communications; the regulator-prescribed sunset communications; the replacement-plan status communicated to the supervisor; the regulator-acknowledged sunset on record with the supervisor).
belongs_to_business_process: processes:process-sd-retire-umxf3c
cohesion_rationale: Constituent work shares a single communications-plan-execution concern, one input class (the regulated strategic-plan record plus the regulator directive or rejection notice plus the superseded-plan identification plus the filings register update), and one output (the communications plan executed under the regulator's continuing supervision with the supervisor-acknowledged sunset recorded). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6).
