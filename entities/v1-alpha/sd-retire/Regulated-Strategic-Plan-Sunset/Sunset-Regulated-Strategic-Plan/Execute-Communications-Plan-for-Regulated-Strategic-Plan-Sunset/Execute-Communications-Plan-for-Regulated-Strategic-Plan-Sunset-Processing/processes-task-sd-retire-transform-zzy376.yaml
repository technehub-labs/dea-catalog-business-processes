plain_language_name: 'Run the Sunset Communications Across Their Audiences'
plain_language_description: 'With the inputs verified, the execution proper begins. The processing custodian runs each tested communication to its audience on the filed plan''s schedule, producing the executed communications plan in the form the activity''s definition specifies. The working papers are kept for the audit trail.'
business_purpose: 'It exists because a sunset that is silent breeds rumour; the plan''s communications are how the retirement is carried publicly.'
practical_context: 'It opens when the verified plan is ready to be worked, and it closes with the communications plan executed in the agreed form and the workings filed.'
worked_example:
  agent_type: human
  narrative: 'A processing custodian in the strategy function issues the tested communications to business units, customers and the supervisor on the filed schedule, keeping the dispatch workings for the audit trail.'
