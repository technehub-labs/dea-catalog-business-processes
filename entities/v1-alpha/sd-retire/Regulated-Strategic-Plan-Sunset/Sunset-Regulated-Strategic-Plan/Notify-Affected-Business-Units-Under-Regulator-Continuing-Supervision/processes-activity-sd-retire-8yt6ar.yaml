plain_language_name: 'Notify the Affected Business Units of the Sunset'
plain_language_description: 'The people whose work the plan governed hear about the sunset through a prescribed outreach, not rumour. Intake registers the prescribed notification list, verification confirms every unit on it is reached with the content and timing the regulator set, and processing delivers the notices and gathers each unit''s acknowledgement onto the plan record. Confirmation completes the outreach and the records custodian preserves the acknowledgement trail for the supervisor.'
business_purpose: 'It leaves no affected team discovering the sunset by rumour, with every notice delivered, acknowledged and evidenced as the supervisor prescribes.'
practical_context: 'It closes the sunset sequence, opening at intake of the prescribed list and closing when the gathered acknowledgements are confirmed and preserved.'
worked_example:
  agent_type: human
  narrative: 'The strategy function notification desk works through the regulator-prescribed unit list, a verification custodian confirms each unit received the mandated content on the mandated timing, and the gathered acknowledgements are preserved where the supervising authority can review them.'
