plain_language_name: 'Receive Regulator Sunset Directive'
plain_language_description: 'The sunset begins with an instruction from the supervisor. A directive or rejection notice from the regulator arrives at intake, verification confirms the document is authentic and complete, and processing records it against the regulated strategic-plan record with the issuing authority, the directive date and the retirement date it sets. Confirmation notifies downstream consumers and the records custodian preserves the recorded directive.'
business_purpose: 'It anchors the whole retirement on an authenticated instruction, so the plan is sunset because the supervisor required it — not on internal whim.'
practical_context: 'It opens this process at intake when the regulator''s notice arrives, closing once the recorded directive with its dates is confirmed and preserved.'
worked_example:
  agent_type: human
  narrative: 'A strategy function registrar logs the regulator''s notice against the plan record, a verification custodian confirms the issuing authority and dates before acceptance, and the finance function is told the retirement clock has started.'
