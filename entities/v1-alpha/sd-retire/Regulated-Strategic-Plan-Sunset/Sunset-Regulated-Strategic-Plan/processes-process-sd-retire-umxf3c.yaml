plain_language_name: 'Sunset Regulated Strategic Plan'
plain_language_description: 'In regulated sectors, a live strategic plan can be ordered out of service by the regulator, and this work carries that retirement out properly. The strategy and finance functions record the regulator''s directive, preserve the status of the plan that replaces it, and retain the retired plan''s records under the retention policy. The sunset is completed with the supervisor''s acknowledgement placed on record.'
business_purpose: 'It makes regulator-ordered retirement clean and provable: the directive, the replacement''s status, the retained records, and the supervisor''s acknowledgement are all settled so the sunset stands up under continuing supervision.'
practical_context: 'Encountered when a competent regulator directs or forces retirement, for instance after a failed stress test or a rejected plan; the strategy and finance functions carry out the sunset under the regulator''s continuing supervision.'
worked_example:
  agent_type: human
  narrative: 'After the regulator rejects the plan, the strategy function logs the directive, marks the replacement plan''s status, and hands the retired records to the finance function for retention under the retention policy. The supervisor''s acknowledgement of the sunset is filed, and the affected business units are notified.'
