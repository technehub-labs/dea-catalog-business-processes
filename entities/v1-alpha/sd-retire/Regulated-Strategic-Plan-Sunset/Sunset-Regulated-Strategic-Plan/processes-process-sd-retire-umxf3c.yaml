trigger: A regulated entity's supervisor-acknowledged-and-live strategic plan must be sunset because a
  competent regulator has required its retirement (failed stress test triggers plan replacement; bank
  recovery-plan rejection by the SRB; FDIC directive to retire an inadequate resolution plan; state PUC
  retraction of an approved strategic plan; NHS England directive to retire a non-viable 5-year strategy).
outcome: The regulated strategic plan is formally sunset with the regulator directive on record, the replacement
  plan's status preserved, the retired plan's records retained per the regulated-entity retention policy,
  and the supervisor's acknowledgement of the sunset recorded.
description: Sunset a regulated entity's supervisor-acknowledged-and-live strategic plan under the enterprise's
  regulated-entity retention policy within the processes:pc-sd-retire-zxnc3c Cell Charter. The trigger is a competent
  regulator's directive or rejection that requires the plan's retirement; the outcome is the plan formally
  sunset with the regulator directive on record, the replacement plan's status preserved, the retired
  plan's records retained per the regulated-entity retention policy, and the supervisor's acknowledgement
  of the sunset recorded. Distinct from strategy improvement (Improve coordinate) and from strategy activation
  (Activate coordinate, which handles replacement-plan activation).
