plain_language_name: 'Regulated Strategic Plan Sunset'
plain_language_description: 'This family sunsets a regulated strategic plan when the regulator requires it. Its processes act on the directive or rejection notice, identify the superseded plan on the regulated record, update the filings register, execute the communications plan, preserve the sunset record, keep the superseded plan''s records on file, and notify affected business units.'
business_purpose: 'So a superseded plan leaves the record set cleanly: directive on file, replacement preserved, records retained, supervisor acknowledgement recorded.'
practical_context: 'Encountered only when a competent regulator requires retirement — a failed stress test, a rejected recovery plan, a retracted approval — never for routine plan refreshes.'
worked_example:
  agent_type: human
  narrative: 'A bank''s recovery plan fails the stress test. The Strategy & Direction Process Owner''s team logs the regulator''s directive, marks the plan superseded on the regulated record, updates the filings register, runs the communications plan, retains the retired records, and notifies the affected business units.'
