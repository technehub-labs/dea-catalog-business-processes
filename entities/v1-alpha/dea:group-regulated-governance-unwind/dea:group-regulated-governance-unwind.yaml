id: dea:group-regulated-governance-unwind
type: ProcessGroup
version: 1.0.0

name: Regulated Governance Unwind

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process
  responsibilities of winding down a regulated entity's governance
  regime following a regulator or court authority determination
  (UK FCA Wind-Down Planning Group supervisory framework;
  California Corporations Code sections 5033-5034 US nonprofit
  dissolution; IRS 501(c)(3) federal tax-exempt dissolution
  obligations; state attorney-general charity oversight; federal
  banking regulator cease-and-desist authority; US federal and
  state court receivership authority) in the
  GovernanceAndExistence x Retire context where the governing
  body, policy instruments, and statutory obligations must be
  wound down under the controlling regulator or court
  supervision.

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-ge-retire

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - "Regulator- or court-issued mandatory dissolution, revocation, wind-down, cease-and-desist, or equivalent order"
    - "Governance body reduction to a wind-down quorum under the controlling statute or regulator or court order"
    - "Policy instrument sunset or supersession by wind-down procedures (charters, mandates, delegations of authority)"
    - "Statutory dissolution filings (Form 990-N/990 for IRS 501(c)(3) status termination; California Secretary of State Form DISS for corporate dissolution; state attorney-general notifications for charity asset disposition; federal/state court reports for receivership termination; FCA S60.060 Form A notification for authorisation surrender)"
    - "Retained-records custodianship assignment for the statutorily required period (California Corp Code 6323; FTC/DOJ obligations; IRS recordkeeping under Treas. Reg. 1.6001-1)"
    - "Surrender of authorisation or cancellation of permission per the regulator or court determination"
  excludes:
    - "Asset and capability retirement (EnablementAndOperations x Retire; CR-BP-66)"
    - "Voluntary governance sunset absent regulator or court mandate (reserved for a future GovernanceAndExistence x Improve coordinate charter extension)"
    - "Counterparty and agent relationship closure (PartyAndRelationship x Retire; CR-BP-67)"
    - "Workforce wind-down (AgencyAndOrganization x Retire; CR-BP-73)"
    - "Regulated entity run-off (FinanceAndAccounting x Retire; CR-BP-75)"

# Intended enterprise outcomes.
outcomes:
  - "The governance regime is wound down under the controlling regulator or court authority: governance bodies are reduced to wind-down quorum per the controlling statute or regulator or court order, policy instruments are sunset per the governance constitution, statutory dissolution filings are submitted, retained-records custodianship is assigned per the service-of-process regime, and the entity is dissolved or its authorisation is surrendered per the regulator or court determination."

