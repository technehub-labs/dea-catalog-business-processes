id: dea:activity-identify-superseded-regulated-strategic-plan
type: Activity
name: Identify Superseded Regulated Strategic Plan
version: 1.0.0
lifecycle_status: candidate
status: candidate
definition: "The cohesive grouping of work within Sunset Regulated Strategic Plan that identifies the superseded or replaced strategic plan on the regulated strategic-plan record and records the supersession reference so that the replacement plan's status is preserved (linkage to the successor plan; the regulator-acknowledged-and-live strategic plan being retired; the failed stress test's plan replacement; the SRB-rejected recovery-plan replacement; the FDIC-retired resolution-plan replacement; the state PUC-retracted strategic-plan replacement; the NHS England-retired 5-year-strategy replacement)."
belongs_to_business_process: dea:process-sunset-regulated-strategic-plan
cohesion_rationale: "Constituent work shares a single superseded-plan-identification concern, one input class (the regulated strategic-plan record plus the regulator directive or rejection notice), and one output (the superseded plan identified on the regulated strategic-plan record with the supersession reference preserved for the regulated-entity retention policy). Cohesion score 9/9 assessed at deposition (CR-BP-32 section 6)."
decomposition_boundary: l4-reached
