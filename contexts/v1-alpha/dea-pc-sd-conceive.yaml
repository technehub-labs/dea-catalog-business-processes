# Process Context Cell Charter: StrategyAndDirection x Conceive.
#
# Lands as part of CR-BP-21a (StrategyAndDirection landing, first
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.2
# (Strategy & Direction: purpose, ambition, strategic intent, corporate
# strategy conception; excludes constitutional mandate and authority
# which live in Governance & Existence).

id: dea:pc-sd-conceive
domain: StrategyAndDirection
lifecycle_stage: Conceive
name: Purpose and Ambition Conception

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **conceiving** the enterprise's
  strategic direction in the **Strategy & Direction** domain. This context
  addresses the front-end work of framing the enterprise's purpose,
  ambition, and strategic intent: deciding what the enterprise is
  for, what it aims to become, what strategic horizons it commits to,
  and what corporate strategy it pursues. v2.4.0: Governance & Existence
  authorises the enterprise to exist (its mandate and authority); this
  context directs the enterprise's deliberate choice of trajectory within
  that authorised frame.

# Scope (PC-005).
scope:
  includes:
    - Purpose and ambition conception
    - Strategic intent conception
    - Strategic horizons framing
    - Corporate strategy development
  excludes:
    - Constitutional mandate and authority (governance-existence x conceive)
    - Charter and policy conception (governance-existence x conceive)
    - Risk framework direction (governance-existence x conceive)
    - Strategic option design (Design stage; adjacent context)
    - Strategic plan and roadmap build (Build stage; adjacent context)
    - Initiative execution (enablement-operations)

# Intended outcomes.
outcomes:
  - Enterprise purpose and ambition are framed and articulated.
  - Strategic intent is committed with a defined trajectory.
  - Strategic horizons are framed and bounded.
  - Corporate strategy is developed within the authorised frame.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-sd-design
  - dea:pc-sd-build
  - dea:pc-sd-operate
  - dea:pc-sd-improve
  - dea:pc-ge-conceive  # Authority handed from governance; strategy is bound by it.

# Business Processes belonging to this context (PC-008).
# Landing tranche 21a brings 1 L2; the other 3 register v2 candidates
# (Purpose, Intent, Horizons) land in CR-BP-21a.1.
processes:
  - dea:process-develop-corporate-strategy
  - dea:process-define-enterprise-purpose-and-ambition
  - dea:process-conceive-strategic-intent
  - dea:process-frame-strategic-horizons


# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Strategy & Direction: the enterprise's deliberate choice of trajectory."
  lifecycle_concern: "Conceive: framing purpose, ambition, and strategic intent."
  combined_semantic_meaning: |
    The front-end work of framing the enterprise's reason for being
    (purpose), what it aims to become (ambition), and the strategic
    trajectory it commits to (intent, horizons, corporate strategy).
  expected_outcomes:
    - Enterprise purpose and ambition are framed and articulated.
    - Strategic intent is committed with a defined trajectory.
    - Strategic horizons are framed and bounded.
    - Corporate strategy is developed within the authorised frame.
  inclusions:
    - Purpose and ambition conception
    - Strategic intent conception
    - Strategic horizons framing
    - Corporate strategy development
  exclusions:
    - Constitutional mandate and authority (governance-existence x conceive)
    - Strategic option design (Design stage)
    - Strategic plan and roadmap build (Build stage)
    - Initiative execution (enablement-operations)
  adjacent_boundaries:
    - "dea:pc-ge-conceive (Governance & Existence): authority vs chosen trajectory."
    - "dea:pc-sd-design (Design): strategy flows into strategic option design."
    - "dea:pc-sd-build (Build): committed strategy flows into plan and roadmap build."
    - "dea:pc-sd-operate (Operate): strategy is steered in review cycles."
    - "dea:pc-sd-improve (Improve): strategy is adapted and refreshed."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

