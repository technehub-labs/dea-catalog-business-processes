# Process Context Cell Charter: FinanceAndAccounting x Build.
#
# Lands as part of CR-BP-21e (FinanceAndAccounting landing, fifth and
# final unadmitted-domain tranche under ECF v2.4.0 register v2 /
# CR-BP-19). Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.7
# (Finance & Accounting: build of finance function, finance systems, and funding facilities).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-fa-build
domain: FinanceAndAccounting
lifecycle_stage: Build
name: Finance Capability and System Build

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **building** the finance function, finance systems, and funding facilities of the enterprise in the **Finance & Accounting** domain. This context addresses the constructive work of standing up the finance function, deploying ERP finance modules, and securing funding facilities. v2.4.0: scoped to monetary consequence (domain-grounding.md §3.7).

# Scope (PC-005).
scope:
  includes:
    - Finance function stand-up
    - ERP finance module deployment
    - Funding facility establishment
  excludes:
    - Financial planning design (Design stage; adjacent context)
    - Building non-finance capabilities (owning domains; adjacent domains)
    - Technology platform build (enablement-operations x build; adjacent domain)

# Intended outcomes.
outcomes:
    - Finance function is stood up and staffed.
    - ERP finance module is deployed and configured.
    - Funding facilities are secured.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-fa-conceive
    - dea:pc-fa-design
    - dea:pc-fa-operate
    - dea:pc-fa-improve

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-secure-funding-facilities
  - dea:process-implement-financial-systems-and-ledger
  - dea:process-build-budgeting-and-forecasting-systems
  - dea:process-onboard-tax-and-compliance-capability


# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Finance & Accounting: the construction of the enterprise's finance capability and systems."
  lifecycle_concern: "Build: standing up the finance function, deploying finance systems, and securing funding facilities."
  combined_semantic_meaning: |
    The constructive work of standing up the finance function, deploying ERP finance modules, and securing funding facilities.
  expected_outcomes:
    - Finance function is stood up and staffed.
    - ERP finance module is deployed and configured.
    - Funding facilities are secured.
  inclusions:
    - Finance function stand-up
    - ERP finance module deployment
    - Funding facility establishment
  exclusions:
    - Financial planning design (Design stage; adjacent context)
    - Building non-finance capabilities (owning domains; adjacent domains)
    - Technology platform build (enablement-operations x build; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-fa-conceive (adjacent context): monetary flow between Build and the adjacent cell."
    - "dea:pc-fa-design (adjacent context): monetary flow between Build and the adjacent cell."
    - "dea:pc-fa-operate (adjacent context): monetary flow between Build and the adjacent cell."
    - "dea:pc-fa-improve (adjacent context): monetary flow between Build and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

# Provenance.
established_by: CR-BP-21e
established_at: '2026-09-08'

