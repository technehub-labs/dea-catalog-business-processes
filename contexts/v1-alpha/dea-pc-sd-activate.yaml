# Process Context Cell Charter: StrategyAndDirection x Activate.
#
# Lands as part of CR-BP-86 (SD Activate admission tranche), the
# eighth catalog cell at a StrategyAndDirection x Activate coordinate
# to be admitted via the Option B escape-clause sequence (after
# CR-BP-71 at PartyAndRelationship x Activate, CR-BP-73 at
# AgencyAndOrganization x Retire, CR-BP-75 at FinanceAndAccounting x
# Retire, CR-BP-78 at GovernanceAndExistence x Retire, CR-BP-81 at
# AgencyAndOrganization x Activate, CR-BP-82 at EnablementAndOperations
# x Activate, CR-BP-83 at FinanceAndAccounting x Activate).
#
# This PC is the spatial coordinate that hosts the regulated strategic-
# plan activation governed workflow at the StrategyAndDirection x
# Activate intersection. The cell admits a single canonical Process
# Group (dea:group-regulated-strategic-plan-activation) and a single
# canonical Business Process (dea:process-institutionalize-regulated-
# strategic-plan). Additional Process Groups and Business Processes at
# this coordinate require further escape-clause evaluation under the
# CR-BP-62 method.
#
# The register v15 deferral was activated by CR-BP-80 escape-clause
# evidence: supervisor-acknowledged strategic-plan activation (Basel
# BCBS 425 / 425a ICAAP and SAA approval by the PRA / ECB; Bank
# Recovery and Resolution Directive (BRRD, 2014/59/EU) Article 5
# recovery-plan activation under SRB / national-resolution-authority
# supervision; UK NHS England / Department of Health trust 5-year
# strategy approval; US state Public Utility Commissions integrated
# resource plan and strategic-plan filings) is universally performed
# across regulated sectors as a legally-mandated, boundary-clear,
# evidence-authoritative transformation distinct from steady-state
# strategy execution. The cell's verbatim escape rationale (CR-BP-19
# register v2) was "Activate and Retire are lifecycle transition
# stages, not stable Process Group operating scopes"; the 2024-2026
# supervisor-acknowledged strategic-plan landscape establishes that
# strategic-plan activation is a distinct enterprise concern with
# supervisor acknowledgement on record, the filing receipt preserved,
# the operational monitoring framework live, and the plan's
# obligations binding on the regulated entity under the regulator's
# continuing supervision -- distinct from strategy build and from
# steady-state strategy execution.
#
# Scope contract (BP-LIFE-009 / MECE-007 / boundary-face):
# - In scope: regulated-strategic-plan activation activities
#   (supervisor-acknowledged strategic-plan filing; supervisor's
#   review completion; filing receipt preservation; operational
#   monitoring framework launch; communications plan activation; KPIs
#   and monitoring framework live; regulated-records entry preserved)
#   for strategic plans that require formal supervisor-acknowledged
#   activation before the plan takes effect (Basel ICAAP / SAA
#   approval; BRRD recovery-plan activation; NHS trust 5-year strategy
#   approval; PUC integrated resource plan / strategic-plan filing;
#   bank recovery and resolution plan activation).
# - Out of scope: strategic-plan conception, design, and build
#   (StrategyAndDirection x Conceive / Design / Build); steady-state
#   strategy execution and performance review
#   (StrategyAndDirection x Operate / Improve); strategic-plan sunset
#   under regulatory mandate (StrategyAndDirection x Retire; the
#   CR-BP-80 escape record at SD.Retire documented DEFER without
#   admission); non-regulated strategic-plan launch (single-business-
#   unit rollout without supervisor's review) -- remains RECORD-
#   PATTERN or MERGE per the CR-BP-63 baseline.
#
# Provenance:
# - Carrier: CR-BP-86 (this slice)
# - Escape-clause discovery: CR-BP-80
#   (dea:discovery-strategy-and-direction-activate-escape)
# - Baseline discovery: CR-BP-63
#   (dea:discovery-strategy-and-direction-activate)
# - Register cell ratified backlog-deferred at v2; cell flipped
#   ratified-accepted/landed at v16 by this slice.
# - Register cell carry-forward content retained in the
#   l1-register.yaml v16 entry for evidence traceability.

