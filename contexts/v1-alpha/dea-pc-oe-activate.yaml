# Process Context Cell Charter: EnablementAndOperations x Activate.
#
# Lands as part of CR-BP-82 (EO Activate admission tranche), the sixth
# catalog cell at an EnablementAndOperations x Activate coordinate to be
# admitted via the Option B escape-clause sequence (after CR-BP-71 at
# PartyAndRelationship x Activate, CR-BP-73 at AgencyAndOrganization x
# Retire, CR-BP-75 at FinanceAndAccounting x Retire, CR-BP-78 at
# GovernanceAndExistence x Retire, CR-BP-81 at AgencyAndOrganization x
# Activate).
#
# This PC is the spatial coordinate that hosts the regulated-operations
# activation governed workflow at the EnablementAndOperations x Activate
# intersection. The cell admits a single canonical Process Group
# (dea:group-regulated-operations-activation) and a single canonical
# Business Process (dea:process-activate-operations-capability).
# Additional Process Groups and Business Processes at this coordinate
# require further escape-clause evaluation under the CR-BP-62 method.
#
# The register v12 deferral was activated by CR-BP-80 escape-clause
# evidence: regulator-authorized operations-capability activation
# (Air Operator Certificate under EASA Part-OR / FAA Part 119; PSD2 /
# ECB / PRA payment-institution authorization under PSD2 Articles 11
# and 28; EMA / FDA / MHRA GMP certification; MiCA Article 59 crypto-
# asset-service-provider authorization; ORR / ERA rail safety-case
# authorization; nuclear operations authorization) is universally
# performed across regulated sectors as a legally-mandated,
# boundary-clear, evidence-authoritative transformation distinct from
# steady-state operation. The cell's verbatim escape rationale
# (CR-BP-19 register v2) was "operations-capability activation is
# often an attribute of build or steady-state operation"; the
# 2024-2026 regulator-issued authorization landscape establishes that
# activation is a distinct enterprise concern with regulator-issued
# authorization or certification, continuing-supervisor notification,
# operations manuals and runbooks live, and operational controls live
# on the regulated operations record -- distinct from capability build
# and from steady-state operation.
#
# Scope contract (BP-LIFE-009 / MECE-007 / boundary-face):
# - In scope: regulated-operations activation activities (regulator-
#   issued authorization or certification acquisition and recording;
#   operations capability description and readiness-assessment
#   evidence; continuing-supervisor notification activation;
#   operations manuals and runbooks live; operational controls
#   (incident management, capacity, security, compliance) live on
#   the regulated operations record; regulated operations record
#   entry preserved) for operations capabilities that require formal
#   regulator-issued authorization or certification before live
#   service (aviation AOC under EASA / FAA; PSD2 / ECB / PRA
#   payment-institution authorization; EMA / FDA / MHRA GMP; FAA
#   Part 119; MiCA Article 59 crypto-asset-service-provider
#   authorization; ORR / ERA rail safety case; nuclear operations
#   authorization; payments-issuer authorization under PSD2 Article 11).
# - Out of scope: operations capability conception and design
#   (EnablementAndOperations x Conceive / Design); operations
#   capability build and configuration (EnablementAndOperations x
#   Build); steady-state operations performance management
#   (EnablementAndOperations x Operate); operations capability
#   decommission and deregistration (EnablementAndOperations x
#   Retire); non-regulated operations-capability activation
#   (internal-product go-live without regulator's authorization) --
#   remains RECORD-PATTERN or MERGE per the CR-BP-63 baseline.
#
# Provenance:
# - Carrier: CR-BP-82 (this slice)
# - Escape-clause discovery: CR-BP-80
#   (dea:discovery-enablement-and-operations-activate-escape)
# - Baseline discovery: CR-BP-63
#   (dea:discovery-enablement-and-operations-activate)
# - Register cell ratified backlog-deferred at v2; cell flipped
#   ratified-accepted/landed at v13 by this slice.
# - Register cell carry-forward content retained in the
#   l1-register.yaml v13 entry for evidence traceability.

schema: dea/v1
schema_version: 1
id: dea:pc-oe-activate
domain: EnablementAndOperations
lifecycle_stage: Activate
name: Activate Operations Capability
process_context:
  id: dea:pc-oe-activate
  domain: EnablementAndOperations
  lifecycle_stage: Activate
  scope_summary: >-
    Governed activation of an operations capability whose live service
    is gated by formal regulator-issued authorization or certification,
    distinct from capability build and from steady-state operation.
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: "Enablement & Operations: the controlled activation of an operations capability whose live service is gated by regulator-issued authorization or certification (AOC; PSD2 / MiCA payment-institution authorization; GMP; FAA Part 119; ORR / ERA rail safety case; nuclear operations authorization), with the regulator's continuing-oversight relationship active and operational controls live on the regulated operations record -- distinct from capability build and from steady-state operation."
  lifecycle_concern: "Activate: the live-readiness activation of an operations capability, moving it from regulator-authorized-but-not-live to regulator-authorized-and-live under the regulator's continuing oversight."
  combined_semantic_meaning: |
    The regulated-operations activation work that moves an operations
    capability from regulator-authorized-but-not-live to regulator-
    authorized-and-live under the enterprise's regulated-entity
    approval authority, with the regulator's authorization on record,
    operations manuals and runbooks live, operational controls
    (incident management, capacity, security, compliance) live, and
    the supervisor's continuing-oversight relationship active, so
    that the operations capability is formally live on the regulated
    operations record under the regulator's continuing supervision.
  expected_outcomes:
    - "Regulator's authorization on record for the operations capability (AOC; PSD2 payment-institution authorization; GMP; FAA Part 119; MiCA Article 59; ORR / ERA rail safety case; nuclear operations authorization; payments-issuer authorization under PSD2 Article 11)"
    - "Operations manuals and runbooks live under the regulator's continuing oversight"
    - "Operational controls (incident management, capacity, security, compliance) live on the regulated operations record"
    - "Continuing-supervisor notification issued and supervisor's continuing-oversight relationship active"
    - "Readiness-assessment evidence (supervised-test records, operational-control framework, service-level commitments) recorded"
    - "Regulated operations record entry preserved for the activated operations capability"
  inclusions:
    - "Regulator-issued authorization or certification acquisition and recording (EASA / FAA AOC; PSD2 / ECB / PRA payment-institution authorization; EMA / FDA / MHRA GMP; FAA Part 119; MiCA Article 59; ORR / ERA rail safety case; nuclear operations authorization; payments-issuer authorization under PSD2 Article 11)"
    - "Operations capability description and readiness-assessment evidence (supervised-test records, operational-control framework, service-level commitments)"
    - "Continuing-supervisor notification activation under the regulator's continuing oversight"
    - "Operations manuals and runbooks live"
    - "Operational controls (incident management, capacity, security, compliance) live on the regulated operations record"
    - "Regulated operations record entry preserved for the activated operations capability"
  exclusions:
    - "Operations capability conception and design (EnablementAndOperations x Conceive / Design)"
    - "Operations capability build and configuration (EnablementAndOperations x Build)"
    - "Steady-state operations performance management (EnablementAndOperations x Operate)"
    - "Operations capability decommission and deregistration (EnablementAndOperations x Retire)"
    - "Non-regulated operations-capability activation (internal-product go-live without regulator's authorization) -- RECORD-PATTERN or MERGE per CR-BP-63 baseline"
    - "Capabilities sourcing or licensing absent a regulator-issued authorization regime"
  adjacent_boundaries:
    - "dea:pc-oe-build (adjacent context): the Build cell handles operations-capability construction and configuration; the Activate cell governs the regulator-issued authorization step that moves the capability from authorized-but-not-live to authorized-and-live."
    - "dea:pc-oe-operate (adjacent context): the Operate cell handles steady-state operations performance management; the Activate cell only governs the regulator-issued activation step."
    - "dea:pc-oe-retire (adjacent context): the Retire cell handles operations-capability decommission and deregistration; the Activate cell handles the regulated live-readiness activation."
    - "dea:pc-ao-activate (sibling cell, CR-BP-81): the A&O Activate cell governs regulator-controlled individual-workforce mobilization; the EO Activate cell governs regulator-authorized operations-capability activation -- separate concerns (individual vs capability)."
    - "dea:pc-pv-activate (sibling cell, CR-BP-71-era): the PV Activate cell governs product/service transition-to-service; the EO Activate cell governs operations-capability activation under regulator-issued authorization."
process_groups:
- id: dea:group-regulated-operations-activation
  kind: functional
  scope: >-
    Governs the controlled activation of an operations capability
    whose live service is gated by regulator-issued authorization or
    certification: regulator authorization or certification acquisition
    and recording; operations capability description and readiness-
    assessment evidence; continuing-supervisor notification; operations
    manuals and runbooks live; operational controls (incident
    management, capacity, security, compliance) live on the regulated
    operations record; regulated operations record entry preserved.
  processes:
  - dea:process-activate-operations-capability
admission:
  recommended_by: dea:discovery-enablement-and-operations-activate-escape
  recommended_at: '2026-09-16'
  recommended_score: 10
  carrier_cr: CR-BP-82
  bp_id: dea:process-activate-operations-capability