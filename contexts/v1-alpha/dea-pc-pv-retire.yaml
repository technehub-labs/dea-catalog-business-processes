# Process Context Cell Charter: ProductAndValue x Retire.
#
# Lands as part of CR-BP-64 (P&V Activate/Retire admission tranche),
# the first governed admission from a CR-BP-63 lifecycle discovery
# exercise. The register cell was backlog-deferred under CR-BP-19;
# CR-BP-63's discovery record
# (discovery/v1-alpha/product-and-value-retire.yaml) established an
# evidence-backed canonical candidate (Transition Out of Service,
# 10/10), and CR-BP-64 reverses the cell disposition to
# ratified-accepted.
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-pv-retire
domain: ProductAndValue
lifecycle_stage: Retire
name: Proposition Retirement and Service Withdrawal

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **transitioning** propositions,
  products and services out of operational service in the
  **Product & Value** domain. This context addresses the
  retirement-stage work of withdrawal planning, stakeholder
  transition, and removal from operational reliance. v2.4.0 grounding
  (domain-grounding.md §3.5): proposition retirement and service
  withdrawal are the proposition-side retirement responsibilities;
  physical asset retirement is Enablement & Operations.

# Scope (PC-005).
scope:
  includes:
    - Retirement decision intake and withdrawal planning
    - Service withdrawal and stakeholder transition
    - Removal from operational reliance
    - Residual obligation identification and routing
  excludes:
    - Steady-state proposition operation (Operate stage; adjacent context)
    - Proposition improvement (Improve stage; adjacent context)
    - Physical asset decommissioning (enablement-operations x retire; adjacent domain)
    - Post-exit obligation closure work (Operate/Improve; adjacent contexts)

# Intended outcomes.
outcomes:
    - Retired propositions are withdrawn from service in a controlled manner.
    - Stakeholders are transitioned off the retired proposition.
    - Operational reliance is removed with residual obligations routed.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-pv-conceive
    - dea:pc-pv-design
    - dea:pc-pv-build
    - dea:pc-pv-operate
    - dea:pc-pv-improve
    - dea:pc-pv-activate

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-transition-out-of-service

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Product & Value: the controlled withdrawal of propositions from operational service."
  lifecycle_concern: "Retire: withdrawal planning, stakeholder transition, and removal from operational reliance."
  combined_semantic_meaning: |
    The retirement-stage work of withdrawal planning, stakeholder
    transition, and removal of propositions from operational reliance.
  expected_outcomes:
    - Retired propositions are withdrawn from service in a controlled manner.
    - Stakeholders are transitioned off the retired proposition.
    - Operational reliance is removed with residual obligations routed.
  inclusions:
    - Retirement decision intake and withdrawal planning
    - Service withdrawal and stakeholder transition
    - Removal from operational reliance
    - Residual obligation identification and routing
  exclusions:
    - Steady-state proposition operation (Operate stage; adjacent context)
    - Proposition improvement (Improve stage; adjacent context)
    - Physical asset decommissioning (enablement-operations x retire; adjacent domain)
    - Post-exit obligation closure work (Operate/Improve; adjacent contexts)
  adjacent_boundaries:
    - "dea:pc-pv-operate (adjacent context): the retirement decision ends steady-state operation."
    - "dea:pc-pv-improve (adjacent context): post-exit obligation closure continues there."
    - "dea:pc-pv-activate (adjacent context): the entry-side transition counterpart of this cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

# Provenance.
established_by: CR-BP-64
established_at: '2026-09-14'

