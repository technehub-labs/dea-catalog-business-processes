# Process Context Cell Charter: AgencyAndOrganization x Retire.
#
# Lands as part of CR-BP-73 (A&O Retire admission tranche), the second
# catalog cell at an AgencyAndOrganization x Retire coordinate, the
# first to be admitted via the Option B escape-clause sequence.
#
# This PC is the spatial coordinate that hosts the regulated workforce
# wind-down governed workflow at the AgencyAndOrganization x Retire
# intersection. The cell admits a single canonical Process Group
# (dea:group-regulated-workforce-wind-down) and a single canonical
# Business Process (dea:process-conduct-regulated-workforce-wind-down).
# Additional Process Groups and Business Processes at this coordinate
# require further escape-clause evaluation under CR-BP-62 method.
#
# The register v2 deferral was activated by CR-BP-72 escape-clause
# evidence: regulated workforce wind-down under WARN (29 U.S.C. 2101
# et seq.; 20 CFR Part 639), EU Directive 98/59/EC, ILO Conventions
# 158 and 135, OECD Employment Outlook is a legally mandated,
# boundary-clear, evidence-authoritative transformation distinct
# from steady-state agent operations and from asset decommissioning
# (EnablementAndOperations x Retire; CR-BP-66).
#
# Scope contract (BP-LIFE-009 / MECE-007 / boundary-face):
# - In scope: regulated workforce wind-down activities (mass-layoff
#   notice, worker-representative consultation, selection, severance,
#   benefits continuation, transition supports) for affected agent
#   populations.
# - Out of scope: steady-state offboarding of individual agents
#   (AgencyAndOrganization x Operate); asset retirement, decommissioning,
#   and shutdown (EnablementAndOperations x Retire / CR-BP-66);
#   individual agent transitions and unit wind-down absent statutory
#   thresholds (Agent Transition and Wind-down / Decommission
#   Organizational Unit work, which remains execution-level inside
#   agent operations); knowledge archival as a standalone process
#   (subsumed by transition supports within this cell, or under
#   knowledge management activities in the Operate coordinate).
# - Boundary explicit: this PC cell governs the regulated wind-down
#   workflow whose trigger is a statutory mass-layoff authorization;
#   the boundary is the verifiable mass-layoff threshold and
#   consultation obligation under the controlling statute or
#   regulation, not an enterprise-internal decision.
#
# Cross-coordinate doctrine (register v2 / v10):
# - Agent transition and unit wind-down absent statutory thresholds
#   remains execution-level inside the AgencyAndOrganization x
#   Operate coordinate (CR-BP-64 discovery rejected the standalone
#   Agent Transition and Wind-down candidate for this reason).
# - Knowledge archival absent regulated wind-down triggers remains
#   execution-level inside the AgencyAndOrganization x Operate
#   coordinate or under knowledge management.
# - Asset retirement and decommissioning remains exclusively at
#   EnablementAndOperations x Retire (CR-BP-66).
#
# Provenance:
# - Carrier: CR-BP-73 (this slice)
# - Escape-clause discovery: CR-BP-72
#   (dea:discovery-agency-and-organization-retire-escape)
# - Baseline discovery: CR-BP-63
#   (dea:discovery-agency-and-organization-retire)
# - Register cell ratified backlog-deferred at v2; cell flipped
#   ratified-accepted/landed at v10 by this slice.
# - Register cell carry-forward content retained in the
#   l1-register.yaml v10 entry for evidence traceability.

schema: dea/v1
schema_version: 1
id: dea:pc-ao-retire
domain: AgencyAndOrganization
lifecycle_stage: Retire
name: Workforce Retirement
process_context:
  id: dea:pc-ao-retire
  domain: AgencyAndOrganization
  lifecycle_stage: Retire
  scope_summary: >-
    Governed retirement of workforce populations under regulated
    wind-down obligations, distinct from steady-state agent
    operations and from asset decommissioning.
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: "Agency & Organization: the regulated retirement of workforce populations under statutory mass-layoff, consultation, notice, severance, and transition-support obligations."
  lifecycle_concern: "Retire: regulated wind-down of an agent population triggered by a statutory mass-layoff threshold or regulated wind-down authorization."
  combined_semantic_meaning: |
    The regulated-workforce-retirement work that moves an enterprise
    workforce from active employment to documented, statutory-compliant
    wind-down under WARN, EU Directive 98/59/EC, ILO C158/C135, or
    jurisdictional mass-layoff statutes, with notice served,
    worker-representative consultation satisfied, severance and
    benefits continuation recorded, and transition supports routed.
  expected_outcomes:
    - "Statutory advance notice served to affected employees and statutory recipients (state dislocated-worker unit, local chief elected official) on the controlling notice period"
    - "Information and consultation with workers' representatives documented per the controlling statute or regulation"
    - "Fair-selection criteria applied and recorded for the affected population"
    - "Severance, benefits continuation, and statutory liability recorded and funded"
    - "Transition supports (state dislocated-worker referral, training, health-care continuation, outplacement) routed to the affected population"
  inclusions:
    - "Statutory advance notice to affected employees (WARN 60-day rule; jurisdictional equivalents)"
    - "Information and consultation with workers' representatives (EU Directive 98/59/EC; jurisdictional works-council obligations)"
    - "Fair-selection criteria (anti-discrimination, statutory exclusions)"
    - "Severance, benefits continuation, and recorded statutory liability"
    - "Transition supports: state dislocated-worker referral, training, health-care continuation, outplacement"
  exclusions:
    - "Steady-state offboarding of individual agents (AgencyAndOrganization x Operate)"
    - "Non-regulated cohort decommission (Operate coordinate or Activity under agent operations)"
    - "Asset retirement, decommissioning, and shutdown (EnablementAndOperations x Retire; CR-BP-66)"
    - "Relationship close-out and regulated offboarding (PartyAndRelationship x Retire; CR-BP-67)"
    - "Knowledge archival absent regulated wind-down triggers (Operate coordinate or Activity under knowledge management)"
  adjacent_boundaries:
    - "dea:pc-ao-operate (adjacent context): the Operate cell continues ongoing agent management, steady-state offboarding, and non-regulated cohort decommission; the Retire cell only governs regulated mass-layoff or regulated wind-down workflows."
    - "dea:pc-eo-retire (sibling cell, CR-BP-66): the Retire cell at EnablementAndOperations handles asset retirement, decommissioning, and shutdown of physical / IT / data assets; the A&O Retire cell handles workforce retirement under regulated mass-layoff or wind-down obligations."
    - "dea:pc-pr-retire (sibling cell, CR-BP-67): the Retire cell at PartyAndRelationship handles party-relationship close-out and regulated offboarding (e.g. GDPR-driven erasure); the A&O Retire cell handles workforce retirement at the agent-population level."
