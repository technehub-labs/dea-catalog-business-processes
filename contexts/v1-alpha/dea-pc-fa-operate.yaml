# Process Context Cell Charter: FinanceAndAccounting x Operate.
#
# Lands as part of CR-BP-21e (FinanceAndAccounting landing, fifth and
# final unadmitted-domain tranche under ECF v2.4.0 register v2 /
# CR-BP-19). Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.7
# (Finance & Accounting: operation of accounting, reporting, treasury, tax, and financial close).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-fa-operate
domain: FinanceAndAccounting
lifecycle_stage: Operate
name: Accounting, Reporting, and Treasury Operation

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **operating** the general ledger, accounts payable and receivable, treasury, tax compliance, financial close, financial planning and analysis, and financial reporting and disclosure of the enterprise in the **Finance & Accounting** domain. This context addresses the steady-state work of monetary recording and reporting. v2.4.0: procure-to-pay and order-to-cash operational execution moved to enablement-operations x operate; the monetary recording of those cycles remains here (domain-grounding.md §3.7).

# Scope (PC-005).
scope:
  includes:
    - General ledger operation
    - Accounts payable and receivable operation
    - Treasury operation
    - Tax compliance operation
    - Financial close operation
    - Financial planning and analysis operation
    - Financial reporting and disclosure operation
  excludes:
    - Finance capability build (Build stage; adjacent context)
    - Procurement transaction execution (enablement-operations x operate; adjacent domain)
    - Agent compensation operation (agency-organization x operate; adjacent domain)

# Intended outcomes.
outcomes:
    - General ledger is operated to period close.
    - Accounts payable and receivable are operated.
    - Treasury is operated within policy.
    - Tax compliance is operated.
    - Financial close is operated on schedule.
    - Financial reporting and disclosure are produced.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-fa-conceive
    - dea:pc-fa-design
    - dea:pc-fa-build
    - dea:pc-fa-improve

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-operate-general-ledger
  - dea:process-run-accounts-payable
  - dea:process-run-accounts-receivable
  - dea:process-execute-payroll
  - dea:process-manage-cash-and-liquidity
  - dea:process-perform-financial-close
  - dea:process-manage-tax-compliance-and-filings
  - dea:process-operate-financial-reporting-and-disclosure


# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Finance & Accounting: the steady-state monetary recording and reporting of the enterprise."
  lifecycle_concern: "Operate: operating the general ledger, payables, receivables, treasury, tax compliance, financial close, and reporting."
  combined_semantic_meaning: |
    The steady-state work of operating the general ledger, accounts payable and receivable, treasury, tax compliance, financial close, financial planning and analysis, and financial reporting and disclosure.
  expected_outcomes:
    - General ledger is operated to period close.
    - Accounts payable and receivable are operated.
    - Treasury is operated within policy.
    - Tax compliance is operated.
    - Financial close is operated on schedule.
    - Financial reporting and disclosure are produced.
  inclusions:
    - General ledger operation
    - Accounts payable and receivable operation
    - Treasury operation
    - Tax compliance operation
    - Financial close operation
    - Financial planning and analysis operation
    - Financial reporting and disclosure operation
  exclusions:
    - Finance capability build (Build stage; adjacent context)
    - Procurement transaction execution (enablement-operations x operate; adjacent domain)
    - Agent compensation operation (agency-organization x operate; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-fa-conceive (adjacent context): monetary flow between Operate and the adjacent cell."
    - "dea:pc-fa-design (adjacent context): monetary flow between Operate and the adjacent cell."
    - "dea:pc-fa-build (adjacent context): monetary flow between Operate and the adjacent cell."
    - "dea:pc-fa-improve (adjacent context): monetary flow between Operate and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

