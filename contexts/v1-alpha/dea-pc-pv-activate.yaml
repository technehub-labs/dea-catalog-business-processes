# Process Context Cell Charter: ProductAndValue x Activate.
#
# Lands as part of CR-BP-64 (P&V Activate/Retire admission tranche),
# the first governed admission from a CR-BP-63 lifecycle discovery
# exercise. The register cell was backlog-deferred under CR-BP-19
# (uniform Activate/Retire rationale); CR-BP-63's discovery record
# (discovery/v1-alpha/product-and-value-activate.yaml) established an
# evidence-backed canonical candidate (Transition to Service, 10/10),
# and CR-BP-64 reverses the cell disposition to ratified-accepted.
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-pv-activate
domain: ProductAndValue
lifecycle_stage: Activate
name: Proposition Launch and Service Transition

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **transitioning** validated
  propositions, products and services into operational service in the
  **Product & Value** domain. This context addresses the
  transition-stage work of validating readiness, moving the object
  from a prepared state into operational service, and obtaining
  operational acceptance. v2.4.0 grounding (domain-grounding.md
  §3.5): launch activation and service transition are the
  proposition-side activation responsibilities; operational delivery
  itself is Enablement & Operations.

# Scope (PC-005).
scope:
  includes:
    - Transition readiness validation
    - Service transition into operation
    - Operational acceptance
    - Launch activation of propositions
  excludes:
    - Proposition development (Build stage; adjacent context)
    - Steady-state proposition operation (Operate stage; adjacent context)
    - Proposition retirement (Retire stage; adjacent context)
    - Operational delivery of the product (enablement-operations; adjacent domain)

# Intended outcomes.
outcomes:
    - Validated propositions are transitioned into operational service.
    - Operational acceptance is recorded with readiness evidence.
    - Launch activation completes with ownership and controls in place.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-pv-conceive
    - dea:pc-pv-design
    - dea:pc-pv-build
    - dea:pc-pv-operate
    - dea:pc-pv-improve
    - dea:pc-pv-retire

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-transition-to-service

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Product & Value: the transition of validated propositions into operational service."
  lifecycle_concern: "Activate: readiness validation, service transition, and operational acceptance."
  combined_semantic_meaning: |
    The transition-stage work of validating readiness, moving
    propositions from a prepared state into operational service, and
    obtaining operational acceptance.
  expected_outcomes:
    - Validated propositions are transitioned into operational service.
    - Operational acceptance is recorded with readiness evidence.
    - Launch activation completes with ownership and controls in place.
  inclusions:
    - Transition readiness validation
    - Service transition into operation
    - Operational acceptance
    - Launch activation of propositions
  exclusions:
    - Proposition development (Build stage; adjacent context)
    - Steady-state proposition operation (Operate stage; adjacent context)
    - Proposition retirement (Retire stage; adjacent context)
    - Operational delivery of the product (enablement-operations; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-pv-build (adjacent context): build-complete propositions hand over at readiness validation."
    - "dea:pc-pv-operate (adjacent context): accepted propositions hand over at operational acceptance."
    - "dea:pc-pv-retire (adjacent context): the exit-side transition counterpart of this cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

# Provenance.
established_by: CR-BP-64
established_at: '2026-09-14'

