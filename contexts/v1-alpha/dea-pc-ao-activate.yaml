# Process Context Cell Charter: AgencyAndOrganization x Activate.
#
# Lands as part of CR-BP-81 (AO Activate admission tranche), the fifth
# catalog cell at an AgencyAndOrganization x Activate coordinate to be
# admitted via the Option B escape-clause sequence (after CR-BP-71 at
# PartyAndRelationship x Activate, CR-BP-73 at AgencyAndOrganization x
# Retire, CR-BP-75 at FinanceAndAccounting x Retire, CR-BP-78 at
# GovernanceAndExistence x Retire).
#
# This PC is the spatial coordinate that hosts the licensed-workforce
# mobilization governed workflow at the AgencyAndOrganization x
# Activate intersection. The cell admits a single canonical Process
# Group (dea:group-licensed-workforce-mobilization) and a single
# canonical Business Process (dea:process-mobilize-licensed-workforce).
# Additional Process Groups and Business Processes at this coordinate
# require further escape-clause evaluation under the CR-BP-62 method.
#
# The register v12 deferral was activated by CR-BP-80 escape-clause
# evidence: licensed-workforce mobilization is universally performed
# across regulated sectors under FCA SMCR (UK), US state healthcare
# licensure, NAIC Producer Licensing Model Act, EASA/FAA crew licensing,
# and UK SRA / US state bar admissions. The cell's verbatim escape
# rationale (CR-BP-19 register v2) was "workforce activation is often
# an attribute of build (hire-and-onboard)"; the 2024-2026 supervised-
# individual-licensing landscape establishes that licence-controlled
# mobilization is a distinct enterprise concern with regulator-controlled
# scope, fitness-and-propriety attestation, supervised-training
# completion, and continuing-supervisor notification -- distinct from
# general workforce build and from performance management.
#
# Scope contract (BP-LIFE-009 / MECE-007 / boundary-face):
# - In scope: licensed-workforce mobilization activities
#   (licence verification, fitness-and-propriety attestation,
#   supervised-training completion, competency assessment,
#   regulated-entity approval authority, signing-authority or
#   controlled-function designation, continuing-supervisor
#   notification) for individuals who must hold regulator-issued
#   licences or registrations before performing live work (banking
#   controlled functions, healthcare practitioners, licensed
#   professional services, telecommunications licensed engineers,
#   aviation crew, insurance producers).
# - Out of scope: workforce recruitment and general onboarding
#   (Build coordinate); steady-state workforce performance and
#   development (Operate/Improve coordinate); workforce offboarding
#   and licence surrender (Retire coordinate, A&O x Retire cells);
#   non-licensed workforce activation (deferred).
# - Boundary explicit: this PC cell governs the licensed-workforce
#   mobilization whose trigger is the enterprise's regulated-entity
#   approval for the licensed role; the boundary is the regulator-
#   controlled scope of the role (signing authority or controlled-
#   function designation), not an enterprise-internal personnel
#   decision.
#
# Cross-coordinate doctrine (register v2 / v12):
# - Recruitment and general onboarding remain at AgencyAndOrganization x
#   Build (CR-BP-15-era records).
# - Workforce performance and development remain at
#   AgencyAndOrganization x Operate.
# - Workforce offboarding and licence surrender remain at
#   AgencyAndOrganization x Retire (CR-BP-73 admitted the regulated
#   workforce wind-down adjacent cell).
# - Capabilities sourcing/licensing absent a regulator-controlled scope
#   remain at AgencyAndOrganization x Build.
#
# Provenance:
# - Carrier: CR-BP-81 (this slice)
# - Escape-clause discovery: CR-BP-80
#   (dea:discovery-agency-and-organization-activate-escape)
# - Baseline discovery: CR-BP-63
#   (dea:discovery-agency-and-organization-activate)
# - Register cell ratified backlog-deferred at v2; cell flipped
#   ratified-accepted/landed at v13 by this slice.
# - Register cell carry-forward content retained in the
#   l1-register.yaml v13 entry for evidence traceability.

schema: dea/v1
schema_version: 1
id: dea:pc-ao-activate
domain: AgencyAndOrganization
lifecycle_stage: Activate
name: Licensed Workforce Mobilization
process_context:
  id: dea:pc-ao-activate
  domain: AgencyAndOrganization
  lifecycle_stage: Activate
  scope_summary: >-
    Governed mobilization of a workforce whose individuals must hold
    regulator-issued licences or registrations before performing live
    work, distinct from general workforce build and from steady-state
    performance management.
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: "Agency & Organization: the controlled mobilization of a licensed or regulated workforce, with regulator-controlled scope, fitness-and-propriety attestation, supervised-training completion, and continuing-supervisor notification -- distinct from general workforce build."
  lifecycle_concern: "Activate: the live-readiness activation of a workforce role whose holders must hold a regulator-issued licence or registration before they may perform live work."
  combined_semantic_meaning: |
    The licensed-workforce mobilization work that moves individuals
    from credentialed-but-not-live to credential-and-inlive under the
    enterprise's regulated-entity approval authority, with the
    supervisor-controlled scope preserved (signing authority or
    controlled-function designation), fitness-and-propriety
    attestation recorded, supervised-training completion preserved,
    and continuing-supervisor notification activated, so that the
    licensed individual is live on the regulated personnel record
    under the regulator's continuing supervision.
  expected_outcomes:
    - "Regulator-controlled scope preserved on the regulated personnel record (signing authority under SMCR CF1..CF11; state healthcare licensure; NAIC producer appointment; FAA/EASA crew licence type-rating; SRA practising certificate; state bar admission)"
    - "Fitness-and-propriety attestation recorded for the licensed individual under the regulator's continuing supervision"
    - "Supervised-training completion preserved on the regulated personnel record"
    - "Competency assessment completed and recorded for the licensed role"
    - "Enterprise's regulated-entity approval authority activated for the licensed role"
    - "Continuing-supervisor notification issued; supervisor's continuing-oversight relationship active"
    - "Licensed workforce role formally live under the regulator's continuing supervision, ready to perform live work"
  inclusions:
    - "Regulator-issued licence or registration verification (FCA SMCR Statements of Responsibilities; state healthcare licensure; NAIC producer licence; FAA/EASA crew licence; SRA practising certificate; state bar admission)"
    - "Fitness-and-propriety attestation (SMCR; state licensure; producer appointment; FAA/EASA; SRA; bar)"
    - "Supervised-training completion record (SMCR; state healthcare; NAIC; FAA/EASA; SRA; bar)"
    - "Competency assessment record for the licensed role"
    - "Enterprise's regulated-entity approval authority framework (the entity-level framework that authorizes the licensed role)"
    - "Signing authority or controlled-function designation (SMCR CF1..CF11; NAIC producer line of authority; FAA/EASA type-rating; SRA role; bar area of practice)"
    - "Continuing-supervisor notification and continuing-oversight relationship activation"
  exclusions:
    - "Workforce recruitment, hiring, and general onboarding (AgencyAndOrganization x Build)"
    - "Steady-state workforce performance and development (AgencyAndOrganization x Operate / Improve)"
    - "Workforce offboarding and licence surrender (AgencyAndOrganization x Retire; CR-BP-73 adjacent cells)"
    - "Non-licensed workforce activation (deferred to a future CR; the cell is reserved for licensed roles only)"
    - "Internal non-regulated personnel activation (where the role has no regulator-issued licence prerequisite)"
    - "Capabilities sourcing/licensing absent a regulator-controlled scope (AgencyAndOrganization x Build)"
  adjacent_boundaries:
    - "dea:pc-ao-build (adjacent context): the Build cell handles recruitment, hiring, and general onboarding; the Activate cell governs the controlled mobilization step where the licensed individual moves from credentialed-but-not-live to credential-and-inlive under the enterprise's regulated-entity approval authority."
    - "dea:pc-ao-operate (adjacent context): the Operate cell handles steady-state workforce performance and development; the Activate cell only governs the live-readiness activation."
    - "dea:pc-ao-retire (adjacent context, CR-BP-73): the Retire cell at A&O handles offboarding and licence surrender; the Activate cell handles the regulated live-readiness activation."
    - "dea:pc-eo-activate (sibling cell): the EO Activate cell governs regulator-authorized operations-capability activation (AOC, PSD2, GMP, MiCA); the A&O Activate cell governs regulator-controlled individual-workforce mobilization -- separate concerns (capability vs individual)."
    - "dea:pc-pv-activate (sibling cell, CR-BP-71-era): the PV Activate cell governs product/service transition-to-service; the A&O Activate cell governs individual-workforce mobilization."
