# Process Context Cell Charter: FinanceAndAccounting x Activate.
#
# Lands as part of CR-BP-83 (FA Activate admission tranche), the
# seventh catalog cell at a FinanceAndAccounting x Activate coordinate
# to be admitted via the Option B escape-clause sequence (after
# CR-BP-71 at PartyAndRelationship x Activate, CR-BP-73 at
# AgencyAndOrganization x Retire, CR-BP-75 at FinanceAndAccounting x
# Retire, CR-BP-78 at GovernanceAndExistence x Retire, CR-BP-81 at
# AgencyAndOrganization x Activate, CR-BP-82 at EnablementAndOperations
# x Activate).
#
# This PC is the spatial coordinate that hosts the regulated-billing
# activation governed workflow at the FinanceAndAccounting x Activate
# intersection. The cell admits a single canonical Process Group
# (dea:group-regulated-billing-activation) and a single canonical
# Business Process (dea:process-activate-billing-capability).
# Additional Process Groups and Business Processes at this coordinate
# require further escape-clause evaluation under the CR-BP-62 method.
#
# The register v14 deferral was activated by CR-BP-80 escape-clause
# evidence: regulator-acknowledged billing-capability activation
# (insurance statutory-accounting framework activation under state
# insurance department supervision; IFRS 17 transition to active for
# insurers; bank treasury capability activation under capital-rules
# supervision; utility rate-effective billing activation under state
# PUC approval; payments-issuer settlement-account activation under
# PSD2 / Federal Reserve / ECB) is universally performed across
# regulated sectors as a legally-mandated, boundary-clear,
# evidence-authoritative transformation distinct from steady-state
# billing. The cell's verbatim escape rationale (CR-BP-19 register v2)
# was "Activate and Retire are lifecycle transition stages, not stable
# Process Group operating scopes"; the 2024-2026 regulator-acknowledged
# accounting and rate-effective framework landscape establishes that
# activation is a distinct enterprise concern with regulator-
# acknowledged accounting or rate framework, tariff or pricing
# approval, operational controls (segregation of duties, audit trail,
# reconciliation) live, and continuing-supervisor notification
# activated -- distinct from capability build and from steady-state
# billing.
#
# Scope contract (BP-LIFE-009 / MECE-007 / boundary-face):
# - In scope: regulated-billing activation activities (regulator-
#   acknowledged accounting or rate framework activation; tariff or
#   pricing approval acquisition and recording; readiness-assessment
#   evidence; supervised-test records; operational-control framework
#   with segregation of duties, audit trail, and reconciliation;
#   continuing-supervisor notification activation; first-invoice or
#   first-recognition runbook; regulated billing record entry
#   preserved) for billing or revenue-recognition capabilities that
#   require formal regulator-acknowledged activation before live
#   invoicing or revenue recognition (insurance statutory-accounting
#   framework activation; IFRS 17 transition to active; bank treasury
#   capability activation under capital-rules supervision; utility
#   rate-effective billing activation under PUC approval; payments-
#   issuer settlement-account activation under PSD2 / Federal Reserve
#   / ECB).
# - Out of scope: billing-capability conception and design
#   (FinanceAndAccounting x Conceive / Design); billing-capability
#   build and configuration (FinanceAndAccounting x Build);
#   steady-state billing operations performance management
#   (FinanceAndAccounting x Operate); billing-capability
#   decommission and deregistration (FinanceAndAccounting x Retire;
#   CR-BP-75 admitted the regulated run-off adjacent cell);
#   non-regulated billing-capability activation (internal-finance
#   cutover without regulator's acknowledgement) -- remains RECORD-
#   PATTERN or MERGE per the CR-BP-63 baseline.
#
# Provenance:
# - Carrier: CR-BP-83 (this slice)
# - Escape-clause discovery: CR-BP-80
#   (dea:discovery-finance-and-accounting-activate-escape)
# - Baseline discovery: CR-BP-63
#   (dea:discovery-finance-and-accounting-activate)
# - Register cell ratified backlog-deferred at v2; cell flipped
#   ratified-accepted/landed at v15 by this slice.
# - Register cell carry-forward content retained in the
#   l1-register.yaml v15 entry for evidence traceability.

schema: dea/v1
schema_version: 1
id: dea:pc-fa-activate
domain: FinanceAndAccounting
lifecycle_stage: Activate
name: Activate Billing Capability
process_context:
  id: dea:pc-fa-activate
  domain: FinanceAndAccounting
  lifecycle_stage: Activate
  scope_summary: >-
    Governed activation of a billing or revenue-recognition capability
    whose live invoicing or revenue recognition is gated by formal
    regulator-acknowledged accounting or rate framework activation,
    distinct from capability build and from steady-state billing.
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: "Finance & Accounting: the controlled activation of a billing or revenue-recognition capability whose live invoicing or revenue recognition is gated by regulator-acknowledged accounting or rate framework (insurance statutory accounting; IFRS 17; bank treasury under capital rules; PUC rate-effective billing; PSD2 settlement-account), with the tariff or pricing approval preserved, operational controls (segregation of duties, audit trail, reconciliation) live, and continuing-supervisor notification activated -- distinct from capability build and from steady-state billing."
  lifecycle_concern: "Activate: the live-readiness activation of a billing or revenue-recognition capability, moving it from regulator-acknowledged-but-not-live to regulator-acknowledged-and-live under the regulator's continuing oversight."
  combined_semantic_meaning: |
    The regulated-billing activation work that moves a billing or
    revenue-recognition capability from regulator-acknowledged-but-
    not-live to regulator-acknowledged-and-live under the
    enterprise's regulated-entity approval authority, with the
    regulator's acknowledgement on record, the tariff or pricing
    approval preserved, operational controls (segregation of
    duties, audit trail, reconciliation) live, and the supervisor's
    continuing-oversight relationship active, so that the billing
    capability is formally live on the regulated billing record
    under the regulator's continuing supervision.
  expected_outcomes:
    - "Regulator's acknowledgement on record for the billing or revenue-recognition capability (insurance statutory accounting; IFRS 17; bank treasury under capital rules; PUC rate-effective billing; PSD2 settlement-account)"
    - "Tariff or pricing approval preserved on the regulated billing record"
    - "Operational controls (segregation of duties, audit trail, reconciliation) live on the regulated billing record"
    - "Continuing-supervisor notification issued and supervisor's continuing-oversight relationship active"
    - "Readiness-assessment evidence (supervised-test records, operational-control framework, first-invoice or first-recognition runbook) recorded"
    - "Regulated billing record entry preserved for the activated billing capability"
  inclusions:
    - "Regulator-acknowledged accounting or rate framework activation (state insurance department supervision; IFRS 17 transition; ECB / PRA capital-rules supervision; PUC rate-effective framework; PSD2 / Federal Reserve / ECB settlement-account framework)"
    - "Tariff or pricing approval acquisition and recording (insurance statutory accounting rate filings; PUC rate-case approval; PSD2 interchange-fee framework; bank treasury capital-rule pricing; settlement-account fee schedule)"
    - "Billing-capability description and readiness-assessment evidence (supervised-test records, operational-control framework, first-invoice or first-recognition runbook)"
    - "Continuing-supervisor notification activation under the regulator's continuing oversight"
    - "Operational controls (segregation of duties, audit trail, reconciliation) live on the regulated billing record"
    - "Regulated billing record entry preserved for the activated billing capability"
  exclusions:
    - "Billing-capability conception and design (FinanceAndAccounting x Conceive / Design)"
    - "Billing-capability build and configuration (FinanceAndAccounting x Build)"
    - "Steady-state billing operations performance management (FinanceAndAccounting x Operate)"
    - "Billing-capability decommission and deregistration (FinanceAndAccounting x Retire; CR-BP-75 admitted the regulated run-off adjacent cell)"
    - "Non-regulated billing-capability activation (internal-finance cutover without regulator's acknowledgement) -- RECORD-PATTERN or MERGE per CR-BP-63 baseline"
    - "Capabilities sourcing or licensing absent a regulator-acknowledged accounting or rate framework"
  adjacent_boundaries:
    - "dea:pc-fa-build (adjacent context): the Build cell handles billing-capability construction and configuration; the Activate cell governs the regulator-acknowledged activation step that moves the capability from acknowledged-but-not-live to acknowledged-and-live."
    - "dea:pc-fa-operate (adjacent context): the Operate cell handles steady-state billing operations performance management; the Activate cell only governs the regulator-acknowledged activation step."
    - "dea:pc-fa-retire (adjacent context, CR-BP-75): the Retire cell at F&A handles regulated run-off; the Activate cell handles the regulated live-readiness activation of a billing capability."
    - "dea:pc-ao-activate (sibling cell, CR-BP-81): the A&O Activate cell governs regulator-controlled individual-workforce mobilization; the FA Activate cell governs regulator-acknowledged billing-capability activation -- separate concerns (individual vs billing capability)."
    - "dea:pc-oe-activate (sibling cell, CR-BP-82): the OE Activate cell governs regulator-authorized operations-capability activation; the FA Activate cell governs regulator-acknowledged billing-capability activation -- separate concerns (operations vs billing)."
process_groups:
- id: dea:group-regulated-billing-activation
  kind: functional
  scope: >-
    Governs the controlled activation of a billing or revenue-
    recognition capability whose live invoicing or revenue
    recognition is gated by regulator-acknowledged accounting or
    rate framework: regulator-acknowledged accounting or rate
    framework activation; tariff or pricing approval acquisition
    and recording; readiness-assessment evidence; supervised-test
    records; first-invoice or first-recognition runbook; operational
    controls (segregation of duties, audit trail, reconciliation)
    live on the regulated billing record; continuing-supervisor
    notification; regulated billing record entry preserved.
  processes:
  - dea:process-activate-billing-capability
admission:
  recommended_by: dea:discovery-finance-and-accounting-activate-escape
  recommended_at: '2026-09-16'
  recommended_score: 10
  carrier_cr: CR-BP-83
  bp_id: dea:process-activate-billing-capability