# Process Context Cell Charter: GovernanceAndExistence x Retire.
#
# Lands as part of CR-BP-78 (G&E Retire admission tranche), the second
# catalog cell at a GovernanceAndExistence x Retire coordinate, the
# fourth and final cell to be admitted via the Option B escape-clause
# sequence (after CR-BP-65 at G&E Activate, CR-BP-73 at A&O Retire,
# and CR-BP-75 at F&A Retire).
#
# This PC is the spatial coordinate that hosts the regulator-mandated
# governance unwind governed workflow at the GovernanceAndExistence
# x Retire intersection. The cell admits a single canonical Process
# Group (dea:group-regulated-governance-unwind) and a single
# canonical Business Process
# (dea:process-effect-regulator-mandated-governance-unwind).
# Additional Process Groups and Business Processes at this coordinate
# require further escape-clause evaluation under CR-BP-62 method.
#
# The register v2 deferral was activated by CR-BP-76 escape-clause
# evidence: regulator-mandated governance unwind under FCA WDPG (UK
# firm wind-down planning), California Corporations Code 5033-5034,
# 6610, 8610, 9680 (US nonprofit dissolution), IRS 501(c)(3) federal
# tax-exempt dissolution obligations, state attorney-general charity
# oversight, federal banking regulator cease-and-desist orders, court
# receivership decrees. The cell's verbatim escape clause is
# "Retirement of governance is rare and largely an attribute of
# operating-model retirement; defer until a sector example (e.g.
# regulator-mandated unwind) requires it"; the 2024-2026 regulatory
# landscape satisfies that escape condition.
#
# Scope contract (BP-LIFE-009 / MECE-007 / boundary-face):
# - In scope: governance bodies and policy regime wind-down under
#   regulator or court mandate (statutory dissolution, retained-records
#   custodianship, policy sunset, governance-body quorum reduction,
#   successor-entity arrangements, statutory dissolution filings,
#   retained-records service-of-process obligations, surrender of
#   authorisation or cancellation of permission, court decree entry)
#   for charities under state nonprofit corporation codes (CA Corp
#   Code 5033-5034, 6610, 8610, 9680) + IRS 501(c)(3) + AG oversight,
#   UK firms under FCA WDPG, federal banking regulator cease-and-desist
#   subjects, court-receivership subjects.
# - Out of scope: voluntary governance sunset absent regulator or
#   court mandate (Improve coordinate per CR-BP-63); asset retirement
#   and decommissioning (EnablementAndOperations x Retire / CR-BP-66);
#   counterparty and agent relationship closure
#   (PartyAndRelationship x Retire / CR-BP-67); product line
#   retirement (ProductAndValue x Retire); workforce wind-down
#   (AgencyAndOrganization x Retire / CR-BP-73); regulated entity
#   run-off (FinanceAndAccounting x Retire / CR-BP-75).
# - Boundary explicit: this PC cell governs the regulator- or
#   court-mandated governance unwind whose trigger is the binding
#   regulator or court order itself, not an enterprise-internal
#   decision.
#
# Cross-coordinate doctrine (register v2 / v12):
# - Voluntary governance sunset absent regulator or court mandate
#   remains execution-level under the GovernanceAndExistence x
#   Improve coordinate per CR-BP-63.
# - Asset retirement and decommissioning remains exclusively at
#   EnablementAndOperations x Retire (CR-BP-66).
# - Counterparty and agent relationship closure remains exclusively
#   at PartyAndRelationship x Retire (CR-BP-67).
# - Workforce wind-down under statutory mass-layoff thresholds
#   remains exclusively at AgencyAndOrganization x Retire
#   (CR-BP-73).
# - Regulated entity run-off under PRA PS20/24 / FSB 2025 / NAIC
#   Model 901 remains exclusively at FinanceAndAccounting x Retire
#   (CR-BP-75).
#
# Provenance:
# - Carrier: CR-BP-78 (this slice)
# - Escape-clause discovery: CR-BP-76
#   (dea:discovery-governance-and-existence-retire-escape)
# - Baseline discovery: CR-BP-63
#   (dea:discovery-governance-and-existence-retire)
# - Register cell ratified backlog-deferred at v2; cell flipped
#   ratified-accepted/landed at v12 by this slice.
# - Register cell carry-forward content retained in the
#   l1-register.yaml v12 entry for evidence traceability.

schema: dea/v1
schema_version: 1
id: dea:pc-ge-retire
domain: GovernanceAndExistence
lifecycle_stage: Retire
name: Governance Unwind
process_context:
  id: dea:pc-ge-retire
  domain: GovernanceAndExistence
  lifecycle_stage: Retire
  scope_summary: >-
    Governance-bodies and policy-instrument retirement triggered by a
    regulator- or court-mandated order, distinct from voluntary
    governance sunset (Improve) and from adjacent Retire cells
    (asset decommissioning, counterparty closure, workforce wind-down,
    regulated entity run-off).
  process_empty: false
  lifecycle_status: candidate
  status: candidate
cell_charter:
  enterprise_concern: "Governance & Existence: the wind-down of governance bodies, policy regimes, mandates, and constitutional instruments under regulator or court mandate (statutory dissolution, retained-records custodianship, policy sunset, governance-body quorum reduction, statutory dissolution filings, surrender of authorisation or cancellation of permission)."
  lifecycle_concern: "Retire: governance unwind of an entity triggered by a regulator or court order."
  combined_semantic_meaning: |
    The regulator- or court-mandated governance unwind work that
    moves an enterprise governance regime from active operation to a
    documented, regulator- or court-supervised, governance-bodies-
    reduced-to-wind-down-quorum, mandates-rescinded, policies-sunset
    state, culminating in statutory dissolution filing and surrender
    of authorisation or cancellation of permission, with retained-
    records custodianship assigned per the service-of-process
    regime.
  expected_outcomes:
    - "The governance regime is wound down under the controlling regulator or court authority with governance bodies reduced to wind-down quorum per the controlling statute or regulator order."
    - "Policy instruments are sunset per the governance constitution."
    - "Statutory dissolution filings are submitted to the controlling authority (Secretary of State, AG Registry of Charities and Fundraisers, FCA, federal banking regulator, court clerk)."
    - "Retained-records custodianship is assigned per the service-of-process regime."
    - "The entity is dissolved or the authorisation is cancelled per the regulator or court determination."
  inclusions:
    - "Regulator- or court-issued mandatory dissolution, revocation, wind-down, or equivalent order"
    - "Governance-bodies reduction to wind-down quorum under the controlling statute or regulator order"
    - "Policy instrument sunset per the governance constitution"
    - "Statutory dissolution filings: certificate of dissolution filing with Secretary of State and forwarding to AG Registry of Charities and Fundraisers, FCA cancellation of permissions, federal banking regulator filings, court decree entry"
    - "Retained-records custodianship assignment per the service-of-process regime"
    - "Successor-entity arrangements documentation"
    - "Surrender of authorisation or cancellation of permission per the regulator or court determination"
  exclusions:
    - "Voluntary governance sunset absent regulator or court mandate (GovernanceAndExistence x Improve per CR-BP-63)"
    - "Asset retirement and decommissioning (EnablementAndOperations x Retire; CR-BP-66)"
    - "Counterparty and agent relationship closure (PartyAndRelationship x Retire; CR-BP-67)"
    - "Product line retirement (ProductAndValue x Retire; CR-BP-67 adjacent)"
    - "Workforce wind-down under statutory mass-layoff thresholds (AgencyAndOrganization x Retire; CR-BP-73)"
    - "Regulated entity run-off (FinanceAndAccounting x Retire; CR-BP-75)"
  adjacent_boundaries:
    - "Voluntary governance sunset (GovernanceAndExistence x Improve; CR-BP-63) is out of scope: the trigger is regulator or court mandate, not an enterprise-internal governance decision."
    - "Asset retirement and decommissioning (EnablementAndOperations x Retire; CR-BP-66) is out of scope: this PC governs the governance regime, not the asset base."
    - "Counterparty and agent relationship closure (PartyAndRelationship x Retire; CR-BP-67) is out of scope: this PC governs the governance regime, not the counterparty base."
    - "Workforce wind-down under statutory mass-layoff thresholds (AgencyAndOrganization x Retire; CR-BP-73) is out of scope: this PC governs the governance regime, not the workforce."
    - "Regulated entity run-off (FinanceAndAccounting x Retire; CR-BP-75) is out of scope: this PC governs the governance regime, not the financial run-off accounting basis."
process_groups:
  - id: dea:group-regulated-governance-unwind
    processes:
      - dea:process-effect-regulator-mandated-governance-unwind
    relationship: composes
processes:
  - dea:process-effect-regulator-mandated-governance-unwind
change_history:
  - cr: CR-BP-78
    date: '2026-09-16'
    change: |
      Initial PC entry; the canonical Process Context at the
      GovernanceAndExistence x Retire coordinate, the fourth
      and final cell admitted via the Option B escape-clause
      sequence (after CR-BP-65 at G&E Activate, CR-BP-73 at
      A&O Retire, CR-BP-75 at F&A Retire). The admission
      activates the register v2 cell's verbatim escape
      condition ("Retirement of governance is rare and largely
      an attribute of operating-model retirement; defer until
      a sector example (e.g. regulator-mandated unwind)
      requires it"). Evidence base: FCA WDPG 3 (UK firm
      wind-down planning), California Corporations Code
      5033-5034, 6610, 8610, 9680 (US nonprofit dissolution),
      IRS 501(c)(3) federal tax-exempt dissolution
      obligations, state attorney-general charity oversight,
      federal banking regulator cease-and-desist orders, court
      receivership decrees. PC-001..008 satisfied.